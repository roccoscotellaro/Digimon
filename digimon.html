<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digimon — Digivice OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pixel Digivolve';
    src: url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff2') format('woff2'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff') format('woff'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.ttf') format('truetype');
    font-display: swap;
  }
  .pixel-title{ font-family:'Pixel Digivolve','Share Tech Mono',monospace; letter-spacing:0.03em; }
  :root{
    --bg: #080b10; --panel: #0e141b; --panel-2: #121a22; --line: #1c2a30;
    --cyan: #35e8c9; --cyan-dim: #1f6e63; --amber: #ff8a3d; --text: #dcece8;
    --text-mute: #6d8385; --danger: #ff5d5d; --radius: 2px; --dchroma: #c896ff;
    font-family: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root-app{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing:0.04em;}
  .app{min-height:100vh;background:
      radial-gradient(circle at 15% 10%, rgba(200,150,255,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(53,232,201,0.06), transparent 45%),
      var(--bg); padding:20px;}
  .hud-frame{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); position:relative;}
  .hud-frame::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--dchroma);border-left:2px solid var(--dchroma);}
  .hud-frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--dchroma);border-right:2px solid var(--dchroma);}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .brand-title{font-family:'Pixel Digivolve','Share Tech Mono',monospace;font-size:15px;text-transform:uppercase;color:var(--dchroma);letter-spacing:0.05em;}
  .brand-sub{font-size:11px;color:var(--text-mute);}
  .conn-ticker{font-size:11px;color:var(--text-mute);}
  .conn-ticker b{color:var(--dchroma);}
  .btn{font-family:'Share Tech Mono',monospace;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px 14px;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:0.05em;border-radius:var(--radius);transition:.15s;}
  .btn:hover{background:rgba(53,232,201,0.1);border-color:var(--cyan);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.solid{background:var(--dchroma);color:#1c0a2e;border-color:var(--dchroma);font-weight:700;}
  .btn.solid:hover{background:#dcb8ff;}
  .btn.ghost{border-color:var(--line);color:var(--text-mute);}
  .btn.small{padding:5px 10px;font-size:10px;text-decoration:none;display:inline-block;}
  input[type=text], input[type=number], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; font-family:'Manrope',sans-serif; font-size:13px; border-radius:var(--radius); width:100%;
  }
  textarea{resize:vertical;min-height:56px;font-family:'Manrope',sans-serif;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--cyan-dim);}
  input[type=color]{padding:2px;height:36px;}
  label{font-size:10px;text-transform:uppercase;color:var(--text-mute);letter-spacing:0.06em;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;min-width:0;}
  .section-title{font-size:12px;text-transform:uppercase;color:var(--dchroma);letter-spacing:0.08em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .card{padding:18px;margin-bottom:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .stat-box{text-align:center;padding:10px 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);}
  .stat-box .l{font-size:9px;color:var(--text-mute);text-transform:uppercase;margin-top:4px;}
  .stat-box input{text-align:center;padding:6px;margin-top:4px;}
  .portrait-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .portrait{width:120px;height:120px;border-radius:12px;object-fit:cover;border:2px solid var(--dchroma);background:#05070a;}
  .portrait-placeholder{width:120px;height:120px;border-radius:12px;background:var(--panel-2);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--text-mute);}
  .list-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;}
  .list-item .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .list-item .name{font-weight:700;font-size:13px;}
  .list-item .sub{font-size:11px;color:var(--text-mute);margin-top:4px;}
  .add-row{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;}
  .muted{color:var(--text-mute);font-size:11px;}
  .err{color:var(--danger);font-size:11px;margin-top:6px;}
  .ok-msg{color:var(--dchroma);font-size:11px;margin-top:6px;}
  .login-wrap{max-width:420px;margin:60px auto;padding:32px;}
  .login-wrap h1{font-family:'Pixel Digivolve','Share Tech Mono',monospace;color:var(--dchroma);font-size:26px;letter-spacing:0.03em;text-align:center;text-shadow:0 0 16px rgba(200,150,255,0.5);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:24px;}
  .role-pick{display:flex;gap:10px;margin-bottom:16px;}
  .role-pick .btn{flex:1;}
  .role-pick .btn.active{background:rgba(200,150,255,0.12);border-color:var(--dchroma);color:var(--dchroma);}
  .save-bar{position:sticky;bottom:0;padding:14px 0;margin-top:6px;background:linear-gradient(to top, var(--bg) 60%, transparent);}
  @media (max-width: 700px){
    .grid-stats{grid-template-columns:repeat(3,1fr);}
    .grid-3{grid-template-columns:1fr 1fr;}
    .app{padding:10px;}
    .hud-frame.card > .section-title{cursor:pointer;user-select:none;}
    .hud-frame.card > .section-title .fold-icon{transition:transform .15s;display:inline-block;}
    .hud-frame.card.collapsed > .section-title .fold-icon{transform:rotate(-90deg);}
    .hud-frame.card.collapsed > *:not(.section-title){display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="root-app"></div>
</div>
<script>
(function(){
  const SESSION_KEY = 'digivice_session_v1';
  // Immagine dell'Uovo mostrata al posto del Digimon finché il Master non approva la scheda.
  // Rocco: sostituisci con l'URL della tua immagine (es. su Supabase Storage), altrimenti resta l'emoji di fallback.
  const EGG_IMAGE_URL = 'https://i.imgur.com/68Yh5vE.gif';
  let session = null;
  let cachedRoster = [];
  let lastApiError = null;
  let pollTimer = null;

  const root = document.getElementById('root-app');

  const STAT_DEFS = [
    { key:'baseAccuracy', label:'Accuracy' }, { key:'baseDamage', label:'Damage' }, { key:'baseDodge', label:'Dodge' },
    { key:'baseArmor', label:'Armor' }, { key:'baseHealth', label:'Health' }
  ];
  const STAGES = ['Fresh','Baby','Rookie','Champion','Ultimate','Mega'];
  const SIZES = ['Small','Medium','Large','Huge','Gigantic','Colossal'];
  function stageIndex(s){ const i = STAGES.indexOf(s); return i<0?0:i; }
  function maxSizeIndexForStage(stage){ return Math.min(SIZES.length-1, stageIndex(stage)+1); }
  function allowedSizes(stage){ return SIZES.slice(0, maxSizeIndexForStage(stage)+1); }

  const STAGE_CREATION = {
    Fresh:    { dp:2,  startStat:1 },
    Baby:     { dp:5,  startStat:1 },
    Rookie:   { dp:10, startStat:2 },
    Champion: { dp:20, startStat:3 },
    Ultimate: { dp:30, startStat:4 },
    Mega:     { dp:40, startStat:5 }
  };
  const CAMPAIGN_LEVELS = {
    Standard: { ap:10, sp:25, cap:5, thresholds:[3,5,6,7], tnShift:0, startTorment:8 },
    Classic:  { ap:5,  sp:20, cap:3, thresholds:[2,3,4,5], tnShift:-2, startTorment:5 },
    Extreme:  { ap:15, sp:30, cap:7, thresholds:[4,6,8,10], tnShift:2, startTorment:10 }
  };
  let cachedProgression = null;
  function campaignConfig(){
    const level = (cachedProgression && cachedProgression.campaignLevel) || 'Standard';
    return CAMPAIGN_LEVELS[level] || CAMPAIGN_LEVELS.Standard;
  }

  function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHTML(s); }

  function defaultDigimon(){
    return {
      name:'', stage:'Rookie', personality:'', imageUrl:'', approved:false,
      maxWounds:5, currentWounds:5, maxMp:3, currentMp:3,
      baseAccuracy:1, baseDamage:1, baseDodge:1, baseArmor:1, baseHealth:1,
      dpTotal:0, unspentBonusDP:0, qualities:[],
      defaultStage:'Rookie', defaultRange:2, evolutionPoints:0, forcedEvoRoundsLeft:0,
      battery:0, size:'Medium', stance:'Neutral', chatColor:'#c896ff',
      resolveCurrent:0, resolveMax:4, hybridMode:false,
      attacks:[]
    };
  }
  function normalizeMember(m){
    m.digimon = Object.assign(defaultDigimon(), m.digimon||{});
    if(!Array.isArray(m.digimon.qualities)) m.digimon.qualities = [];
    if(!Array.isArray(m.digimon.attacks)) m.digimon.attacks = [];
    return m;
  }

  function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function loadSession(){ try{ const v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

  // Legge la risposta come testo e poi prova a interpretarla come JSON. Se una funzione
  // serverless va in crash, Vercel risponde con testo ("A server error has occurred") o HTML:
  // prima r.json() lanciava "Unexpected token 'A' ... is not valid JSON" e il messaggio a video
  // era incomprensibile. Ora si vede il vero errore restituito dal server.
  async function readJson(r){
    let raw = '';
    try{ raw = await r.text(); }catch(e){ raw = ''; }
    try{ return JSON.parse(raw); }
    catch(e){
      return { error: 'Il server ha risposto con un errore non-JSON (HTTP ' + r.status + '): ' + String(raw).replace(/<[^>]*>/g,' ').trim().slice(0,160) };
    }
  }
  async function apiGet(path){
    try{ const r = await fetch(path); const data = await readJson(r);
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function apiPost(path, body){
    try{ const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await readJson(r);
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function apiPut(path, body){
    try{ const r = await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await readJson(r);
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function getRoster(code){ const d = await apiGet('/api/roster?code=' + encodeURIComponent(code)); return d ? (d.members||[]).map(normalizeMember) : []; }
  async function saveMember(code, member){ const d = await apiPost('/api/roster', { code, member }); return !!(d && d.ok); }
  async function uploadImage(code, dataUrl){ return apiPost('/api/upload', { code, dataUrl }); }
  async function getProgression(code){
    const d = await apiGet('/api/state?resource=progression&code=' + encodeURIComponent(code));
    const p = d ? d.progression : { milestone:0, xp:0, inspiration:0, campaign_level:'Standard' };
    return { milestone: p.milestone||0, xp: p.xp||0, inspiration: p.inspiration||0, campaignLevel: p.campaign_level || 'Standard' };
  }
  async function pushLog(code, entry){ return apiPost('/api/log', { code, ...entry }); }

  function getStarterPrefillFromURL(){
    try{
      const params = new URLSearchParams(location.search);
      if(!params.has('prefillName')) return null;
      return {
        name: params.get('prefillName') || '',
        attribute: params.get('prefillAttribute') || 'Free',
        personality: params.get('prefillPersonality') || '',
        baseAccuracy: Number(params.get('prefillAcc'))||2,
        baseDamage: Number(params.get('prefillDmg'))||2,
        baseDodge: Number(params.get('prefillDodge'))||2,
        baseArmor: Number(params.get('prefillArmor'))||2,
        baseHealth: Number(params.get('prefillHp'))||2,
        signatureMove: params.get('prefillSig') || ''
      };
    }catch(e){ return null; }
  }
  function clearStarterPrefillFromURL(){
    try{
      const url = new URL(location.href);
      ['prefillName','prefillAttribute','prefillPersonality','prefillAcc','prefillDmg','prefillDodge','prefillArmor','prefillHp','prefillSig'].forEach(k=>url.searchParams.delete(k));
      history.replaceState(null, '', url.toString());
    }catch(e){}
  }

  // ---------- Avvisi (notice) ----------
  async function getNotices(code){ const d = await apiGet('/api/notice?code=' + encodeURIComponent(code)); return d ? (d.notices||[]) : []; }
  async function confirmNotice(code, id, username){ return apiPut('/api/notice', { code, id, ack: username }); }

  // ---------- Segnalazioni Bug ----------
  async function createBugReport(code, username, text){ return apiPost('/api/notice', { resource:'bugreport', code, username, text }); }

  // ---------- Coda Avvisi bloccanti (stessa logica di index.html) ----------
  let noticeQueue = [];
  let noticeModalOpen = false;
  function isNoticeForMe(n){
    if(!session) return false;
    if(n.target_type==='all') return true;
    const list = Array.isArray(n.target_usernames) ? n.target_usernames : [];
    return list.includes(session.username);
  }
  function isNoticeConfirmedByMe(n){
    const acked = Array.isArray(n.acked_by) ? n.acked_by : [];
    return acked.includes(session.username);
  }
  async function checkNoticesForMe(){
    if(!session) return;
    const all = await getNotices(session.code);
    const mine = all.filter(n=>n.active && isNoticeForMe(n) && !isNoticeConfirmedByMe(n));
    mine.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    noticeQueue = mine;
    if(!noticeModalOpen && noticeQueue.length>0) showNextNotice();
    if(noticeQueue.length===0 && noticeModalOpen){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
    }
  }
  function showNextNotice(){
    if(noticeQueue.length===0){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
      return;
    }
    noticeModalOpen = true;
    const n = noticeQueue[0];
    const old = document.getElementById('notice-modal');
    if(old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'notice-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    modal.innerHTML = `
      <div class="hud-frame" style="max-width:480px;width:100%;padding:22px;background:var(--panel);">
        <div class="section-title"><span>📢 Avviso dal Master${noticeQueue.length>1?` (${noticeQueue.length} in attesa)`:''}</span></div>
        ${n.image_url ? `<img src="${escapeAttr(n.image_url)}" style="max-width:100%;max-height:40vh;object-fit:contain;margin-bottom:14px;border:1px solid var(--line);display:block;" />` : ''}
        <div style="white-space:pre-wrap;margin-bottom:18px;line-height:1.5;">${escapeHTML(n.text)}</div>
        <button class="btn solid" id="notice-confirm-btn" style="width:100%;padding:12px;">Ho capito</button>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('notice-confirm-btn').onclick = async ()=>{
      await confirmNotice(session.code, n.id, session.username);
      noticeQueue.shift();
      showNextNotice();
    };
  }

  function enableCollapsibleCards(container){
    (container||document).querySelectorAll('.hud-frame.card').forEach(card=>{
      const title = card.querySelector(':scope > .section-title');
      if(!title || title.dataset.foldBound) return;
      title.dataset.foldBound = '1';
      if(!title.querySelector('.fold-icon')){
        const icon = document.createElement('span');
        icon.className = 'fold-icon';
        icon.textContent = '▾';
        title.appendChild(icon);
      }
      title.addEventListener('click', ()=>{
        if(window.innerWidth > 700) return;
        card.classList.toggle('collapsed');
      });
    });
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    checkNoticesForMe();
    pollTimer = setInterval(async ()=>{
      if(!session) return;
      cachedRoster = await getRoster(session.code);
      checkNoticesForMe();
      if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      render();
    }, 4000);
  }

  function render(){
    if(!session){ renderLogin(); return; }
    renderPage();
  }

  function topbar(){
    return `
    <div class="hud-frame topbar">
      <div>
        <div class="brand-title">👾 DIGIMON</div>
        <div class="brand-sub">Digimon: Digital Adventures — Campagna ${escapeHTML(session.code)}</div>
      </div>
      <div class="conn-ticker mono">
        UTENTE <b>${escapeHTML(session.username)}</b> (${session.role==='master'?'Master':'Giocatore'})
        &nbsp;<a href="index.html" class="btn ghost small">← Tavolo</a>
        &nbsp;<a href="player.html" class="btn ghost small">👤 Giocatore</a>
        &nbsp;<button class="btn ghost small" id="btn-logout">Esci</button>
      </div>
    </div>
    ${lastApiError ? `<div class="hud-frame" style="border-color:var(--danger);padding:8px 14px;margin-bottom:16px;color:var(--danger);font-size:12px;">⚠ ${escapeHTML(lastApiError)}</div>` : ''}`;
  }

  function renderLogin(){
    root.innerHTML = `
      <div class="login-wrap hud-frame">
        <h1>DIGIMON // ACCESSO</h1>
        <div class="sub">Inserisci lo stesso codice campagna e nome utente usati nel Tavolo Testuale.</div>
        <div class="field"><label>Codice Campagna</label><input type="text" id="in-code" placeholder="es. FRONTIER01" /></div>
        <div class="field"><label>Nome Utente</label><input type="text" id="in-user" placeholder="il tuo nome al tavolo" /></div>
        <div class="field"><label>Ruolo</label>
          <div class="role-pick">
            <button class="btn active" id="role-player" data-role="player">Giocatore</button>
            <button class="btn" id="role-master" data-role="master">Master</button>
          </div>
        </div>
        <button class="btn solid" id="btn-enter" style="width:100%;padding:12px;">Entra</button>
        <div class="err" id="login-err"></div>
      </div>`;
    let role = 'player';
    document.getElementById('role-player').onclick = ()=>{ role='player'; document.getElementById('role-player').classList.add('active'); document.getElementById('role-master').classList.remove('active'); };
    document.getElementById('role-master').onclick = ()=>{ role='master'; document.getElementById('role-master').classList.add('active'); document.getElementById('role-player').classList.remove('active'); };
    document.getElementById('btn-enter').onclick = async ()=>{
      const code = document.getElementById('in-code').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      const username = document.getElementById('in-user').value.trim();
      const errEl = document.getElementById('login-err');
      if(!code || !username){ errEl.textContent = 'Inserisci codice campagna e nome utente.'; return; }
      const roster = await getRoster(code);
      const existing = roster.find(m=>m.username===username);
      const member = normalizeMember(existing || { username, role });
      member.role = role;
      await saveMember(code, member);
      session = { code, username, role };
      saveSession(session);
      cachedRoster = await getRoster(code);
      cachedProgression = await getProgression(code);
      startPolling();
      render();
    };
  }

  function logout(){
    if(pollTimer) clearInterval(pollTimer);
    session = null; clearSession(); render();
  }

  function statBoxHTML(m, key, label, editable){
    const val = Number(m.digimon[key])||0;
    return editable
      ? `<div class="stat-box"><input type="number" min="0" max="10" id="d-stat-${key}" value="${val}" /><div class="l">${label}</div></div>`
      : `<div class="stat-box"><div class="v mono" style="font-size:20px;color:var(--dchroma);">${val}</div><div class="l">${label}</div></div>`;
  }

  function portraitBlockHTML(m, editable, isMaster){
    const d = m.digimon;
    return `
    <div class="portrait-wrap">
      ${d.imageUrl ? `<img class="portrait" src="${escapeAttr(d.imageUrl)}" />` : `<div class="portrait-placeholder">👾</div>`}
      <div style="flex:1;min-width:220px;">
        ${editable ? `
        <div class="row">
          <div class="field"><label>Nome</label><input type="text" id="d-name" value="${escapeAttr(d.name||'')}" placeholder="Nome del Digimon" /></div>
          <div class="field" style="max-width:150px;"><label>Stage</label>
            <select id="d-stage">${STAGES.map(s=>`<option value="${s}" ${d.stage===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>Personalità</label><textarea id="d-personality" placeholder="descrivi la personalità...">${escapeHTML(d.personality||'')}</textarea></div>

  // ---------- Creazione Guidata: Digimon (incorporata direttamente in questa pagina) ----------
  let creationDraft = null;
  let justBuiltDigimon = false;

  function startDigimonWizard(prefill){
    creationDraft = {
      stage:'Rookie', size:'Medium',
      name: (prefill && prefill.name) || '',
      imageUrl: '',
      personality: (prefill && prefill.personality) || '',
      attribute: (prefill && prefill.attribute) || 'Free',
      baseAccuracy: (prefill && prefill.baseAccuracy) || STAGE_CREATION.Rookie.startStat,
      baseDamage: (prefill && prefill.baseDamage) || STAGE_CREATION.Rookie.startStat,
      baseDodge: (prefill && prefill.baseDodge) || STAGE_CREATION.Rookie.startStat,
      baseArmor: (prefill && prefill.baseArmor) || STAGE_CREATION.Rookie.startStat,
      baseHealth: (prefill && prefill.baseHealth) || STAGE_CREATION.Rookie.startStat,
      signatureMove: (prefill && prefill.signatureMove) || ''
    };
    renderPage();
  }

  function digimonWizardHTML(){
    const draft = creationDraft;
    const cfg = STAGE_CREATION[draft.stage];
    const statKeys = ['baseAccuracy','baseDamage','baseDodge','baseArmor','baseHealth'];
    const statLabels = { baseAccuracy:'ACC', baseDamage:'DMG', baseDodge:'DODGE', baseArmor:'ARM', baseHealth:'HP' };
    const dpSpent = statKeys.reduce((s,k)=>s+(draft[k]-cfg.startStat),0);
    const dpRemaining = cfg.dp - dpSpent;
    const errors = [];
    if(dpRemaining<0) errors.push(`Hai speso troppi DP sulle Stat (sforo di ${-dpRemaining}).`);

    return `
    <div class="hud-frame card">
      <div class="section-title"><span>🧙 Creazione Guidata — Digimon</span></div>
      ${draft.signatureMove ? `<div class="muted" style="margin-bottom:10px;color:var(--dchroma);">📡 Dati importati dalla Bio-Resonance Scan — puoi comunque modificarli.</div>` : ''}
      <div class="field"><label>Nome</label><input type="text" id="wiz-d-name" value="${escapeAttr(draft.name)}" /></div>
      <div class="row">
        <div class="field"><label>Stage</label>
          <select id="wiz-d-stage">${STAGES.map(s=>`<option ${draft.stage===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Size</label>
          <select id="wiz-d-size">${allowedSizes(draft.stage).map(s=>`<option ${draft.size===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
      </div>
      <div class="muted" style="margin-bottom:6px;">DP di partenza per ${escapeHTML(draft.stage)}: <b>${cfg.dp}</b> · Stat base: <b>${cfg.startStat}</b> ciascuna prima di spendere DP.</div>
      <div class="flex-between" style="margin-bottom:6px;"><span class="muted">DP rimasti per le Stat</span><span class="mono" style="color:${dpRemaining>=0?'var(--dchroma)':'var(--danger)'};">${dpRemaining}</span></div>
      <div class="grid-stats">
        ${statKeys.map(k=>`
          <div class="stat-box">
            <div class="l">${statLabels[k]}</div>
            <input type="number" data-wiz-stat="${k}" min="${cfg.startStat}" value="${draft[k]}" />
          </div>
        `).join('')}
      </div>
      <div class="muted" style="margin-top:6px;">DP non spesi in Stat verranno riservati come budget Qualities (${Math.max(0,dpRemaining)} DP).</div>
      <div class="field" style="margin-top:8px;"><label>Personalità</label><textarea id="wiz-d-personality" rows="2">${escapeHTML(draft.personality)}</textarea></div>
      <div class="field"><label>URL Immagine (opz. — resterà nascosta finché il Master non approva)</label><input type="text" id="wiz-d-img" value="${escapeAttr(draft.imageUrl)}" /></div>
      <div class="field"><label>Attributo (Variant Rule 2.05c)</label>
        <select id="wiz-d-attribute">
          ${['Vaccine','Data','Virus','Free','Variable'].map(a=>`<option ${draft.attribute===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div style="border-top:1px dashed var(--line);margin:12px 0;"></div>
      ${errors.length ? `<div class="err">${errors.map(e=>escapeHTML(e)).join('<br/>')}</div>` : '<div class="ok-msg">Tutto valido, puoi salvare.</div>'}
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost" id="btn-wiz-cancel" style="flex:1;">Annulla</button>
        <button class="btn solid" id="btn-wiz-save" style="flex:1;" ${errors.length?'disabled':''}>🥚 Applica e Chiudi nell'Uovo</button>
      </div>
      <div class="muted" id="wiz-status" style="margin-top:6px;"></div>
    </div>`;
  }

  function bindDigimonWizard(target){
    const draft = creationDraft;
    const statKeys = ['baseAccuracy','baseDamage','baseDodge','baseArmor','baseHealth'];
    document.getElementById('wiz-d-name').onchange = (e)=>{ draft.name = e.target.value; };
    document.getElementById('wiz-d-personality').onchange = (e)=>{ draft.personality = e.target.value; };
    document.getElementById('wiz-d-img').onchange = (e)=>{ draft.imageUrl = e.target.value; };
    document.getElementById('wiz-d-attribute').onchange = (e)=>{ draft.attribute = e.target.value; };
    document.getElementById('wiz-d-stage').onchange = (e)=>{
      draft.stage = e.target.value;
      const newCfg = STAGE_CREATION[draft.stage];
      statKeys.forEach(k=>{ draft[k] = newCfg.startStat; });
      draft.size = allowedSizes(draft.stage)[0] || 'Medium';
      renderPage();
    };
    document.getElementById('wiz-d-size').onchange = (e)=>{ draft.size = e.target.value; };
    root.querySelectorAll('[data-wiz-stat]').forEach(inp=>{
      inp.onchange = ()=>{
        const cfg = STAGE_CREATION[draft.stage];
        draft[inp.getAttribute('data-wiz-stat')] = Math.max(cfg.startStat, Number(inp.value)||cfg.startStat);
        renderPage();
      };
    });
    document.getElementById('btn-wiz-cancel').onclick = ()=>{ creationDraft = null; renderPage(); };
    const saveBtn = document.getElementById('btn-wiz-save');
    if(saveBtn){
      saveBtn.onclick = async ()=>{
        const cfg = STAGE_CREATION[draft.stage];
        const dpSpent = statKeys.reduce((s,k)=>s+(draft[k]-cfg.startStat),0);
        const dpRemaining = cfg.dp - dpSpent;

        target.digimon.name = draft.name;
        target.digimon.stage = draft.stage;
        target.digimon.defaultStage = draft.stage;
        target.digimon.size = draft.size;
        target.digimon.personality = draft.personality;
        target.digimon.imageUrl = draft.imageUrl;
        target.digimon.attribute = draft.attribute || 'Free';
        statKeys.forEach(k=>{ target.digimon[k] = draft[k]; });
        target.digimon.maxWounds = stageIndex(draft.stage) + Number(draft.baseHealth)*2;
        target.digimon.currentWounds = target.digimon.maxWounds;
        target.digimon.dpTotal = Math.max(0, dpRemaining);
        target.digimon.qualities = [];
        target.digimon.evolutionPoints = 0;
        target.digimon.defaultRange = 2;
        target.digimon.approved = false; // si "chiude" nell'Uovo finché il Master non lo schiude
        if(!target.digimon.stageStats) target.digimon.stageStats = {};
        target.digimon.stageStats[draft.stage] = {
          baseAccuracy: draft.baseAccuracy, baseDamage: draft.baseDamage, baseDodge: draft.baseDodge,
          baseArmor: draft.baseArmor, baseHealth: draft.baseHealth,
          maxWounds: target.digimon.maxWounds, maxMp: target.digimon.maxMp, size: draft.size
        };
        if(draft.signatureMove){
          target.digimon.attacks = [
            { name: draft.signatureMove, shape:'Range', type:'Damage', effectKey:'', extraTags:'', desc:'Attacco caratteristico portato dal Bio-Resonance Scan.', signature:true, reach:1, areaAttack:false },
            { name:'Raggio a Distanza', shape:'Range', type:'Damage', effectKey:'', extraTags:'', desc:'Un colpo dalla distanza.', signature:false, reach:1, areaAttack:false }
          ];
        }

        const st = document.getElementById('wiz-status');
        st.textContent = 'Salvataggio...';
        const ok = await saveMember(session.code, target);
        if(ok){
          await pushLog(session.code, { who: session.username, role:'player', text: `${target.username} ha completato la Creazione Guidata di ${target.digimon.name||'un Digimon'} — resta nell'Uovo in attesa dell'approvazione del Master.` });
          creationDraft = null;
          justBuiltDigimon = true;
          cachedRoster = await getRoster(session.code);
          renderPage();
        } else {
          st.style.color = 'var(--danger)';
          st.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
        }
      };
    }
  }

  // ---------- Costruisci Nuovo Stage (prepara le Stat di uno Stage mai raggiunto prima) ----------
  // Per regola (3.19): raggiungere per la prima volta uno Stage è come creare un nuovo Digimon —
  // va costruito con un budget DP proprio, non assegnato automaticamente.
  let stageBuildDraft = null;

  function isStageBuilt(d, stage){ return !!(d.stageStats && d.stageStats[stage]); }

  function stageBuilderHTML(m){
    const d = m.digimon;
    if(stageBuildDraft){
      const draft = stageBuildDraft;
      const cfg = STAGE_CREATION[draft.stage];
      const statKeys = ['baseAccuracy','baseDamage','baseDodge','baseArmor','baseHealth'];
      const statLabels = { baseAccuracy:'ACC', baseDamage:'DMG', baseDodge:'DODGE', baseArmor:'ARM', baseHealth:'HP' };
      const dpSpent = statKeys.reduce((s,k)=>s+(draft[k]-cfg.startStat),0);
      const dpRemaining = cfg.dp - dpSpent;
      const errors = [];
      if(dpRemaining<0) errors.push(`Hai speso troppi DP sulle Stat (sforo di ${-dpRemaining}).`);
      return `
      <div class="hud-frame card">
        <div class="section-title"><span>🛠️ Costruisci Stage: ${escapeHTML(draft.stage)}</span></div>
        <div class="muted" style="margin-bottom:6px;">DP di partenza per ${escapeHTML(draft.stage)}: <b>${cfg.dp}</b> · Stat base: <b>${cfg.startStat}</b> ciascuna prima di spendere DP.</div>
        <div class="field"><label>Size</label>
          <select id="sb-size">${allowedSizes(draft.stage).map(s=>`<option ${draft.size===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="flex-between" style="margin-bottom:6px;"><span class="muted">DP rimasti per le Stat</span><span class="mono" style="color:${dpRemaining>=0?'var(--dchroma)':'var(--danger)'};">${dpRemaining}</span></div>
        <div class="grid-stats">
          ${statKeys.map(k=>`
            <div class="stat-box">
              <div class="l">${statLabels[k]}</div>
              <input type="number" data-sb-stat="${k}" min="${cfg.startStat}" value="${draft[k]}" />
            </div>
          `).join('')}
        </div>
        <div class="muted" style="margin-top:6px;">DP non spesi in Stat verranno riservati come budget Qualities aggiuntivo per questo Stage (${Math.max(0,dpRemaining)} DP).</div>
        ${errors.length ? `<div class="err">${errors.map(e=>escapeHTML(e)).join('<br/>')}</div>` : '<div class="ok-msg">Tutto valido, puoi salvare.</div>'}
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost" id="btn-sb-cancel" style="flex:1;">Annulla</button>

    return `

      <div class="section-title"><span>🛠️ Costruisci Nuovo Stage</span></div>
      <div class="muted" style="margin-bottom:10px;">Prima di poter evolvere a uno Stage mai raggiunto, va costruito qui — è come creare un Digimon nuovo (regola 3.19), con un suo budget DP.</div>

        ${STAGES.map(s=>{
          const built = isStageBuilt(d, s);
          return built
            ? `<span class="tag" style="background:var(--panel-2);border-color:var(--dchroma);color:var(--dchroma);">✅ ${s}</span>`
            : `<button class="btn ghost small" data-sb-start="${s}">🛠️ ${s}</button>`;
        }).join('')}
      </div>
    </div>`;
  }

  function bindStageBuilder(target){
    if(stageBuildDraft){
      const draft = stageBuildDraft;
      root.querySelectorAll('[data-sb-stat]').forEach(inp=>{
        inp.onchange = ()=>{
          const cfg = STAGE_CREATION[draft.stage];

      const saveBtn = document.getElementById('btn-sb-save');
      if(saveBtn){
        saveBtn.onclick = async ()=>{
          const statKeys = ['baseAccuracy','baseDamage','baseDodge','baseArmor','baseHealth'];
          if(!target.digimon.stageStats) target.digimon.stageStats = {};
          target.digimon.stageStats[draft.stage] = {

            renderPage();
          } else {
            st.style.color='var(--danger)'; st.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
          }
        };
      }
      return;
    }
    root.querySelectorAll('[data-sb-start]').forEach(btn=>{
      btn.onclick = ()=>{
        const stage = btn.getAttribute('data-sb-start');
        const cfg = STAGE_CREATION[stage];
        stageBuildDraft = {
          stage, size: allowedSizes(stage)[0] || 'Medium',
          baseAccuracy: cfg.startStat, baseDamage: cfg.startStat, baseDodge: cfg.startStat,
          baseArmor: cfg.startStat, baseHealth: cfg.startStat
        };
        renderPage();
      };
    });
  }

  // ---------- Bonus DP da Milestone: da spendere su Stat (propagate a tutti gli Stage costruiti) o Qualities ----------
  function bonusDpBlockHTML(m){
    const d = m.digimon;
    const pool = Number(d.unspentBonusDP||0);
    if(pool<=0) return '';
    const statKeys = ['baseAccuracy','baseDamage','baseDodge','baseArmor','baseHealth'];
    const statLabels = { baseAccuracy:'Accuracy', baseDamage:'Damage', baseDodge:'Dodge', baseArmor:'Armor', baseHealth:'Health' };
    return `
    <div class="hud-frame card" style="border-color:var(--dchroma);">
      <div class="section-title"><span>🎁 Bonus DP da Milestone: ${pool}</span></div>
      <div class="muted" style="margin-bottom:10px;">Ogni punto va su una Stat (si applica automaticamente a tutti gli Stage già costruiti, per regola 10.03) oppure nel budget Qualities.</div>
      <div class="row">
        <select id="bdp-stat-select" style="flex:2;">
          ${statKeys.map(k=>`<option value="${k}">${statLabels[k]}</option>`).join('')}
        </select>
        <button class="btn small" id="btn-bdp-stat" style="flex:1;">+1 Stat</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="btn ghost small" id="btn-bdp-quality" style="width:100%;">Sposta 1 DP nel budget Qualities</button>
      </div>
      <div class="muted" id="bdp-status" style="margin-top:6px;"></div>
    </div>`;
  }

  function bindBonusDp(target){
    const statBtn = document.getElementById('btn-bdp-stat');
    if(statBtn){
      statBtn.onclick = async ()=>{
        const key = document.getElementById('bdp-stat-select').value;
        const d = target.digimon;
        d[key] = Number(d[key]||0) + 1;
        // Propaga l'incremento a tutti gli Stage già costruiti, come da regola 10.03.
        if(d.stageStats){
          Object.keys(d.stageStats).forEach(stage=>{
            if(stage===d.stage) return; // lo Stage attuale è già aggiornato sopra
            d.stageStats[stage][key] = Number(d.stageStats[stage][key]||0) + 1;
          });
        }
        if(!d.stageStats) d.stageStats = {};
        if(d.stageStats[d.stage]) d.stageStats[d.stage][key] = d[key];
        d.unspentBonusDP = Math.max(0, Number(d.unspentBonusDP||0) - 1);
        const st = document.getElementById('bdp-status');
        st.textContent = 'Salvataggio...';
        const ok = await saveMember(session.code, target);
        if(ok){ cachedRoster = await getRoster(session.code); renderPage(); }
        else { st.style.color='var(--danger)'; st.textContent = 'Errore: ' + (lastApiError||'sconosciuto'); }
      };
    }
    const qBtn = document.getElementById('btn-bdp-quality');
    if(qBtn){
      qBtn.onclick = async ()=>{
        target.digimon.dpTotal = Number(target.digimon.dpTotal||0) + 1;
        target.digimon.unspentBonusDP = Math.max(0, Number(target.digimon.unspentBonusDP||0) - 1);
        const st = document.getElementById('bdp-status');
        st.textContent = 'Salvataggio...';
        const ok = await saveMember(session.code, target);
        if(ok){ cachedRoster = await getRoster(session.code); renderPage(); }
        else { st.style.color='var(--danger)'; st.textContent = 'Errore: ' + (lastApiError||'sconosciuto'); }
      };
    }
  }

  function renderPage(){
    const isMaster = session.role === 'master';
    let target = null;
    let selectorHTML = '';

    if(isMaster){
      const players = cachedRoster.filter(m=>m.role==='player');
      const selected = window.__digimonSelected || (players[0] && players[0].username) || null;
      target = players.find(p=>p.username===selected) || players[0] || null;
      selectorHTML = `
      <div class="hud-frame card">
        <div class="section-title"><span>Seleziona Giocatore</span></div>
        <select id="d-select-player">
          ${players.length===0 ? '<option>— nessun giocatore —</option>' : players.map(p=>`<option value="${escapeAttr(p.username)}" ${target && target.username===p.username?'selected':''}>${escapeHTML(p.username)} — ${escapeHTML(p.digimon.name||'(senza Digimon)')}</option>`).join('')}
        </select>
        <div class="muted" style="margin-top:8px;">Come Master puoi modificare direttamente la scheda selezionata.</div>
      </div>`;
    } else {
      target = cachedRoster.find(m=>m.username===session.username);
    }

    const editable = true;
    if(isMaster && creationDraft) creationDraft = null;
    if(isMaster && stageBuildDraft) stageBuildDraft = null;

    let bodyHTML;
    if(creationDraft && target){
      bodyHTML = digimonWizardHTML();
    } else if(stageBuildDraft && target){
      bodyHTML = stageBuilderHTML(target);
    } else if(!target || !target.digimon.name){
      bodyHTML = `
        <div class="hud-frame card muted">
          ${isMaster ? (target ? `
            <div style="margin-bottom:10px;">${escapeHTML(target.username)} non ha ancora un Digimon.</div>
            <button class="btn ghost small" id="btn-start-wizard">🧙 Apri Creazione Guidata manualmente (bypassa lo Scan)</button>
          ` : 'Nessuna scheda trovata. Seleziona un giocatore.') : `
            <div style="margin-bottom:10px;">Non hai ancora un Digimon. Il primo passo è la Bio-Resonance Scan, che ti assegna il tuo Digimon partner — dopo lo Scan potrai completare i punteggi con la Creazione Guidata.</div>
            <a href="digivice-scan.html" target="_blank" class="btn solid" style="text-decoration:none;display:inline-block;padding:10px 16px;">📡 Avvia Bio-Resonance Scan</a>
            <div class="muted" style="margin-top:10px;">Hai già fatto lo Scan ma la Creazione Guidata non si è aperta o non l'hai finita? Chiedi al Master di aprirtela da qui.</div>
          `}
        </div>`;
    } else if(!target.digimon.approved){
      bodyHTML = `
        <div class="hud-frame card">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;gap:14px;">
            ${EGG_IMAGE_URL ? `<img src="${escapeAttr(EGG_IMAGE_URL)}" style="width:140px;height:140px;object-fit:contain;" />` : `<div style="width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff8e6, #f0d9a0 60%, #d9b976);display:flex;align-items:center;justify-content:center;font-size:64px;">🥚</div>`}
            ${isMaster ? `<button class="btn small" id="d-approve" style="color:var(--cyan);border-color:var(--cyan-dim);">✅ Approva</button>` : ''}
          </div>
        </div>`;
    } else {
      bodyHTML = null;
    }

    root.innerHTML = `
      <div style="max-width:760px;margin:0 auto;">
        ${topbar()}
        ${selectorHTML}
        ${bodyHTML !== null ? bodyHTML : `
        <div class="hud-frame card">
          ${portraitBlockHTML(target, editable, isMaster)}
        </div>
        ${bonusDpBlockHTML(target)}
        ${stageBuilderHTML(target)}
        <div class="hud-frame card">
          <div class="section-title"><span>Punteggi Base</span></div>
          <div class="grid-stats">
            ${STAT_DEFS.map(d=>statBoxHTML(target, d.key, d.label, editable)).join('')}
          </div>
        </div>
        ${stageSwitchBlockHTML(target, editable)}
        ${statoBlockHTML(target, editable)}
        ${qualitiesBlockHTML(target, editable)}
        ${attacksBlockHTML(target, editable)}
        ${editable ? `
        <div class="save-bar">
          <button class="btn solid" id="d-save" style="width:100%;padding:12px;">💾 Salva Scheda</button>
          <div id="d-save-msg" style="margin-top:8px;"></div>
          ${isMaster ? `<button class="btn ghost" id="d-reset" style="width:100%;padding:10px;margin-top:8px;color:var(--danger);border-color:var(--danger);">🗑️ Azzera Digimon (permette una nuova Creazione Guidata)</button>` : ''}
        </div>` : ''}
        `}
        <div class="hud-frame card">
          <div class="section-title"><span>🐞 Segnala un Bug</span></div>
          <div class="muted" style="margin-bottom:10px;">Hai trovato qualcosa che non funziona come dovrebbe? Descrivilo qui — arriva direttamente al Master.</div>
          <textarea id="bug-text" rows="4" placeholder="Cosa è successo? Cosa ti aspettavi succedesse invece?"></textarea>
          <button class="btn solid" id="btn-send-bug" style="width:100%;margin-top:8px;">Invia Segnalazione</button>
          <div class="muted" id="bug-status" style="margin-top:6px;"></div>
        </div>
      </div>`;

    document.getElementById('btn-logout').onclick = logout;
    const bugBtn = document.getElementById('btn-send-bug');
    if(bugBtn) bugBtn.onclick = async ()=>{
      const text = document.getElementById('bug-text').value.trim();
      const statusEl = document.getElementById('bug-status');
      if(!text){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Scrivi qualcosa prima di inviare.'; return; }
      statusEl.style.color='var(--text-mute)'; statusEl.textContent = 'Invio...';
      const res = await createBugReport(session.code, session.username, text);
      if(res && res.ok){
        statusEl.style.color='var(--dchroma)'; statusEl.textContent = 'Segnalazione inviata, grazie!';
        document.getElementById('bug-text').value = '';
      } else {
        statusEl.style.color='var(--danger)'; statusEl.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
      }
    };

    if(isMaster){
      const sel = document.getElementById('d-select-player');
      if(sel) sel.onchange = ()=>{ window.__digimonSelected = sel.value; renderPage(); };
    }

    const startWizBtn = document.getElementById('btn-start-wizard');
    if(startWizBtn) startWizBtn.onclick = ()=>{ startDigimonWizard(null); };
    if(creationDraft && target) bindDigimonWizard(target);
    if(target) bindStageBuilder(target);
    if(target && target.digimon.approved) bindBonusDp(target);

    if(target){
      root.querySelectorAll('[data-stage-switch]').forEach(btn=>{
        btn.onclick = async ()=>{
          target.digimon.stage = btn.getAttribute('data-stage-switch');
          await saveMember(session.code, target);
          cachedRoster = await getRoster(session.code);
          renderPage();
        };
      });
      const approveBtn = document.getElementById('d-approve');
      if(approveBtn){
        approveBtn.onclick = async ()=>{
          target.digimon.approved = true;
          await saveMember(session.code, target);
          cachedRoster = await getRoster(session.code);
          renderPage();
        };
      }
    }

    if(target && editable && bodyHTML===null){
      bindImageUpload(target);
      bindListEditors(target);
      document.getElementById('d-save').onclick = async ()=>{
        STAT_DEFS.forEach(d=>{
          const el = document.getElementById('d-stat-'+d.key);
          if(el) target.digimon[d.key] = Math.max(0, Number(el.value)||0);
        });
        const imgEl = document.getElementById('d-imageUrl');
        if(imgEl) target.digimon.imageUrl = imgEl.value.trim();
        target.digimon.name = document.getElementById('d-name').value.trim();
        target.digimon.stage = document.getElementById('d-stage').value;
        target.digimon.personality = document.getElementById('d-personality').value.trim();
        target.digimon.currentWounds = Math.max(0, Number(document.getElementById('d-currentWounds').value)||0);
        target.digimon.maxWounds = Math.max(0, Number(document.getElementById('d-maxWounds').value)||0);
        target.digimon.currentMp = Math.max(0, Number(document.getElementById('d-currentMp').value)||0);
        target.digimon.maxMp = Math.max(0, Number(document.getElementById('d-maxMp').value)||0);
        target.digimon.resolveCurrent = Math.max(0, Number(document.getElementById('d-resolveCurrent').value)||0);
        target.digimon.resolveMax = Math.max(0, Number(document.getElementById('d-resolveMax').value)||0);
        target.digimon.battery = Number(document.getElementById('d-battery').value)||0;
        target.digimon.size = document.getElementById('d-size').value;
        target.digimon.stance = document.getElementById('d-stance').value.trim();
        target.digimon.chatColor = document.getElementById('d-chatColor').value;
        target.digimon.dpTotal = Number(document.getElementById('d-dpTotal').value)||0;
        target.digimon.defaultRange = Number(document.getElementById('d-defaultRange').value)||0;
        target.digimon.evolutionPoints = Number(document.getElementById('d-evolutionPoints').value)||0;
        target.digimon.forcedEvoRoundsLeft = Number(document.getElementById('d-forcedEvoRoundsLeft').value)||0;
        target.digimon.defaultStage = document.getElementById('d-defaultStage').value;
        target.digimon.hybridMode = document.getElementById('d-hybridMode').checked;

        const msgEl = document.getElementById('d-save-msg');
        msgEl.innerHTML = '<span class="muted">Salvataggio...</span>';
        const ok = await saveMember(session.code, target);
        msgEl.innerHTML = ok ? '<span class="ok-msg">✔ Salvato.</span>' : `<span class="err">⚠ ${escapeHTML(lastApiError||'errore sconosciuto')}</span>`;
        if(ok) cachedRoster = await getRoster(session.code);
      };
      const resetBtn = document.getElementById('d-reset');
      if(resetBtn){
        resetBtn.onclick = async ()=>{
          if(!window.confirm(`Azzerare il Digimon di ${target.username} (${target.digimon.name||'senza nome'})? Nome, Stage, Qualities, Attacchi e tutti i punteggi torneranno ai valori iniziali e potrà rifare la Creazione Guidata. L'azione non è reversibile.`)) return;
          if(!window.confirm(`Sei sicuro? Questa è l'ultima conferma prima di azzerare definitivamente il Digimon di ${target.username}.`)) return;
          target.digimon = defaultDigimon();
          const ok = await saveMember(session.code, target);
          if(ok) cachedRoster = await getRoster(session.code);
          renderPage();
        };
      }
    }

    enableCollapsibleCards(root);
  }

  function bindListEditors(target){
    root.querySelectorAll('[data-q-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.digimon.qualities.splice(Number(btn.getAttribute('data-q-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    const qAdd = document.getElementById('d-q-add');
    if(qAdd) qAdd.onclick = async ()=>{
      const name = document.getElementById('d-q-name').value.trim();
      if(!name) return;
      const cost = Number(document.getElementById('d-q-cost').value)||0;
      const category = document.getElementById('d-q-category').value.trim();
      const description = document.getElementById('d-q-desc').value.trim();
      target.digimon.qualities.push({ name, cost, category, description });
      await saveMember(session.code, target);
      renderPage();
    };
    root.querySelectorAll('[data-a-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.digimon.attacks.splice(Number(btn.getAttribute('data-a-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    const aAdd = document.getElementById('d-a-add');
    if(aAdd) aAdd.onclick = async ()=>{
      const name = document.getElementById('d-a-name').value.trim();
      if(!name) return;
      const shape = document.getElementById('d-a-shape').value;
      const type = document.getElementById('d-a-type').value;
      const reach = Number(document.getElementById('d-a-reach').value)||0;
      const signature = document.getElementById('d-a-signature').checked;
      const desc = document.getElementById('d-a-desc').value.trim();
      target.digimon.attacks.push({ name, shape, type, effectKey:'', extraTags:'', desc, signature, reach, areaAttack:false });
      await saveMember(session.code, target);
      renderPage();
    };
  }

  function bindImageUpload(target){
    const fileInput = document.getElementById('d-img-file');
    const btn = document.getElementById('d-img-btn');
    const statusEl = document.getElementById('d-img-status');
    if(!fileInput || !btn) return;
    btn.onclick = ()=> fileInput.click();
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      statusEl.textContent = 'Caricamento...';
      btn.disabled = true;
      try{
        const dataUrl = await new Promise((resolve,reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await uploadImage(session.code, dataUrl);
        if(res && res.ok && res.url){
          const imgEl = document.getElementById('d-imageUrl');
          if(imgEl) imgEl.value = res.url;
          statusEl.textContent = '✔ Caricata — ricordati di salvare.';
        } else {
          statusEl.textContent = '⚠ Caricamento fallito: ' + (lastApiError||'errore sconosciuto');
        }
      }catch(e){
        statusEl.textContent = '⚠ Errore: ' + e.message;
      }
      btn.disabled = false;
      fileInput.value = '';
    };
  }

  const restored = loadSession();
  if(restored && restored.code && restored.username){ session = restored; }
  (async ()=>{
    if(session){
      cachedRoster = await getRoster(session.code);
      cachedProgression = await getProgression(session.code);
      startPolling();
    }
    render();
    // Se arriviamo dallo Scan (?prefillName=...), apri subito la Wizard del Digimon pre-compilata —
    // solo se il Digimon non è già stato creato, per non azzerare per sbaglio una scheda esistente.
    const prefill = getStarterPrefillFromURL();
    if(prefill && session && session.role==='player'){
      const me = cachedRoster.find(m=>m.username===session.username);
      if(!me || !me.digimon.name){
        startDigimonWizard(prefill);
      }
      clearStarterPrefillFromURL();
    }
  })();
})();
</script>
</body>
</html>
