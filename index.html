  @font-face {
    font-family: 'Pixel Digivolve';
    src: url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff2') format('woff2'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff') format('woff'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.ttf') format('truetype');
    font-display: swap;
  }
  .digimoji-text{ font-family:'Digicode','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP','MS Gothic','Share Tech Mono',monospace; letter-spacing:0.08em; font-size:20px; cursor:help; }
  .pixel-title{ font-family:'Pixel Digivolve','Share Tech Mono',monospace; letter-spacing:0.03em; }
  :root{
    --bg: #080b10;
    --panel: #0e141b;
    --panel-2: #121a22;
    --line: #1c2a30;
    --cyan: #35e8c9;
    --cyan-dim: #1f6e63;
    --amber: #ff8a3d;
    --text: #dcece8;
    --text-mute: #6d8385;
    --danger: #ff5d5d;
    --radius: 2px;
    font-family: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root-app{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing: 0.04em;}
  .app{min-height:100vh;background:
      radial-gradient(circle at 15% 10%, rgba(53,232,201,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,138,61,0.05), transparent 45%),
      var(--bg);
      padding:20px; position:relative; overflow-x:hidden;}
  .scanline{position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;}
  .hud-frame{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); position:relative;}
  .hud-frame::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
  .hud-frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);}
  /* Cornice "a Digivice" per gli Evolution Point (vedi epDigiviceHTML): non più una cornice ricostruita
     a CSS, ma l'immagine reale del Digivice fornita dall'utente, usata come sfondo/cornice. Il foro
     trasparente al centro dell'immagine (dove nel PNG originale c'è la finestrella LCD) viene coperto
     da .ep-dv-screen, posizionato in percentuale sulle stesse proporzioni misurate sul PNG, dentro cui
     scorrono le "barrette" orizzontali che indicano quanti EP sono disponibili. */
  .ep-digivice{display:inline-flex;flex-direction:column;align-items:center;gap:4px;--dv-w:110px;vertical-align:middle;}
  .ep-digivice.mini{--dv-w:58px;gap:2px;}
  .ep-dv-frame{position:relative;width:var(--dv-w);aspect-ratio:33/30;flex-shrink:0;
    background-image:url('https://gsquzfhxgyqrnkrqdivc.supabase.co/storage/v1/object/public/campaign-images/FRONTIER1/1787672473672_rpmfhm.png');
    background-size:100% 100%;background-repeat:no-repeat;}
  .ep-dv-screen{position:absolute;left:37%;top:36%;width:25.8%;height:28.3%;background:#04110d;border-radius:2px;
    overflow:hidden;display:flex;flex-direction:column-reverse;gap:6%;box-shadow:inset 0 0 4px rgba(0,0,0,0.85);}
  .ep-dv-bar{flex:1 1 0;min-height:0;background:#16262c;border-radius:0.5px;}
  .ep-dv-bar.filled{background:var(--cyan);box-shadow:0 0 3px rgba(53,232,201,0.85);}
  .ep-dv-bar.dim{opacity:0.15;}
  .ep-dv-label{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.05em;color:var(--text-mute);text-transform:uppercase;white-space:nowrap;line-height:1.2;text-align:center;}
  .ep-digivice.mini .ep-dv-label{font-size:9px;}
  .ep-dv-label b{color:var(--cyan);font-size:14px;}
  .ep-digivice.mini .ep-dv-label b{font-size:11px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-dot{width:9px;height:9px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .brand-title{font-family:'Pixel Digivolve','Share Tech Mono',monospace;font-size:15px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.05em;}
  .brand-sub{font-size:11px;color:var(--text-mute);}
  .conn-ticker{font-size:11px;color:var(--text-mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
  .conn-ticker b{color:var(--cyan);}

  .btn{font-family:'Share Tech Mono',monospace;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px 14px;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:0.05em;border-radius:var(--radius);transition:.15s;}
  .btn:hover{background:rgba(53,232,201,0.1);border-color:var(--cyan);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.solid{background:var(--cyan);color:#04211c;border-color:var(--cyan);font-weight:700;}
  .btn.solid:hover{background:#4ffbe0;}
  .btn.amber{border-color:var(--amber);color:var(--amber);}
  .btn.amber:hover{background:rgba(255,138,61,0.12);}
  .btn.ghost{border-color:var(--line);color:var(--text-mute);}
  .btn.small{padding:5px 10px;font-size:10px;}

  input[type=text], input[type=number], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; font-family:'Manrope',sans-serif; font-size:13px; border-radius:var(--radius); width:100%;
  }
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--cyan-dim);}
  label{font-size:10px;text-transform:uppercase;color:var(--text-mute);letter-spacing:0.06em;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-mute);margin:8px 0;}
  .checkbox-row input{width:auto;flex:none;}
  .checkbox-row label{display:inline;margin:0;text-transform:none;font-size:12px;color:var(--text);cursor:pointer;}
  .section-title{font-size:12px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.08em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .section-title::before{ font-family:'Digicode',monospace; content:'ABC '; opacity:0.35; margin-right:4px; font-size:13px; letter-spacing:0.1em; }
  .card{padding:16px;margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .stat-box{text-align:center;padding:8px 4px;background:var(--panel-2);border:1px solid var(--line);}
  .stat-box .v{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--cyan);}
  .stat-box .l{font-size:9px;color:var(--text-mute);text-transform:uppercase;margin-top:2px;}
  .stat-box input{text-align:center;padding:4px;margin-top:4px;}

  .scene-box{position:relative; height:220px; border:1px solid var(--line); overflow:hidden; background:#05070a; margin-bottom:10px;}
  .scene-box[data-scene-img-expand]{cursor:zoom-in;}
  .scene-expand-hint{position:absolute;top:8px;right:10px;font-size:16px;opacity:0.65;text-shadow:0 0 6px rgba(0,0,0,0.9);z-index:2;pointer-events:none;}
  .scene-box img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.55;}
  .scene-box .overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(8,11,16,0) 40%, rgba(8,11,16,0.9) 100%);}
  .scene-box .title{position:absolute;bottom:10px;left:14px;font-family:'Pixel Digivolve','Share Tech Mono',monospace;color:var(--cyan);font-size:22px;letter-spacing:0.04em;text-shadow:0 0 12px rgba(53,232,201,0.6);}
  .scene-box .portraits{position:absolute;bottom:10px;right:14px;display:flex;gap:6px;}
  .scene-box .portraits img{width:44px;height:44px;object-fit:cover;border:1px solid var(--cyan-dim);border-radius:50%;background:#000;}
  .scene-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-size:12px;}
  .enc-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto;}
  .enc-modal-card{position:relative;max-width:460px;width:100%;padding:20px;background:var(--panel);border:1px solid var(--line);max-height:90vh;overflow-y:auto;}
  .enc-modal-img-wrap{width:100%;height:300px;background:#12181f;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .enc-modal-img{max-width:100%;max-height:100%;object-fit:contain;}

  .log{height:280px;overflow-y:auto;padding:10px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;}
  .log-entry{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.03);}
  .log-entry .who{font-family:'Share Tech Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
  .log-entry.player .who{color:var(--cyan);}
  .log-entry.gm .who{color:var(--amber);}
  .log-entry.digimon .who{color:#c896ff;}
  .log-entry.roll .who{color:#7ee787;}
  .log-entry.roll{background:rgba(126,231,135,0.05);border-radius:4px;padding:8px;border-bottom:1px solid rgba(126,231,135,0.15);}
  .log-entry.request .who{color:var(--amber);}
  .log-entry.request{background:rgba(255,138,61,0.06);border-radius:4px;padding:8px;border-bottom:1px solid rgba(255,138,61,0.2);}
  .log-entry.moverequest .who{color:var(--cyan);}
  .log-entry.moverequest{background:rgba(53,232,201,0.06);border-radius:4px;padding:8px;border-bottom:1px solid rgba(53,232,201,0.2);}
  .log-entry.enemy .who{color:var(--danger);}
  /* Contorno invece di sfondo tinto: i messaggi da Nemico/NPC portano quasi sempre un colore
     scelto a mano (Colore scritta in chat) — uno sfondo colorato dietro ci "sporcava" la resa.
     Un bordo intorno al messaggio basta a segnalare la provenienza senza interferire. */
  .log-entry.enemy{border:1px solid rgba(255,93,93,0.4);border-radius:4px;padding:8px;}
  .log-entry.npc .who{color:#ffd76a;}
  .log-entry.npc{border:1px solid rgba(255,215,106,0.4);border-radius:4px;padding:8px;}
  .who-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid var(--line);flex-shrink:0;}
  .log-entry.digimon .who-avatar{border-radius:4px;object-fit:contain;background:rgba(200,150,255,0.08);width:28px;height:28px;}
  .log-entry .txt{color:var(--text);margin-top:2px;line-height:1.4;}
  .log-entry .txt .log-h{font-weight:700;margin:6px 0 3px;line-height:1.3;}
  .log-entry .txt .log-h1{font-size:16px;color:var(--amber);}
  .log-entry .txt .log-h2{font-size:14.5px;color:var(--amber);}
  .log-entry .txt .log-h3{font-size:13.5px;color:var(--cyan);}
  .log-entry .txt .log-h:first-child{margin-top:0;}
  /* Discorso diretto ("...") distinto dalla narrazione/azione circostante: colore caldo +
     corsivo, così a colpo d'occhio si separa il "detto/pronunciato" dal resto del testo —
     vedi formatLogText(). Riconosce sia le virgolette dritte "..." sia quelle tipografiche
     "..."/«...». */
  .log-entry .txt .log-speech{color:var(--amber);font-style:italic;}
  .log-entry .meta{font-size:10px;color:var(--text-mute);margin-left:8px;}
  .log-image{max-width:220px;max-height:220px;border-radius:6px;border:1px solid var(--line);margin-top:6px;display:block;cursor:zoom-in;object-fit:cover;}
  /* "Menziona" in chat: mostra chi si sta citando (una voce del Digidex o un NPC) come un
     piccolo badge cliccabile dentro il testo del messaggio, invece di un semplice nome scritto. */
  .mention-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(53,232,201,0.12);border:1px solid var(--cyan-dim);color:var(--cyan);border-radius:12px;padding:1px 8px 1px 2px;font-size:12px;cursor:pointer;vertical-align:middle;line-height:1.6;}
  .mention-chip img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .mention-chip:hover{border-color:var(--cyan);background:rgba(53,232,201,0.22);}

  .dice-perspective{perspective:400px;display:inline-flex;gap:6px;vertical-align:middle;}
  .die3d{display:inline-block;font-size:26px;line-height:1;color:var(--cyan);animation:diceroll 0.7s cubic-bezier(.3,1.4,.6,1);}
  @keyframes diceroll{
    0%{ transform: rotateX(0deg) rotateY(0deg) scale(0.5); opacity:0.2; }
    55%{ transform: rotateX(340deg) rotateY(160deg) scale(1.2); opacity:1; }
    100%{ transform: rotateX(720deg) rotateY(360deg) scale(1); }
  }
  .roll-btn{background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);cursor:pointer;font-size:13px;padding:1px 6px;border-radius:3px;line-height:1.4;}
  .roll-btn:hover{background:rgba(53,232,201,0.1);}
  .roll-total{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--cyan);margin-left:8px;}
  .roll-verdict{font-family:'Share Tech Mono',monospace;font-size:12px;text-transform:uppercase;margin-left:8px;padding:2px 8px;border-radius:12px;}
  .roll-verdict.crit-success{background:rgba(53,232,201,0.18);color:var(--cyan);}
  .roll-verdict.success{background:rgba(126,231,135,0.15);color:#7ee787;}
  .roll-verdict.fail{background:rgba(255,93,93,0.12);color:var(--danger);}
  .roll-verdict.crit-fail{background:rgba(255,93,93,0.25);color:var(--danger);}

  .moves-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .move-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px;text-align:left;cursor:pointer;border-radius:var(--radius);}
  .move-btn:hover{border-color:var(--cyan-dim);}
  .move-btn .name{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--cyan);}
  .move-btn .desc{font-size:11px;color:var(--text-mute);margin-top:3px;}

  .login-wrap{max-width:420px;margin:60px auto;}
  .login-wrap h1{font-family:'Pixel Digivolve','Share Tech Mono',monospace;color:var(--cyan);font-size:28px;letter-spacing:0.03em;text-align:center;text-shadow:0 0 16px rgba(53,232,201,0.5);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:28px;}
  .role-pick{display:flex;gap:10px;margin-bottom:16px;}
  .role-pick .btn{flex:1;}
  .role-pick .btn.active{background:rgba(53,232,201,0.12);border-color:var(--cyan);color:var(--cyan);}
  #tab-scheda.active, #tab-inventario.active, #tab-dex.active, #tab-bug.active{background:rgba(53,232,201,0.12);border-color:var(--cyan);color:var(--cyan);}

  .roster-item{padding:10px;border-bottom:1px solid var(--line);font-size:12px;}
  .roster-item:last-child{border-bottom:none;}
  .roster-item .name{color:var(--cyan);font-family:'Share Tech Mono',monospace;}
  .roster-item .sub{color:var(--text-mute);}
  /* Struttura esplicita della riga di testa (avatar+nome a sinistra, EP+azioni a destra),
     invece dei soli div inline di prima: serve ad avere qualcosa di preciso da bersagliare nel
     media query mobile, dove la riga va spezzata su più righe (vedi sotto) invece di restare
     stretta orizzontalmente e "tagliata" fuori dallo schermo. */
  .roster-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .roster-item-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .roster-item-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .roster-item-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* Selettore Chat (Generale/Privata/Gruppo) — prima era stilizzato SOLO dentro il media query
     mobile (sotto 760px): su desktop restava con l'aspetto grezzo di default del browser,
     stonando col resto dell'interfaccia. Questa è la versione "sempre attiva", coerente con
     .btn; il media query più sotto aggiunge solo aggiustamenti di misura per il touch. */
  .chat-seg{
    display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;
  }
  .chat-seg-btn{
    flex:1;padding:8px 4px;font-family:'Share Tech Mono',monospace;font-size:11px;
    text-align:center;background:var(--panel-2);color:var(--text-mute);border:none;cursor:pointer;
    border-right:1px solid var(--line);text-transform:uppercase;letter-spacing:0.03em;
    position:relative;transition:.15s;
  }
  .chat-seg-btn:last-child{border-right:none;}
  .chat-seg-btn:hover{color:var(--text);}
  .chat-seg-btn.active{background:rgba(53,232,201,0.12);color:var(--cyan);font-weight:700;}
  .chat-seg-btn .seg-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--danger);margin-left:4px;vertical-align:middle;
  }

  .suggest-box{background:var(--panel-2);border:1px solid var(--cyan-dim);padding:10px;margin-top:8px;font-size:12px;}
  .suggest-line{padding:6px 8px;margin-bottom:4px;background:rgba(53,232,201,0.05);cursor:pointer;border-radius:var(--radius);}
  .suggest-line:hover{background:rgba(53,232,201,0.12);}
  .dice-panel-bar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .dice-btn{padding:4px 8px;font-size:12px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--mono);min-width:36px;text-align:center;transition:border-color .15s,background .15s;}
  .dice-btn:hover{border-color:var(--cyan);background:rgba(53,232,201,0.08);}
  .dice-btn.active{border-color:var(--cyan);background:rgba(53,232,201,0.15);color:var(--cyan);}
  .dice-qty{width:38px;text-align:center;font-size:12px;padding:4px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--mono);}
  .dice-mod{width:46px;text-align:center;font-size:12px;padding:4px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--mono);}
  .dice-roll-go{padding:4px 12px;font-size:12px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--cyan);background:rgba(53,232,201,0.15);color:var(--cyan);font-weight:700;}

  .tag{font-size:10px;padding:2px 8px;border:1px solid var(--line);color:var(--text-mute);border-radius:20px;text-transform:uppercase;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .muted{color:var(--text-mute);font-size:11px;}
  .err{color:var(--danger);font-size:11px;margin-top:6px;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--cyan-dim);}

  /* ===== Orologio di Gioco ===== */
  .game-clock-display{display:inline-flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--amber);letter-spacing:0.04em;white-space:nowrap;}
  .game-clock-display .clock-icon{font-size:14px;opacity:0.8;}
  .game-clock-display .clock-time{font-size:15px;font-weight:700;text-shadow:0 0 8px rgba(255,138,61,0.4);}
  .game-clock-display .clock-label{font-size:9px;color:var(--text-mute);text-transform:uppercase;}
  .game-clock-master-panel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;margin-bottom:12px;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);}
  .game-clock-master-panel label{margin:0;font-size:10px;}
  .game-clock-master-panel input[type=time]{width:110px;padding:4px 6px;font-size:13px;font-family:'Share Tech Mono',monospace;}
  .game-clock-master-panel .btn{padding:4px 10px;font-size:10px;}
  .game-clock-master-panel select{width:auto;min-width:120px;padding:4px 6px;font-size:11px;}
  /* Badge giorno/notte sovrapposto alla scene-box */
  .scene-daytime-badge{position:absolute;top:8px;left:10px;display:inline-flex;align-items:center;gap:5px;
    font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.04em;
    padding:3px 10px 3px 6px;border-radius:12px;z-index:3;pointer-events:none;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .scene-daytime-badge .dt-icon{font-size:16px;line-height:1;}
  .scene-daytime-badge .dt-label{text-transform:uppercase;font-size:10px;letter-spacing:0.08em;}
  .scene-daytime-badge .dt-time{font-weight:700;font-size:13px;}
  .scene-daytime-badge.dt-dawn{background:rgba(255,183,77,0.2);color:#ffb74d;border:1px solid rgba(255,183,77,0.35);}
  .scene-daytime-badge.dt-day{background:rgba(255,236,130,0.18);color:#ffec82;border:1px solid rgba(255,236,130,0.3);}
  .scene-daytime-badge.dt-dusk{background:rgba(255,138,101,0.2);color:#ff8a65;border:1px solid rgba(255,138,101,0.35);}
  .scene-daytime-badge.dt-night{background:rgba(100,120,200,0.2);color:#90a4f4;border:1px solid rgba(100,120,200,0.35);}
  .scene-daytime-badge.dt-midnight{background:rgba(70,70,140,0.22);color:#7e7ec8;border:1px solid rgba(70,70,140,0.35);}

  @media (max-width: 760px){
    .app{padding:6px;padding-bottom:calc(66px + env(safe-area-inset-bottom, 0px));}
    .topbar{flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px;margin-bottom:10px;}
    .conn-ticker{font-size:10px;}
    .brand-title{font-size:12px;}
    .grid2{grid-template-columns:1fr;gap:10px;}
    .card{padding:10px;margin-bottom:10px;}
    .row{flex-wrap:wrap;}
    .row > *{flex:1 1 100%;min-width:0;}
    .grid-stats{grid-template-columns:repeat(3,1fr);gap:6px;}
    .stat-box{padding:6px 3px;}
    .stat-box .v{font-size:16px;}
    .moves-grid{grid-template-columns:1fr;}
    .role-pick{flex-direction:column;}
    .login-wrap{margin:24px auto;max-width:100%;padding:20px !important;}
    .scene-box{height:140px;}
    .sheet-head{flex-wrap:wrap;}
    .die3d, .die3d-static{font-size:20px !important;}
    .roster-item .sub{font-size:11px;}
    /* Su schermi stretti la riga di testa del Roster (avatar+nome a sinistra, EP+4 bottoni a
       destra) non ci sta più affiancata: va in colonna, e il blocco EP+azioni passa a piena
       larghezza sotto nome/avatar invece di restare compresso/tagliato accanto ad essi. I
       bottoni delle azioni si dispongono su una griglia 2 colonne invece di una riga unica che
       sfora lo schermo. */
    .roster-item-head{flex-direction:column;align-items:stretch;gap:8px;}
    .roster-item-right{width:100%;justify-content:flex-start;}
    .roster-item-actions{width:100%;}
    .roster-item-actions .btn{flex:1 1 calc(50% - 6px);text-align:center;}
    input[type=text], input[type=number], textarea, select{font-size:16px;}
    .btn{font-size:11px;padding:8px 10px;-webkit-tap-highlight-color:transparent;}
    .btn.small{padding:6px 8px;font-size:10px;}
    #sidebar-content, .hud-frame.card{width:100%;}
    div[style*="display:flex;gap:14px"]{flex-direction:column;}
    div[style*="display:grid;grid-template-columns:1fr 1fr;gap:14px"]{grid-template-columns:1fr;}

    /* ===== CHAT MOBILE: il log occupa quasi tutto lo schermo ===== */
    .mobile-section[data-mobile-tab="chat"] .log{
      height:calc(100svh - 230px) !important;min-height:200px;max-height:calc(100svh - 180px);
      font-size:14px;
    }
    .mobile-section[data-mobile-tab="chat"] .section-title{margin-bottom:4px !important;padding-bottom:4px !important;}
    /* Input area compatta */
    .mobile-section[data-mobile-tab="chat"] textarea{rows:1;font-size:15px;padding:10px;border-radius:8px;margin-top:6px;}
    .mobile-section[data-mobile-tab="chat"] .row{gap:6px;margin-top:6px !important;}
    /* Nascondi "Correggi italiano" su mobile per risparmiare spazio, accessibile dal menu */
    .mobile-section[data-mobile-tab="chat"] #btn-correct{display:none;}
    /* Master: nascondi controlli "parla come" dietro un details/summary */
    .mobile-section[data-mobile-tab="chat"] .gm-speak-controls{margin-top:6px;}
    .mobile-section[data-mobile-tab="chat"] .gm-speak-controls summary{
      font-size:11px;color:var(--text-mute);cursor:pointer;padding:6px 0;
      -webkit-tap-highlight-color:transparent;
    }
    /* ===== MINI-LOG nel tab Battle (mobile): ultimi 4 messaggi ===== */
    #combat-mini-log{
      max-height:180px;overflow-y:auto;font-size:12px;
      border:1px solid var(--line);border-radius:6px;padding:6px 8px;
      background:var(--panel);margin-bottom:10px;
    }
    #combat-mini-log .log-entry{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
    #combat-mini-log .log-entry:last-child{border-bottom:none;}
    #combat-mini-log .who-avatar{width:22px;height:22px;}
    #combat-mini-log .log-entry .log-who{font-size:11px;}
    #combat-mini-log .log-entry .log-text{font-size:12px;line-height:1.35;}

    .combat-turn-chat-banner{
      padding:8px 12px;margin-bottom:10px;border-radius:6px;
      border:1px solid var(--cyan);background:rgba(53,232,201,0.08);
      font-size:13px;color:var(--cyan);text-align:center;
      animation:turnChatPulse 2s ease-in-out 3;
    }
    @keyframes turnChatPulse{
      0%,100%{opacity:1;} 50%{opacity:0.6;}
    }

    /* Log entry avatar più grandi su mobile */
    .who-avatar{width:36px;height:36px;}
    .log-entry.digimon .who-avatar{width:40px;height:40px;}
    .log-entry .who{font-size:12px;}
    .log-entry .txt{font-size:13.5px;line-height:1.5;}
    .log-image{max-width:180px;max-height:180px;}

    /* ===== Widget audio / attributi: mai sopra il menu in basso su mobile ===== */
    .dvos-fixed-widget{
      right:6px !important;
      z-index:8500 !important; /* sotto il menu (9000), sopra il contenuto */
    }
    .dvos-audio-fixed{
      bottom:calc(56px + env(safe-area-inset-bottom, 0px) + 8px) !important;
    }
    .dvos-attr-fixed{
      bottom:calc(56px + env(safe-area-inset-bottom, 0px) + 50px) !important;
    }

    /* ===== BOTTOM NAV (mobile only) ===== */
    .mobile-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:9000;
      display:flex;align-items:stretch;
      background:var(--panel);border-top:1px solid var(--line);
      box-shadow:0 -2px 12px rgba(0,0,0,0.5);
      padding:0;height:56px;
      padding-bottom:env(safe-area-inset-bottom, 0);
      /* Rimosso backdrop-filter: lo sfondo qui sopra (var(--panel)) è già opaco (#0e141b,
         nessun alpha), quindi il blur non aveva alcun effetto visivo su nessun browser —
         serviva solo a innescare un bug noto di compositing di Safari/WebKit su elementi
         "position:fixed" con backdrop-filter, che produce una riga/artefatto colorato
         (qui: la striscia ciano che taglia le icone segnalata dall'utente, riprodotta solo
         su Safari e non su altri browser/telefono). Vedi claude/split-status-addendum-*.md. */
    }
    .mobile-nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;background:none;border:none;color:var(--text-mute);font-size:9px;
      font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;
      cursor:pointer;padding:4px 2px;position:relative;
      -webkit-tap-highlight-color:transparent;
    }
    .mobile-nav-btn .nav-icon{font-size:18px;line-height:1;}
    .mobile-nav-btn.active{color:var(--cyan);}
    .mobile-nav-btn.active::after{
      content:'';position:absolute;top:0;left:25%;right:25%;height:2px;
      background:var(--cyan);border-radius:0 0 2px 2px;
    }
    .mobile-nav-btn .nav-badge{
      position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;
      border-radius:50%;background:var(--danger);box-shadow:0 0 4px var(--danger);
    }

    /* Sezioni mobile: solo quella attiva è visibile... */
    .mobile-section{display:none !important;}
    .mobile-section.mobile-active{display:block !important;padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px)) !important;}
    /* ...tranne "Scena": resta sempre visibile (musica + Digimon in scena), anche mentre si è su
       Chat o Battaglia, sia per i giocatori che per il Master. È la STESSA sezione della scheda
       Scena (nessuna duplicazione): questa regola la sottrae al toggle sopra perché il selettore
       con l'attributo ha specificità maggiore della classe .mobile-section da sola. */
    .mobile-section[data-mobile-tab="scena"]{display:block !important;}
    /* Quando però NON si è effettivamente sulla scheda Scena (manca .mobile-active: si è su Chat/
       Battaglia/ecc.), il contenuto completo è superfluo — resta visibile solo l'essenziale
       (sfondo/immagine della Scena + i Digimon in essa, via #scene-live), nascondendo: titolo
       sezione, riga Milestone/Ispirazione, widget audio, breadcrumb/descrizione del Settore
       (unico .hud-frame.card dentro #scene-live), e per il Master anche tutti i campi di editing
       (Titolo/Immagine/Musica/Luoghi/Incontri/ecc.) e il pannello Mappa dei Settori. Sempre la
       STESSA sezione, nessun elemento duplicato: solo un sottoinsieme nascosto via CSS. */
    .mobile-section[data-mobile-tab="scena"]:not(.mobile-active) > .hud-frame.card > *:not(#scene-live){display:none;}
    .mobile-section[data-mobile-tab="scena"]:not(.mobile-active) #scene-live > .hud-frame.card{display:none;}
    .mobile-section[data-mobile-tab="scena"]:not(.mobile-active) #sector-map-card{display:none;}
    .mobile-section[data-mobile-tab="scena"]:not(.mobile-active) > .hud-frame.card{padding-bottom:8px;margin-bottom:8px;}

    /* Chat: segmented control — solo aggiustamenti di misura per touch, lo stile base è
       nella regola .chat-seg/.chat-seg-btn fuori dal media query (sempre attiva). */
    .chat-seg-btn{
      padding:10px 4px;-webkit-tap-highlight-color:transparent;
    }

    /* Schede pieghevoli mobile: card con section-title cliccabile per espandere/comprimere */
    .hud-frame.card .section-title{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
    .hud-frame.card.collapsed{padding-bottom:12px;}

    /* Chat send bar: textarea + bottone inline su mobile */
    .mobile-send-bar{display:flex;gap:6px;align-items:flex-end;margin-top:6px;}
    .mobile-send-bar textarea{flex:1;min-height:38px;max-height:100px;resize:none;border-radius:8px;padding:10px;font-size:15px;margin:0 !important;}
    .mobile-send-bar .btn{height:38px;border-radius:8px;padding:0 16px;flex-shrink:0;}
    /* Hint su mobile: molto compatto */
    .mobile-section[data-mobile-tab="chat"] #action-hint{font-size:10px;margin-top:2px !important;line-height:1.3;}
  }

  /* Desktop: nasconde la nav e ignora le classi mobile */
  @media (min-width: 761px){
    .mobile-nav{display:none !important;}
    .mobile-section{display:block !important;}
  }

  .portrait{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .portrait-sm{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;}
  .sheet-head{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
  .sheet-head .info{flex:1;}
  .sheet-head .nm{font-family:'Share Tech Mono',monospace;color:var(--cyan);font-size:15px;}
  .sheet-head .tg{font-size:11px;color:var(--text-mute);}

  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;color:var(--text-mute);margin-bottom:3px;letter-spacing:0.05em;}
  .bar-label .val{font-family:'Share Tech Mono',monospace;color:var(--text);}
  .bar-track{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;transition:width .3s;}
  .bar-fill.hp{background:linear-gradient(90deg, var(--cyan-dim), var(--cyan));}
  .bar-fill.mp{background:linear-gradient(90deg, #6b3fa0, #c896ff);}
  .bar-fill.low{background:linear-gradient(90deg, #8a2f2f, var(--danger));}
  .bar-controls{display:flex;gap:6px;align-items:center;margin-top:4px;}
  .bar-controls button{width:22px;height:22px;line-height:1;border:1px solid var(--line);background:var(--panel-2);color:var(--cyan);cursor:pointer;border-radius:3px;font-size:14px;}
  .bar-controls button:hover{border-color:var(--cyan-dim);}

  /* ---- Battery: chevron-cell charge readout instead of a plain gradient bar ---- */
  @keyframes battcharge{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
  .batt-cells{display:flex;gap:3px;}
  .batt-cell{flex:1;min-width:9px;height:18px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden;
    clip-path:polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%);
    box-shadow:inset 0 0 5px rgba(0,0,0,0.6);}
  .batt-cell::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.10), transparent 45%);}
  .batt-cell.filled{background:linear-gradient(180deg,#e6cbff,#8a4fe0 55%,#5c2ba3);border-color:#c299f5;
    box-shadow:0 0 9px rgba(168,121,232,0.75), 0 0 2px rgba(230,203,255,0.9), inset 0 0 4px rgba(255,255,255,0.35);
    animation:battcharge 2.4s ease-in-out infinite;}
  .batt-cell.locked{opacity:0.3;box-shadow:none;background:repeating-linear-gradient(135deg, var(--panel-2) 0 3px, var(--bg) 3px 6px);}
  .batt-cells.mini .batt-cell{height:11px;}

  /* ---- Compact HP readout for the Scene and Combat tracker ---- */
  @keyframes hpcrit{0%,100%{box-shadow:0 0 6px rgba(255,93,93,0.55);}50%{box-shadow:0 0 13px rgba(255,93,93,0.95);}}
  @keyframes evounready{0%,100%{box-shadow:0 0 5px rgba(255,138,61,0.5);border-color:var(--amber);}50%{box-shadow:0 0 15px rgba(255,138,61,0.95);border-color:#ffb066;}}
  .evo-btn-unready{animation:evounready 1.1s ease-in-out infinite;}
  @keyframes hpsheen{0%{transform:translateX(-120%);}100%{transform:translateX(220%);}}
  .hp-mini{display:flex;align-items:center;gap:6px;margin-top:5px;flex:1;min-width:80px;}
  .hp-mini-track{flex:1;height:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.6);}
  .hp-mini-fill{height:100%;border-radius:2px;transition:width .4s ease, background .4s ease;position:relative;overflow:hidden;}
  .hp-mini-fill::before{content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(0,0,0,0.35) 0 2px, transparent 2px 9%);}
  .hp-mini-fill::after{content:"";position:absolute;top:0;bottom:0;width:30%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation:hpsheen 3.2s ease-in-out infinite;}
  .hp-mini-fill.ok{background:linear-gradient(90deg, var(--cyan-dim), var(--cyan));}
  .hp-mini-fill.warn{background:linear-gradient(90deg, #b06a1f, var(--amber));box-shadow:0 0 6px rgba(255,138,61,0.4);}
  .hp-mini-fill.crit{background:linear-gradient(90deg, #8a2f2f, var(--danger));animation:hpcrit 1.1s ease-in-out infinite;}
  .hp-mini-fill.ko{background:repeating-linear-gradient(90deg,#3a3f3f 0 4px,#2a2e2e 4px 8px);}
  .hp-mini-val{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-mute);white-space:nowrap;}
  .hp-mini-label{font-size:9px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-mute);margin-right:2px;}
  .enc-card-mini{display:flex;flex-direction:column;align-items:center;}
  .target-dropdown-item:active{background:var(--panel-2);}
  .target-dropdown-item+.target-dropdown-item{border-top:1px solid var(--line);}

  .view-mode .field-static{margin-bottom:10px;}
  .field-static label{margin-bottom:2px;}
  .field-static .v{font-size:13px;color:var(--text);}
  .toggle-edit-btn{width:100%;margin-top:4px;}
</style>
</head>
<body>
<div class="scanline"></div>
<div id="root-app" class="app"></div>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/util.js"></script>
<script src="js/dice.js"></script>
<script src="js/rules.js"></script>
<script src="js/combat-engine.js"></script>
<script src="js/missions.js"></script>
<script src="js/digimoji.js"></script>
<script src="js/encounters.js"></script>
<script src="js/npc-registry.js"></script>
<script src="js/chat-composer.js"></script>
<script src="js/chat-log-engine.js"></script>
<script src="js/subgroups.js"></script>
<script src="js/private-chat.js"></script>
<script src="js/notices.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/digimon-card.js"></script>
<script src="js/tamer-card.js"></script>
<script src="js/progression.js"></script>
<script src="js/scene-encounters.js"></script>
<script src="js/dex-admin.js"></script>
<script src="js/ui-nav.js"></script>
<script>
// sidebarTab/editingTamer/editingScene dichiarate FUORI dalla IIFE sotto, come session/cachedXxx
// in js/store.js: sono flag di stato UI locale che funzioni ESTERNE (in js/tamer-card.js e
// probabilmente js/scene-encounters.js) leggono/scrivono -- se restano dentro la IIFE, quelle
// funzioni non le vedono e lanciano "X is not defined" al primo utilizzo, interrompendo lì tutta
// la funzione chiamante (inclusa initMobileNav più sotto in renderPlayer/renderMaster: da qui il
// sintomo "barra di navigazione mobile non risponde più"). sidebarTab e editingTamer erano
// entrambe la causa confermata di due crash successivi di renderPlayer per i giocatori (Fase 23);
// editingScene è stata promossa qui per prevenzione, stesso pattern, non ancora confermata rotta.
let sidebarTab = 'scheda';
let editingTamer = false;
let editingScene = false;
(function(){
  const root = document.getElementById('root-app');
  let pollTimer = null;
  // session e tutte le variabili cachedXxx (roster, scena, log, dex, npc, combat,
  // progressione, sottogruppi, missioni, log privati...) sono state spostate in js/store.js,
  // caricato prima di questo script -- restano lette E SCRITTE esattamente come prima
  // ovunque nel file (risalendo la catena di scope fino al globale), solo non sono piu'
  // dichiarate qui. E' il prerequisito per poter estrarre in futuro moduli come combat.js,
  // che hanno bisogno di leggere/scrivere questo stato da fuori questa IIFE.
  // lastApiError e' ora dichiarata in js/api.js (caricato prima di questo script) insieme ai
  // 4 helper apiGet/apiPost/apiPut/apiDelete che la scrivono -- qui sotto viene solo letta.
  const ONLINE_WINDOW_MS = 9000;
  const SESSION_KEY = 'digivice_session_v1';
  // EGG_IMAGE_URL spostata in js/ui-helpers.js

  // editingTamer/editingScene dichiarate sopra, fuori da questa IIFE (vedi commento lì).
  // editingDigimon spostato in js/digimon-card.js
  // sidebarTab dichiarata sopra, fuori da questa IIFE (vedi commento lì).
  // Tracciamento "ultimo messaggio già notificato" per le notifiche desktop — SEPARATO dal
  // tracciamento "letto/non letto" (che usa localStorage e persiste tra sessioni): qui basta la
  // memoria della scheda corrente, perché vogliamo solo evitare di notificare più volte lo stesso
  // messaggio ad ogni ciclo di polling (4s) mentre resta non letto.
  let __lastNotifiedPublicId; // undefined finché non facciamo il primo controllo (evita di notificare tutta la cronologia al caricamento)
  let __lastNotifiedPrivateIds = {}; // per thread (username) -> id dell'ultimo messaggio già notificato
  // Pallino "nuovo messaggio" sempre visibile in cima alla pagina (vedi topbar()): a differenza del
  // campanello 🔔, che richiede il permesso del browser e su Safari iPhone in scheda normale non è
  // nemmeno disponibile (typeof Notification==='undefined'), questo funziona SEMPRE, su qualunque
  // dispositivo, senza permessi — ed è anche l'unico modo di accorgersi di un nuovo messaggio quando
  // si è su un'altra parte della pagina (es. scheda Digimon) e il Registro non è a schermo.
  let __topbarUnreadFlag = false;
  function setTopbarUnread(v){
    __topbarUnreadFlag = v;
    const el = document.getElementById('topbar-chat-badge');
    if(el) el.style.display = v ? 'inline-block' : 'none';
  }
  // entry = ultimo messaggio del log (pubblico o del thread privato indicato da key); myName = nome
  // mostrato per l'utente corrente (per non auto-notificarsi dei propri messaggi). kind è 'public' o 'private'.
  function maybeNotifyNew(kind, key, entry, myName){
    if(!entry) return;
    const already = kind==='public' ? __lastNotifiedPublicId : __lastNotifiedPrivateIds[key];
    const firstCheck = already===undefined;
    if(kind==='public') __lastNotifiedPublicId = entry.id; else __lastNotifiedPrivateIds[key] = entry.id;
    if(firstCheck) return;
    if(String(entry.id)===String(already)) return;
    if(entry.who===myName) return;
    setTopbarUnread(true);
    if(typeof window.__dvosNotify==='function') window.__dvosNotify(kind==='public' ? `💬 ${entry.who}` : `✉️ ${entry.who} (privato)`, entry.text||'');
  }
  // dexActiveFilters/dexAddEvolutions/dexCanEditGlobal spostate in js/dex-admin.js
  // sectorMapSelectedId/moveOpenUsername/encounterDraft spostate in js/scene-encounters.js
  const ACTION_HINT_DEFAULT_TEXT = 'Scorciatoia: scrivi <code>/tira NomeSkill [TN] [major|minor]</code> (es. <code>/tira awareness 15 major</code>) per tirare in chat, opzionalmente usando un Aspect.';
  let pendingActionImageUrl = null;
  let pendingGmImageUrl = null;
  // "Rispondi a un messaggio specifico": stato del riquadro-anteprima sopra ciascun composer.
  // pendingReplyTo è condiviso dalle 3 modalità del composer del Giocatore (Generale/Privata/
  // Sottogruppo usano lo stesso <textarea id="action-text">); pendingGmReplyTo è solo per la
  // Chat Generale del Master (Privata e Sottogruppo hanno il proprio, vedi js/private-chat.js e
  // js/subgroups.js). Vedi replySnippetFromEntry/renderReplyBanner in js/chat-log-engine.js.
  let pendingReplyTo = null;
  let pendingGmReplyTo = null;
  // missionsModalOpen/missionDraftObjectives spostati in js/missions.js

  async function getProgression(code){
    const d = await apiGet('/api/state?resource=progression&code=' + encodeURIComponent(code));
    const p = d ? d.progression : { milestone:0, xp:0, inspiration:0, campaign_level:'Standard' };
    return { milestone: p.milestone||0, xp: p.xp||0, inspiration: p.inspiration||0, campaignLevel: p.campaign_level || 'Standard', attributeAdvantage: p.attributeAdvantage || p.attribute_advantage || '', naturalCriticalResults: !!(p.naturalCriticalResults || p.natural_critical_results), blastEvolutionEnabled: !!(p.blastEvolutionEnabled || p.blast_evolution_enabled), slideEvolutionEnabled: !!(p.slideEvolutionEnabled || p.slide_evolution_enabled), darkEvolutionEnabled: !!(p.darkEvolutionEnabled || p.dark_evolution_enabled) };
  }
  // saveProgression spostato in js/progression.js.

  async function getCombat(code){ const d = await apiGet('/api/state?resource=combat&code=' + encodeURIComponent(code)); return d ? d.combat : null; }
  // BUGFIX (segnalato dal vivo: "il personaggio torna indietro da solo post movimento e consuma
  // anche l'altra azione"): refreshLiveParts() ri-fetcha cachedCombat dal server ad ogni ciclo di
  // polling (ogni 15s) E lo fa girare anche a fine di ogni azione locale (es. doMove chiama
  // refreshLiveParts() subito dopo aver salvato). Se il timer di polling scattava PROPRIO durante
  // la finestra fra la mutazione locale (es. p.zone = newZone) e la risposta di questo
  // saveCombat(...), il refetch del poll sostituiva (Object.assign) cachedCombat.participants con
  // la copia ANCORA VECCHIA del server (scritta prima che questo salvataggio arrivasse) — a quel
  // punto il saveCombat in corso finiva per salvare quella stessa copia vecchia (nessun errore,
  // "ok"), quindi né lo spostamento né la spesa dell'Azione venivano davvero persistiti: la
  // narrazione in chat diceva "ti sei spostato" ma la posizione tornava quella di prima al giro di
  // polling successivo ("torna indietro da solo"). Il giocatore, non sapendo che la mossa non era
  // mai stata salvata, procedeva con l'azione successiva (es. Attacca) usando quella che credeva
  // fosse la sua seconda Azione — che invece era ancora la prima disponibile lato server, e veniva
  // sì spesa per davvero: netto, 2 Azioni consumate per un solo spostamento mai avvenuto. Fix:
  // combatActionPending resta true per tutta la durata di QUALSIASI salvataggio di combattimento
  // (saveCombat è l'unico punto da cui tutte le azioni di combattimento passano); refreshLiveParts
  // (vedi combatActionPending più sotto) salta il refetch del combattimento finché è true, quindi
  // un salvataggio in corso non può più essere sovrascritto da un poll concorrente. Riusata anche
  // come guardia anti-doppio-click nei bottoni self-service del giocatore (vedi bindAttacksCard/
  // bindCombatSelfActions), che rifiutano un secondo click mentre un salvataggio è già in corso.
  let combatActionPending = false;
  async function saveCombat(code, data){
    combatActionPending = true;
    try {
      return await apiPost('/api/state', { resource:'combat', code, data });
    } finally {
      combatActionPending = false;
    }
  }

  // ========== OROLOGIO DI GIOCO (In-Game Clock) ==========
  // Persistito come resource dedicata 'gameclock' su /api/state (tabella game_clock). Struttura:
  //   { baseTime: "08:00", clocks: { "general":"08:25", "sub:abc":"08:10", "private:user":"08:15" } }
  // - baseTime: l'orario impostato dal Master come punto di partenza.
  // - clocks: orario corrente per ogni "canale" (generale, sottogruppo, privata). Ogni messaggio
  //   in un canale avanza il suo orologio di 5 minuti; ogni round completato in combattimento
  //   avanza di 1 minuto l'orologio del canale dove il combattimento è ancorato (chatLock).
  let cachedGameClock = null;

  function defaultGameClock(){ return { baseTime:'08:00', clocks:{} }; }

  // L'orologio è salvato come resource dedicata 'gameclock' su /api/state (tabella game_clock
  // su Supabase). Stessa struttura di combat: { data: { baseTime, clocks } }.
  async function getGameClock(code){
    const d = await apiGet('/api/state?resource=gameclock&code=' + encodeURIComponent(code));
    return d && d.gameclock ? d.gameclock : defaultGameClock();
  }
  async function saveGameClock(code, data){
    return apiPost('/api/state', { resource:'gameclock', code, data });
  }

  // Aggiunge `minutes` all'orologio di un canale specifico. channelKey = 'general' | 'sub:<id>' | 'private:<username>'
  function clockAddMinutes(clockStr, minutes){
    const [h,m] = (clockStr||'08:00').split(':').map(Number);
    let total = h*60 + m + minutes;
    total = ((total % 1440) + 1440) % 1440; // wrap 24h
    return String(Math.floor(total/60)).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
  }

  async function advanceGameClock(channelKey, minutes){
    if(!session || !cachedScene) return;
    if(!cachedGameClock) cachedGameClock = await getGameClock(session.code);
    const gc = cachedGameClock;
    if(!gc.clocks) gc.clocks = {};
    const current = gc.clocks[channelKey] || gc.baseTime || '08:00';
    gc.clocks[channelKey] = clockAddMinutes(current, minutes);
    await saveGameClock(session.code, gc);
    refreshGameClockDisplay();
  }

  // Determina il channelKey in base a dove sta scrivendo l'utente corrente.
  function currentClockChannel(){
    if(session && session.role==='player'){
      if(typeof playerChatMode!=='undefined'){
        if(playerChatMode==='subgroup' && typeof playerActiveSubgroupId!=='undefined' && playerActiveSubgroupId)
          return 'sub:'+playerActiveSubgroupId;
        if(playerChatMode==='private') return 'private:'+session.username;
      }
      return 'general';
    }
    // Master: scrive sempre in generale (il suo composer non ha private/subgroup toggle nella
    // stessa forma, ma il canale del combattimento è gestito separatamente).
    return 'general';
  }

  // Restituisce l'orario corrente per il canale indicato (o il canale attivo se non specificato).
  function getClockTime(channelKey){
    if(!cachedGameClock) return '??:??';
    const gc = cachedGameClock;
    const key = channelKey || currentClockChannel();
    return (gc.clocks && gc.clocks[key]) || gc.baseTime || '08:00';
  }

  // Formatta il display dell'orologio (usato nel topbar e ovunque serve).
  function gameClockHTML(channelKey){
    const time = getClockTime(channelKey);
    const dt = daytimeInfo(time);
    return `<span class="game-clock-display"><span class="clock-icon">${dt.icon}</span><span class="clock-time">${escapeHTML(time)}</span><span class="clock-label">${escapeHTML(dt.label)}</span></span>`;
  }

  // Fascia oraria → icona, etichetta e classe CSS per il badge giorno/notte sulla scena.
  // Le fasce sono:  00-04 Notte Fonda, 05-06 Alba, 07-11 Mattina, 12-16 Pomeriggio,
  //                 17-18 Tramonto, 19-20 Sera, 21-23 Notte.
  function daytimeInfo(clockStr){
    const [h] = (clockStr||'08:00').split(':').map(Number);
    if(h >= 0  && h < 5)  return { icon:'🌑', label:'Notte Fonda',  cls:'dt-midnight' };
    if(h >= 5  && h < 7)  return { icon:'🌅', label:'Alba',         cls:'dt-dawn' };
    if(h >= 7  && h < 12) return { icon:'☀️', label:'Mattina',       cls:'dt-day' };
    if(h >= 12 && h < 17) return { icon:'🌤️', label:'Pomeriggio',   cls:'dt-day' };
    if(h >= 17 && h < 19) return { icon:'🌇', label:'Tramonto',     cls:'dt-dusk' };
    if(h >= 19 && h < 21) return { icon:'🌆', label:'Sera',         cls:'dt-dusk' };
    return                        { icon:'🌙', label:'Notte',        cls:'dt-night' };
  }

  // HTML del badge giorno/notte, iniettato dentro la scene-box (position:absolute, top-left).
  function sceneDaytimeBadgeHTML(channelKey){
    const time = getClockTime(channelKey);
    if(time==='??:??') return '';
    const dt = daytimeInfo(time);
    return `<div class="scene-daytime-badge ${dt.cls}"><span class="dt-icon">${dt.icon}</span><span class="dt-time">${escapeHTML(time)}</span><span class="dt-label">${escapeHTML(dt.label)}</span></div>`;
  }

  // Inietta (o aggiorna) il badge giorno/notte dentro la prima .scene-box trovata in pagina.
  function refreshSceneDaytimeBadge(){
    const box = document.querySelector('.scene-box');
    if(!box) return;
    let badge = box.querySelector('.scene-daytime-badge');
    const html = sceneDaytimeBadgeHTML();
    if(!html){ if(badge) badge.remove(); return; }
    if(badge){
      badge.outerHTML = html;
    } else {
      box.insertAdjacentHTML('afterbegin', html);
    }
  }

  // Aggiorna il display dell'orologio già presente in pagina (chiamata dopo ogni avanzamento e polling).
  function refreshGameClockDisplay(){
    const el = document.getElementById('game-clock-live');
    if(el) el.innerHTML = gameClockHTML();
    // Badge giorno/notte sulla scena
    refreshSceneDaytimeBadge();
    // Aggiorna anche l'eventuale orologio nel pannello Master con tutti i canali
    const panel = document.getElementById('game-clock-all-channels');
    if(panel){
      const gc = cachedGameClock || defaultGameClock();
      const channels = allClockChannels();
      const base = gc.baseTime || '08:00';
      panel.innerHTML = channels.map(ch=>{
        const time = (gc.clocks && gc.clocks[ch.key]) || base;
        const dt = daytimeInfo(time);
        return `<span style="display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;font-size:12px;font-family:'Share Tech Mono',monospace;"><span style="font-size:14px;">${dt.icon}</span><span style="color:var(--text-mute);">${escapeHTML(ch.label)}</span> <b style="color:var(--amber);">${escapeHTML(time)}</b></span>`;
      }).join('');
      // Aggiorna anche il selettore se presente
      refreshClockChannelSelect();
    }
  }

  // Pannello Master per impostare l'orologio (inserito dal render del Master).
  // Costruisce la lista completa dei canali: Generale + ogni sottogruppo + ogni giocatore (privata).
  function allClockChannels(){
    const channels = [{ key:'general', label:'💬 Generale' }];
    (cachedSubgroups||[]).forEach(g=>{
      channels.push({ key:'sub:'+g.id, label:'👥 '+g.name });
    });
    (cachedRoster||[]).filter(m=>m.role==='player').forEach(m=>{
      channels.push({ key:'private:'+m.username, label:'✉️ Privata ('+displayName(m)+')' });
    });
    return channels;
  }

  function gameClockMasterPanelHTML(){
    const gc = cachedGameClock || defaultGameClock();
    const channels = allClockChannels();
    const channelOpts = channels.map(ch=>{
      const time = (gc.clocks && gc.clocks[ch.key]) ? ` [${gc.clocks[ch.key]}]` : '';
      return `<option value="${escapeAttr(ch.key)}">${escapeHTML(ch.label)}${escapeHTML(time)}</option>`;
    }).join('');
    return `
    <div class="game-clock-master-panel">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span style="font-size:16px;">🕐</span>
        <label style="white-space:nowrap;">Ora Base</label>
        <input type="time" id="gc-base-time" value="${escapeAttr(gc.baseTime||'08:00')}" />
        <button class="btn small" id="gc-set-base">Imposta</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <label style="white-space:nowrap;">Canale</label>
        <select id="gc-channel-select"><option value="__all__">— Tutti i canali —</option>${channelOpts}</select>
        <label style="white-space:nowrap;">Vai a</label>
        <input type="time" id="gc-manual-time" value="${escapeAttr(gc.baseTime||'08:00')}" />
        <button class="btn small" id="gc-set-channel">Imposta</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="btn small amber" id="gc-reset-all" title="Riporta tutti i canali all'Ora Base">🔄 Reset Tutti</button>
      </div>
    </div>
    <div id="game-clock-all-channels" style="margin-bottom:10px;"></div>`;
  }

  function bindGameClockMasterPanel(){
    const setBaseBtn = document.getElementById('gc-set-base');
    if(setBaseBtn) setBaseBtn.onclick = async ()=>{
      const val = document.getElementById('gc-base-time').value;
      if(!val) return;
      if(!cachedGameClock) cachedGameClock = defaultGameClock();
      cachedGameClock.baseTime = val;
      await saveGameClock(session.code, cachedGameClock);
      refreshGameClockDisplay();
    };
    const setChBtn = document.getElementById('gc-set-channel');
    if(setChBtn) setChBtn.onclick = async ()=>{
      const ch = document.getElementById('gc-channel-select').value;
      const val = document.getElementById('gc-manual-time').value;
      if(!val) return;
      if(!cachedGameClock) cachedGameClock = defaultGameClock();
      if(!cachedGameClock.clocks) cachedGameClock.clocks = {};
      if(ch==='__all__'){
        // Imposta TUTTI i canali conosciuti, non solo quelli già avanzati
        allClockChannels().forEach(c=>{ cachedGameClock.clocks[c.key] = val; });
        cachedGameClock.baseTime = val;
      } else {
        cachedGameClock.clocks[ch] = val;
      }
      await saveGameClock(session.code, cachedGameClock);
      refreshGameClockDisplay();
      // Aggiorna le opzioni del selettore per mostrare i nuovi orari
      refreshClockChannelSelect();
    };
    const resetBtn = document.getElementById('gc-reset-all');
    if(resetBtn) resetBtn.onclick = async ()=>{
      if(!cachedGameClock) cachedGameClock = defaultGameClock();
      const base = cachedGameClock.baseTime || '08:00';
      cachedGameClock.clocks = {};
      await saveGameClock(session.code, cachedGameClock);
      refreshGameClockDisplay();
    };
    refreshGameClockDisplay();
  }

  // Aggiorna le opzioni del selettore canale per riflettere gli orari correnti (senza ricreare
  // l'intero pannello, che perderebbe il focus dell'utente).
  function refreshClockChannelSelect(){
    const sel = document.getElementById('gc-channel-select');
    if(!sel) return;
    const gc = cachedGameClock || defaultGameClock();
    const channels = allClockChannels();
    const current = sel.value;
    sel.innerHTML = '<option value="__all__">— Tutti i canali —</option>' + channels.map(ch=>{
      const time = (gc.clocks && gc.clocks[ch.key]) ? ` [${gc.clocks[ch.key]}]` : '';
      return `<option value="${escapeAttr(ch.key)}"${ch.key===current?' selected':''}>${escapeHTML(ch.label)}${escapeHTML(time)}</option>`;
    }).join('');
  }
  // ========== Fine Orologio di Gioco ==========

  // ---------- Blocco chat di combattimento (richiesta utente) ----------
  // Quando il Master avvia un combattimento può scegliere UNA chat (Generale o un Sottogruppo
  // esistente) dove: 1) viene inviato un avviso che spiega che la chat è bloccata; 2) i giocatori
  // non possono più scrivere messaggi liberi in quella chat finché il Master non conclude il
  // combattimento (bindActionSend più sotto controlla combatChatLockLocationMatches prima di ogni
  // invio); 3) tutta la narrazione automatica del combattimento (tiri, spostamenti, danni, Clash,
  // ecc. — vedi pushCombatNarration, usata al posto di pushLog da tutte le funzioni di
  // combattimento) viene instradata lì invece che sempre in Chat Generale. combat.chatLock è
  // { location: 'general' | 'sub:<id sottogruppo>', message } — location null/assente = nessun
  // blocco, comportamento identico a prima (pushCombatNarration si comporta come pushLog).
  const DEFAULT_COMBAT_LOCK_MESSAGE = "⚔️ È iniziato un combattimento! Questa chat resta bloccata per i giocatori finché il Master non lo conclude — segui qui gli eventi e le narrazioni dello scontro.";
  function combatChatLockLabel(location){
    if(!location || location==='general') return 'Chat Generale';
    if(location.startsWith('sub:')){
      const g = (cachedSubgroups||[]).find(x=>x.id===location.slice(4));
      return g ? `Sottogruppo: ${g.name}` : 'Sottogruppo';
    }
    return location;
  }
  // Instrada la narrazione automatica di un'azione di combattimento verso la chat scelta dal
  // Master per QUEL combattimento (combat.chatLock), con lo stesso schema location già usato
  // altrove (pushLog per Generale, pushPrivateLog col thread 'subgroup:'+id per un Sottogruppo).
  // Se il Master non ha scelto nessuna chat (combat.chatLock assente — combattimento "vecchio
  // stile"/nessun blocco richiesto), si comporta esattamente come un pushLog normale: nessun
  // cambiamento di comportamento per chi non usa la feature.
  // Stesso instradamento di pushCombatNarration, ma restituisce solo il `thread` (es.
  // 'subgroup:xxx', o null per la Chat Generale) usato per quella chiamata — serve a chi deve poi
  // MODIFICARE il messaggio appena pubblicato (narrazione AI in arrivo dopo la frase di base):
  // editLogEntry deve ricevere lo stesso thread, altrimenti cerca di aggiornare la riga sbagliata
  // (la tabella "logs" pubblica invece di "private_logs") e l'update non trova nulla da cambiare.
  function combatNarrationThread(combat){
    const lock = combat && combat.chatLock;
    if(!lock || !lock.location || lock.location==='general') return null;
    if(lock.location.startsWith('sub:')) return 'subgroup:'+lock.location.slice(4);
    return null;
  }
  async function pushCombatNarration(combat, entry){
    const lock = combat && combat.chatLock;
    if(!lock || !lock.location || lock.location==='general') return pushLog(session.code, entry);
    if(lock.location.startsWith('sub:')){
      const subgroupId = lock.location.slice(4);
      // IMPORTANTE: niente cachedSubgroups qui — è popolata SOLO in un paio di punti lato Master
      // (pannello "Sottogruppi di Chat", selettore sottogruppo della richiesta di tiro). Per un
      // Giocatore resta sempre vuota/non aggiornata, quindi group risultava sempre undefined e la
      // riga finiva silenziosamente su currentLocationKey() (posizione del gruppo) invece che su
      // quella vera del sottogruppo — il narrato dell'azione del giocatore veniva scritto, ma
      // filtrato via dalla vista "Storico per Settore" della chat del sottogruppo (sembrava che
      // "non uscisse nulla"). getSubgroups fa una fetch fresca, funziona per chiunque.
      const groups = await getSubgroups(session.code);
      const group = groups.find(g=>g.id===subgroupId);
      const meta = { ...(entry.meta||{}) };
      if(meta.location===undefined) meta.location = group ? subgroupLocationKey(group) : currentLocationKey();
      return pushPrivateLog(session.code, 'subgroup:'+subgroupId, { ...entry, meta });
    }
    return pushLog(session.code, entry);
  }
  // true se il composer di chat che il GIOCATORE sta guardando in questo momento (chatMode +
  // eventuale sottogruppo attivo) è proprio quello bloccato da un combattimento in corso — usata
  // sia per disabilitare visivamente il campo (renderChatArea) sia come controllo definitivo
  // prima dell'invio (bottone "Invia"), così non è aggirabile anche se la UI fosse rimasta stale.
  // myTurnNow (opzionale): se true, la chat si considera SBLOCCATA anche se coincide con quella
  // scelta come "chat di combattimento" — durante il proprio turno si può sempre parlare lì,
  // indipendentemente da quale fosse la chat bloccata dal Master. Chiamare senza questo parametro
  // (o con false/undefined) per sapere se una data chat È quella scelta come chatLock a prescindere
  // dal turno — utile per mostrare il messaggio "è il tuo turno" solo in quella chat specifica.
  function combatChatLockLocationMatches(chatMode, subgroupId, myTurnNow){
    if(!cachedCombat || !cachedCombat.active || !cachedCombat.chatLock) return false;
    if(myTurnNow) return false;
    const loc = cachedCombat.chatLock.location;
    if(!loc) return false;
    if(loc==='general') return chatMode==='public';
    if(loc.startsWith('sub:')) return chatMode==='subgroup' && subgroupId===loc.slice(4);
    return false;
  }
  // Countdown/scadenza delle 24h dall'inizio del turno attuale (combat.turnStartedAt, impostato
  // quando il Master calcola l'ordine dei turni e ad ogni "Turno Successivo" — vedi
  // advanceCombatTurn/btn-combat-calc-order): puramente informativo, un promemoria di quanto tempo
  // resta prima che sia "regolare" per il Master intervenire al posto del giocatore di turno — il
  // Master può già farlo in qualsiasi momento dal proprio Combat Manager (nessun controllo di
  // turno lato Master), questo timer non blocca né sblocca nulla di per sé.
  function combatTurnTimerLabel(combat){
    if(!combat || !combat.turnStartedAt) return null;
    const started = new Date(combat.turnStartedAt).getTime();
    if(isNaN(started)) return null;
    const elapsedMs = Date.now() - started;
    const remainingMs = 24*60*60*1000 - elapsedMs;
    const fmt = (ms)=>{ const h = Math.floor(ms/3600000); const m = Math.floor((ms%3600000)/60000); return h>0 ? `${h}h ${m}m` : `${m}m`; };
    return remainingMs <= 0 ? { expired:true, overText: fmt(-remainingMs) } : { expired:false, text: fmt(remainingMs) };
  }

  // buildInitiativeOrder spostato in js/combat-engine.js

  // Ogni Azione appartiene al pool del Tamer o a quello del Digimon -- Indice Regole 9.01: "ogni
  // partecipante guadagna 2 Azioni (Tamer e Digimon separatamente)". 'pool' indica quale contatore
  // del partecipante viene scalato da trySpendAction: 'tamer' -> participant.tamerActions,
  // 'digimon' -> participant.actions. Move/Difficult Move/Clash sono "Tamer o Digimon" a regolamento,
  // ma il sito non modella il Tamer come entità fisica separata (niente zona/Accuracy/Dodge propri),
  // quindi per ora restano sul pool del Digimon -- vedi claude/audit-regolamento-dda2e.md, Addendum 3.
  // Ogni voce ha ora anche 'desc': testo semplice mostrato sotto ai due select di scelta Azione
  // (pannello Giocatore e riga del Master) -- richiesta utente: "le scelte del tamer non si capiscono
  // minimamente quali siano". Vedi combatSelfActionHTML/bindCombatSelfActions e renderCombatManager.
  const ACTION_DEFS = [
    { key:'move', label:'Muovi', cost:1, pool:'digimon', desc:'Sposta il Digimon di 1 zona lungo la linea delle distanze.' },
    { key:'attack', label:'Attacca (Digimon)', cost:1, oncePerRound:true, pool:'digimon', desc:'Il Digimon usa uno dei suoi Attacchi (tira Accuracy, il bersaglio tira Dodge). Una sola volta a round.' },
    { key:'attack_tamer', label:'Attacca (Tamer)', cost:1, oncePerRoundTamer:true, pool:'tamer', desc:'Il Tamer stesso attacca (tiro di Precision, 1-2 Danni se riesce) — non consuma l\'Attacco del Digimon.' },
    { key:'difficult_move', label:'Movimento Difficile', cost:2, pool:'digimon', desc:'Come Muovi, ma può attraversare Terreno Difficile.' },
    { key:'holdback', label:'Trattieni Colpo', cost:1, pool:'digimon', desc:'Attacco non letale: se ridurrebbe il bersaglio a 0 Ferite, resta a 1 ma incapacitato per il resto dello scontro. Non disponibile in Stance Offensiva/Fierce o con Attacchi [HAZARD].' },
    { key:'skill_tamer', label:'Skill Check (Tamer)', cost:1, pool:'tamer', desc:'Il Tamer tenta una Prova di Abilità a sua scelta (es. persuadere, cercare indizi).' },
    { key:'skill_digimon', label:'Skill Check (Digimon)', cost:2, pool:'digimon', desc:'Il Digimon tenta una Prova di Abilità a sua scelta (costa 2 Azioni Digimon).' },
    { key:'stance', label:'Cambio Stance', cost:1, pool:'digimon', desc:'Il Digimon cambia Stance di combattimento (Neutrale/Offensiva/Difensiva). Una volta a turno.' },
    { key:'clash', label:'Clash', cost:1, pool:'digimon', desc:'Avvia un Clash (contrasto diretto) contro un bersaglio. Una volta a turno contro lo stesso bersaglio.' },
    { key:'bolster_tamer', label:'Bolster (Tamer, +2)', cost:1, pool:'tamer', desc:'Trasforma 1 Azione con Pool Check in 2 Azioni: +2 dadi al Pool Check (anche per potenziare Direct/Aid/Guard).' },
    { key:'bolster_digimon', label:'Bolster (Digimon, +SV)', cost:1, pool:'digimon', desc:'Come sopra, ma per il Digimon: il bonus è pari al suo SV più alto nel Default Range invece di +2.' },
    { key:'aid', label:'Aid', cost:1, pool:'digimon', desc:'Il Digimon tenta di aiutare un alleato entro il proprio Reach: su questo tavolo si tira un vero Pool Check (Nd6 = Stage) e, se riesce almeno 1 successo, l\'alleato ottiene il bonus prima del suo prossimo turno (variante rispetto al bonus garantito da regolamento). Una volta a turno.' },
    { key:'guard', label:'Guard', cost:1, pool:'digimon', desc:'Il Digimon si prepara: ottiene un bonus pari al proprio SV al prossimo Dodge Pool prima del suo prossimo turno (non conta ai fini delle penalità da Dodge ripetuto). Una volta a turno.' },
    { key:'resist1', label:'Resist (1 Az.)', cost:1, pool:'digimon', desc:'Riduce di 1 la Potenza di tutti gli Effetti attivi sul Digimon (a 0 l\'Effetto termina).' },
    { key:'resist2', label:'Resist (2 Az.)', cost:2, pool:'digimon', desc:'Come sopra, ma riduce la Potenza di 2 (2 Azioni spese).' },
    { key:'direct1', label:'Direct (1 Az. — Charisma)', cost:1, pool:'tamer', desc:'Il Tamer incita un Digimon: aggiunge dadi pari a Charisma al suo prossimo Accuracy/Dodge Pool (-2 se non è il proprio partner). Dura finché non viene usato o il Tamer ripete l\'Azione. Una volta a turno.' },
    { key:'direct2', label:'Direct (2 Az. — Highest Attribute)', cost:2, pool:'tamer', desc:'Come Direct (1 Az.), ma il bonus è pari all\'Attributo più alto del Tamer invece di Charisma.' },
    { key:'reinforce1', label:'Reinforce (1 Az. — Body)', cost:1, pool:'tamer', reinforceOnce:true, desc:'Il Tamer tira un Pool Check di Body: il Digimon ottiene Wound Box Temporanee pari ai successi, fino al prossimo turno del Tamer. Una volta a turno.' },
    { key:'reinforce2', label:'Reinforce (2 Az. — Highest Attribute)', cost:2, pool:'tamer', reinforceOnce:true, desc:'Come Reinforce (1 Az.), ma il Pool Check usa l\'Attributo più alto del Tamer invece di Body.' },
    { key:'reposition1', label:'Reposition (1 Az. — Agility)', cost:1, pool:'tamer', desc:'Il Tamer aiuta il Digimon a riposizionarsi sulla linea delle distanze con un Pool Check di Agility.' },
    { key:'reposition2', label:'Reposition (2 Az. — Highest Attribute)', cost:2, pool:'tamer', desc:'Come Reposition (1 Az.), ma il Pool Check usa l\'Attributo più alto del Tamer invece di Agility.' },
    { key:'hold_action', label:'Hold Action (Tamer, 2 Az.)', cost:2, pool:'tamer', desc:'Il Tamer dichiara un trigger specifico e un\'Azione da 1 che il Digimon eseguirà se quel trigger si verifica prima del prossimo turno (con +Intelligence del Tamer al tiro). Se il trigger non si verifica, non succede nulla.' },
    { key:'hold_breath', label:'Hold Breath', cost:1, pool:'digimon', desc:'Evita il danno da annegamento per quel turno. Usi limitati per combattimento; se usata mentre si ha ancora aria, non consuma un utilizzo.' },
    { key:'other1', label:'Altro (1 Azione, Digimon)', cost:1, pool:'digimon', desc:'Azione libera del Digimon non elencata sopra (es. effetto di una Quality), costo 1 Azione.' },
    { key:'other2', label:'Altro (2 Azioni, Digimon)', cost:2, pool:'digimon', desc:'Come sopra, ma da 2 Azioni Digimon.' },
    { key:'other1_tamer', label:'Altro (1 Azione, Tamer)', cost:1, pool:'tamer', desc:'Azione libera del Tamer non elencata sopra, costo 1 Azione Tamer.' },
    { key:'other2_tamer', label:'Altro (2 Azioni, Tamer)', cost:2, pool:'tamer', desc:'Come sopra, ma da 2 Azioni Tamer.' }
  ];

  function trySpendAction(participant, actionKey){
    const def = ACTION_DEFS.find(a=>a.key===actionKey);
    if(!def) return { ok:false, msg:'Azione non valida' };
    const poolKey = def.pool==='tamer' ? 'tamerActions' : 'actions';
    if(actionKey==='move' && (participant.effects||[]).some(e=>e.key==='root')){
      return { ok:false, msg:'È sotto [ROOT]: non può usare Muovi finché l\'Effetto non termina.' };
    }
    // Reposition (Tamer) riuscito: 1 spostamento gratuito attraverso gli strumenti già esistenti
    // (frecce linea/Avvicina/Allontana/Imposta zona, tutti chiamano trySpendAction(p,'move')) --
    // finanziato dall'Azione Tamer già spesa per Reposition invece che da un'altra Azione Digimon.
    // Vedi applyActionMechanic per dove p.repositionFree viene guadagnato.
    if(actionKey==='move' && Number(participant.repositionFree||0)>0){
      participant.repositionFree -= 1;
      return { ok:true, def, freeReposition:true };
    }
    if(def.oncePerRound && participant.attackedThisRound){
      let hasAmmo = false;
      if(participant.isPC){
        const member = cachedRoster.find(m=>m.username===participant.username);
        if(member){
          const qMech = computeQualityMechanics(member.digimon.qualities);
          if(qMech.ammoRank>0){
            if(participant.ammoUsesLeft===undefined) participant.ammoUsesLeft = stageIndex(member.digimon.stage)+1;
            if(participant.ammoUsesLeft>0) hasAmmo = true;
          }
        }
      }
      if(!hasAmmo) return { ok:false, msg:'Ha già usato Attacca questo round.' };
    }
    if(def.oncePerRoundTamer && participant.attackedThisRoundTamer){
      return { ok:false, msg:'Il Tamer ha già usato Attacca questo round.' };
    }
    // Reinforce (9.06b, "Una volta a turno"): a differenza di Attacca (Tamer/Digimon, che hanno
    // già un flag dedicato sopra), Reinforce non aveva ALCUNA verifica -- un Tamer con abbastanza
    // Azioni poteva ripeterlo più volte nello stesso turno, sommando PF Temporanei ben oltre
    // quanto previsto da regolamento. Flag dedicato (non riusa attackedThisRoundTamer, che è
    // semanticamente legato solo ad Attacca Tamer) resettato a fine turno in applyEndOfTurnEffects.
    if(def.reinforceOnce && participant.usedReinforceThisTurn){
      return { ok:false, msg:'Il Tamer ha già usato Reinforce questo turno.' };
    }
    const current = participant[poolKey]===undefined ? 2 : participant[poolKey];
    if(current < def.cost) return { ok:false, msg: poolKey==='tamerActions' ? 'Azioni del Tamer insufficienti.' : 'Azioni insufficienti.' };
    participant[poolKey] = current - def.cost;
    if(def.oncePerRound){
      if(participant.attackedThisRound && participant.ammoUsesLeft>0){
        participant.ammoUsesLeft -= 1;
      } else {
        participant.attackedThisRound = true;
      }
    }
    if(def.oncePerRoundTamer){
      participant.attackedThisRoundTamer = true;
    }
    if(def.reinforceOnce){
      participant.usedReinforceThisTurn = true;
    }
    // Passa turno automatico dopo 5 minuti (richiesta utente, solo per PC -- mai per un Nemico
    // creato dal Master): timbra il momento in cui ENTRAMBI i pool di Azioni (Digimon e Tamer) si
    // esauriscono, così il conto alla rovescia parte da lì. Controllato/consumato in
    // refreshLiveParts (gira ogni 15s su ogni client); azzerato di nuovo non appena il
    // partecipante riottiene un'Azione in uno qualsiasi dei due pool (bottoni +1 Azione/↺ 2+2,
    // o il reset automatico a inizio turno in applyEndOfTurnEffects).
    const actsLeftNow = participant.actions===undefined?2:participant.actions;
    const tamerActsLeftNow = participant.tamerActions===undefined?2:participant.tamerActions;
    if(actsLeftNow<=0 && tamerActsLeftNow<=0 && !participant.actionsExhaustedAt){
      participant.actionsExhaustedAt = new Date().toISOString();
    }
    return { ok:true, def };
  }

  // ---------- bonus reale ai dadi per le Azioni di supporto (Direct/Aid/Guard/Bolster) ----------
  // Indice Regole 9.06a/9.06b: prima di questo blocco, queste Azioni spendevano solo Azioni e
  // scrivevano una narrazione fissa -- nessun effetto vero sui tiri (l'utente ha verificato: "viene
  // aumentato davvero il pool di dadi per gli attacchi?" -- risposta era no). Da qui in poi il
  // bonus si accoda sul bersaglio (participant.pendingRollBonus) e si consuma da solo al primo tiro
  // di Accuracy o Dodge che gli càpita addosso in performAttackRoll -- esattamente "al prossimo
  // Accuracy/Dodge Pool" del manuale.
  const SUPPORT_ACTION_KEYS = ['direct1','direct2','aid','guard','bolster_tamer','bolster_digimon'];
  // Stat del Tamer che controlla p (per Direct/Bolster Tamer). I Nemici non hanno una scheda Tamer
  // separata sul sito: stesso fallback fisso già usato per loro altrove (es. Finisher del Clash).
  function ownerAttr(p, key){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      return member ? Number(member.tamer[key]||0) : 1;
    }
    return Number(p[key]||1);
  }
  function participantSV(p){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      return member ? stageIndex(member.digimon.stage)+1 : 1;
    }
    return 1;
  }
  function highestAttribute(p){
    return Math.max(ownerAttr(p,'agility'), ownerAttr(p,'body'), ownerAttr(p,'charisma'), ownerAttr(p,'intelligence'), ownerAttr(p,'willpower'));
  }
  // Accoda un bonus al prossimo Pool Check del bersaglio. stat: 'either' (Direct/Aid/Bolster, che
  // dicono "Accuracy/Dodge") o 'dodge' (Guard, che nel manuale è ristretto al solo Dodge). Se c'è
  // già un bonus in coda si sommano gli importi (Bolster "potenzia" Direct/Aid/Guard già in coda),
  // altrimenti quello nuovo sostituisce il tipo restando comunque la somma dei due importi.
  function queuePendingRollBonus(target, amount, sourceLabel, stat){
    stat = stat || 'either';
    if(amount<=0) return;
    if(target.pendingRollBonus){
      target.pendingRollBonus.amount += amount;
      target.pendingRollBonus.source += ' + ' + sourceLabel;
      if(target.pendingRollBonus.stat!=='either') target.pendingRollBonus.stat = stat;
    } else {
      target.pendingRollBonus = { amount, source: sourceLabel, stat };
    }
  }
  // Effetto MECCANICO reale di Direct/Aid/Guard/Bolster (oltre a trySpendAction, che resta
  // responsabile solo del costo in Azioni). Ritorna { ok, note } da appendere alla narrazione.
  // NOTA IMPLEMENTAZIONE: a differenza del testo di regolamento (bonus flat, garantito, per
  // Direct/Guard/Bolster), Aid qui tira davvero un Pool Check (Nd6 pari a SV) e mette in coda il
  // bonus SOLO se il tiro ottiene almeno 1 Successo -- così come richiesto esplicitamente
  // dall'utente ("si fa il tiro di Aid e se il tiro riesce si aggiunge il bonus... in automatico").
  // È una scelta di house-rule dichiarata per questa sola Azione: se non è quello che intendevi,
  // dimmelo e lo riporto a bonus flat garantito come le altre tre.
  async function applySupportActionEffect(actionKey, actor, target){
    if(actionKey==='direct1' || actionKey==='direct2'){
      if(!target) return { ok:false, note:'nessun bersaglio scelto: nessun bonus accodato.' };
      const base = actionKey==='direct1' ? ownerAttr(actor,'charisma') : highestAttribute(actor);
      const own = target.id===actor.id;
      const amount = Math.max(0, base - (own?0:2));
      queuePendingRollBonus(target, amount, 'Direct', 'either');
      return { ok:true, note: `+${amount} Accuracy/Dodge in coda sul prossimo Pool Check di ${narratorName(target)}${own?'':' (-2: non è il proprio Digimon)'}.` };
    }
    if(actionKey==='guard'){
      const sv = participantSV(actor);
      queuePendingRollBonus(actor, sv, 'Guard', 'dodge');
      return { ok:true, note: `+${sv} Dodge (SV) in coda sul proprio prossimo Pool Check di Dodge.` };
    }
    if(actionKey==='aid'){
      if(!target) return { ok:false, note:'nessun bersaglio scelto: Aid non ha effetto.' };
      const sv = participantSV(actor);
      const roll = rollPool(sv);
      if(roll.successes>=1){
        queuePendingRollBonus(target, sv, 'Aid', 'either');
        return { ok:true, note: `Tiro di Aid ${sv}d6[${roll.dice.join(',')}]=${roll.successes} succ. → RIUSCITO: +${sv} Accuracy/Dodge in coda sul prossimo Pool Check di ${narratorName(target)}.` };
      }
      return { ok:true, note: `Tiro di Aid ${sv}d6[${roll.dice.join(',')}]=${roll.successes} succ. → NON RIUSCITO: nessun bonus accodato.` };
    }
    if(actionKey==='bolster_tamer' || actionKey==='bolster_digimon'){
      if(!target) return { ok:false, note:'nessun bersaglio scelto: nessun bonus accodato.' };
      const amount = actionKey==='bolster_tamer' ? 2 : participantSV(actor);
      const hadExisting = !!target.pendingRollBonus;
      const existingStat = hadExisting ? target.pendingRollBonus.stat : 'either';
      queuePendingRollBonus(target, amount, 'Bolster', existingStat);
      return { ok:true, note: `+${amount} extra in coda sul prossimo Pool Check di ${narratorName(target)}${hadExisting?' (potenzia un bonus già in coda)':''} — totale in coda: +${target.pendingRollBonus.amount}.` };
    }
    return { ok:false, note:'' };
  }

  // Chiavi delle Azioni gestite da applyActionMechanic qui sotto (richiesta utente:
  // "automatizziamo tutto" — prima queste voci erano puro bookkeeping: spendevano solo le Azioni e
  // scrivevano una riga di log generica, senza applicare alcun effetto di gioco vero).
  const MECHANIC_ACTION_KEYS = ['reinforce1','reinforce2','reposition1','reposition2','resist1','resist2','stance','skill_tamer','skill_digimon','clash'];
  // Effetto MECCANICO reale delle Azioni sopra. Stesso spirito di applySupportActionEffect: qui sopra
  // trySpendAction resta responsabile solo del costo in Azioni, questa funzione applica l'effetto
  // vero. extra porta dati scelti dall'utente nell'interfaccia (stance, skillKey) quando servono.
  // NOTA: Hold Action e Hold Breath restano bookkeeping puro (non incluse in MECHANIC_ACTION_KEYS) —
  // Hold Action dichiara un trigger condizionale futuro (nessun sistema di eventi nel sito per
  // rilevarlo in automatico), Hold Breath userebbe una risorsa "aria" mai modellata sul sito. Idem
  // per "Altro" (libere per definizione) e Attacca Tamer (rimosso dal menu su richiesta utente).
  async function applyActionMechanic(code, actionKey, actor, target, extra){
    extra = extra || {};
    // ---- Reinforce: Pool Check di Body (1 Az.) o Attributo più alto (2 Az.) del TAMER -> il
    // Digimon ottiene Wound Box Temporanee pari ai successi (tempWounds, stesso campo già usato
    // dallo Shield/dagli Effetti — vedi getParticipantWounds).
    // BUGFIX (segnalato dall'utente: "aveva fatto anche Reinforce, ma gli HP temporanei non sono
    // stati caricati da nessuna parte"): il ramo PC scriveva `member.digimon.tempWounds` solo sulla
    // copia locale di `cachedRoster` ma non chiamava MAI `saveMember` -- a differenza di ogni altro
    // punto del codice che tocca `member.digimon.*` (vedi applyDamageToParticipant/applyInstantEffect
    // Shield, entrambi in questo file). La modifica restava quindi solo in memoria sul client di chi
