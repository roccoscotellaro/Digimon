        <div class="mobile-section" data-mobile-tab="scheda">
          <div class="hud-frame" style="padding:6px;margin-bottom:16px;display:flex;gap:6px;">
            <button class="btn small" id="tab-scheda" style="flex:1;">Scheda</button>
            <button class="btn small" id="tab-inventario" style="flex:1;">Inventario</button>
            <button class="btn small" id="tab-bug" style="flex:1;">🐞 Bug</button>
          </div>
          <div id="sidebar-content"></div>
        </div>
      </div>
      ${playerMobileNavHTML()}
    `;

    renderSidebar(me);
    bindSceneAudio(cachedScene);
    bindTopbarChatJump();
    refreshSceneDaytimeBadge();
    document.getElementById('tab-scheda').onclick = ()=>{ sidebarTab='scheda'; renderSidebar(me); };
    document.getElementById('tab-inventario').onclick = ()=>{ sidebarTab='inventario'; renderSidebar(me); };
    document.getElementById('tab-bug').onclick = ()=>{ sidebarTab='bug'; renderSidebar(me); };

    document.getElementById('btn-logout').onclick = logout;
    document.getElementById('btn-open-missions').onclick = openMissionsModal;
    bindChatAttach('action', code, 'chat', ()=>pendingActionImageUrl, (url)=>{ pendingActionImageUrl = url; });
    bindMentionButton('action', code, 'action-text');
    renderChatArea(code, me, { forceScrollBottom:true }); // riempie il selettore location + il Registro (vedi sopra)
    // Popola il mini-log nel tab Battle al primo render
    {
      const _ml = document.getElementById('combat-mini-log');
      if(_ml && cachedLog && cachedLog.length > 0){
        const _last4 = cachedLog.slice(-4);
        _ml.innerHTML = typeof logHTML === 'function' ? logHTML(_last4, false) : _last4.map(e=>`<div style="padding:2px 0;font-size:12px;"><b style="color:var(--cyan);font-size:11px;">${escapeHTML(e.who||'')}</b> <span>${escapeHTML(e.text||'')}</span></div>`).join('');
        _ml.scrollTop = _ml.scrollHeight;
      }
      // Banner turno iniziale
      const _tb = document.getElementById('combat-turn-chat-banner');
      if(_tb && cachedCombat && cachedCombat.active && isMyCombatTurn(cachedCombat, session.username)){
        __lastTurnChatNotifiedUsername = currentTurnParticipant(cachedCombat)?.username || null;
        _tb.innerHTML = '<div class="combat-turn-chat-banner">⚔️ È il tuo turno! Ora puoi scrivere in chat 💬</div>';
      }
    }
    document.getElementById('btn-correct').onclick = async ()=>{
      const ta = document.getElementById('action-text');
      const status = document.getElementById('correct-status');
      status.textContent = 'Correzione in corso...';
      const corrected = await correggiItaliano(ta.value);
      ta.value = corrected;
      status.textContent = lastApiError ? ('Errore: ' + lastApiError) : 'Testo corretto.';
    };
    document.getElementById('btn-send-action').onclick = async ()=>{
      const ta = document.getElementById('action-text');
      const raw = ta.value.trim();
      if(!raw) return;
      if(combatChatLockLocationMatches(playerChatMode, playerActiveSubgroupId)){
        const actionHintEl = document.getElementById('action-hint');
        if(actionHintEl) actionHintEl.innerHTML = '<span style="color:var(--danger);">🔒 Questa chat è bloccata: è in corso un combattimento.</span>';
        return;
      }
      if(playerChatMode==='subgroup' && playerActiveSubgroupId){
        const subMeta = {};
        if(pendingActionImageUrl) subMeta.image = pendingActionImageUrl;
        // Vedi subgroupLocationKey: tagga con la posizione effettiva del sottogruppo, non quella
        // del gruppo intero, altrimenti un sottogruppo separato non viene mai "riconosciuto".
        subMeta.location = subgroupLocationKey((cachedSubgroups||[]).find(g=>g.id===playerActiveSubgroupId));
        await pushPrivateLog(code, 'subgroup:'+playerActiveSubgroupId, { who: displayName(me), role:'player', text: raw, meta: subMeta });
        advanceGameClock('sub:'+playerActiveSubgroupId, 5); // +5min per messaggio sottogruppo
        ta.value='';
        pendingActionImageUrl = null;
        const ap = document.getElementById('action-img-preview');
        if(ap) ap.innerHTML = '';
        await refreshPlayerLogDisplay(code, me);
        return;
      }
      if(playerChatMode==='private'){
        // Stesso trattamento dell'immagine allegata della chat pubblica qui sotto (pendingActionImageUrl
        // è condiviso tra le due modalità, dato che usano lo stesso widget #action-img-*): senza questo
        // l'immagine restava selezionata nel widget ma non veniva mai inviata in privato.
        const privTextMeta = {};
        if(pendingActionImageUrl) privTextMeta.image = pendingActionImageUrl;
        // Vedi memberLocationKey: tagga con la posizione effettiva del giocatore (se separato
        // dal gruppo), non quella del gruppo intero.
        privTextMeta.location = memberLocationKey(me);
        await pushPrivateLog(code, session.username, { who: displayName(me), role:'player', text: raw, meta: privTextMeta });
        advanceGameClock('private:'+session.username, 5); // +5min per messaggio privato
        ta.value='';
        pendingActionImageUrl = null;
        const actionPreviewPriv = document.getElementById('action-img-preview');
        if(actionPreviewPriv) actionPreviewPriv.innerHTML = '';
        await refreshPlayerLogDisplay(code, me);
        return;
      }
      const rollResult = await tryParseRollShortcut(raw, me);
      const resEl = document.getElementById('action-roll-result');
      if(rollResult){
        if(rollResult.dice && resEl){
          resEl.innerHTML = `${diceRowHTML(rollResult.dice)}<span class="roll-total">${rollResult.resultLabel}</span>${rollResult.verdict?`<span class="roll-verdict ${rollResult.verdict.cls}">${rollResult.verdict.label}</span>`:''}`;
        } else if(resEl){
          resEl.innerHTML = '';
        }
        const rollMeta = rollResult.dice ? { dice: rollResult.dice } : {};
        if(pendingActionImageUrl) rollMeta.image = pendingActionImageUrl;
        await pushLog(code, { who: displayName(me), role:'roll', text: rollResult.text, meta: Object.keys(rollMeta).length ? rollMeta : null });
      } else {
        const textMeta = {};
        if(pendingActionImageUrl) textMeta.image = pendingActionImageUrl;
        await pushLog(code, { who: displayName(me), role:'player', text: raw, meta: Object.keys(textMeta).length ? textMeta : null });
      }
      advanceGameClock('general', 5); // +5min per messaggio generale
      ta.value='';
      pendingActionImageUrl = null;
      const actionPreview = document.getElementById('action-img-preview');
      if(actionPreview) actionPreview.innerHTML = '';
      refreshLiveParts();
    };
    bindAttacksCard(code, me);
    attachLogModeration(document.getElementById('log-live'), code, me, undefined, undefined, refreshLiveParts);
    bindCombatSelfActions(code, session.username);
    // Frecce ◀/▶ della linea distanze (vedi zoneLineHTML): compaiono anche al Giocatore quando è
    // il suo turno — le leghiamo già al primo render, non solo al primo poll di refreshLiveParts.
    bindZoneLineArrows(code, (cachedRoster||[]).filter(m=>m.role==='player'));
    updateChatModeButtons();
    // Chat segmented control (mobile-friendly, works on desktop too)
    document.querySelectorAll('#player-chat-seg .chat-seg-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const mode = btn.dataset.chatmode;
        playerChatMode = mode;
        document.querySelectorAll('#player-chat-seg .chat-seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.chatmode===mode));
        const subWrap = document.getElementById('player-subgroup-select-wrap');
        if(subWrap) subWrap.style.display = mode==='subgroup' ? '' : 'none';
        await refreshPlayerLogDisplay(code, me);
      };
    });
    updateChatModeButtons();
    initMobileNav();

    startPolling();
  }

  let editingSkills = false;

  // siblingCardId spostato in js/ui-helpers.js

  function renderSkillsCard(me, containerId){
    containerId = containerId || 'skills-card';
    const cardEl = document.getElementById(containerId);
    if(!cardEl) return;
    const t = me.tamer;
    if(!editingSkills){
      const gp = Number(t.unspentGrowthPoints||0);
      cardEl.innerHTML = `
        <div class="flex-between"><div class="section-title" style="margin:0;border:none;padding:0;">Skill</div>
        <button class="btn small" id="btn-edit-skills">Modifica</button></div>
        ${gp>0 ? `
          <div class="hud-frame" style="padding:8px;margin:10px 0;border-color:var(--cyan-dim);">
            <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Growth Points disponibili</span><span class="mono" style="color:var(--cyan);">${gp}</span></div>
            <div class="row">
              <select id="gp-skill-select" style="flex:2;">${SKILL_DEFS.map(d=>`<option value="${d.key}">${escapeHTML(d.label)}</option>`).join('')}</select>
              <button class="btn small" id="btn-gp-skill" style="flex:1;">+1 Skill (1 GP)</button>
            </div>
            ${gp>=3 ? `
            <div class="row" style="margin-top:6px;">
              <select id="gp-attr-select" style="flex:2;">
                <option value="agility">Agility</option><option value="body">Body</option><option value="charisma">Charisma</option><option value="intelligence">Intelligence</option><option value="willpower">Willpower</option>
              </select>
              <button class="btn small" id="btn-gp-attr" style="flex:1;">+1 Attributo (3 GP)</button>
            </div>` : ''}
            <div class="muted" id="gp-status" style="margin-top:4px;"></div>
          </div>
        ` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;">
          ${SKILL_DEFS.map(def=>`
            <div class="stat-box" style="text-align:left;padding:6px 8px;">
              <div class="l" style="margin-bottom:2px;">${escapeHTML(def.label)}</div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span class="v" style="font-size:15px;">${Number(t.skills[def.key])||0}</span>
                <span style="display:flex;align-items:center;gap:4px;">
                  <span class="muted" style="font-size:9px;">${def.attrs.map(a=>ATTR_ABBR[a]).join('/')}</span>
                  <button class="roll-btn" data-roll-skill="${def.key}" title="Tira ${escapeAttr(def.label)}">🎲</button>
                </span>
              </div>
            </div>
          `).join('')}
        </div>
        <div id="skill-roll-panel-${containerId}" style="margin-top:12px;"></div>
      `;
      document.getElementById('btn-edit-skills').onclick = ()=>{ editingSkills = true; renderSkillsCard(me, containerId); };
      const gpSkillBtn = document.getElementById('btn-gp-skill');
      if(gpSkillBtn){
        gpSkillBtn.onclick = async ()=>{
          const key = document.getElementById('gp-skill-select').value;
          const def = SKILL_DEFS.find(d=>d.key===key);
          const max = skillMax(t, def);
          const statusEl = document.getElementById('gp-status');
          if(Number(t.skills[key])||0 >= max){ statusEl.style.color='var(--danger)'; statusEl.textContent = `${def.label} è già al massimo consentito (${max}).`; return; }
          t.skills[key] = (Number(t.skills[key])||0) + 1;
          t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 1;
          await saveMember(session.code, me);
          renderSkillsCard(me, containerId);
        };
      }
      const gpAttrBtn = document.getElementById('btn-gp-attr');
      if(gpAttrBtn){
        gpAttrBtn.onclick = async ()=>{
          const attr = document.getElementById('gp-attr-select').value;
          const statusEl = document.getElementById('gp-status');
          const current = Number(t[attr])||0;
          const milestone = cachedProgression ? Number(cachedProgression.milestone||0) : 0;
          let cap = 5;
          if(milestone>=6) cap = 7; else if(milestone>=3) cap = 6;
          if(current >= cap){ statusEl.style.color='var(--danger)'; statusEl.textContent = `Tetto attuale per gli Attributi: ${cap} (Milestone ${milestone}).`; return; }
          t[attr] = current + 1;
          t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 3;
          await saveMember(session.code, me);
          renderSkillsCard(me, containerId);
          renderTamerCard(me, siblingCardId(containerId,'tamer'));
        };
      }
      cardEl.querySelectorAll('[data-roll-skill]').forEach(btn=>{
        btn.onclick = ()=>{ openSkillRollPanel(me, btn.getAttribute('data-roll-skill'), containerId); };
      });
    } else {
      cardEl.innerHTML = `
        <div class="section-title">Skill — Modifica</div>
        <div class="muted" style="margin-bottom:10px;">Una Skill non può superare il valore più alto tra i suoi Attributi collegati.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${SKILL_DEFS.map(def=>{
            const max = skillMax(t, def);
            return `
            <div class="field" style="margin-bottom:6px;">
              <label>${escapeHTML(def.label)} <span class="muted">(max ${max}, ${def.attrs.map(a=>ATTR_ABBR[a]).join('/')})</span></label>
              <input type="number" min="0" max="${max}" id="e-sk-${def.key}" value="${Number(t.skills[def.key])||0}" />
            </div>`;
          }).join('')}
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost" id="btn-cancel-skills">Annulla</button>
          <button class="btn solid" id="btn-save-skills">Salva</button>
        </div>
        <div class="muted" id="save-status-skills" style="margin-top:6px;"></div>
      `;
      document.getElementById('btn-cancel-skills').onclick = ()=>{ editingSkills = false; renderSkillsCard(me, containerId); };
      document.getElementById('btn-save-skills').onclick = async ()=>{
        SKILL_DEFS.forEach(def=>{
          const el = document.getElementById('e-sk-'+def.key);
          if(!el) return;
          const max = skillMax(t, def);
          let val = Number(el.value)||0;
          if(val > max) val = max;
          if(val < 0) val = 0;
          me.tamer.skills[def.key] = val;
        });
        const newMaxWounds = 3+Number(me.tamer.skills.endurance||0);
        if(me.tamer.currentWounds > newMaxWounds) me.tamer.currentWounds = newMaxWounds;
        const ok = await saveMember(session.code, me);
        const st = document.getElementById('save-status-skills');
        st.style.color = ok ? 'var(--text-mute)' : 'var(--danger)';
        st.textContent = ok ? 'Salvato.' : ('Errore: '+(lastApiError||''));
        if(ok){ editingSkills = false; renderSkillsCard(me, containerId); renderTamerCard(me, siblingCardId(containerId,'tamer')); }
      };
    }
  }

  const SKILL_LABEL_BY_KEY = { evade:'EVADE', precision:'PREC', stealth:'STEALTH', athletics:'ATHL', endurance:'END', featsOfStrength:'FOS', manipulate:'MANIP', perform:'PERF', persuasion:'PERS', decipherIntent:'D.INTENT', survival:'SURV', knowledge:'KNOW', fortitude:'FORT', bravery:'BRAV', awareness:'AWARE' };
  function talentAbbr(t){ return t.skill ? (SKILL_LABEL_BY_KEY[t.attr] || t.attr) : ATTR_ABBR[t.attr]; }

  function computeUnlockedTalents(tamer){
    const cfg = campaignConfig();
    const stdIdx = { 3:0, 5:1, 6:2, 7:3 };
    return TALENT_DEFS.filter(t => {
      const idx = stdIdx[t.threshold];
      const effectiveThreshold = idx!==undefined ? cfg.thresholds[idx] : t.threshold;
      const value = t.skill ? Number((tamer.skills && tamer.skills[t.attr])||0) : Number(tamer[t.attr]||0);
      return value >= effectiveThreshold;
    });
  }

      document.getElementById('tamer-w-plus').onclick = async ()=>{ me.tamer.currentWounds = Math.min(maxW, me.tamer.currentWounds+1); await saveMember(session.code, me); renderTamerCard(me, containerId); };
      document.getElementById('ip-minus').onclick = async ()=>{ me.tamer.inspirationPoints = Math.max(0, (me.tamer.inspirationPoints||0)-1); await saveMember(session.code, me); renderTamerCard(me, containerId); };

      const majorBtn = document.getElementById('btn-aspect-major-use');
      if(majorBtn) majorBtn.onclick = async ()=>{
        const asPenalty = window.confirm('OK = usa come bonus (+4, consuma 1 uso). Annulla = invoca la penalità (-4, ripristina l\'uso e guadagni 1 IP).');
        if(asPenalty){
          me.tamer.majorAspect.usesLeft = Math.max(0,(me.tamer.majorAspect.usesLeft||0)-1);
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Usa il Major Aspect "${me.tamer.majorAspect.text}" (+4 al prossimo Check).` });
        } else {
          me.tamer.majorAspect.usesLeft = 1;
          me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Invoca la penalità del Major Aspect "${me.tamer.majorAspect.text}" (-4), ripristina l'uso e guadagna 1 IP.` });
        }
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
        refreshLiveParts();

      const minorBtn = document.getElementById('btn-aspect-minor-use');

        if(asPenalty){
          me.tamer.minorAspect.usesLeft = Math.max(0,(me.tamer.minorAspect.usesLeft||0)-1);

          me.tamer.minorAspect.usesLeft = 2;
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Invoca la penalità del Minor Aspect "${me.tamer.minorAspect.text}" (-2), ripristina entrambi gli usi.` });
        }
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
        refreshLiveParts();
      };
      document.getElementById('btn-add-torment').onclick = async ()=>{
        const name = window.prompt('Nome del Torment:');

        const boxes = Math.max(0, Math.min(10, Number(boxesStr)||0));
        if(!me.tamer.torments) me.tamer.torments = [];
        me.tamer.torments.push({ name, boxes, usedThisRest:false });
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
      };

          renderTamerCard(me, containerId);

        btn.onclick = async ()=>{

          renderTamerCard(me, containerId);

          if(!tor || tor.usedThisRest) return;
          const result = rollTormentCheck(tor.boxes);
          let outcomeText;
          if(result.outcome==='crit-success'){
            tor.boxes = Math.max(0, tor.boxes-1);
            me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
            tor.usedThisRest = true;
            outcomeText = 'Successo Critico! Cancella 1 Casella Torment e guadagna 1 IP.';
          } else if(result.outcome==='success'){
            me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
            tor.usedThisRest = true;
            outcomeText = 'Successo! Guadagna 1 IP.';
          } else if(result.outcome==='deep-crit-fail'){
            tor.boxes = Math.min(10, tor.boxes+1);
            me.tamer.tormentPenalty = -5;
            tor.usedThisRest = true;
            outcomeText = 'Fallimento Critico Profondo! +1 Casella Torment, penalità -5 fino al Rest.';
          } else if(result.outcome==='crit-fail'){
            me.tamer.tormentPenalty = -2;
            tor.usedThisRest = true;
            outcomeText = 'Fallimento Critico! Penalità -2 fino al Rest.';
          } else {
            outcomeText = 'Fallimento. Nessun effetto, si può ritentare più tardi.';
          }
          await saveMember(session.code, me);
          const resEl = document.getElementById('torment-result-'+idx);
          if(resEl) resEl.innerHTML = `${diceRowHTML(result.dice)} <b>${result.total}</b> vs TN ${result.tn} — ${outcomeText}`;
          await pushLog(session.code, { who: displayName(me), role:'roll', text: `Torment Check su "${tor.name}": 3d6[${result.dice.join(',')}]=${result.total} vs TN ${result.tn} → ${outcomeText}`, meta:{dice: result.dice} });
          if(tor.usedThisRest){ btn.disabled = true; btn.textContent = 'Già tentato (Rest)'; }

          ${statBox('WILL','e-t-willpower',t.willpower)}

        <div class="field"><label>Minor Aspect</label><input type="text" id="e-t-aspect-minor" value="${escapeAttr(t.minorAspect.text)}" placeholder="es. Smarter Than They Act..." /></div>
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost" id="btn-cancel-tamer">Annulla</button>
          <button class="btn solid" id="btn-save-tamer">Salva</button>
        </div>
        <div class="muted" id="save-status-tamer" style="margin-top:6px;"></div>
      `;
      document.getElementById('btn-cancel-tamer').onclick = ()=>{ editingTamer = false; renderTamerCard(me, containerId); };
      document.getElementById('btn-save-tamer').onclick = async ()=>{
        ['agility','body','charisma','intelligence','willpower'].forEach(k=>{
          const el = document.getElementById('e-t-'+k);
          if(el) me.tamer[k] = Number(el.value)||0;
        });
        me.tamer.imageUrl = document.getElementById('e-t-img').value.trim();
        me.tamer.digiviceImageUrl = document.getElementById('e-t-digivice-img').value.trim();
        me.tamer.majorAspect.text = document.getElementById('e-t-aspect-major').value.trim();
        me.tamer.minorAspect.text = document.getElementById('e-t-aspect-minor').value.trim();
        SKILL_DEFS.forEach(def=>{
          const max = skillMax(me.tamer, def);
          const cur = Number(me.tamer.skills[def.key])||0;
          if(cur > max) me.tamer.skills[def.key] = max;
        });
        const newMax = 3+Number(me.tamer.skills.endurance||0);
        if(me.tamer.currentWounds > newMax) me.tamer.currentWounds = newMax;
        const ok = await saveMember(session.code, me);
        const st = document.getElementById('save-status-tamer');
        st.style.color = ok ? 'var(--text-mute)' : 'var(--danger)';
        st.textContent = ok ? 'Salvato.' : ('Errore: '+(lastApiError||''));
        if(ok){ editingTamer = false; renderTamerCard(me, containerId); renderSkillsCard(me, siblingCardId(containerId,'skills')); }
      };
    }
  }

  function renderInventoryCard(me, containerId){

    const cardEl = document.getElementById(containerId);
    if(!cardEl) return;
    const items = me.tamer.inventory || [];

  function openSkillRollPanel(me, skillKey, containerId){

      panel.innerHTML = `
        <div class="hud-frame" style="padding:10px;">
          <div class="section-title" style="margin:0 0 8px;border:none;padding:0;">Tira ${escapeHTML(def.label)}</div>
          ${def.attrs.length>1 ? `
            <div class="row" style="margin-bottom:8px;">
              ${def.attrs.map(a=>`<button class="btn small ${a===chosenAttr?'active':''}" data-pick-attr="${a}" style="flex:1;${a===chosenAttr?'background:rgba(53,232,201,0.15);border-color:var(--cyan);color:var(--cyan);':''}">${ATTR_ABBR[a]}</button>`).join('')}
            </div>
          ` : ''}
          <div class="field"><label>TN (opzionale, la decide il Master)</label><input type="number" id="roll-tn-${containerId}" placeholder="es. 15" /></div>
          <div class="muted" style="margin-bottom:6px;">Stunt (bonus del Master per un'azione descritta con stile)</div>
          <div class="row" style="margin-bottom:8px;">
            <div class="field" style="margin-bottom:0;"><label>Bonus (+0/+3)</label><input type="number" id="roll-stunt-bonus-${containerId}" value="0" min="0" max="3" /></div>
            <div class="field" style="margin-bottom:0;"><label>Dadi Extra (0-5)</label><input type="number" id="roll-stunt-dice-${containerId}" value="0" min="0" max="5" /></div>
          </div>
          ${teamworkBonus!==0 ? `<div class="muted" style="margin-bottom:8px;color:var(--cyan);">🤝 Bonus Teamwork attivo: ${teamworkBonus>0?'+':''}${teamworkBonus} (si applica automaticamente e si consuma con questo tiro)</div>` : ''}
          ${majorLeft>0 || minorLeft>0 ? `
            <div class="muted" style="margin-bottom:6px;">Aspects (applica bonus al tiro)</div>
            <div class="row" style="margin-bottom:8px;">
              ${majorLeft>0 ? `<label style="display:flex;align-items:center;gap:4px;font-size:11px;flex:1;"><input type="checkbox" id="roll-aspect-major-${containerId}" /> Major (+4, ${majorLeft} usi)</label>` : ''}
              ${minorLeft>0 ? `<label style="display:flex;align-items:center;gap:4px;font-size:11px;flex:1;"><input type="checkbox" id="roll-aspect-minor-${containerId}" /> Minor (+2, ${minorLeft} usi)</label>` : ''}
            </div>
          ` : ''}
          ${hasMiracle && ipAvailable>=7 ? `
            <label style="display:flex;align-items:center;gap:4px;font-size:11px;margin-bottom:8px;"><input type="checkbox" id="roll-miracle-${containerId}" /> Miracle: +Willpower+5 (costa 7 IP, hai ${ipAvailable})</label>
          ` : ''}
          <button class="btn solid" id="roll-confirm-${containerId}" style="width:100%;">Tira 3d6</button>
          <div id="roll-result-${containerId}" style="margin-top:10px;"></div>
        </div>
      `;
      if(def.attrs.length>1){
        panel.querySelectorAll('[data-pick-attr]').forEach(b=>{
          b.onclick = ()=>{ chosenAttr = b.getAttribute('data-pick-attr'); draw(); };
        });
      }
      document.getElementById('roll-confirm-'+containerId).onclick = async ()=>{
        const tnVal = document.getElementById('roll-tn-'+containerId).value;
        const attrVal = me.tamer[chosenAttr];
        const digimonBonus = prodigiousSkillBonus(me, def);
        const skillVal = Number(me.tamer.skills[skillKey]||0) + digimonBonus;
        const stuntBonus = Math.max(0, Math.min(3, Number(document.getElementById('roll-stunt-bonus-'+containerId).value)||0));
        const stuntDice = Math.max(0, Math.min(5, Number(document.getElementById('roll-stunt-dice-'+containerId).value)||0));
        const { dice, total: baseTotal } = rollSkillCheck(attrVal, skillVal, stuntDice);
        let total = baseTotal + stuntBonus;
        let aspectNote = '';
        if(digimonBonus>0) aspectNote += ` +${digimonBonus} dal Digimon (Prodigious Skill/Mind Over Matter)`;
        if(stuntDice>0) aspectNote += ` +Stunt (${stuntDice} dadi extra, tenuti i 3 migliori)`;
        if(stuntBonus>0) aspectNote += ` +${stuntBonus} Stunt`;
        if(teamworkBonus!==0){
          total += teamworkBonus;
          aspectNote += ` ${teamworkBonus>0?'+':''}${teamworkBonus} Teamwork`;
          me.tamer.teamworkBonus = 0;

        const majorBox = document.getElementById('roll-aspect-major-'+containerId);

        if(majorBox && majorBox.checked){
          total += 4;

          aspectNote += ` +4 Major Aspect (${me.tamer.majorAspect.text})`;

        if(minorBox && minorBox.checked){
          total += 2;
          me.tamer.minorAspect.usesLeft = Math.max(0,(me.tamer.minorAspect.usesLeft||0)-1);
          aspectNote += ` +2 Minor Aspect (${me.tamer.minorAspect.text})`;
        }
        if(miracleBox && miracleBox.checked && Number(me.tamer.inspirationPoints||0)>=7){
          const bonus = me.tamer.willpower + 5;
          total += bonus;
          me.tamer.inspirationPoints -= 7;
          aspectNote += ` +${bonus} Miracle (-7 IP)`;
        }
        await saveMember(session.code, me);
        const verdict = evaluateVsTN(total, tnVal, dice);
        const resEl = document.getElementById('roll-result-'+containerId);
        resEl.innerHTML = `${diceRowHTML(dice)}<span class="roll-total">${total}</span>${verdict?`<span class="roll-verdict ${verdict.cls}">${verdict.label}</span>`:''}`;
        const logText = `tira ${def.label} (${ATTR_ABBR[chosenAttr]}+Skill): 3d6[${dice.join(',')}] + ${attrVal} + ${skillVal}${aspectNote} = ${total}` + (verdict ? ` vs TN ${tnVal} → ${verdict.label}` : '');
        await pushLog(session.code, { who: displayName(me), role:'roll', text: logText, meta: { dice, total, verdict: verdict?verdict.label:null } });
        refreshLiveParts();
      };
    };
    draw();
  }

  async function tryParseRollShortcut(raw, me){
    const m = raw.match(/^\/(tira|r)\s+(.+)$/i);
    if(!m) return null;
    let rest = m[2].trim();
    let tn = null;
    let aspectWanted = null;
    let parts = rest.split(/\s+/);
    let lastWord = parts[parts.length-1].toLowerCase();
    if(['major','maggiore'].includes(lastWord)){ aspectWanted='major'; parts = parts.slice(0,-1); lastWord = parts[parts.length-1]||''; }
    else if(['minor','minore'].includes(lastWord)){ aspectWanted='minor'; parts = parts.slice(0,-1); lastWord = parts[parts.length-1]||''; }
    if(/^\d+$/.test(lastWord)){
      tn = Number(lastWord);
      parts = parts.slice(0,-1);
    }
    rest = parts.join(' ');
    const query = rest.trim().toLowerCase();
    if(!query) return { text: `⚠ comando non riconosciuto: "${rest}". Usa /tira <NomeSkill|Accuracy|Dodge|Health> [TN] [major|minor]`, dice:null };

    const poolMap = { 'accuracy':'baseAccuracy', 'acc':'baseAccuracy', 'dodge':'baseDodge', 'schivata':'baseDodge', 'health':'baseHealth', 'hp':'baseHealth', 'salute':'baseHealth' };
    if(poolMap[query]){
      const statKey = poolMap[query];
      const { dice, successes } = rollPool(me.digimon[statKey]);
      return {
        dice, isPool:true, resultLabel: `${successes} successi`, verdict:null,
        text: `tira Pool Check ${query.toUpperCase()} (${me.digimon[statKey]}d6): [${dice.join(',')}] → ${successes} successi`
      };
    }

    const def = SKILL_DEFS.find(d=>d.label.toLowerCase()===query || d.label.toLowerCase().startsWith(query) || query.startsWith(d.label.toLowerCase()));
    if(def){
      const attr = def.attrs[0];
      const attrVal = me.tamer[attr];
      const digimonBonus = prodigiousSkillBonus(me, def);
      const skillVal = Number(me.tamer.skills[def.key]||0) + digimonBonus;
      const { dice, total: baseTotal } = rollSkillCheck(attrVal, skillVal);
      let total = baseTotal;
      let aspectNote = digimonBonus>0 ? ` +${digimonBonus} dal Digimon (Prodigious Skill/Mind Over Matter)` : '';
      if(aspectWanted==='major' && me.tamer.majorAspect && (me.tamer.majorAspect.usesLeft||0)>0){
        total += 4;
        me.tamer.majorAspect.usesLeft -= 1;
        aspectNote = ` +4 Major Aspect (${me.tamer.majorAspect.text})`;
        await saveMember(session.code, me);
      } else if(aspectWanted==='minor' && me.tamer.minorAspect && (me.tamer.minorAspect.usesLeft||0)>0){
        total += 2;
        me.tamer.minorAspect.usesLeft -= 1;
        aspectNote = ` +2 Minor Aspect (${me.tamer.minorAspect.text})`;
        await saveMember(session.code, me);
      } else if(aspectWanted){
        aspectNote = ` (nessun uso di Aspect ${aspectWanted} disponibile, ignorato)`;
      }
      const verdict = evaluateVsTN(total, tn, dice);
      return {
        dice, isPool:false, resultLabel: String(total), verdict,
        text: `tira ${def.label} (${ATTR_ABBR[attr]}+Skill): 3d6[${dice.join(',')}] + ${attrVal} + ${skillVal}${aspectNote} = ${total}` + (verdict ? ` vs TN ${tn} → ${verdict.label}` : '')
      };
    }
    return { text: `⚠ comando non riconosciuto: "${rest}". Usa /tira <NomeSkill|Accuracy|Dodge|Health> [TN] [major|minor]`, dice:null };
  }

        const skillKey = document.getElementById('req-skill').value;
        const tn = document.getElementById('req-tn').value;
        const sendGeneral = document.getElementById('req-chan-general').checked;
        const sendPrivate = document.getElementById('req-chan-private').checked;
        const sendSubgroup = reqSubChk ? reqSubChk.checked : false;
        const subSel = document.getElementById('req-subgroup-select');
        const subgroupId = subSel ? subSel.value : '';
        const statusEl = document.getElementById('req-roll-status');
        if(!targetUsernames.length){
          if(statusEl) statusEl.textContent = 'Scegli almeno un giocatore.';
          return;
        }
        if(!sendGeneral && !sendPrivate && !sendSubgroup){
          if(statusEl) statusEl.textContent = 'Scegli almeno un canale (Generale, Privata e/o Sottogruppo).';
          return;
        }
        if(sendSubgroup && !subgroupId){
          if(statusEl) statusEl.textContent = 'Scegli un sottogruppo.';
          return;
        }
        const poolLabels = { baseAccuracy:'Accuracy (Pool)', baseDodge:'Dodge (Pool)', baseHealth:'Health (Pool)' };
        const label = poolLabels[skillKey] || (SKILL_DEFS.find(d=>d.key===skillKey)||{}).label || skillKey;
        const tnPart = (tn && !poolLabels[skillKey]) ? ` (TN ${tn})` : '';
        // Più destinatari nello stesso payload, separati da virgola: ogni giocatore in lista
        // vede il proprio bottone "🎲 Tira ora" sullo stesso messaggio (vedi logHTML), invece di
        // dover creare una richiesta separata per ciascuno.
        const namesLabel = targetUsernames.map(u=>{ const p = players.find(x=>x.username===u); return p ? displayName(p) : u; }).join(', ');
        const payload = `${targetUsernames.join(',')}|${skillKey}|${tn||''}`;
        const entry = { who:'Master', role:'request', text: `Richiesta a ${namesLabel}: tira ${label}${tnPart}::REQ::${payload}` };
        if(sendGeneral) await pushLog(code, entry);
        if(sendPrivate){
          // BUGFIX: qui sotto mancava il tag di location (vedi memberLocationKey/pushPrivateLog
          // più sopra nel file) — la richiesta veniva marcata con la posizione ATTUALE DEL MASTER
          // invece che con quella effettiva del giocatore destinatario. Se il giocatore era stato
          // spostato singolarmente in un Settore diverso, il filtro "Settore attuale" della sua
          // Chat Privata non la mostrava mai: appariva solo passando a "Tutto lo storico".
          // Stesso identico pattern già usato per i normali messaggi di Chat Privata (vedi sopra).
          for(const u of targetUsernames){
            const member = cachedRoster.find(m=>m.username===u);
            await pushPrivateLog(code, u, { ...entry, meta: { location: memberLocationKey(member) } });
          }
        }
        if(sendSubgroup){
          // Stesso bug e stessa correzione per i Sottogruppi (vedi subgroupLocationKey): la
          // richiesta va taggata con la posizione EFFETTIVA del sottogruppo, non quella del
          // Master, altrimenti resta "invisibile" nel filtro di default della sua chat.
          const group = (cachedSubgroups||[]).find(g=>g.id===subgroupId) || null;
          await pushPrivateLog(code, 'subgroup:'+subgroupId, { ...entry, meta: { location: subgroupLocationKey(group) } });
        }
        if(statusEl) statusEl.textContent = '';
        refreshLiveParts();
      };
    }

    startPolling();

  function getParticipantClashStats(p){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member){
        const stats = computeDerivedStats(member.digimon);
        const qMech = computeQualityMechanics(member.digimon.qualities);
        stats.clashBonus = qMech.brawlerClash || 0;
        return stats;
      }
      return { cpu:0, ram:0, clashBonus:0 };
    }
    return { cpu: Math.max(0, Math.floor(Number(p.armor||0)/3)), ram: Number(p.ram||0), clashBonus:0 };
  }

  // Attacchi disponibili per un partecipante al combattimento, sia esso un Digimon
  // giocante (dalla sua scheda) o un nemico (importati dal Digidex o dalla Scena).

    return p.side==='ally' ? 'var(--cyan)' : (p.side==='enemy' ? 'var(--danger)' : 'var(--text-mute)');

      const member = cachedRoster.find(m=>m.username===p.username);
      if(member && member.digimon){
        return bestDigimonImage(null, member.digimon.name, member.digimon.imageUrl, preferStatic);

  // (getParticipantAttacks/getParticipantWounds/EFFECT_ICONS/effectIcon/effectExplanationText/EFFECT_TAG_ALIASES/EFFECT_DEFS/EFFECT_QUALITY_MAP/hasAttributeAdvantage/getParticipantAttribute/hasEffectQuality) spostato in js/combat-engine.js

  async function applyInstantEffect(code, target, key, potency){
    const def = EFFECT_DEFS.find(d=>d.key===key);
    if(!def || !def.instant) return null;
    if(def.instant==='pull'){
      const from = target.zone||'Medio';
      const steps = Math.max(1, potency);
      const zi = Math.max(0, zoneIndex(from)-steps);
      target.zone = ZONES[zi];
      return `${target.name} viene attirato da ${zoneLabel(from)} a ${zoneLabel(target.zone)}.`;
    }
    if(def.instant==='push'){
      const from = target.zone||'Medio';
      const steps = Math.max(1, potency);
      const zi = Math.min(ZONES.length-1, zoneIndex(from)+steps);
      target.zone = ZONES[zi];
      return `${target.name} viene respinto da ${zoneLabel(from)} a ${zoneLabel(target.zone)}.`;
    }
    if(def.instant==='cleanse'){
      let removedCount = 0;
      target.effects = (target.effects||[]).filter(e=>{
        const d = EFFECT_DEFS.find(x=>x.key===e.key);
        if(d && d.type==='negative' && removedCount<potency){ removedCount++; return false; }
        return true;
      });
      return `${target.name} viene purificato: rimossi ${removedCount} Effetti negativi.`;
    }
    if(def.instant==='shield'){
      if(target.isPC){
        const member = cachedRoster.find(m=>m.username===target.username);
        if(member){ member.digimon.tempWounds = Number(member.digimon.tempWounds||0)+potency; await saveMember(code, member); }
      } else {
        target.tempWounds = Number(target.tempWounds||0)+potency;
      }
      return `${target.name} guadagna ${potency} Caselle Ferita Temporanee.`;
    }
    return null;
  }

  // (computeEffectModifiers/effectTagsHTML/tickEffectsForParticipant/applyDamageToParticipantSync/getParticipantCombatStats/getParticipantResistance/getParticipantSizeIndex) spostato in js/combat-engine.js

  // Regola 9.12a — Sconfitta: un Digimon portato a 0 Wound Box scende al suo Default Stage,
  // resta a 1 Wound Box, ed è "Sconfitto" (cosciente, ma di norma ignorato per il resto del
  // combattimento salvo scelga di rientrare a proprio rischio — nessuna Azione speciale è
  // definita da regolamento per questo caso, è a discrezione del Master).
  // Se il Digimon è già al proprio Default Stage (o sotto), il caso limite è il Digitama:
  // non è automatizzato da nessuna parte nell'app, va gestito a mano dal Master.
  async function applyDefeatIfNeeded(code, participant){
    if(participant.isPC){
      const member = cachedRoster.find(m=>m.username===participant.username);
      if(!member || member.digimon.defeated || member.digimon.currentWounds>0) return null;
      const curIdx = stageIndex(member.digimon.stage);
      const defIdx = stageIndex(member.digimon.defaultStage);
      member.digimon.defeated = true;
      if(curIdx>defIdx){
        applyStageChange(member.digimon, member.digimon.stage, member.digimon.defaultStage);
        member.digimon.currentWounds = 1;
        await saveMember(code, member);
        return { name: member.digimon.name||participant.name, digitama:false, toStage: member.digimon.defaultStage };
      } else {
        await saveMember(code, member);
        return { name: member.digimon.name||participant.name, digitama:true };
      }
    } else {
      if(participant.defeated || (participant.currentWounds||0)>0) return null;
      participant.defeated = true;
      return { name: participant.name, digitama:false, enemy:true };
    }
  }

  async function applyDamageToParticipant(code, combat, p, amount){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member){
        let remaining = amount;
        const shield = Number(member.digimon.tempWounds||0);
        if(shield>0 && remaining>0){
          const absorbed = Math.min(shield, remaining);
          member.digimon.tempWounds = shield - absorbed;
          remaining -= absorbed;
        }
        member.digimon.currentWounds = Math.max(0, member.digimon.currentWounds - remaining);
        const qMech = computeQualityMechanics(member.digimon.qualities);
        if(qMech.combatMonster>0 && amount>0){
          member.digimon.resolveCurrent = Math.min(Number(member.digimon.resolveMax||0), Number(member.digimon.resolveCurrent||0)+amount);
        }
        await saveMember(code, member);
      }
    } else {
      let remaining = amount;
      const shield = Number(p.tempWounds||0);
      if(shield>0 && remaining>0){
        const absorbed = Math.min(shield, remaining);
        p.tempWounds = shield - absorbed;
        remaining -= absorbed;
      }
      p.currentWounds = Math.max(0, (p.currentWounds||0) - remaining);
      await saveCombat(code, combat);
    }
  }

  // ---------- shared attack resolution (usato sia dal Combat Manager del Master sia dall'attacco in self-service del giocatore) ----------
  function validateAttackTargeting(attacker, target, atk){
    if(!attacker || !target || attacker.id===target.id){
      return { ok:false, error:'Scegli attaccante e bersaglio diversi.' };
    }
    const zDist = zoneDistance(attacker.zone||'Medio', target.zone||'Medio');
    if(atk && atk.shape==='Melee' && zDist>0){
      return { ok:false, error:`${atk.name} è [MELEE]: serve la stessa posizione di ${target.name} (ora: ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')}). Avvicinati prima di attaccare.` };
    }
    if(atk && atk.shape==='Range' && zDist > (atk.reach||1)){
      return { ok:false, error:`${atk.name} è [RANGE ${atk.reach||1}]: ${target.name} è troppo lontano (distanza ${zDist}, ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')}).` };
    }
    return { ok:true };
  }

  // Esegue i tiri Accuracy (attaccante) vs Dodge (bersaglio, automatico) e applica il danno se colpito.
  // Assume che validateAttackTargeting sia già stato chiamato con esito positivo.
  // Nome "sicuro" per i log tecnici (::TECH::): se il partecipante ha nameHidden, mostra
  // l'etichetta nascosta ("Nemico 1" ecc.) invece del nome reale, così espandendo i dettagli
  // in chat il giocatore non vede il vero nome del Digimon.
  function techLogName(p){ return (p && p.nameHidden) ? hiddenParticipantLabel(p) : (p ? p.name : ''); }

  async function performAttackRoll(code, combat, attacker, target, atk){
    const aStats = getParticipantCombatStats(attacker);
    const tStats = getParticipantCombatStats(target);
    const zDist = zoneDistance(attacker.zone||'Medio', target.zone||'Medio');
    const zPenalty = zonePenalty(zDist);
    const effAccuracy = Math.max(0, aStats.accuracy + zPenalty);
    const overpowerUsed = !!attacker.overpowerActive;
    const accRoll = rollPool(effAccuracy, overpowerUsed);
    if(overpowerUsed) attacker.overpowerActive = false;
    if(aStats.certainStrike>0) accRoll.successes += aStats.certainStrike;
    let attrAdvNote = '';
    const attrRule = cachedProgression && cachedProgression.attributeAdvantage;
    if(attrRule && hasAttributeAdvantage(getParticipantAttribute(attacker), getParticipantAttribute(target))){
      if(attrRule==='minor'){
        const bonusDie = rollD6();
        accRoll.dice.push(bonusDie);
        if(bonusDie>=4) accRoll.successes += 1;
        attrAdvNote = ` [Attribute Advantage (Minor): +1d6(${bonusDie})]`;
      } else if(attrRule==='major'){
        accRoll.successes += 1;
        attrAdvNote = ' [Attribute Advantage (Major): +1 Successo automatico]';
      }
    }
    const dodgeRoll = rollPool(tStats.dodge);
    if(tStats.absoluteEvasion>0) dodgeRoll.successes += tStats.absoluteEvasion;
    const zoneNote = (zPenalty!==0 ? ` (${zPenalty} Accuracy per distanza: ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')})` : '') + (overpowerUsed ? ' [Overpower: 4 conta come Successo]' : '');
    const certainNote = (aStats.certainStrike>0 ? ` +${aStats.certainStrike} [CERTAIN]` : '') + attrAdvNote;
    const atkLabel = atk ? `${atk.name} ${attackTagsPlain(atk)}` : 'Attacco generico';
    // Nomi mascherati per i log tecnici: se il Digimon ha nameHidden, il log NON rivela il nome reale.
    const aName = techLogName(attacker);
    const tName = techLogName(target);
    let logText, dealt = 0;

    if(atk && atk.type==='Support'){
      const effDef = atk.effectKey ? EFFECT_DEFS.find(d=>d.key===atk.effectKey) : null;
      const isHelpful = effDef && effDef.type==='positive';
      const verb = isHelpful ? 'supporta' : 'colpisce';
      const resultTag = isHelpful ? 'RIUSCITO' : 'COLPITO';
      if(accRoll.successes <= dodgeRoll.successes){
        logText = `✨ ${aName} usa ${atkLabel} su ${tName}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${isHelpful?'NON RIUSCITO':'MANCATO'}, nessun Effetto applicato.`;
      } else if(atk.effectKey){
        const def = effDef;
        // Potenza 1 / Durata 3 di default (stessi valori dello strumento manuale "+Effetto" sulla riga
        // partecipante) — niente popup nativi del browser, che stonavano col resto dell'interfaccia.
        // Il Master può correggerli in un secondo momento rimuovendo e riapplicando l'Effetto a mano.
        const potency = 1;
        if(def && def.instant){
          const msg = await applyInstantEffect(code, target, atk.effectKey, potency);
          logText = `✨ ${aName} usa ${atkLabel} su ${tName}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${resultTag}! ${msg}`;
        } else {
          const duration = 3;
          if(!target.effects) target.effects = [];
          target.effects.push({ key: atk.effectKey, potency, duration });
          logText = `✨ ${aName} usa ${atkLabel} su ${tName}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${resultTag}! ${isHelpful?'Supporta':'Applica'} ${def?def.label:atk.effectKey} (Potenza ${potency}, Durata ${duration} — valori di default, correggibili a mano sulla riga di ${tName}).`;
        }
      } else {
        logText = `✨ ${aName} usa ${atkLabel} su ${tName}: ${verb}, ma non ha un Effetto collegato da applicare.`;
      }
    } else {
      if(accRoll.successes <= dodgeRoll.successes){
        logText = `⚔ ${aName} usa ${atkLabel} su ${tName}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → MANCATO (schivato)`;
      } else {
        const excess = accRoll.successes - dodgeRoll.successes;
        let raw = excess + aStats.damage;
        let combatMonsterNote = '';
        if(attacker.isPC){
          const aMember = cachedRoster.find(m=>m.username===attacker.username);
          if(aMember && Number(aMember.digimon.resolveCurrent||0)>0 && computeQualityMechanics(aMember.digimon.qualities).combatMonster>0){
            const resolveSpent = Number(aMember.digimon.resolveCurrent||0);
            raw += resolveSpent;
            aMember.digimon.resolveCurrent = 0;
            await saveMember(code, aMember);
            combatMonsterNote = ` +${resolveSpent} Resolve (Combat Monster, azzerato)`;
          }
        }
        dealt = Math.max(0, raw - tStats.armor);
        await applyDamageToParticipant(code, combat, target, dealt);
        const w = getParticipantWounds(target);
        const defeatInfo = await applyDefeatIfNeeded(code, target);
        let defeatNote = '';
        if(defeatInfo){
          const defName = target.nameHidden ? hiddenParticipantLabel(target) : defeatInfo.name;
          defeatNote = defeatInfo.digitama
            ? ` 🥚 ${defName} è Sconfitto ed è già al Default Stage minimo: da regolamento diventerebbe Digitama — gestiscilo a mano.`
            : ` 🏳️ ${defName} è Sconfitto! Retrocede a ${defeatInfo.toStage} con 1 Ferita.`;
        }
        logText = `⚔ ${aName} usa ${atkLabel} su ${tName}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → COLPITO! (${excess}+DMG ${aStats.damage})${combatMonsterNote}-ARM ${tStats.armor} = ${dealt} danno → ${tName} ${w.current}/${w.max} Ferite${defeatNote}`;
        return { logText, dealt, accRoll, dodgeRoll, atkLabel, defeatInfo };
      }
    }
    return { logText, dealt, accRoll, dodgeRoll, atkLabel, defeatInfo: null };
  }

  async function grantMilestoneRewards(code, milestoneNumber, reason){
    const players = cachedRoster.filter(m=>m.role==='player');
    for(const p of players){
      p.tamer.unspentGrowthPoints = Number(p.tamer.unspentGrowthPoints||0) + 3;
      p.tamer.inspirationPoints = Number(p.tamer.inspirationPoints||0) + 1;
      p.digimon.unspentBonusDP = Number(p.digimon.unspentBonusDP||0) + 3;
      // Traccia l'origine di ogni concessione (quale Milestone, quando, come) — prima si perdeva,
      // lasciando solo un numero grezzo senza modo di risalire al perché per il Master.
      p.digimon.bonusDpLog = Array.isArray(p.digimon.bonusDpLog) ? p.digimon.bonusDpLog : [];
      p.digimon.bonusDpLog.push({ amount: 3, milestone: milestoneNumber, date: new Date().toISOString(), reason: reason || 'Milestone' });
      await saveMember(code, p);
    }
  }

      await saveProgression(code, prog);
      cachedProgression = prog;
      const label = e.target.value==='minor' ? 'Minor Advantage' : (e.target.value==='major' ? 'Major Advantage' : 'Disattivata');
      await pushLog(code, { who:'Sistema', role:'gm', text: `⚙ Variant Rule Attribute Advantage: ${label}.` });
      renderProgressionMaster(code);
    };
    document.getElementById('natcrit-toggle').onchange = async (e)=>{
      prog.naturalCriticalResults = e.target.checked;
      await saveProgression(code, prog);
      cachedProgression = prog;
      await pushLog(code, { who:'Sistema', role:'gm', text: `⚙ Variant Rule Natural Critical Results: ${prog.naturalCriticalResults?'Attiva':'Disattivata'}.` });
      renderProgressionMaster(code);
    };
    document.getElementById('blastevo-toggle').onchange = async (e)=>{
      prog.blastEvolutionEnabled = e.target.checked;
      await saveProgression(code, prog);
      cachedProgression = prog;

    document.getElementById('slideevo-toggle').onchange = async (e)=>{
      prog.slideEvolutionEnabled = e.target.checked;
      await saveProgression(code, prog);
      cachedProgression = prog;
      await pushLog(code, { who:'Sistema', role:'gm', text: `⚙ Slide Evolution ${prog.slideEvolutionEnabled?'resa disponibile ai giocatori':'nascosta ai giocatori'}.` });
      renderProgressionMaster(code);
      refreshLiveParts();
    };
    document.getElementById('darkevo-toggle').onchange = async (e)=>{
      prog.darkEvolutionEnabled = e.target.checked;
      await saveProgression(code, prog);
      cachedProgression = prog;
      await pushLog(code, { who:'Sistema', role:'gm', text: `⚙ Dark Evolution ${prog.darkEvolutionEnabled?'resa disponibile':'nascosta'}.` });
      renderProgressionMaster(code);
      refreshLiveParts();
    };
    document.getElementById('btn-milestone-narrative').onclick = async ()=>{
      prog.milestone += 1;
      prog.inspiration = Number(prog.inspiration||0) + 1;
      await saveProgression(code, prog);
      cachedProgression = prog;
      await grantMilestoneRewards(code, prog.milestone, 'Narrativa');
      await pushLog(code, { who:'Sistema', role:'gm', text: `🌟 Milestone ${prog.milestone} raggiunta (narrativa)! Ogni giocatore riceve 3 Growth Points, 1 IP, e il proprio Digimon 3 DP Bonus. Il party guadagna 1 Punto Ispirazione.` });
      renderProgressionMaster(code);
      refreshLiveParts();
    };
    document.getElementById('btn-take-break').onclick = async ()=>{
      const players = cachedRoster.filter(m=>m.role==='player');
      for(const p of players){
        p.tamer.currentWounds = 3 + Number(p.tamer.skills.endurance||0);
        p.digimon.currentWounds = p.digimon.maxWounds;
        const cap = cachedProgression ? Number(cachedProgression.milestone||0) : 0;
        p.digimon.evolutionPoints = Math.min(cap, Number(p.digimon.evolutionPoints||0)+1);
        await saveMember(code, p);
      }
      await pushLog(code, { who:'Sistema', role:'gm', text: `☕ Il party prende un Break: Ferite recuperate del tutto, +1 Evolution Point a testa.` });
      refreshLiveParts();
    };
    document.getElementById('btn-take-rest').onclick = async ()=>{
      const players = cachedRoster.filter(m=>m.role==='player');
      for(const p of players){
        p.tamer.currentWounds = 3 + Number(p.tamer.skills.endurance||0);
        p.digimon.currentWounds = p.digimon.maxWounds;
        const cap = cachedProgression ? Number(cachedProgression.milestone||0) : 0;
        p.digimon.evolutionPoints = cap;
        p.tamer.tormentPenalty = 0;
        (p.tamer.torments||[]).forEach(t=>{ t.usedThisRest = false; });
        if(!p.tamer.specialOrdersUsed) p.tamer.specialOrdersUsed = {};
        TALENT_DEFS.filter(t=>t.once==='rest').forEach(t=>{ p.tamer.specialOrdersUsed[t.order] = false; });
        (p.digimon.armorForms||[]).forEach(af=>{ af.usedThisRest = false; });
        await saveMember(code, p);
      }
      await pushLog(code, { who:'Sistema', role:'gm', text: `😴 Il party fa un Rest: Ferite ed Evolution Points recuperati del tutto, penalità Torment rimosse, Torment Check di nuovo disponibili.` });

      prog.inspiration = Number(document.getElementById('prog-insp-manual').value)||0;
      const ok = await saveProgression(code, prog);
      cachedProgression = prog;
      const st = document.getElementById('prog-status');
      st.style.color = ok ? 'var(--text-mute)' : 'var(--danger)';
      st.textContent = ok ? 'Salvato.' : ('Errore: '+(lastApiError||''));
      renderProgressionMaster(code);
    };

  // ---------- LOG BIO-RESONANCE SCAN (vista Master) ----------
  // Mostra a chi è stato assegnato ogni Digimon (e Crest, se il Tamer aveva il Digimedaglione),
  // con data/ora e numero del tentativo. Il Master può cancellare una riga per correggere un
  // errore, liberare un nome "preso" per errore, o restituire un tentativo a un giocatore.
  // renderScanLogMaster (Log Bio-Resonance Scan) spostato in js/notices.js

  // (privateReadKey/markPrivateThreadRead/isPrivateThreadUnread/checkMasterPrivateUnread/
  // updateMasterChatModeUI/bindMasterChatMode/renderPrivateChatMaster) spostato in js/private-chat.js


  // (zone-math: ZONES/zoneIndex/zoneDistance/zonePenalty/zoneLabel/zoneStepToward/zoneStepAway/zoneStepDirection/zoneSideEffectsNote) spostato in js/combat-engine.js

    // esplicitamente qualcun altro), per velocizzare la risoluzione del suo attacco.
    // Assegna etichette stabili ("Nemico 1", "Nemico 2") ai partecipanti con nome nascosto che
    // non hanno ancora un hiddenLabelNum — succede se il combattimento è stato creato prima di
    // questa feature o se il dato non è sopravvissuto a un reload.
    (combat.participants||[]).forEach(p => assignHiddenLabelNum(combat, p));

    if(!combatPresetAttackerId){
      const curr = currentTurnParticipant(combat);

    }

    if(!combat.active){

          <select id="combat-start-chatlock">

        await saveCombat(code, cachedCombat);
        if(cachedCombat.chatLock){

        startCombatMusic(cachedScene);
        for(const p of players){

    function populateAttackChoice(){
      const attackerId = document.getElementById('combat-attacker').value;
      const attacker = combat.participants.find(p=>p.id===attackerId);
      const sel = document.getElementById('combat-attack-choice');
      const btnWrap = document.getElementById('combat-attack-buttons');
      if(!sel) return;
      const atks = getParticipantAttacks(attacker);
      // combatSelectedAttackIndex è la fonte di verità persistente (sopravvive a qualunque re-render
      // del pannello); se non è più valida per l'attaccante corrente (indice fuori range), si azzera.
      if(combatSelectedAttackIndex!==null && (combatSelectedAttackIndex<0 || combatSelectedAttackIndex>=atks.length)){
        combatSelectedAttackIndex = null;
      }
      if(atks.length===0){
        sel.innerHTML = '<option value="">⚠️ Nessun Attacco — importa da Dex</option>';
        if(btnWrap) btnWrap.innerHTML = '<div class="muted" style="font-size:11px;grid-column:1/-1;">⚠️ Nessun Attacco — importa da Dex.</div>';
      } else {
        sel.innerHTML = '<option value="">— scegli un Attacco —</option>' + atks.map((a,i)=>`<option value="${i}" ${combatSelectedAttackIndex===i?'selected':''}>${a.signature?'⭐ ':''}${escapeHTML(a.name)} — ${a.shape}/${a.type}</option>`).join('');
        sel.value = combatSelectedAttackIndex===null ? '' : String(combatSelectedAttackIndex);
        if(btnWrap){
          const applyHighlight = ()=>{
            btnWrap.querySelectorAll('[data-atk-btn]').forEach(b=>{
              const i = Number(b.getAttribute('data-atk-btn'));
              const a = atks[i];
              const typeColor = a.type==='Support' ? 'var(--cyan)' : 'var(--danger)';
              const isSel = combatSelectedAttackIndex === i;
              b.style.border = `2px solid ${isSel?typeColor:'var(--line)'}`;
              b.style.background = isSel?'rgba(255,255,255,0.06)':'var(--panel-2)';
            });
          };
          btnWrap.innerHTML = atks.map((a,i)=>{
            const typeColor = a.type==='Support' ? 'var(--cyan)' : 'var(--danger)';
            return `<button type="button" data-atk-btn="${i}" style="text-align:left;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;">
              <div style="font-size:12px;font-weight:bold;color:${typeColor};">${a.signature?'⭐ ':''}${escapeHTML(a.name)}</div>
              <div class="muted" style="font-size:9px;">${a.shape} · ${a.type}${a.areaAttack?' · Area':''}</div>
            </button>`;
          }).join('');
          applyHighlight();
          btnWrap.querySelectorAll('[data-atk-btn]').forEach(b=>{
            b.onclick = ()=>{
              // Scritto sia sulla variabile persistente (sopravvive a QUALSIASI re-render, es. aprire
              // i dettagli di un altro partecipante) sia sulla select nascosta, che resta la fonte
              // letta da "Risolvi Attacco". Prima la scelta viveva solo nella select e spariva al
              // primo re-render causato da un click qualsiasi altrove nel pannello.
              combatSelectedAttackIndex = Number(b.getAttribute('data-atk-btn'));
              sel.value = b.getAttribute('data-atk-btn');
              applyHighlight();
              updateAreaButtonVisibility();
            };
          });
        }
      }
      updateAreaButtonVisibility();
    }

            const cMember = cachedRoster.find(m=>m.username===controller.username);
            const stageNum = cMember ? stageIndex(cMember.digimon.stage)+1 : 1;
            const tn = 10+stageNum;
            const finVal = Math.max(cStats.cpu, cStats.bit||0);
            const { dice, total } = rollSkillCheck(finVal, 0);
            const verdict = evaluateVsTN(total, tn, dice);
            let bonus = 0, bonusNote='';
            if(verdict && (verdict.cls==='success'||verdict.cls==='crit-success')){
              bonus = stageNum;
              if(verdict.cls==='crit-success'){
                const bestDerived = Math.max(cStats.bit||0, cStats.dos||0, cStats.ram||0, cStats.cpu||0);
                if(bestDerived>stageNum) bonus = bestDerived;
              }
              dealt += bonus;
              bonusNote = ` +${bonus} bonus Finisher (Check ${total} vs TN ${tn}, ${verdict.label})`;
            } else {
              bonusNote = ` nessun bonus (Check ${total} vs TN ${tn}, Fallito)`;
            }
            await applyDamageToParticipant(code, combat, opponent, dealt);
            const w = getParticipantWounds(opponent);
            text = `🏆 Finisher di ${narratorName(controller)} su ${narratorName(opponent)}: COLPITO! ${dealt} danno → ${narratorName(opponent)} ${w.current}/${w.max} Ferite — il Clash finisce.`;

      document.getElementById('btn-clash-attack').onclick = async ()=>{

        const dodgeRoll = rollPool(Math.floor(oStats.dodge/2));

        if(accRoll.successes<=dodgeRoll.successes){

        } else {

          await applyDamageToParticipant(code, combat, opponent, dealt);
          const w = getParticipantWounds(opponent);
          text = `⚔ ${narratorName(controller)} attacca ${narratorName(opponent)} nel Clash: COLPITO! ${dealt} danno → ${narratorName(opponent)} ${w.current}/${w.max} Ferite`;
        }
        await pushCombatNarration(combat, { who:'Master', role:'roll', text: `${text}::TECH::${techDetail}`, meta:{dice:accRoll.dice.concat(dodgeRoll.dice), avatar: resolveParticipantImage(controller)} });
        await persistAndRefresh();
        renderClashActions();
      };
      document.getElementById('btn-clash-pin').onclick = async ()=>{
        opponent.clashPinned = true;
        await pushCombatNarration(combat, { who:'Master', role:'gm', text: `📌 ${narratorName(controller)} pinna ${narratorName(opponent)}: non può Fuggire o fare Comeback finché non riesce un Contest Pin.`, meta:{avatar: resolveParticipantImage(controller)} });

          return;

        const dealt = Math.max(0, cStats.damage - oStats.armor);
        await applyDamageToParticipant(code, combat, opponent, dealt);
        const zi = Math.min(ZONES.length-1, zoneIndex(opponent.zone||'Medio')+1);
        opponent.zone = ZONES[zi];
        controller.clashWith=null; controller.clashController=false; controller.clashPinned=false; controller.clashComebackBonus=0;
        opponent.clashWith=null; opponent.clashController=false; opponent.clashPinned=false; opponent.clashComebackBonus=0;
        const w = getParticipantWounds(opponent);
        await pushCombatNarration(combat, { who:'Master', role:'gm', text: `🤾 ${narratorName(controller)} lancia ${narratorName(opponent)} (${dealt} danno, ora a ${zoneLabel(opponent.zone)}) — il Clash finisce.`, meta:{avatar: resolveParticipantImage(controller)} });

      document.getElementById('btn-clash-weak').onclick = async ()=>{
        const oStats = getParticipantCombatStats(opponent);
        const cStats = getParticipantCombatStats(controller);
        const accRoll = rollPool(oStats.accuracy);
        const dodgeRoll = rollPool(Math.floor(cStats.dodge/2));
        let dealt=0, text;
        const techDetail = `Acc ${oStats.accuracy}d6[${accRoll.dice.join(',')}]=${accRoll.successes} succ. vs Dodge½ ${Math.floor(cStats.dodge/2)}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ.`;
        if(accRoll.successes<=dodgeRoll.successes){

          dealt = Math.ceil(raw/2);

          const w = getParticipantWounds(controller);
          text = `🥊 ${narratorName(opponent)} tenta un Attacco Disperato su ${narratorName(controller)}: COLPITO! ${dealt} danno (dimezzato) → ${narratorName(controller)} ${w.current}/${w.max} Ferite`;
        }
        await pushCombatNarration(combat, { who:'Master', role:'roll', text: `${text}::TECH::${techDetail}`, meta:{dice:accRoll.dice.concat(dodgeRoll.dice), avatar: resolveParticipantImage(opponent)} });
        await persistAndRefresh();
        renderClashActions();

      document.getElementById('btn-clash-comeback').onclick = async ()=>{

      attackBtn.onclick = async ()=>{
        const attackerId = document.getElementById('combat-attacker').value;
        const targetId = document.getElementById('combat-target').value;
        const attacker = combat.participants.find(p=>p.id===attackerId);
        const target = combat.participants.find(p=>p.id===targetId);
        const resEl = document.getElementById('combat-attack-result');
        let atk = null;
        const atkChoiceEl = document.getElementById('combat-attack-choice');
        if(attacker && atkChoiceEl && atkChoiceEl.value !== ''){
          atk = getParticipantAttacks(attacker)[Number(atkChoiceEl.value)];
        }
        if(!atk){
          if(resEl) resEl.innerHTML = `<div class="err">Scegli un Attacco dalla lista (per regolamento non esiste un "attacco generico" — ogni Attacco ha sempre almeno [MELEE]/[RANGE] e [DAMAGE]/[SUPPORT]). Se ${attacker?escapeHTML(attacker.name):'il partecipante'} non ne ha, importali dal Dex.</div>`;
          return;
        }
        const validation = validateAttackTargeting(attacker, target, atk);
        if(!validation.ok){
          if(resEl) resEl.innerHTML = `<div class="err">${validation.error}</div>`;
          return;
        }
        // Applica il limite di 1 Attacco a round (eccetto Ammo Rank, già gestito da trySpendAction).
        const spend = trySpendAction(attacker, 'attack');
        if(!spend.ok){
          if(resEl) resEl.innerHTML = `<div class="err">${spend.msg}</div>`;
          return;
        }
        if(resEl) resEl.innerHTML = '<div class="muted" style="font-size:11px;">Tiro...</div>';
        const { logText, dealt, accRoll, dodgeRoll, defeatInfo } = await performAttackRoll(code, combat, attacker, target, atk);
        const hit = accRoll.successes > dodgeRoll.successes;
        const detailHTML = `${diceRowHTML(accRoll.dice)}<span class="muted">vs</span>${diceRowHTML(dodgeRoll.dice)}<div class="muted" style="margin-top:4px;font-size:10.5px;">${escapeHTML(logText)}</div>`;
        const fallbackCompact = attackResultCompactHTML(null, hit, dealt, detailHTML);
        // Testo principale in chat = narrazione (di base, subito; sostituita dall'AI se arriva in tempo).
        // I dettagli tecnici (Accuracy/Dodge, tiri) restano dietro il marcatore ::TECH::, visibili solo espandendo.
        const baseNarr = basicAttackNarration(attacker, target, atk, hit, dealt, defeatInfo);
        const pushed = await pushCombatNarration(combat, { who: narratorName(attacker), role:'roll', text: `${baseNarr}::TECH::${logText}`, meta:{ dice: accRoll.dice.concat(dodgeRoll.dice), avatar: resolveParticipantImage(attacker) } });
        const rollEntryId = pushed && pushed.entry && pushed.entry.id;
        if(defeatInfo){
          const defeatDispName = target.nameHidden ? hiddenParticipantLabel(target) : defeatInfo.name;
          const noticeText = defeatInfo.digitama
            ? `🥚 ${defeatDispName} è Sconfitto ed è già al Default Stage minimo — da regolamento diventerebbe Digitama, gestiscilo a mano.`
            : `🏳️ ${defeatDispName} è Sconfitto! Retrocede a ${defeatInfo.toStage} con 1 Ferita e viene ignorato per il resto del combattimento (a meno che il giocatore non scelga di rientrare a proprio rischio).`;
          await pushCombatNarration(combat, { who:'Sistema', role:'gm', text: noticeText });
        }
        await persistAndRefresh();
        // persistAndRefresh ricostruisce l'intera card (quindi anche #combat-attack-result vuoto):
        // riapplico subito il risultato (dadi/danno) — non aspetta l'AI, così il tiro non resta mai bloccato.
        const resEl2 = document.getElementById('combat-attack-result');
        if(resEl2) resEl2.innerHTML = fallbackCompact;
        // Narrazione AI: gareggia con un timeout di 6s. Se arriva in tempo, sostituisce la frase di base
        // come testo principale dello STESSO messaggio (i dettagli tecnici restano invariati dietro l'espandi).
        const narrTimeout = new Promise(resolve=>setTimeout(()=>resolve(null), 6000));
        Promise.race([narrateAttack(attacker, target, atk, hit, dealt, defeatInfo), narrTimeout]).then(async (narrLine)=>{
          if(!narrLine || !rollEntryId) return;
          await editLogEntry(code, rollEntryId, `${narrLine}::TECH::${logText}`, combatNarrationThread(combat));
          refreshLiveParts();
        });

    const areaAttackBtn = document.getElementById('btn-combat-attack-area');

      areaAttackBtn.onclick = async ()=>{
        const attackerId = document.getElementById('combat-attacker').value;
        const targetId = document.getElementById('combat-target').value;
        const attacker = combat.participants.find(p=>p.id===attackerId);
        const centerTarget = combat.participants.find(p=>p.id===targetId);
        const resEl = document.getElementById('combat-attack-result');
        if(!attacker || !centerTarget){
          if(resEl) resEl.innerHTML = '<div class="err">Scegli attaccante e bersaglio.</div>';
          return;
        }
        const atkChoiceEl = document.getElementById('combat-attack-choice');
        let atk = null;
        if(atkChoiceEl && atkChoiceEl.value !== ''){
          atk = getParticipantAttacks(attacker)[Number(atkChoiceEl.value)];
        }
        if(!atk || !atk.areaAttack){
          if(resEl) resEl.innerHTML = '<div class="err">L\'attacco selezionato non è un Area Attack.</div>';
          return;
        }
        const spend = trySpendAction(attacker, 'attack');
        if(!spend.ok){
          if(resEl) resEl.innerHTML = `<div class="err">${spend.msg}</div>`;
          return;
        }
        const zone = centerTarget.zone || 'Medio';
        const victims = combat.participants.filter(p=>p.id!==attacker.id && p.side!==attacker.side && (p.zone||'Medio')===zone);
        if(victims.length===0){
          if(resEl) resEl.innerHTML = `<div class="err">Nessun bersaglio avversario nella zona ${zone}.</div>`;
          return;
        }
        const aStats = getParticipantCombatStats(attacker);
        const effAccuracy = Math.max(0, aStats.accuracy);
        const accRoll = rollPool(effAccuracy);
        if(aStats.certainStrike>0) accRoll.successes += aStats.certainStrike;
        const lines = [`🌪 ${narratorName(attacker)} usa ${atk.name} ${attackTagsPlain(atk)} come Area Attack sulla zona ${zone} (Accuracy ${effAccuracy}d6[${accRoll.dice.join(',')}]=${accRoll.successes} succ.):`];
        let combatMonsterGain = 0;
        for(const v of victims){
          const vStats = getParticipantCombatStats(v);
          const dodgeRoll = rollPool(vStats.dodge);
          if(vStats.absoluteEvasion>0) dodgeRoll.successes += vStats.absoluteEvasion;
          if(accRoll.successes <= dodgeRoll.successes){
            lines.push(`— ${narratorName(v)}: MANCATO (Dodge ${vStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ.)`);
            continue;
          }
          const excess = accRoll.successes - dodgeRoll.successes;
          if(atk.type==='Support'){
            if(atk.effectKey){
              const def = EFFECT_DEFS.find(d=>d.key===atk.effectKey);
              const isPositive = def && def.type==='positive';
              const finalPotency = isPositive ? 0 : 1;
              if(def && def.instant){
                const msg = await applyInstantEffect(code, v, atk.effectKey, 1);
                lines.push(`— ${narratorName(v)}: COLPITO! ${msg}`);
              } else if(finalPotency>0){
                if(!v.effects) v.effects=[];
                v.effects.push({ key: atk.effectKey, potency:1, duration:1 });
                lines.push(`— ${narratorName(v)}: COLPITO! Applica ${def?def.label:atk.effectKey} (Potenza 1, Durata 1 — ridotto da Area).`);
              } else {
                lines.push(`— ${narratorName(v)}: COLPITO! Effetto positivo azzerato dalla penalità Area (nessun effetto).`);
              }
            } else {
              lines.push(`— ${narratorName(v)}: COLPITO! (nessun Effetto collegato)`);
            }
          } else {
            const raw = excess + aStats.damage;
            const dealt = Math.max(0, Math.ceil((raw - vStats.armor)/2));
            await applyDamageToParticipant(code, combat, v, dealt);
            if(dealt>0) combatMonsterGain += dealt;
            const w = getParticipantWounds(v);
            const vDefeat = await applyDefeatIfNeeded(code, v);
            const vDefeatNote = vDefeat ? (vDefeat.digitama ? ` 🥚 Sconfitto — già al Default Stage minimo, diventerebbe Digitama (gestisci a mano).` : ` 🏳️ Sconfitto! Retrocede a ${vDefeat.toStage} con 1 Ferita.`) : '';
            lines.push(`— ${narratorName(v)}: COLPITO! ${dealt} danno (dimezzato da Area) → ${w.current}/${w.max} Ferite${vDefeatNote}`);
          }
        }
        if(attacker.isPC && atk.type!=='Support'){
          const aMember = cachedRoster.find(m=>m.username===attacker.username);
          if(aMember && Number(aMember.digimon.resolveCurrent||0)>0 && computeQualityMechanics(aMember.digimon.qualities).combatMonster>0){
            aMember.digimon.resolveCurrent = 0;
            await saveMember(code, aMember);
          }
        }
        if(resEl) resEl.innerHTML = '<div class="muted" style="font-size:11px;">Tiro in corso...</div>';
        const hitCount = victims.length - lines.filter(l=>l.includes('MANCATO')).length;
        const areaFriendly = `🌪 ${narratorName(attacker)} usa ${atk.name} come Area su ${zoneLabel(zone)}: ${hitCount}/${victims.length} colpiti.`;
        const compactHTML = attackResultCompactHTML(
          areaFriendly,
          hitCount>0, combatMonsterGain,
          `${diceRowHTML(accRoll.dice)}<div class="muted" style="margin-top:4px;font-size:10.5px;">${lines.map(escapeHTML).join('<br>')}</div>`
        );
        await pushCombatNarration(combat, { who:'Master', role:'roll', text: `${areaFriendly}::TECH::${lines.join(' | ')}`, meta:{ dice: accRoll.dice, avatar: resolveParticipantImage(attacker) } });
        await persistAndRefresh();
        const resEl2 = document.getElementById('combat-attack-result');
        if(resEl2) resEl2.innerHTML = compactHTML;
      };

        const b = combat.participants.find(p=>p.id===bId);
        const resEl = document.getElementById('combat-clash-result');
        if(!a || !b || a.id===b.id){
          if(resEl) resEl.innerHTML = '<div class="err">Scegli due partecipanti diversi.</div>';
          return;
        }
        const aStats = getParticipantClashStats(a);
        const bStats = getParticipantClashStats(b);
        const wasClashPair = a.clashWith===b.id && b.clashWith===a.id;
        const aPinned = wasClashPair && a.clashPinned && !a.clashController;
        const bPinned = wasClashPair && b.clashPinned && !b.clashController;
        let winner, loser, aRoll, bRoll, autoWin=false;
        if(aPinned || bPinned){
          winner = aPinned ? b : a; loser = aPinned ? a : b;
          autoWin = true;
        } else {
          const aBonus = (a.clashComebackBonus||0) + (aStats.clashBonus||0);
          const bBonus = (b.clashComebackBonus||0) + (bStats.clashBonus||0);
          aRoll = rollSkillCheck(aStats.cpu, aStats.ram); aRoll.total += aBonus;
          bRoll = rollSkillCheck(bStats.cpu, bStats.ram); bRoll.total += bBonus;
          if(aRoll.total > bRoll.total){ winner=a; loser=b; }
          else if(bRoll.total > aRoll.total){ winner=b; loser=a; }
          else if(aStats.cpu !== bStats.cpu){ winner = aStats.cpu>bStats.cpu ? a : b; loser = winner===a?b:a; }
          else { winner = a; loser = b; }
        }
        a.clashComebackBonus = 0; b.clashComebackBonus = 0;
        a.clashPinned = false; b.clashPinned = false;
        a.clashWith = b.id; b.clashWith = a.id;
        a.clashController = (winner.id===a.id); b.clashController = (winner.id===b.id);
        if(a.isPC){ const m=cachedRoster.find(x=>x.username===a.username); if(m){ m.digimon.stance='Neutral'; await saveMember(code, m); } }
        if(b.isPC){ const m=cachedRoster.find(x=>x.username===b.username); if(m){ m.digimon.stance='Neutral'; await saveMember(code, m); } }
        const friendlyClash = autoWin
          ? `🤼 Clash: il Pin era ancora attivo, controlla automaticamente ${narratorName(winner)}. Entrambi tornano in Stance Neutrale.`

          ? `Pin attivo su ${narratorName(loser)}: nessun tiro, controllo automatico a ${narratorName(winner)}.`
          : `${narratorName(a)} 3d6+CPU${aStats.cpu}+RAM${aStats.ram}=${aRoll.total} vs ${narratorName(b)} 3d6+CPU${bStats.cpu}+RAM${bStats.ram}=${bRoll.total}`;
        const clashMeta = autoWin ? { avatar: resolveParticipantImage(winner) } : { dice:(aRoll.dice||[]).concat(bRoll.dice||[]), avatar: resolveParticipantImage(winner) };
        await pushCombatNarration(combat, { who:'Master', role:'gm', text: `${friendlyClash}::TECH::${techClash}`, meta: clashMeta });
        if(resEl) resEl.innerHTML = `<div class="muted">Controlla il Clash: <b style="color:var(--cyan);">${escapeHTML(winner.name)}</b></div>`;
        await persistAndRefresh();
      };
