  function attachLogModeration(container, code, me, isPrivate, subgroupThread){
    if(!container || container.dataset.modBound) return;
    container.dataset.modBound = '1';
    container.addEventListener('click', async (e)=>{
      const editBtn = e.target.closest('[data-log-edit]');
      const delBtn = e.target.closest('[data-log-del]');
      const fulfillBtn = e.target.closest('[data-fulfill-target]');
      const moveAcceptBtn = e.target.closest('[data-move-accept-sector]');
      // In chat privata il thread attuale può cambiare da un refresh all'altro (il Master
      // passa da un giocatore all'altro), quindi lo leggiamo dalla variabile globale al
      // momento del click, non lo "congeliamo" quando la funzione viene collegata.
      const thread = subgroupThread ? (typeof subgroupThread==='function'?subgroupThread():subgroupThread) : (isPrivate ? masterPrivateThread : null);
      const sourceLog = subgroupThread ? cachedSubgroupLog : (isPrivate ? cachedMasterPrivateLog : cachedLog);
      if(editBtn){
        const id = editBtn.getAttribute('data-log-edit');
        const entry = sourceLog.find(l=>String(l.id)===String(id));
        if(entry) openEditLogModal(entry, code, thread);
      }
      if(delBtn){
        const id = delBtn.getAttribute('data-log-del');
        if(window.confirm('Eliminare questo messaggio dal registro?')){
          await deleteLogEntry(code, id, thread);
          refreshLiveParts();
        }
      }
      if(fulfillBtn && me){
        const skillKey = fulfillBtn.getAttribute('data-fulfill-skill');
        const tn = fulfillBtn.getAttribute('data-fulfill-tn');
        const poolKeys = ['baseAccuracy','baseDodge','baseHealth'];
        let text = null;
        let rollMeta = null;
        if(poolKeys.includes(skillKey)){
          const { dice, successes } = rollPool(me.digimon[skillKey]);
          const label = skillKey==='baseAccuracy'?'Accuracy':(skillKey==='baseDodge'?'Dodge':'Health');
          text = `tira Pool Check ${label} (${me.digimon[skillKey]}d6): [${dice.join(',')}] → ${successes} successi (richiesto dal Master)`;
          rollMeta = { dice, successes };
        } else {
          const def = SKILL_DEFS.find(d=>d.key===skillKey);
          if(def){
            const attr = def.attrs[0];
            const attrVal = me.tamer[attr];
            const digimonBonus = prodigiousSkillBonus(me, def);
            const skillVal = Number(me.tamer.skills[def.key]||0) + digimonBonus;
            const { dice, total: baseTotal } = rollSkillCheck(attrVal, skillVal);
            let total = baseTotal;
            let aspectNote = digimonBonus>0 ? ` +${digimonBonus} dal Digimon (Prodigious Skill/Mind Over Matter)` : '';
            const majorLeft = me.tamer.majorAspect ? (me.tamer.majorAspect.usesLeft||0) : 0;
            const minorLeft = me.tamer.minorAspect ? (me.tamer.minorAspect.usesLeft||0) : 0;
            if(majorLeft>0 || minorLeft>0){
              const choice = window.prompt(`Usare un Aspect? Scrivi "major" (+4, ${majorLeft} usi), "minor" (+2, ${minorLeft} usi), o lascia vuoto per nessuno.`, '');
              if(choice && choice.trim().toLowerCase().startsWith('major') && majorLeft>0){
                total += 4; me.tamer.majorAspect.usesLeft -= 1;
                aspectNote = ` +4 Major Aspect (${me.tamer.majorAspect.text})`;
                await saveMember(session.code, me);
              } else if(choice && choice.trim().toLowerCase().startsWith('minor') && minorLeft>0){
                total += 2; me.tamer.minorAspect.usesLeft -= 1;
                aspectNote = ` +2 Minor Aspect (${me.tamer.minorAspect.text})`;
                await saveMember(session.code, me);
              }
            }
            const verdict = evaluateVsTN(total, tn, dice);
            text = `tira ${def.label} (${ATTR_ABBR[attr]}+Skill): 3d6[${dice.join(',')}] + ${attrVal} + ${skillVal}${aspectNote} = ${total}` + (verdict?` vs TN ${tn} → ${verdict.label}`:'') + ' (richiesto dal Master)';
            rollMeta = { dice, total, verdict: verdict?verdict.label:null };
          }
        }
        if(text){
          const entry = { who: displayName(me), role:'roll', text, meta: rollMeta };
          // Risponde nello stesso canale in cui è arrivata la richiesta: se il giocatore la sta
          // guardando nella sua chat privata col Master, il tiro resta privato; altrimenti va
          // nella chat generale visibile a tutti (comportamento invariato per le richieste generali).
          if(playerChatMode==='private') await pushPrivateLog(code, session.username, entry);
          else await pushLog(code, entry);
          refreshLiveParts();
        }
      }
      if(moveAcceptBtn && me){
        // Il Master ha esplicitamente proposto questa destinazione in chat: lo spostamento va a
        // buon fine anche se lo "spostamento libero"/le connessioni non lo permetterebbero — qui
        // non è il giocatore a decidere di muoversi da solo, è un invito diretto del Master.
        const sectorId = moveAcceptBtn.getAttribute('data-move-accept-sector');
        const luogoId = moveAcceptBtn.getAttribute('data-move-accept-luogo') || null;
        if(sectorId){
          moveAcceptBtn.disabled = true;
          const prevSectorId = me.tamer.currentSectorId;
          const prevLuogoId = me.tamer.currentLuogoId;
          me.tamer.currentSectorId = sectorId;
          me.tamer.currentLuogoId = luogoId;
          const ok = await saveMember(code, me);
          if(!ok){
            me.tamer.currentSectorId = prevSectorId;
            me.tamer.currentLuogoId = prevLuogoId;
            moveAcceptBtn.disabled = false;
          } else {
            const destName = luogoId ? luogoNameById(sectorId, luogoId) : sectorNameById(sectorId);
            const entry = { who: displayName(me), role:'player', text: `🚶 ${displayName(me)} si sposta a "${destName||''}".` };
            if(playerChatMode==='private') await pushPrivateLog(code, session.username, entry);
            else await pushLog(code, entry);
            refreshLiveParts();
          }
        }
      }
    });
  }

  function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHTML(s); }

  // Converte un testo grezzo (narrazione del Master, chat, ecc.) in HTML sicuro,
  // preservando gli a capo e un piccolo sottoinsieme di markdown: ### / ## / # per i titoli
  // e **testo** per il grassetto. L'escaping HTML avviene sempre PRIMA di interpretare
  // i simboli markdown, quindi non introduce rischi di injection.
  function formatLogText(raw){
    if(raw==null || raw==='') return '';
    const escaped = escapeHTML(String(raw)).replace(/\r\n/g,'\n');
    const lines = escaped.split('\n');
    let html = '';
    lines.forEach((line, i)=>{
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      if(h){
        html += `<div class="log-h log-h${h[1].length}">${h[2]}</div>`;
      } else {
        html += line;
        if(i < lines.length-1) html += '<br>';
      }
    });
    // Discorso diretto: il testo tra virgolette viene evidenziato (colore + corsivo, vedi CSS
    // .log-speech) per distinguere a colpo d'occhio ciò che il personaggio DICE dal resto del
    // messaggio (narrazione/azione) — richiesto per rendere più leggibili i messaggi lunghi dove
    // si mescolano descrizione e battute. Riconosce le virgolette dritte "..." (diventate &quot;
    // dopo l'escaping HTML sopra) e quelle tipografiche “...”/«...» (non toccate dall'escaping).
    // Non greedy e senza attraversare <br>/<div> (escluso "<" dal contenuto): resta dentro una
    // singola riga, quindi non scatta per una virgoletta "aperta" dimenticata a fine messaggio.
    html = html
      .replace(/(&quot;)([^<]+?)(&quot;)/g, '$1<span class="log-speech">$2</span>$3')
      .replace(/(“)([^<]+?)(”)/g, '$1<span class="log-speech">$2</span>$3')
      .replace(/(«)([^<]+?)(»)/g, '$1<span class="log-speech">$2</span>$3');
    // grassetto **testo** (non a cavallo di righe già trasformate in <div>)
    html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    // "Menziona": [[dex:ID]] / [[npc:NOME_CODIFICATO]] inseriti dal bottone 🔖 nel composer
    // diventano un badge cliccabile con mini-ritratto, invece di restare testo grezzo — mostra
    // subito a chi legge di chi si sta parlando, con un tap per vedere la scheda completa.
    html = html.replace(/\[\[dex:([a-zA-Z0-9_-]+)\]\]/g, (m, id)=>{
      const e = cachedDex.find(x=>String(x.id)===id);
      if(!e) return m;
      return mentionChipHTML(e.image_url, e.name, 'dex:'+id);
    });
    html = html.replace(/\[\[npc:([^\]]+)\]\]/g, (m, encName)=>{
      let name; try{ name = decodeURIComponent(encName); }catch(err){ name = encName; }
      const npcs = loadSavedNpcs(session && session.code);
      const n = npcs.find(x=>x.name===name);
      return mentionChipHTML(n ? n.avatar : null, name, 'npc:'+encName);
    });
    return html;
  }
  function mentionChipHTML(avatar, name, dataKey){
    return `<span class="mention-chip" data-mention-open="${escapeAttr(dataKey)}">${avatar?`<img src="${escapeAttr(avatar)}" onerror="this.style.display='none'" />`:''}${escapeHTML(name)}</span>`;
  }
  // Bottone "🔖 Menziona" accanto a un composer: apre il selezionatore e inserisce il token
  // scelto (Digidex o NPC salvato) al punto del cursore nella textarea indicata.
  function mentionButtonHTML(prefix){
    return `<button type="button" class="btn ghost small" id="${prefix}-mention-btn" style="margin-top:6px;">🔖 Menziona</button>`;
  }

  function openMentionPicker(code, onPick){
    const old = document.getElementById('mention-picker-modal');

        <div class="section-title" style="margin-top:0;">🔖 Mostra chi stai citando</div>

    function renderList(){

        ${npcMatches.length ? `<div class="muted" style="font-size:10px;text-transform:uppercase;margin:10px 0 4px;">NPC</div>` + npcMatches.map(n=>`<div class="roster-item" data-mention-pick="npc:${escapeAttr(encodeURIComponent(n.name))}" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;">${n.avatar?`<img src="${escapeAttr(n.avatar)}" style="width:26px;height:26px;object-fit:cover;border-radius:4px;" />`:''}<span>${escapeHTML(n.name)}</span></div>`).join('') : ''}

    } else if(key.startsWith('npc:')){
      const encName = key.slice(4);
      let name; try{ name = decodeURIComponent(encName); }catch(err){ name = encName; }
      const npcs = loadSavedNpcs(session && session.code);
      const n = npcs.find(x=>x.name===name);

  function showMentionDetailModal({ name, image, description, stage, categories }){
    const old = document.getElementById('mention-detail-modal');
    if(old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'mention-detail-modal';

        ${image ? `<div class="enc-modal-img-wrap"><img src="${escapeAttr(image)}" onerror="this.style.display='none'" class="enc-modal-img" /></div>` : ''}
        <div style="margin-top:10px;">

  // Le "evolutions" di una voce Digidex sono oggetti { name, imageUrl, ... }, non semplici stringhe.
  // Estrae sempre il nome in modo sicuro, altrimenti finisce per stampare "[object Object]" a video
  // (ed è quello che finiva salvato dentro unlockedEvolutions dalla checkbox del Master).
  function evoName(ev){ if(ev==null) return ''; return typeof ev==='string' ? ev : String(ev.name||''); }
  // Specchio di digimon.html: spacca le mosse del Digidex ("Nome — [TAG][TAG]") nello schema attacks.
  function parseDexAttackString(raw){
    if(!raw) return null;
    const dashSplit = raw.split(/\s+—\s+/);
    const name = (dashSplit[0] || raw).trim();
    if(!name) return null;
    const tagBlock = dashSplit.slice(1).join(' — ');
    const tags = Array.from(tagBlock.matchAll(/\[([^\]]+)\]/g)).map(m=>m[1].trim());
    const shape = tags.some(t=>/^MELEE$/i.test(t)) ? 'Melee' : 'Range';
    const hasDamage = tags.some(t=>/^DAMAGE/i.test(t));
    const type = hasDamage ? 'Damage' : 'Support';
    // BUG STORICO: un Tag come [FEAR] o [SLOW] nel testo veniva mostrato come semplice etichetta
    // ma non era mai collegato a un vero effectKey — quindi ogni Attacco [SUPPORT] importato dal
    // Digidex non applicava MAI il suo Effetto in combattimento, nonostante il testo lo dichiarasse.
    // Ora riconosciamo automaticamente il primo Tag che corrisponde a un'etichetta di EFFECT_DEFS
    // (es. "[FEAR]", anche con numero dietro tipo "[FEAR 2]") e lo agganciamo.
    // EFFECT_TAG_ALIASES copre varianti di testo già presenti nel Digidex che non coincidono
    // esattamente con l'etichetta interna (es. "[CONFUSION]" nel testo vs chiave 'confuse').
    let effectKey = '';
    for(const t of tags){
      const word = t.split(/\s+/)[0].toUpperCase();
      const aliasKey = EFFECT_TAG_ALIASES[word];
      if(aliasKey){ effectKey = aliasKey; break; }
      const match = EFFECT_DEFS.find(d=>d.label.toUpperCase()===word);
      if(match){ effectKey = match.key; break; }
    }
    const extraTags = tags.filter(t=>!/^MELEE$/i.test(t) && !/^RANGE$/i.test(t)).join(' · ');
    return { name, shape, type, extraTags, effectKey };
  }
  // Rilegge TUTTO il Digidex con la stessa logica di parseDexAttackString usata in combattimento
  // (quindi cattura automaticamente anche gli alias tipo CONFUSION→confuse) e segnala ogni mossa
  // [SUPPORT] il cui Tag di Effetto non corrisponde a nessuno dei 45 Effetti ufficiali — che sia
  // per un refuso nel testo, un tag inventato, o perché manca del tutto.
  function buildAttacksFromDexEntry(dexEntry){
    if(!dexEntry) return [];
    const list = [];
    const addMove = (raw, desc, signature) => {
      const parsed = parseDexAttackString(raw);
      if(!parsed) return;
      list.push({ name: parsed.name, shape: parsed.shape, type: parsed.type, effectKey: parsed.effectKey || '', extraTags: parsed.extraTags, desc: desc||'', signature: !!signature, reach: parsed.shape==='Range'?1:0, areaAttack:false });
    };
    if(dexEntry.signature_move) addMove(dexEntry.signature_move, dexEntry.attack_desc, true);
    (dexEntry.extra_attacks||[]).forEach(ea=>{ if(ea && ea.move) addMove(ea.move, ea.desc, false); });
    if(dexEntry.signature_move_2) addMove(dexEntry.signature_move_2, dexEntry.attack_desc_2, true);
    return list;
  }

  // ---------- SCENE ENCOUNTERS: name-only strings (legacy) vs full Dex-linked objects ----------
  function normalizeEncounter(e){
    if(typeof e === 'string'){
      return { id:'enc'+Date.now()+Math.random().toString(36).slice(2,6), name:e, dexId:null, stage:'', categories:[], image:'', description:'', baseStats:{baseAccuracy:0,baseDamage:0,baseDodge:0,baseArmor:0,baseHealth:0}, attacks:[], revealed:true, isBoss:false, currentWounds:null, disposition:'enemy' };
    }
    return Object.assign({ id:'enc'+Date.now()+Math.random().toString(36).slice(2,6), name:'', dexId:null, stage:'', categories:[], image:'', description:'', baseStats:{baseAccuracy:0,baseDamage:0,baseDodge:0,baseArmor:0,baseHealth:0}, attacks:[], revealed:true, isBoss:false, currentWounds:null, disposition:'enemy' }, e);
  }
  const ENCOUNTER_DISPOSITIONS = { enemy:{label:'Nemico', color:'var(--danger)', icon:'⚔️'}, ally:{label:'Alleato', color:'var(--cyan)', icon:'🤝'}, neutral:{label:'Neutrale', color:'var(--text-mute)', icon:'❔'} };

  // Caselle Ferita di un Incontro nella Scena, stessa formula usata per i Digimon dei giocatori (Stage + Health×2)
  function encounterMaxWounds(e){
    const bs = (e && e.baseStats) || {};
    return Math.max(1, stageIndex(e && e.stage) + Number(bs.baseHealth||0)*2);
  }
  function encounterCurrentWounds(e){
    const max = encounterMaxWounds(e);
    if(e.currentWounds===null || e.currentWounds===undefined) return max;
    return Math.max(0, Math.min(max, Number(e.currentWounds)));
  }
  function encName(e){ return (typeof e==='string') ? e : ((e && e.name) || ''); }

  function findCurrentSector(){
    if(!cachedScene.currentSectorId) return null;
    for(const m of (cachedScene.macroScenes||[])){
      const s = (m.sectors||[]).find(x=>x.id===cachedScene.currentSectorId);
      if(s) return s;
    }
    return null;
  }

  function sceneCurrentSectorLuoghiHTML(){
    const s = findCurrentSector();
    if(!s) return '<div class="muted" style="font-size:11px;">Nessun Settore attuale impostato (gestiscilo dal pannello Mappa qui sotto).</div>';
    const luoghi = s.luoghi || [];
    if(luoghi.length===0) return `<div class="muted" style="font-size:11px;">Il Settore attuale ("${escapeHTML(s.name)}") non ha Luoghi specifici.</div>`;
    return luoghi.map(lg=>{
      const isCurrent = cachedScene.currentLuogoId===lg.id;
      return `
        <div class="flex-between" style="padding:4px 6px;margin-top:3px;background:rgba(255,255,255,0.03);border-radius:6px;">
          <span style="font-size:12px;display:flex;align-items:center;gap:5px;">
            ${lg.image?`<img src="${escapeAttr(lg.image)}" onerror="this.style.display='none'" style="width:18px;height:18px;object-fit:cover;border-radius:3px;" />`:''}
            ${escapeHTML(lg.name)} ${isCurrent?'<span class="tag" style="color:var(--cyan);border-color:var(--cyan);font-size:9px;">📍 Attuale</span>':''}
          </span>
          <span>
            <button class="btn ${isCurrent?'ghost':''} small" data-scene-luogo-activate="${lg.id}" style="padding:2px 6px;font-size:10px;">${isCurrent?'Attivo':'📍 Attiva'}</button>
            <button class="btn ghost small" data-scene-luogo-reveal="${lg.id}" style="padding:2px 6px;font-size:10px;">${lg.revealed?'🙈 Nascondi':'👁️ Rivela'}</button>
          </span>
        </div>
      `;
    }).join('');

  function bindSceneCurrentSectorLuoghi(code){
    const el = document.getElementById('scene-luoghi-live');
    if(!el) return;
    el.querySelectorAll('[data-scene-luogo-activate]').forEach(btn=>{
      btn.onclick = async ()=>{
        const luogoId = btn.getAttribute('data-scene-luogo-activate');
        const s = findCurrentSector();
        if(!s) return;
        const lg = (s.luoghi||[]).find(x=>x.id===luogoId);
        if(!lg) return;
        cachedScene.currentLuogoId = luogoId;
        lg.revealed = true;
        await saveScene(code, cachedScene);
        el.innerHTML = sceneCurrentSectorLuoghiHTML();
        bindSceneCurrentSectorLuoghi(code);
        refreshLiveParts();
      };
    });
    el.querySelectorAll('[data-scene-luogo-reveal]').forEach(btn=>{
      btn.onclick = async ()=>{
        const luogoId = btn.getAttribute('data-scene-luogo-reveal');
        const s = findCurrentSector();
        if(!s) return;
        const lg = (s.luoghi||[]).find(x=>x.id===luogoId);
        if(!lg) return;
        lg.revealed = !lg.revealed;
        await saveScene(code, cachedScene);
        el.innerHTML = sceneCurrentSectorLuoghiHTML();
        bindSceneCurrentSectorLuoghi(code);
      };
    });
  }

  async function openEncounterDetail(name, code, username){
    const e = (cachedScene.encounters||[]).map(normalizeEncounter).find(x=>x.revealed!==false && x.name.trim().toLowerCase()===String(name).trim().toLowerCase());
    if(!e) return;
    // Auto-register in the Digidex the moment someone looks this Digimon up, since they've now "met" it.
    let dexMatch = cachedDex.find(d=>String(d.name).trim().toLowerCase()===e.name.trim().toLowerCase());
    try{
      if(!dexMatch){
        const d = await addDexEntry(code, {
          name: e.name, stage: e.stage||'Rookie', description: e.description||'', imageUrl: e.image||'',
          categories: e.categories||[], baseStats: e.baseStats||{}, addedBy: username, discovered: true
        });
        if(d && d.entry){ cachedDex.push(d.entry); dexMatch = d.entry; }
      } else if(!dexMatch.discovered){
        const ok = await updateDexEntry(code, dexMatch.id, {
          name: dexMatch.name, stage: dexMatch.stage, description: dexMatch.description,
          imageUrl: dexMatch.image_url, categories: dexMatch.categories||[], baseStats: dexMatch.base_stats||{},
          evolutions: dexMatch.evolutions||[], qualities: dexMatch.qualities||[], dpTotal: dexMatch.dp_total||0,
          discovered: true
        });
        if(ok) dexMatch.discovered = true;
      }
      const dexLive = document.getElementById('dex-live');
      if(dexLive) dexLive.innerHTML = dexListHTML(cachedDex, session && session.role==='master');
    }catch(err){ /* non-blocking: still show the detail card even if auto-registration fails */ }

    const evolutions = (dexMatch && Array.isArray(dexMatch.evolutions)) ? dexMatch.evolutions : [];
    // Pre-evolutions: any Dex entry that lists this name among ITS evolutions.
    const preEvolutions = cachedDex
      .filter(d => Array.isArray(d.evolutions) && d.evolutions.some(ev => String(ev.name).trim().toLowerCase() === e.name.trim().toLowerCase()))
      .map(d => ({ name: d.name, imageUrl: d.image_url }));
    const description = e.description || (dexMatch && dexMatch.description) || '';
    const categories = (dexMatch && dexMatch.categories && dexMatch.categories.length) ? dexMatch.categories : (e.categories||[]);
    const { attribute, family } = splitCategoriesAttribute(categories);
    const oldModal = document.getElementById('enc-detail-modal');
    if(oldModal) oldModal.remove();
    const modal = document.createElement('div');
    modal.id = 'enc-detail-modal';
    modal.className = 'enc-modal-backdrop';
    modal.innerHTML = `
      <div class="enc-modal-card hud-frame">
        <button class="btn ghost small" id="enc-modal-close" style="position:absolute;top:8px;right:8px;">✕</button>
        ${e.image ? `<div class="enc-modal-img-wrap"><img src="${escapeAttr(e.image)}" onerror="this.style.display='none'" class="enc-modal-img" /></div>` : ''}
        <div class="flex-between" style="margin-top:10px;">
          <b style="font-size:16px;">${escapeHTML(e.name)}</b>
          <span>${e.stage?`<span class="tag">${escapeHTML(e.stage)}</span>`:''}${e.isBoss?`<span class="tag" style="color:var(--danger);border-color:var(--danger);">👑 Boss</span>`:''}</span>
        </div>
        ${(attribute || family.length) ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">${attributeBadgeHTML(attribute)}${family.map(c=>`<span class="tag" style="font-size:9px;">${escapeHTML(c)}</span>`).join('')}</div>` : ''}
        ${description ? `<div class="sub" style="margin-top:8px;">${escapeHTML(description)}</div>` : '<div class="muted" style="margin-top:8px;">Nessuna descrizione disponibile.</div>'}
        ${preEvolutions.length ? `
          <div class="muted" style="margin-top:14px;margin-bottom:4px;">Pre-Evoluzioni</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">${preEvolutions.map(ev=>evoUnlockedHTML(ev)).join('')}</div>
        ` : ''}
        ${evolutions.length ? `
          <div class="muted" style="margin-top:14px;margin-bottom:4px;">Possibili Evoluzioni</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">${evolutions.map(ev=>evoUnlockedHTML(ev)).join('')}</div>
        ` : ''}
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('enc-modal-close').onclick = closeEncounterDetail;
    modal.onclick = (ev)=>{ if(ev.target===modal) closeEncounterDetail(); };
  }

  // Global delegation: works no matter which render function last drew the scene box

  // ---------- Coda Avvisi bloccanti ----------
  let noticeQueue = [];
  let noticeModalOpen = false;
  let __noticeAudioEl = null;
  // Suono di notifica: parte quando compare il primo Avviso non ancora confermato e continua in
  // loop finché il giocatore non li accetta tutti (o rimuto). Non riparte da capo tra un Avviso e
  // l'altro nella stessa coda — un solo elemento riutilizzato, non un nuovo Audio() ogni volta.
  const NOTICE_SFX_URL = 'https://gsquzfhxgyqrnkrqdivc.supabase.co/storage/v1/object/public/campaign-audio/FRONTIER1/1787662152805_maxffk.mpeg';
  function __startNoticeSfx(){
    if(window.__dvosAudioPrefs && (window.__dvosAudioPrefs.clickMuted || window.__dvosAudioPrefs.musicMuted)) return;
    if(__noticeAudioEl && !__noticeAudioEl.paused) return;
    try{
      if(!__noticeAudioEl){ __noticeAudioEl = new Audio(NOTICE_SFX_URL); __noticeAudioEl.loop = true; __noticeAudioEl.volume = 0.5; }
      __noticeAudioEl.play().catch(()=>{});
    }catch(e){}
  }
  function __stopNoticeSfx(){
    if(__noticeAudioEl){ try{ __noticeAudioEl.pause(); __noticeAudioEl.currentTime = 0; }catch(e){} }
  }

  function isNoticeForMe(n){
    if(!session) return false;
    if(n.target_type==='all') return true;
    const list = Array.isArray(n.target_usernames) ? n.target_usernames : [];
    return list.includes(session.username);
  }
  function isNoticeConfirmedByMe(n){
    const acked = Array.isArray(n.acked_by) ? n.acked_by : [];
    return acked.includes(session.username);
  }

  async function checkNoticesForMe(){
    if(!session) return;
    const all = await getNotices(session.code);
    const mine = all.filter(n=>n.active && isNoticeForMe(n) && !isNoticeConfirmedByMe(n));
    mine.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    noticeQueue = mine;
    if(!noticeModalOpen && noticeQueue.length>0) showNextNotice();
    if(noticeQueue.length===0 && noticeModalOpen){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
      __stopNoticeSfx();
    }
  }

  function showNextNotice(){
    if(noticeQueue.length===0){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
      __stopNoticeSfx();
      return;
    }
    noticeModalOpen = true;
    const n = noticeQueue[0];
    const old = document.getElementById('notice-modal');
    if(old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'notice-modal';
    modal.className = 'enc-modal-backdrop';
    modal.style.zIndex = '9999';
    // Passo 1 — solo un annuncio, niente suono ancora: i browser bloccano l'avvio automatico
    // dell'audio se non parte da un click diretto dell'utente (la notifica compare da sola via
    // polling, quindi far partire il suono qui verrebbe silenziosamente bloccato). Il click su
    // "Leggi ora" è un gesto reale e sblocca l'audio per il passo 2.
    modal.innerHTML = `
      <div class="hud-frame" style="max-width:420px;width:92vw;padding:26px;position:relative;text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">📢</div>
        <div class="section-title" style="margin-bottom:6px;justify-content:center;">Hai una nuova notifica${noticeQueue.length>1?` (${noticeQueue.length} in attesa)`:''}</div>
        <button class="btn solid" id="notice-open-btn" style="width:100%;padding:12px;margin-top:14px;">Leggi ora</button>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('notice-open-btn').onclick = ()=>{
      __startNoticeSfx();
      showNoticeContent(n);
    };
  }
  function showNoticeContent(n){
    const old = document.getElementById('notice-modal');
    if(old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'notice-modal';
    modal.className = 'enc-modal-backdrop';
    modal.style.zIndex = '9999';
    modal.innerHTML = `
      <div class="hud-frame" style="max-width:480px;width:92vw;padding:22px;position:relative;">
        <div class="section-title" style="margin-bottom:14px;">📢 Avviso dal Master${noticeQueue.length>1?` (${noticeQueue.length} in attesa)`:''}</div>
        ${n.image_url ? `<img src="${escapeAttr(n.image_url)}" style="max-width:100%;max-height:40vh;object-fit:contain;margin-bottom:14px;border:1px solid var(--line);display:block;" />` : ''}
        <div style="white-space:pre-wrap;margin-bottom:18px;line-height:1.5;">${escapeHTML(n.text)}</div>
        <button class="btn solid" id="notice-confirm-btn" style="width:100%;padding:12px;">Ho capito</button>
      </div>
    `;
    // Nessuna chiusura cliccando fuori né tasto ✕: è bloccante di proposito, come richiesto.
    document.body.appendChild(modal);
    document.getElementById('notice-confirm-btn').onclick = async ()=>{
      await confirmNotice(session.code, n.id, session.username);
      noticeQueue.shift();
      if(noticeQueue.length===0) __stopNoticeSfx();
      showNextNotice();
    };
  }

  // ---------- MOBILE BOTTOM NAV ----------
  // Su mobile, mostra una barra di navigazione fissa in basso. Ogni tab attiva una sezione
  // diversa (le card vengono wrappate in div.mobile-section con data-mobile-tab).
  // Su desktop (>760px) il sistema non fa nulla — le sezioni restano tutte visibili nel grid2.
  let __currentMobileTab = null;

  function isMobile(){ return window.innerWidth <= 760; }

  function initMobileNav(){
    if(!isMobile()) return;
    const nav = document.querySelector('.mobile-nav');
    if(!nav) return;
    const btns = nav.querySelectorAll('.mobile-nav-btn');
    btns.forEach(btn=>{
      btn.onclick = ()=>{
        const tab = btn.dataset.tab;
        if(!tab) return;
        switchMobileTab(tab);
      };
    });
    // Attiva il primo tab se non c'è nessuno attivo
    if(!__currentMobileTab){
      const first = nav.querySelector('.mobile-nav-btn');
      if(first && first.dataset.tab) switchMobileTab(first.dataset.tab);
    } else {
      switchMobileTab(__currentMobileTab);
    }
  }

  function switchMobileTab(tab){
    __currentMobileTab = tab;
    // Aggiorna bottoni
    document.querySelectorAll('.mobile-nav-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===tab);
    });
    // Mostra/nascondi sezioni
    document.querySelectorAll('.mobile-section').forEach(sec=>{
      sec.classList.toggle('mobile-active', sec.dataset.mobileTab===tab);
    });
    // Scroll to top quando si cambia tab
    window.scrollTo({ top: 0 });
  }

  function missionsListHTML(){
    if(cachedMissions.length===0) return `<div class="muted">Nessuna missione ancora registrata.</div>`;
    const isMaster = session && session.role==='master';
    // Per i giocatori mostra prima le missioni assegnate a loro (ma tutte restano visibili, come richiesto).
    const sorted = isMaster ? cachedMissions : cachedMissions.slice().sort((a,b)=>{
      const aMine = (a.assigned_to||[]).includes(session.username) ? 0 : 1;
      const bMine = (b.assigned_to||[]).includes(session.username) ? 0 : 1;
      return aMine - bMine;
    });
    return sorted.map(m=>missionCardHTML(m, isMaster)).join('');
  }

  function missionCardHTML(m, isMaster){
    const objs = Array.isArray(m.objectives) ? m.objectives : [];
    const doneCount = objs.filter(o=>o.done).length;
    const assigned = Array.isArray(m.assigned_to) ? m.assigned_to : [];
    return `
      <div class="hud-frame card" style="padding:12px;margin-bottom:10px;" data-mission-id="${m.id}">
        <div class="flex-between" style="align-items:flex-start;">
          <div>

            ${m.description ? `<div class="sub" style="margin-top:2px;">${escapeHTML(m.description)}</div>` : ''}
          </div>
          <span class="tag mono" style="color:${MISSION_STATUS_COLOR[m.status]||'var(--text-mute)'};border-color:${MISSION_STATUS_COLOR[m.status]||'var(--line)'};">${MISSION_STATUS_LABEL[m.status]||m.status}</span>
        </div>
        ${objs.length>0 ? `
          <div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;margin-top:10px;">Obiettivi (${doneCount}/${objs.length})</div>
          <div style="margin-top:4px;">
            ${objs.map((o,i)=>`
              <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-top:4px;cursor:pointer;${o.done?'opacity:0.6;text-decoration:line-through;':''}">
                <input type="checkbox" data-mission-obj="${m.id}:${i}" ${o.done?'checked':''} style="width:auto;" />
                ${escapeHTML(o.text)}
              </label>
            `).join('')}
          </div>
        ` : ''}

          </select>

        </div>

  // ---------- DIGIMOJI: conversione fonetica italiana -> Hiragana ----------
  // Regole pensate per l'ortografia italiana (ca/co/cu = k, che/chi = k, ci = "chi",
  // ga/go/gu = g, ghe/ghi = g, gi = "ji", sci = "shi"), più le varianti standard
  // (romaji "wapuro": ti/tu/si/hu/zi come alternative a chi/tsu/shi/fu/ji).
  const HIRA3 = {chi:'き',che:'け',ghi:'ぎ',ghe:'げ',sci:'し',tsu:'つ',shi:'し'};
  const HIRA2 = {
    ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',
    ca:'か',co:'こ',cu:'く',ci:'ち',
    sa:'さ',si:'し',su:'す',se:'せ',so:'そ',
    ta:'た',ti:'ち',te:'て',to:'と',tu:'つ',
    na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',
    ha:'は',hi:'ひ',hu:'ふ',fu:'ふ',he:'へ',ho:'ほ',
    ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',
    ya:'や',yu:'ゆ',yo:'よ',
    ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',
    wa:'わ',wo:'を',
    ga:'が',gu:'ぐ',go:'ご',gi:'じ',
    za:'ざ',zu:'ず',ze:'ぜ',zo:'ぞ',zi:'じ',ji:'じ',
    da:'だ',de:'で',do:'ど',di:'ぢ',du:'づ',
    ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',
    pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',
    va:'ば',vi:'び',vu:'ぶ',ve:'べ',vo:'ぼ', // Japanese has no native "v" sound; approximated on the b-row
  };
  const HIRA1 = {a:'あ',i:'い',u:'う',e:'え',o:'お',n:'ん'};

  function italianToHiragana(text){
    let out = '';
    let lower = String(text||'').toLowerCase();
    // Sokuon (small tsu): a doubled consonant becomes っ + the single consonant,
    // e.g. "addo" -> "aっdo", matching how Japanese renders gemination in loanwords.
    lower = lower.replace(/([bcdfghjklmpqrstvwxyz])\1/g, 'っ$1');
    let i = 0;
    while(i < lower.length){
      const c3 = lower.substr(i,3);
      const c2 = lower.substr(i,2);
      const c1 = lower.substr(i,1);
      if(c3.length===3 && HIRA3[c3]){ out += HIRA3[c3]; i+=3; continue; }
      if(c2.length===2 && HIRA2[c2]){ out += HIRA2[c2]; i+=2; continue; }
      if(HIRA1[c1]){ out += HIRA1[c1]; i+=1; continue; }
      out += lower[i]; i+=1;
    }
    return out;
  }

  // Collega la conversione live a una textarea + checkbox "Digimoji".
  // Converte una parola non appena viene completata (spazio/punteggiatura/a capo),
  // evitando l'ambiguità della "n" (es. "montana" convertita lettera per lettera
  // rischierebbe di leggere "n" come ん prima di sapere se segue una vocale).
  function attachDigimojiInput(taId, chkId){
    const ta = document.getElementById(taId);
    const chk = document.getElementById(chkId);
    if(!ta || !chk) return;
    function convertWordBeforeBoundary(){
      const val = ta.value;
      const pos = ta.selectionStart == null ? val.length : ta.selectionStart;
      if(pos===0) return;
      const justTyped = val[pos-1];
      if(/[a-zA-Z]/.test(justTyped)) return; // parola non ancora conclusa
      let start = pos-2;
      while(start>=0 && /[a-zA-Z]/.test(val[start])) start--;
      start++;
      const wordEnd = pos-1;
      if(start>=wordEnd) return;
      const word = val.slice(start, wordEnd);
      const converted = italianToHiragana(word);
      if(converted===word) return;
      ta.value = val.slice(0,start) + converted + val.slice(wordEnd);
      const newPos = start + converted.length + (pos - wordEnd);
      try{ ta.setSelectionRange(newPos, newPos); }catch(e){}
    }
    function convertAllNow(){
      if(!chk.checked) return;
      const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
      const convertedBefore = italianToHiragana(ta.value.slice(0,pos));
      ta.value = italianToHiragana(ta.value);
      const newPos = convertedBefore.length;
      try{ ta.setSelectionRange(newPos, newPos); }catch(e){}
    }
    ta.addEventListener('input', ()=>{ if(chk.checked) convertWordBeforeBoundary(); });
    ta.addEventListener('blur', convertAllNow);
    chk.addEventListener('change', ()=>{ if(chk.checked) convertAllNow(); });
    // Passata di sicurezza: converte per intero (anche l'ultima parola rimasta
    // a metà) subito prima dell'invio effettivo del messaggio.
    ta.dataset.digimojiFinalize = 'true';
  }


  // ---------- global dex filter delegation ----------
  document.addEventListener('click', function(e){
    const chip = e.target.closest('[data-filter-cat]');
    if(!chip) return;
    const cat = chip.getAttribute('data-filter-cat');
    if(cat === '__clear__'){
      dexActiveFilters = [];
    } else {
      const idx = dexActiveFilters.indexOf(cat);
      if(idx>=0) dexActiveFilters.splice(idx,1); else dexActiveFilters.push(cat);
    }
    const dexLive = document.getElementById('dex-live');
    if(dexLive){
      dexLive.innerHTML = dexListHTML(cachedDex, dexCanEditGlobal);
      if(dexCanEditGlobal && session) bindDexEditButtons(session.code);
    }
  });

  // ---------- schede pieghevoli su mobile ----------
  // Tocca il titolo (.section-title) di una .hud-frame.card per aprirla/chiuderla.
  // Lo stato "chiusa" è tenuto in un Set separato dal DOM (chiave = testo del titolo),
  // perché il polling ogni 4s rigenera l'HTML delle card e perderebbe lo stato altrimenti.
  const __collapsedCardKeys = new Set();

  function __cardTitleKey(card){
    if(card.id) return 'id:' + card.id;
    const t = card.querySelector('.section-title');
    if(!t) return null;
    return 'txt:' + t.textContent.replace('▾','').replace('▸','').trim();
  }

  function __applyCollapseToCard(card){
    const titleEl = card.querySelector('.section-title');
    if(!titleEl) return;
    const key = __cardTitleKey(card);
    const shouldCollapse = key && __collapsedCardKeys.has(key);
    let headerChild = titleEl;
    while(headerChild.parentElement && headerChild.parentElement !== card) headerChild = headerChild.parentElement;
    Array.from(card.children).forEach(child=>{
      if(child === headerChild) return;
      if(shouldCollapse){
        // Ricordiamo il display che il child aveva PRIMA di essere piegato (spesso non è la
        // stringa vuota: es. #mchat-private-slot/#mchat-subgroup-slot partono da "display:none"
        // finché non è la loro scheda ad essere attiva, o #player-subgroup-select-wrap fuori
        // dalla modalità Sottogruppi) — solo così possiamo ripristinarlo esattamente quando la
        // card si riapre, invece di forzare tutto a visibile.
        if(child.dataset.prevDisplay===undefined) child.dataset.prevDisplay = child.style.display || '';
        child.style.display = 'none';
      } else if(child.dataset.prevDisplay!==undefined){
        // La card era stata chiusa da questa stessa funzione: la riapriamo ripristinando
        // esattamente il display precedente (che potrebbe essere "none", se quel child era
        // già nascosto per altri motivi, es. la chat privata quando non è la scheda attiva).
        child.style.display = child.dataset.prevDisplay;
        delete child.dataset.prevDisplay;
      }
      // Se la card non è mai stata chiusa da questa funzione (caso normale, la stragrande
      // maggioranza dei render), NON tocchiamo affatto lo style dei figli: prima invece questa
      // funzione girava ad ogni ri-render (il MutationObserver più sotto la richiama continuamente
      // durante il polling) e resettava incondizionatamente OGNI figlio a "display: ''" — il che
      // cancellava il display:none con cui updateMasterChatModeUI()/updateChatModeButtons()
      // tenevano nascoste Chat Privata e Sottogruppi quando non erano la scheda attiva. Risultato:
      // su mobile (dove questa funzione è attiva) le tre chat restavano sempre tutte aperte insieme.
    });
    card.classList.toggle('collapsed', !!shouldCollapse);
    if(!titleEl.querySelector('.fold-icon')){
      const icon = document.createElement('span');
      icon.className = 'fold-icon';
      icon.style.float = 'right';
      icon.style.opacity = '0.6';
      titleEl.appendChild(icon);
    }
    titleEl.querySelector('.fold-icon').textContent = shouldCollapse ? '▸' : '▾';
  }

  function __refreshAllCollapsibleCards(){
    if(window.innerWidth > 760) return;
    document.querySelectorAll('.hud-frame.card').forEach(__applyCollapseToCard);
  }

  document.addEventListener('click', function(e){
    if(window.innerWidth > 760) return;
    if(e.target.closest('button, a, input, select, textarea, label')) return;
    const titleEl = e.target.closest('.section-title');
    if(!titleEl) return;
    const card = titleEl.closest('.hud-frame.card');
    if(!card) return;
    // Solo il titolo "principale" (il primo .section-title della card) apre/chiude l'intera scheda,
    // per non interferire con eventuali sotto-titoli interni.
    if(card.querySelector('.section-title') !== titleEl) return;
    const key = __cardTitleKey(card);
    if(!key) return;
    if(__collapsedCardKeys.has(key)) __collapsedCardKeys.delete(key);
    else __collapsedCardKeys.add(key);
    __applyCollapseToCard(card);
  });

  // Le card vengono rigenerate di continuo (polling, cambi tab, ecc.): un MutationObserver
  // leggero riapplica lo stato pieghevole ogni volta che il contenuto cambia, con un piccolo
  // debounce per non lavorare ad ogni singola modifica del DOM.
  let __collapseRefreshTimer = null;
  const __collapseObserver = new MutationObserver(()=>{
    if(__collapseRefreshTimer) return;
    __collapseRefreshTimer = setTimeout(()=>{
      __collapseRefreshTimer = null;
      __refreshAllCollapsibleCards();
    }, 150);
  });
  __collapseObserver.observe(document.body, { childList:true, subtree:true });
  window.addEventListener('resize', __refreshAllCollapsibleCards);

  // ---------- SFX: suono al click (fornito da Rocco, incorporato come data URI) ----------
  // Nessun file esterno da ospitare: il clip è piccolo (pochi KB) ed è incorporato direttamente
  // qui. Uso new Audio() ad ogni click (invece di un singolo elemento riutilizzato) così i click
  // ravvicinati si sovrappongono invece di tagliarsi a vicenda.
  const CLICK_SFX_URL = "https://gsquzfhxgyqrnkrqdivc.supabase.co/storage/v1/object/public/campaign-audio/FRONTIER1/1787070670792_1jktvp.mpeg";
  function __playClickSfx(){
    try{
      if(window.__dvosAudioPrefs && (window.__dvosAudioPrefs.clickMuted || window.__dvosAudioPrefs.musicMuted)) return;
      const a = new Audio(CLICK_SFX_URL);
      a.volume = 0.5;
      a.play().catch(()=>{ /* browser blocca l'audio finché non c'è un gesto utente: fallisce silenziosamente */ });
    }catch(e){}
  }
  // Stesso mute degli altri SFX (clickMuted): il suono di evoluzione è un effetto puntuale come il
  // click, non musica di sottofondo, quindi rispetta lo stesso interruttore invece di uno separato.
  function __playEvolutionSfx(url){
    try{
      if(window.__dvosAudioPrefs && (window.__dvosAudioPrefs.clickMuted || window.__dvosAudioPrefs.musicMuted)) return;
      new Audio(url).play().catch(()=>{});
    }catch(e){}
  }
  document.addEventListener('click', function(e){
    // Niente suono quando si clicca dentro campi di testo (fastidioso mentre si scrive/seleziona).
    if(e.target.closest('input, textarea, select')) return;
    __playClickSfx();
  }, true);

  // ---------- boot ----------
  const restored = loadSession();
  if(restored && restored.code && restored.username){
    session = restored;
    window.__dvosSession = session;
  }
  render();
})();
</script>

<script>
(function(){
  // Qui NON creiamo un elemento audio nuovo: riusiamo #scene-audio-el, gia' esistente e gestito
  // da bindSceneAudio()/getEffectiveMusic() in base alla Scena/Settore/Macroscena attivi. Questo
  // widget aggiunge solo un controllo di Volume/Mute persistito, senza toccare quale traccia suona.
  // window.__dvosAudioPrefs viene letto anche dal suono di click esistente piu' in basso in questo
  // stesso file (vedi guardia aggiunta dentro __playClickSfx).
  const PREFS_KEY = 'dvos_audio_prefs_v1';
  function loadPrefs(){
    try{ return Object.assign({musicVolume:0.5, musicMuted:false, clickMuted:false, notifEnabled:false}, JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')); }
    catch(e){ return {musicVolume:0.5, musicMuted:false, clickMuted:false, notifEnabled:false}; }
  }
  function savePrefs(p){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){} }
  const prefs = loadPrefs();
  window.__dvosAudioPrefs = prefs;

  const musicToggleBtn = document.getElementById('dvos-music-toggle');
  const musicVolumeInp = document.getElementById('dvos-music-volume');
  const clickToggleBtn = document.getElementById('dvos-click-toggle');
  const notifToggleBtn = document.getElementById('dvos-notif-toggle');

  function getMusicEl(){ return document.getElementById('scene-audio-el'); }
  function applyMusicVolume(){
    const musicEl = getMusicEl();
    if(!musicEl) return;
    musicEl.volume = prefs.musicMuted ? 0 : prefs.musicVolume;
    if(prefs.musicMuted && !musicEl.paused) musicEl.pause();
  }
  // ===== Web Push vere (funzionano anche a browser chiuso / telefono bloccato) =====
  // IMPORTANTE: sostituisci questa stringa con la tua VAPID PUBLIC KEY (quella privata non va
  // MAI nel frontend — resta solo nelle variabili d'ambiente di Vercel, letta da log.js).
  const VAPID_PUBLIC_KEY = 'BEK60wRfo25vKGUWeSM8UDUVf4jTKdv1hvkq_aD9zfaNq1gLdd6GAwI0-dh9w4l4ZW2QnuGVoO5glrvnSsduQuk';
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const out = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) out[i] = rawData.charCodeAt(i);
    return out;
  }
  // Registra il Service Worker (se non già attivo) e sottoscrive questo dispositivo/browser alla
  // Web Push, salvando la sottoscrizione lato server (tabella push_subscriptions). Richiede che
  // window.__dvosSession sia già valorizzato (impostato dallo script principale al login/restore) —
  // se manca, la persona non ha ancora fatto login e non c'è nulla a cui associare la sottoscrizione.
  // Ritorna true/false a seconda che sia andata a buon fine, così il campanello sa se può contare
  // sulla push "vera" o deve ripiegare sulla notifica locale (solo scheda aperta).
  async function subscribeToPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    if(!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.indexOf('INSERISCI')===0) return false;
    const sess = window.__dvosSession;
    if(!sess || !sess.code || !sess.username) return false;
    try{
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const resp = await fetch('/api/log?resource=push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: sess.code, username: sess.username, subscription: sub.toJSON() })
      });
      return resp.ok;
    }catch(e){
      return false;
    }
  }
  async function unsubscribeFromPush(){
    if(!('serviceWorker' in navigator)) return;
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(!reg) return;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return;
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await fetch('/api/log?resource=push&endpoint=' + encodeURIComponent(endpoint), { method: 'DELETE' });
    }catch(e){}
  }
  // Notifiche Desktop: mai richieste in automatico — solo quando la persona clicca il campanello.
  // Restano "spente" (anche col permesso del browser già concesso) finché non le si accende qui:
  // il permesso del browser e la preferenza dell'app sono due interruttori separati.
  function notifActive(){
    return prefs.notifEnabled===true && typeof Notification!=='undefined' && Notification.permission==='granted';
  }
  function refreshNotifUI(){
    if(!notifToggleBtn) return;
    if(typeof Notification==='undefined'){ notifToggleBtn.style.display='none'; return; }
    if(Notification.permission==='denied'){
      notifToggleBtn.textContent = '🔕';
      notifToggleBtn.title = 'Notifiche bloccate dal browser — riabilitale dalle impostazioni del sito';
      return;
    }
    notifToggleBtn.textContent = notifActive() ? '🔔' : '🔕';
    notifToggleBtn.title = notifActive()
      ? (window.__dvosPushSubscribed ? 'Notifiche push: attive anche a browser chiuso (clicca per disattivare)' : 'Notifiche attive solo a scheda aperta (clicca per disattivare)')
      : 'Notifiche: disattive (clicca per attivare)';
  }
  function refreshUI(){
    if(musicToggleBtn) musicToggleBtn.textContent = prefs.musicMuted ? '🔇' : '🔊';
    if(musicVolumeInp) musicVolumeInp.value = Math.round(prefs.musicVolume*100);
    if(clickToggleBtn) clickToggleBtn.style.opacity = prefs.clickMuted ? '0.4' : '1';
    applyMusicVolume();
    refreshNotifUI();
  }
  refreshUI();
  // Se le notifiche erano già attive in una sessione precedente (permesso già concesso), ri-sottoscriviamo
  // in automatico al caricamento — silenziosamente, senza chiedere di nuovo il permesso (il browser non lo
  // richiede se è già stato concesso in passato). Se il dispositivo non supporta la Push API vera (es. Safari
  // desktop più vecchi), semplicemente non succede nulla e restano le notifiche locali (solo scheda aperta).
  if(typeof Notification!=='undefined' && Notification.permission==='granted' && prefs.notifEnabled===true){
    subscribeToPush().then(ok=>{ window.__dvosPushSubscribed = ok; refreshNotifUI(); });
  }
  // La musica di scena viene (ri)assegnata dinamicamente da bindSceneAudio() ad ogni refresh: il
  // volume va quindi riapplicato periodicamente, non solo al primo caricamento della pagina.
  setInterval(applyMusicVolume, 2000);

  if(musicToggleBtn) musicToggleBtn.onclick = ()=>{
    prefs.musicMuted = !prefs.musicMuted;
    savePrefs(prefs);
    refreshUI();
    const musicEl = getMusicEl();
    if(!prefs.musicMuted && musicEl && musicEl.paused && musicEl.src) musicEl.play().catch(()=>{});
  };
  if(musicVolumeInp) musicVolumeInp.oninput = ()=>{
    prefs.musicVolume = Number(musicVolumeInp.value)/100;
    if(prefs.musicVolume>0) prefs.musicMuted = false;
    savePrefs(prefs);
    refreshUI();
  };
  if(clickToggleBtn) clickToggleBtn.onclick = ()=>{
    prefs.clickMuted = !prefs.clickMuted;
    savePrefs(prefs);
    refreshUI();
  };
  if(notifToggleBtn) notifToggleBtn.onclick = async ()=>{
    if(typeof Notification==='undefined') return;
    if(Notification.permission==='denied'){ refreshNotifUI(); return; } // bloccate dal browser, nulla da fare qui
    if(Notification.permission!=='granted'){
      // Il permesso viene chiesto SOLO qui, dentro un click esplicito della persona — mai in automatico
      // al caricamento della pagina.
      const perm = await Notification.requestPermission();
      if(perm!=='granted'){ refreshNotifUI(); return; }
      prefs.notifEnabled = true;
    } else {
      prefs.notifEnabled = !prefs.notifEnabled;
    }
    savePrefs(prefs);
    if(prefs.notifEnabled){
      window.__dvosPushSubscribed = await subscribeToPush();
    } else {
      window.__dvosPushSubscribed = false;
      unsubscribeFromPush();
    }
    refreshUI();
  };
  // Esposta al resto della pagina (dentro il ciclo di polling in refreshLiveParts/checkPlayerPrivateUnread/
  // checkMasterPrivateUnread) per mostrare una notifica ISTANTANEA quando arriva un messaggio nuovo, senza
  // aspettare il giro server→push. Se la Web Push vera è attiva (window.__dvosPushSubscribed), la saltiamo
  // qui: altrimenti, a scheda in background, arriverebbero DUE notifiche per lo stesso messaggio — una da
  // qui e una dal Service Worker (sw.js) quando riceve il push. A scheda chiusa questa qui non gira comunque
  // (il codice della pagina non è in esecuzione), quindi in quel caso è solo la push a coprire l'avviso.
  window.__dvosNotify = function(title, body){
    if(!notifActive()) return;
    if(window.__dvosPushSubscribed) return;
    if(document.hasFocus() && !document.hidden) return;
    try{
      const n = new Notification(title, { body: String(body||'').slice(0,140), tag:'dvos-msg' });
      n.onclick = ()=>{ window.focus(); n.close(); };
    }catch(e){}
  };
})();
</script>
<!-- ===== fine Widget Audio Persistente ===== -->
</body>
</html>
