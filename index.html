      '': '',
      pool: 'Nemico molto resistente con DP Pool tra il 10% e il 100% in più della media dei giocatori, investito soprattutto in Wound Boxes/Armor. Colpisce piano ma dura a lungo. Attenzione a non esagerare: un singolo nemico verrà comunque sopraffatto dal numero di Azioni del gruppo.',
      template: 'Un solo Nemico ma con un Turno e un Pool di Ferite separato per ogni giocatore (es. Giocatore 1 ↔ Pool 1): ogni giocatore lo affronta "per conto suo" finché il suo Pool non è esaurito. Il lato debole è che il Boss può occupare un solo spazio alla volta e deve scegliere se restare Ranged, concentrarsi su un bersaglio, o spendere Azioni per spostarsi.',
      tagteam: 'Crea un numero di Digimon nemici pari ai giocatori, tutti considerati "Boss": qualsiasi giocatore può attaccare chiunque di loro (diversamente dal Boss Template). Più lungo da preparare, ma molto efficace per rallentare o fermare l\'intero gruppo.',
      raid: 'Mix dei tre precedenti: +50% DP rispetto alla media giocatori, investito soprattutto in Health; dagli Resistenza (non Immunità) a molti Effetti negativi. Ha una Raid Action a inizio Iniziativa che impiega un round intero per attivarsi: i giocatori possono fare un Check Decipher Intent (Azione Interrupt, TN 10+Stage Boss+Milestone Party) per capirne gli effetti e adattarsi prima che scatti.',
      multistage: 'Il Boss attraversa più Fasi (di solito via Evoluzione o Mode Change), ognuna trattata come un nuovo Combattimento: Recovery Check rapido a ogni cambio fase, si azzerano gli usi "per Combattimento" ma NON si ottengono i benefici di un Riposo. Rendi le prime Fasi più facili delle successive.'
    };
    const bossSel = document.getElementById('eb-bosstype');
    bossSel.addEventListener('change', ()=>{ document.getElementById('eb-bosstype-desc').textContent = bossDescs[bossSel.value] || ''; });
    const recalc = ()=>{
      const baseDp = Number(document.getElementById('eb-basedp').value)||0;
      const diff = Number(document.getElementById('eb-difficulty').value)||0;
      const ms = Number(document.getElementById('eb-milestone').value)||0;
      const ps = Number(document.getElementById('eb-partysize').value)||1;
      const budget = (baseDp + ms*4 + diff) * ps;
      document.getElementById('eb-budget').textContent = budget;
      const enemies = Number(document.getElementById('eb-enemies').value)||1;
      const stagesAbove = Number(document.getElementById('eb-stagesabove').value)||0;
      const spentOnEntry = enemies*10 + enemies*stagesAbove*20;
      const remaining = budget - spentOnEntry;
      const perEnemy = Math.floor(remaining / enemies);
      const resEl = document.getElementById('eb-result');
      resEl.style.color = remaining<0 ? 'var(--danger)' : 'var(--text-mute)';
      resEl.innerHTML = `Costo ingresso Nemici: ${spentOnEntry} DP (10/nemico + 20/Stage sopra il range).<br/>DP Bonus rimanenti da distribuire: <b>${remaining}</b> (~${perEnemy} DP a testa, min. 3 in Health ciascuno).`;
    };
    cardEl.querySelectorAll('input, select').forEach(el=> el.addEventListener('input', recalc));
    recalc();
  }

  // getParticipantBattery spostato in js/combat-engine.js

  // Un Digimon ancora "nell'Uovo" (approved:false) non deve rivelare il nome agli altri Tamer nelle
  // viste di combattimento condivise — solo il Master e il proprietario stesso lo vedono per esteso.
  // p.username collega il partecipante alla sua scheda in cachedRoster; se manca (nemico/NPC) non
  // c'è nulla da nascondere.
  function combatDisplayName(p, isMaster){
    if(!p) return '';
    if(p.nameHidden && !isMaster) return hiddenParticipantLabel(p);
    if(!p.username) return p.name || '';
    if(isMaster || (session && session.username===p.username)) return p.name;
    const member = cachedRoster.find(m=>m.username===p.username);
    if(member && member.digimon && member.digimon.approved===false) return '🥚 (Uovo)';
    if(isDigimonHiddenFromViewer(member)) return '❔ (???)';
    return p.name;
  }

  // Richiesta utente: quando più Digimon nello stesso combattimento condividono lo stesso nome
  // visualizzato (es. più membri di un gruppo con Digimon della stessa specie), soprattutto nel
  // menu di scelta del bersaglio "non si capiva che Digimon si stesse attaccando" (oltre alle
  // barrette vita andrebbe indicato un numerino, come già avviene per "Nemico 1/2/3"). A differenza
  // di p.hiddenLabelNum (assignHiddenLabelNum in js/encounters.js), QUI il numero non è persistito
  // sul partecipante: viene ricalcolato a ogni chiamata in base al testo effettivamente mostrato al
  // viewer corrente (isMaster), sull'ordine stabile di combat.participants -- così resta corretto
  // anche se un Digimon cambia nome a metà combattimento (evoluzione, vedi syncCombatParticipantName)
  // senza bisogno di tenerlo sincronizzato altrove. Nomi già mascherati/nascosti non collidono quasi
  // mai perché hiddenParticipantLabel li numera già diversamente ("❔ Nemico 1" vs "❔ Nemico 2").
  // Ritorna una stringa vuota se il nome di p non è condiviso da nessun altro partecipante visibile
  // allo stesso viewer, altrimenti " #N" (con lo spazio iniziale, pronta da appendere al nome).
  function duplicateNameSuffix(combat, p, isMaster){
    if(!combat || !Array.isArray(combat.participants) || !p) return '';
    const dispName = combatDisplayName(p, isMaster);
    if(!dispName) return '';
    const sameName = combat.participants.filter(x=>combatDisplayName(x, isMaster)===dispName);
    if(sameName.length<2) return '';
    const idx = sameName.indexOf(p);
    return idx>=0 ? ` #${idx+1}` : '';
  }

  // Linea visiva delle 5 posizioni (Molto Corto—Molto Lungo) coi ritratti dei partecipanti piazzati
  // dove si trovano davvero — usa le stesse immagini già mostrate altrove (resolveParticipantImage),
  // niente di nuovo da caricare. Le GIF animate (vedi Wikimon Story Sprites) sono un possibile upgrade
  // futuro: qui la struttura è già pronta, basterebbe sostituire l'URL statico con quello della GIF.
  function zoneLineHTML(combat, isMaster){
    if(!combat.participants || combat.participants.length===0) return '';
    // Le zone sono relative: "Molto Corto"/"Lungo" ecc. non dicono nulla da sole. Quando è il turno
    // di qualcuno, mostriamo sotto ogni posizione la distanza reale da LUI (0 = stessa posizione/Melee
    // ok, 1-2 = dentro Reach corrispondente) — così si vede a colpo d'occhio chi è a tiro.
    const byId = {}; combat.participants.forEach(p=>byId[p.id]=p);
    const activeId = (combat.order && combat.order.length) ? combat.order[combat.currentIndex] : null;
    const active = activeId ? byId[activeId] : null;
    const activeIdx = active ? zoneIndex(active.zone||'Medio') : null;
    return `
      <div style="margin:4px 0 12px 0;padding:10px 6px 4px 6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;">
        ${active ? `<div class="muted" style="font-size:9px;margin-bottom:6px;">Distanza da <b style="color:var(--cyan);">${escapeHTML(combatDisplayName(active, isMaster))}</b> (di turno):</div>` : ''}
        <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-end;">
          <div style="position:absolute;top:14px;left:5%;right:5%;height:2px;background:var(--line);z-index:0;"></div>
          ${ZONES.map((z,zi)=>{
            // Richiesta utente: gli NPC Sconfitti (isPC false, .defeated true -- Master o Nemici in
            // generale, non i PC che invece per regolamento restano in campo retrocessi) spariscono
            // dalla linea dei Range per tutti, Master incluso: non sono più bersagli validi, e la
            // linea resta leggibile senza icone di partecipanti ormai fuori combattimento.
            const here = combat.participants.filter(p=>(p.zone||'Medio')===z && !(!p.isPC && isParticipantDefeated(p)));
            let label = '';
            if(active!==null){
              if(zi===activeIdx) label = `<span style="color:var(--cyan);">★ Qui</span>`;
              else {
                const d = Math.abs(zi-activeIdx);
                label = d<=1 ? `<span style="color:var(--cyan-dim,var(--cyan));">${d} zona</span>` : `<span style="color:var(--amber);">${d} zone</span>`;
              }
            }
            return `
            <div style="display:flex;flex-direction:column;align-items:center;flex:1;z-index:1;min-width:0;">
              <div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:30px;align-items:flex-end;margin-bottom:2px;">
                ${here.map(p=>{
                  const color = p.side==='ally' ? 'var(--cyan)' : 'var(--danger)';
                  const dispName = combatDisplayName(p, isMaster);
                  const isMasked = dispName !== p.name;
                  // Un Incontro con "🎭 Nascondi Nome" nasconde SOLO nome/descrizione: l'immagine
                  // resta visibile (la presenza in Scena è comunque nota) — vedi combatDisplayName.
                  // Le altre forme di mascheramento (Uovo non ancora approvato, Digimon di un
                  // giocatore nascosto al resto del gruppo) continuano a nascondere anche l'immagine,
                  // coerente con come sono già trattate altrove nell'app.
                  const showPortraitDespiteMask = isMasked && !!p.nameHidden && !isMaster;
                  const portrait = (isMasked && !showPortraitDespiteMask)
                    ? `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--text-mute);font-size:14px;">❔</div>`
                    // .portrait-sm ha una dimensione FISSA (36x36) via CSS: senza forzare qui
                    // width/height:100%, l'img si renderizza a 36x36 dentro il contenitore 26x26
                    // (overflow:hidden) e mostra solo l'angolo in alto a sinistra invece di
                    // scalarsi per intero — width/height:100% la fa riempire il contenitore reale.
                    : portraitHTML(resolveParticipantImage(p, true), dispName, 'sm', 'width:100%;height:100%;object-fit:cover;');
                  return `<div title="${escapeAttr(dispName)}" style="width:26px;height:26px;border-radius:6px;overflow:hidden;border:2px solid ${color};box-shadow:0 0 4px rgba(0,0,0,0.4);">${portrait}</div>`;
                }).join('')}
              </div>
              <div style="width:10px;height:10px;border-radius:50%;background:${zi===activeIdx?'var(--cyan)':(here.length?'var(--amber)':'var(--panel)')};border:2px solid var(--line);"></div>
              <div style="font-size:9px;margin-top:2px;text-align:center;white-space:nowrap;">${label}</div>
            </div>
          `;}).join('')}
        </div>
        ${(()=>{
          // Chi può muovere chi è di turno con queste frecce: il Master sempre (qualunque
          // partecipante), il Giocatore SOLO quando è il proprio Digimon ad essere di turno — così
          // sostituiamo, anche su mobile, i meno intuitivi bottoni "Avvicinati/Allontanati" del
          // pannello Attacchi con lo stesso semplice ◀/▶ già usato dal Master.
          const isMyTurnToMove = !isMaster && active && active.isPC && session && session.username===active.username;
          if(!active || !(isMaster || isMyTurnToMove)) return '';
          const moveLabel = isMaster ? escapeHTML(active.name) : 'te stesso';
          return `
          <div class="row" style="margin-top:8px;">
            <button class="btn ghost small" data-zoneline-move="-1" style="flex:1;" ${activeIdx<=0?'disabled':''}>◀ Muovi ${moveLabel} (1 Az.)</button>
            <button class="btn ghost small" data-zoneline-move="1" style="flex:1;" ${activeIdx>=ZONES.length-1?'disabled':''}>Muovi ${moveLabel} (1 Az.) ▶</button>
          </div>
          <div id="zoneline-move-status" class="muted" style="font-size:10px;margin-top:2px;min-height:12px;"></div>
          `;
        })()}
        ${here_multi_note(combat)}
      </div>
    `;
  }
  // Lega le frecce sotto la linea al Digimon di cui è il turno — sposta di 1 pallino nella direzione
  // scelta, spendendo 1 Azione. Va richiamata ogni volta che #combat-live viene ridisegnato, sia per
  // il Master (può sempre muovere chi è di turno) sia per il Giocatore (solo nel proprio turno —
  // vedi il guard qui sotto, che rispecchia la condizione con cui zoneLineHTML genera i bottoni).
  function bindZoneLineArrows(code, players){
    document.querySelectorAll('[data-zoneline-move]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!cachedCombat || !cachedCombat.active || !cachedCombat.order || !cachedCombat.order.length) return;
        const p = cachedCombat.participants.find(x=>x.id===cachedCombat.order[cachedCombat.currentIndex]);
        const statusEl = document.getElementById('zoneline-move-status');
        if(!p) return;
        const isMasterNow = !!(session && session.role==='master');
        // Guardia lato client (oltre a quella che già nasconde il bottone): un Giocatore può
        // muovere solo il proprio Digimon, e solo quando è davvero il suo turno.
        if(!isMasterNow && !(p.isPC && session && session.username===p.username)){
          if(statusEl){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Non è il tuo turno.'; }
          return;
        }
        // Guardia anti-doppio-tap: vedi combatActionPending presso saveCombat — un secondo tap
        // mentre il salvataggio precedente è ancora in corso non deve spendere una seconda Azione.
        if(combatActionPending){
          if(statusEl){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Spostamento precedente ancora in salvataggio, attendi un istante e riprova.'; }
          return;
        }
        const dir = Number(btn.getAttribute('data-zoneline-move'));
        const newZone = zoneStepDirection(p.zone||'Medio', dir);
        if(!newZone){ if(statusEl){ statusEl.style.color='var(--danger)'; statusEl.textContent = `${p.name} è già al limite della linea.`; } return; }
        const result = trySpendAction(p, 'move');
        if(!result.ok){ if(statusEl){ statusEl.style.color='var(--danger)'; statusEl.textContent = result.msg; } return; }
        const from = p.zone||'Medio';
        const prevActions = p.actions;
        p.zone = newZone;
        const moveDispName = p.nameHidden ? hiddenParticipantLabel(p) : p.name;
        // saveCombat può fallire (rete, o conflitto con un salvataggio concorrente) — se succede,
        // annulliamo la mutazione locale invece di narrare/mostrare uno spostamento che sul server
        // non è mai stato salvato (stesso bugfix già applicato al vecchio doMove del Giocatore).
        const ok = await saveCombat(code, cachedCombat);
        if(!ok){
          p.zone = from;
          p.actions = prevActions;
          if(statusEl){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Spostamento non salvato (errore di rete o conflitto con un\'altra azione in corso) — riprova.'; }
          return;
        }
        // Stesso schema degli attacchi: frase di base subito visibile, dettaglio tecnico (zona di
        // partenza/arrivo, Azioni residue) dietro ::TECH::, poi eventualmente sostituita dalla
        // narrazione AI (narrateMovement) se arriva in tempo.
        const moveBaseNarr = `${moveDispName} si sposta verso ${zoneLabel(newZone)}.`;
        const moveTechDetail = result.freeReposition
          ? `${zoneLabel(from)} → ${zoneLabel(newZone)} (gratuito: Reposition) — restano ${p.actions}/2 Azioni.`
          : `${zoneLabel(from)} → ${zoneLabel(newZone)} (1 Azione) — restano ${p.actions}/2 Azioni.`;
        const movePushed = await pushCombatNarration(cachedCombat, { who: narratorName(p), role: isMasterNow?'gm':'player', text: `${moveBaseNarr}::TECH::${moveTechDetail}`, meta:{ avatar: resolveParticipantImage(p) } });
        const moveEntryId = movePushed && movePushed.entry && movePushed.entry.id;
        const combatLive = document.getElementById('combat-live');
        // isMasterNow, non un `true` fisso: questa stessa funzione ora è richiamata anche dal
        // Giocatore (vedi sopra) — un `true` fisso qui smascererebbe a lui i nomi/Digimon nascosti
        // ad ogni suo stesso spostamento (stesso bug già corretto altrove in advanceCombatTurn).
        if(combatLive) combatLive.innerHTML = combatDisplayHTML(cachedCombat, isMasterNow);
        bindZoneLineArrows(code, players);
        if(typeof renderCombatManager==='function' && document.getElementById('combat-mgr-card')) renderCombatManager(code, players);
        if(!p.nameHidden){
          const moveNarrTimeout = new Promise(resolve=>setTimeout(()=>resolve(null), AI_NARRATION_TIMEOUT_MS));
          Promise.race([narrateMovement(p, from, newZone), moveNarrTimeout]).then(async (narrLine)=>{
            if(!narrLine || !moveEntryId) return;
            await editLogEntry(code, moveEntryId, `${narrLine}::TECH::${moveTechDetail}`, combatNarrationThread(cachedCombat));
            refreshLiveParts();
          });
        }
      };
    });
  }
  function here_multi_note(combat){
    // Se più partecipanti condividono una posizione, lo segnaliamo esplicitamente: un Attacco ad Area
    // (o T:BLAST/T:CONE) su quel punto della linea colpisce tutti loro insieme.
    const counts = {};
    combat.participants.forEach(p=>{ const z=p.zone||'Medio'; counts[z]=(counts[z]||0)+1; });
    const shared = Object.entries(counts).filter(([z,n])=>n>1);
    if(shared.length===0) return '';
    return `<div class="muted" style="font-size:9px;margin-top:6px;">🌪 ${shared.map(([z,n])=>`${n} Digimon in ${zoneLabel(z)}`).join(' · ')} — un Attacco ad Area lì li colpirebbe tutti insieme.</div>`;
  }


  function combatDisplayHTML(combat, isMaster){
    if(!combat || !combat.active) return '<div class="muted">Nessun combattimento in corso.</div>';
    // Assegna etichette stabili anche lato giocatore (nel caso non sia passato da renderCombatManager)
    (combat.participants||[]).forEach(p => assignHiddenLabelNum(combat, p));
    const byId = {};
    combat.participants.forEach(p=>byId[p.id]=p);
    const orderList = (combat.order||[]).map(id=>byId[id]).filter(Boolean);
    const activeP = orderList[combat.currentIndex] || null;
    const timer = combatTurnTimerLabel(combat);
    return `
      <div class="flex-between" style="margin-bottom:8px;">
        <span class="mono" style="color:var(--cyan);">ROUND ${combat.round}</span>
      </div>
      ${combat.chatLock ? `<div class="muted" style="margin-bottom:6px;font-size:11px;">🔒 Chat bloccata per i giocatori: <b>${escapeHTML(combatChatLockLabel(combat.chatLock.location))}</b> — si sblocca da sola a fine combattimento.</div>` : ''}
      ${timer && activeP ? `<div class="muted" style="margin-bottom:8px;font-size:11px;${timer.expired?'color:var(--danger);':''}">⏳ Turno di <b>${escapeHTML(combatDisplayName(activeP, isMaster))}</b>: ${timer.expired ? `scaduto da ${escapeHTML(timer.overText)} — ${isMaster?'puoi agire tu al posto suo dalla Gestione Combattimento qui sotto':'il Master può ormai agire al posto tuo'}.` : `${escapeHTML(timer.text)} rimasti prima che il Master possa agire al posto suo.`}</div>` : ''}
      ${zoneLineHTML(combat, !!isMaster)}
      ${orderList.length===0 ? '<div class="muted">Ordine non ancora calcolato.</div>' : orderList.map((p,i)=>{
        // Richiesta utente: gli NPC Sconfitti spariscono dalla fase di Battaglia, ma SOLO lato
        // Giocatore -- il Master deve continuare a vederli (es. per "Ripristina Sconfitta" più sotto
        // nella Gestione Combattimento, o per gestirli a mano). Il ritorno di stringa vuota (invece
        // di filtrare l'array PRIMA della map) mantiene l'indice i allineato a combat.currentIndex,
        // usato subito sotto per evidenziare chi è di turno -- filtrare prima avrebbe spostato gli
        // indici e rotto l'evidenziazione del turno attivo.
        if(!isMaster && !p.isPC && isParticipantDefeated(p)) return '';
        const wounds = getParticipantWounds(p);
        const battery = getParticipantBattery(p);
        const dispName = combatDisplayName(p, isMaster);
        // Richiesta utente: un numerino accanto al nome (vicino alla barretta vita) per distinguere
        // Digimon con lo stesso nome nello stesso combattimento — vedi duplicateNameSuffix.
        const dupSuffix = duplicateNameSuffix(combat, p, isMaster);
        return `
        <div style="padding:6px 8px;margin-bottom:4px;border-radius:4px;${i===combat.currentIndex?'background:rgba(53,232,201,0.15);border:1px solid var(--cyan);':'background:var(--panel-2);border:1px solid var(--line);'}${p.side==='enemy'?'border-left:3px solid var(--danger);':''}">
          <div class="flex-between">
            <span>${i===combat.currentIndex?'▶ ':''}<b>${escapeHTML(dispName)}</b>${dupSuffix?`<span class="mono" style="color:var(--amber);">${escapeHTML(dupSuffix)}</span>`:''} <span class="tag" style="margin-left:4px;color:${p.side==='ally'?'var(--cyan)':'var(--danger)'};border-color:${p.side==='ally'?'var(--cyan-dim)':'rgba(255,93,93,0.4)'};">${p.side==='ally'?'Alleato':'Nemico'}</span></span>
            <span class="mono">Iniz. ${p.initiative} · Az.Dig ${p.actions===undefined?2:p.actions}/2 · Az.Tam ${p.tamerActions===undefined?2:p.tamerActions}/2 · <span style="color:var(--amber);">${zoneLabel(p.zone||'Medio')}</span></span>
          </div>
          ${miniHpBarHTML(wounds.current, wounds.max, wounds.temp, 'HP')}
          ${battery ? `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;"><span class="hp-mini-label">⚡</span>${batteryCellsHTML(battery.current, battery.max, true)}<span class="hp-mini-val">${battery.current}/${battery.max}</span></div>` : ''}
          ${p.effects && p.effects.length ? `<div style="margin-top:4px;">${effectTagsHTML(p)}</div>` : ''}
          ${p.clashWith ? `<div class="muted" style="margin-top:4px;">🤼 In Clash con ${escapeHTML(combatDisplayName(byId[p.clashWith]||{}, isMaster))} — ${p.clashController?'<b style="color:var(--cyan);">controlla</b>':'sotto controllo'}</div>` : ''}
        </div>
      `;}).join('')}
    `;
  }
  // dexEditOpenId spostata in js/dex-admin.js

  // ---------- session persistence ----------
  function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function loadSession(){ try{ const v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

  // ---------- API helpers ----------
  // apiGet/apiPost/apiPut/apiDelete e la variabile lastApiError sono state spostate in
  // js/api.js: sono le uniche 4 funzioni del vecchio blocco "API helpers" a non leggere
  // nessuna variabile privata di questa closure (session, cachedScene, currentLocationKey...),
  // quindi puo' viverci fuori senza problemi -- tutti i wrapper (getRoster, pushLog, ecc. qui
  // sotto) restano invece dentro index.html perche' quelle variabili le usano davvero, e sono
  // private a questa IIFE. lastApiError resta leggibile come prima ovunque nel file (catena
  // di scope fino al globale dichiarato in api.js), solo non e' piu' dichiarata qui.
  // (uploadChatImage, chatAttachHTML, bindChatAttach) spostati in js/chat-composer.js
  // apiPut/apiDelete sono state spostate in js/api.js insieme a apiGet/apiPost e lastApiError

  async function getRoster(code){ const d = await apiGet('/api/roster?code=' + encodeURIComponent(code)); return d ? (d.members||[]) : []; }

  async function getScene(code){
    const d = await apiGet('/api/state?resource=scene&code=' + encodeURIComponent(code));
    const s = d ? d.scene : { title:'', background:'', music:'', encounters:[] };
    if(!Array.isArray(s.encounters)) s.encounters = [];
    s.encounters = s.encounters.map(normalizeEncounter);
    if(!s.id) s.id = 'scene'+Date.now()+Math.random().toString(36).slice(2,6);
    if(!Array.isArray(s.macroScenes)){
      // Migra la vecchia struttura piatta "sectors" in una Macroscena di default, se presente
      const legacySectors = Array.isArray(s.sectors) ? s.sectors.map(sec=>({ ...sec, luoghi: sec.luoghi||[] })) : [];
      s.macroScenes = legacySectors.length>0 ? [{ id:'ms'+Date.now(), name:'Macroscena Principale', description:'', sectors: legacySectors }] : [];
      s.currentMacroSceneId = s.macroScenes.length>0 ? s.macroScenes[0].id : null;
      delete s.sectors;
    }
    if(s.currentMacroSceneId===undefined) s.currentMacroSceneId = null;
    if(s.currentSectorId===undefined) s.currentSectorId = null;
    if(s.currentLuogoId===undefined) s.currentLuogoId = null;
    return s;
  }

  // ---------- Dado generico GDR (qualsiasi NdX±M, usabile da tutte le chat) ----------
  // Accetta: "2d6", "1d20+3", "4d8-1", "d12", "3d10+2d4", "2d6+1d8+5", "/roll 2d20", ecc.
  // Ritorna null se il testo non è un comando dado. Se lo è, ritorna { text, allDice, total }.
  function parseGenericDiceRoll(raw){
    let input = raw.trim();
    // Accetta prefisso opzionale /roll o /r
    if(/^\/r(oll)?\s/i.test(input)) input = input.replace(/^\/r(oll)?\s+/i, '').trim();
    // Deve contenere almeno un NdX
    if(!/\d*d\d+/i.test(input)) return null;
    // Rimuovi spazi per la validazione
    const clean = input.replace(/\s+/g, '');
    // Verifica che l'intera stringa sia una formula dado valida (NdX, +, -, numeri)
    if(!/^\d*d\d+([+\-]\d*d?\d+)*$/i.test(clean)) return null;
    // Splitta i token: ogni +/- inizia un nuovo token
    const tokens = clean.match(/[+\-]?[^+\-]+/g) || [];
    let total = 0;
    const allDice = []; // {sides, results[]}
    const parts = []; // stringhe descrittive
    for(const tok of tokens){
      const sign = tok.startsWith('-') ? -1 : 1;
      const abs = tok.replace(/^[+\-]/, '');
      const diceMatch = abs.match(/^(\d*)d(\d+)$/i);
      if(diceMatch){
        const count = Math.min(Number(diceMatch[1] || 1), 100); // cap a 100 dadi
        const sides = Math.min(Number(diceMatch[2]), 1000);
        if(count < 1 || sides < 1) return null;
        const results = [];
        for(let i=0; i<count; i++){
          const r = Math.floor(Math.random()*sides)+1;
          results.push(r);
          total += r * sign;
        }
        allDice.push({ sides, results, sign });
        parts.push(`${sign<0?'-':''}${count}d${sides}[${results.join(',')}]`);
      } else {
        const num = Number(abs);
        if(isNaN(num)) return null;
        total += num * sign;
        parts.push(`${sign<0?'-':'+'}${num}`);
      }
    }
    // Formatta testo: "2d6[3,5]+1d8[7]+3 = 18"
    let desc = parts.join('');
    if(desc.startsWith('+')) desc = desc.slice(1);
    return { text: `🎲 ${desc} = ${total}`, allDice, total };
  }

  // ---------- Pannello Dadi UI (bottoni per ogni tipo di dado GDR) ----------
  const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
  // Mappa emoji facce d6 (stesse di DIE_FACES in js/dice.js); per gli altri dadi usa il numero.
  const D6_FACES = ['','⚀','⚁','⚂','⚃','⚄','⚅'];

  function genericDiceRowHTML(results, sides){
    // Replica la stessa animazione 3D dei d6 (classe .die3d con @keyframes diceroll)
    // Per i d6 usa le emoji facce, per gli altri mostra il numero stilizzato.
    return `<span class="dice-perspective">${results.map((r,i)=>{
      const delay = i * 0.08;
      const face = (sides===6 && D6_FACES[r]) ? D6_FACES[r] : r;
      const style = `animation-delay:${delay}s;${sides!==6?'font-size:20px;min-width:26px;text-align:center;':''}`;
      return `<span class="die3d" style="${style}">${face}</span>`;
    }).join('')}</span>`;
  }

          <div id="${panelId}-error" style="margin-top:2px;font-size:11px;color:var(--danger);"></div>
        </div>
      </details>
    `;
    let selectedSides = null;
    el.querySelectorAll('.dice-btn').forEach(btn=>{
      btn.onclick = ()=>{
        el.querySelectorAll('.dice-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectedSides = Number(btn.getAttribute('data-dice-sides'));
      };
    });
    document.getElementById(panelId+'-go').onclick = ()=>{
      const errEl = document.getElementById(panelId+'-error');
      const resEl = document.getElementById(panelId+'-result');
      errEl.textContent = '';
      if(!selectedSides){ errEl.textContent = 'Seleziona un tipo di dado.'; return; }
      const qty = Math.max(1, Math.min(100, Number(document.getElementById(panelId+'-qty').value)||1));
      const modRaw = (document.getElementById(panelId+'-mod').value||'').trim();
      let mod = 0;
      if(modRaw){
        mod = parseInt(modRaw.replace(/^\+/, ''), 10);
        if(isNaN(mod)){ errEl.textContent = 'Modificatore non valido (es. +3 o -1).'; return; }
      }
      const results = [];
      let total = 0;
      for(let i=0; i<qty; i++){
        const r = Math.floor(Math.random()*selectedSides)+1;
        results.push(r);
        total += r;
      }
      total += mod;
      const modStr = mod > 0 ? `+${mod}` : (mod < 0 ? `${mod}` : '');
      const rollText = `🎲 ${qty}d${selectedSides}[${results.join(',')}]${modStr} = ${total}`;
      // Animazione 3D
      resEl.innerHTML = `${genericDiceRowHTML(results, selectedSides)}<span class="roll-total">${total}</span>`;
      sendDiceRollToChat(panelId, rollText);
    };

  async function sendDiceRollToChat(panelId, rollText){
    const errEl = document.getElementById(panelId+'-error');
    try{
      const code = session.code;
      if(panelId==='dice-panel-player'){
        const me = cachedMe || (cachedRoster||[]).find(m=>m.username===session.username);
        const who = me ? displayName(me) : session.username;
        const entry = { who, role:'roll', text: rollText };
        if(playerChatMode==='subgroup' && playerActiveSubgroupId){
          const group = (cachedSubgroups||[]).find(g=>g.id===playerActiveSubgroupId) || null;
          entry.meta = { location: subgroupLocationKey(group) };
          await pushPrivateLog(code, 'subgroup:'+playerActiveSubgroupId, entry);
        } else if(playerChatMode==='private'){
          entry.meta = { location: memberLocationKey(me) };
          await pushPrivateLog(code, session.username, entry);
        } else {
          await pushLog(code, entry);
        }
      } else {
        // Master — segue il tab chat attualmente selezionato (Generale/Privata/Sottogruppo)
        const entry = { who:'Master', role:'roll', text: rollText };
        if(typeof masterChatMode!=='undefined' && masterChatMode==='private' && masterPrivateThread){
          await pushPrivateLog(code, masterPrivateThread, entry);
        } else if(typeof masterChatMode!=='undefined' && masterChatMode==='subgroup' && typeof activeSubgroupId!=='undefined' && activeSubgroupId){
          const group = (cachedSubgroups||[]).find(g=>g.id===activeSubgroupId) || null;
          entry.meta = { location: subgroupLocationKey(group) };
          await pushPrivateLog(code, 'subgroup:'+activeSubgroupId, entry);
        } else {
          await pushLog(code, entry);
        }
      }
      refreshLiveParts();
    } catch(e){
      if(errEl) errEl.textContent = 'Errore invio: ' + e.message;
    }
  }

  function normalizeMember(m){
    const hadPriorTamer = !!(m.tamer && typeof m.tamer.built === 'undefined' && Object.keys(m.tamer).length>0);
    m.tamer = Object.assign(defaultTamer(), m.tamer||{});
    if(hadPriorTamer) m.tamer.built = true; // scheda pre-esistente creata prima di questo flag: non è "vuota"
    if(!m.tamer.skills) m.tamer.skills = defaultSkills();
    m.tamer.skills = Object.assign(defaultSkills(), m.tamer.skills);
    if(m.tamer._legacyEndurance===undefined && m.tamer.endurance!==undefined && !m.tamer.skills.endurance){
      m.tamer.skills.endurance = Number(m.tamer.endurance)||0;
    }
    if(m.tamer.currentWounds===null || m.tamer.currentWounds===undefined) m.tamer.currentWounds = 3+Number(m.tamer.skills.endurance||0);
    if(!Array.isArray(m.tamer.inventory)) m.tamer.inventory = [];
    m.digimon = Object.assign(defaultDigimon(), m.digimon||{});
    if(!m.digimon.attacks || !m.digimon.attacks.length) m.digimon.attacks = defaultDigimon().attacks;
    if(!Array.isArray(m.digimon.unlockedEvolutions)) m.digimon.unlockedEvolutions = [];
    return m;
  }

  function waitForElement(id, maxWaitMs){

  // Pallino "non letto" generico su un bottone della segmented control (usato sia per la Chat
  // Privata sia per i Sottogruppi).
  function updateChatBadge(btnId, forceUnread){
    const btn = document.getElementById(btnId);
    if(!btn) return;
    let badge = btn.querySelector('.unread-dot');
    const show = forceUnread===true;
    if(show && !badge){
      badge = document.createElement('span');
      badge.className = 'unread-dot';
      badge.style.cssText = 'display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:5px;';
      btn.appendChild(badge);
    } else if(!show && badge){
      badge.remove();
    }
  }
  // Sottogruppi a cui appartiene il giocatore corrente. Legge da cachedSubgroups (popolata dal
  // server via refreshLiveParts ad ogni poll — vedi sotto), non più da localStorage: così
  // funziona anche su un dispositivo diverso da quello del Master. Struttura: [{ id, name, members:[] }]
  function getMySubgroups(code, username){
    return (cachedSubgroups||[]).filter(g=>Array.isArray(g.members) && g.members.includes(username));
  }

  function updateChatModeButtons(){
    // Sync segmented control
    document.querySelectorAll('#player-chat-seg .chat-seg-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.chatmode===playerChatMode);
    });
    const hint = document.getElementById('action-hint');
    if(hint) hint.style.display = (playerChatMode==='private' || playerChatMode==='subgroup') ? 'none' : 'block';
    // Mostra/nascondi bottone sottogruppi
    if(session){
      const myGroups = getMySubgroups(session.code, session.username);
      const segSubBtn = document.getElementById('seg-subgroup-btn');
      if(segSubBtn) segSubBtn.style.display = myGroups.length>0 ? '' : 'none';
      const subWrap = document.getElementById('player-subgroup-select-wrap');
      if(subWrap) subWrap.style.display = playerChatMode==='subgroup' ? '' : 'none';
      ensurePlayerSubgroupPicker(session.code);
    }
  }

  // Crea/aggiorna il selettore "quale sottogruppo sto guardando" e mantiene playerActiveSubgroupId
  // valido. PRIMA questa logica girava una volta sola, dentro il bind iniziale di renderPlayer():
  // se in quel momento cachedSubgroups era ancora vuota (praticamente sempre, dato che si popola
  // solo al primo giro di polling DOPO il render), playerActiveSubgroupId restava null per
  // sempre. Risultato: aprendo "👥 Gruppo" con playerActiveSubgroupId null, renderChatArea non
  // trovava le condizioni per il ramo "sottogruppo" e mostrava per sbaglio la Chat Generale (da
  // qui "leggo solo gli stessi messaggi") — e siccome quel ramo non veniva mai eseguito, il
  // thread non veniva mai segnato come letto (da qui il pallino rosso che restava acceso anche
  // dopo aver aperto la chat). Ora questa funzione gira ad ogni updateChatModeButtons(), quindi
  // anche ad ogni ciclo di polling: appena i sottogruppi arrivano dal server, la selezione si
  // aggiusta da sola.
  function ensurePlayerSubgroupPicker(code){
    if(!session) return;
    const wrap = document.getElementById('player-subgroup-select-wrap');
    if(!wrap) return;
    const myGroups = getMySubgroups(code, session.username);
    // Se il gruppo attivo non esiste più (es. eliminato dal Master) o non è mai stato scelto,
    // ripiega sul primo disponibile.
    if(!playerActiveSubgroupId || !myGroups.some(g=>g.id===playerActiveSubgroupId)){
      playerActiveSubgroupId = myGroups.length>0 ? myGroups[0].id : null;
    }
    if(myGroups.length===0){
      wrap.innerHTML = '';
      return;
    }
    let subSel = document.getElementById('player-subgroup-select');
    if(!subSel){
      wrap.innerHTML = `<select id="player-subgroup-select" style="width:100%;font-size:12px;"></select>`;
      subSel = document.getElementById('player-subgroup-select');
    }
    subSel.innerHTML = myGroups.map(g=>`<option value="${escapeAttr(g.id)}" ${g.id===playerActiveSubgroupId?'selected':''}>${escapeHTML(g.name)}</option>`).join('');
    subSel.onchange = async ()=>{
      playerActiveSubgroupId = subSel.value;
      await refreshPlayerLogDisplay(code, cachedMe);
    };
  }

  // Disegna insieme il selettore "Storico per Settore" (con le opzioni ricavate dal thread
  // attualmente aperto) e il Registro sottostante, per QUALSIASI delle tre chat del giocatore
  // (Generale/Privata/Gruppo) — sono condivisi lo stesso #chat-location-bar e #log-live, cambia
  // solo quale log/filtro sta guardando in quel momento in base a playerChatMode.
  async function renderChatArea(code, me, opts){
    opts = opts || {};
    if(!session) return;
    // BUGFIX (segnalato dall'utente: "la risposta ai messaggi da telefono sembra non funzionare
    // lato giocatori"): vedi lastLogTapAt/ensureCombatUiTapListener più sotto nel file. Le chiamate
    // dirette (invio messaggio, cambio filtro location, cambio modalità chat) passano sempre
    // { forceScrollBottom:true } e devono sempre eseguire; il refresh PASSIVO di sfondo
    // (refreshLiveParts, senza opts) invece salta la ricostruzione di #log-live se c'è stato un
    // tap/tocco recente al suo interno, per non distruggere il bottone che il giocatore sta
    // ancora toccando (↩ Rispondi, ✎, ✕, 🎲 Tira ora, voto spostamento, Evolvi ora...). Il prossimo
    // giro di polling (pochi secondi dopo) ridisegna comunque il log con i dati aggiornati.
    if(!opts.forceScrollBottom && (Date.now() - lastLogTapAt) < 2500) return;
    let raw, filterVal, thread = null;
    // "Chiave attuale" da usare per il filtro/tag: per Privata/Sottogruppo NON è la posizione
    // del gruppo intero (currentLocationKey), ma quella effettiva di chi partecipa — altrimenti
    // il filtro "Storico per Settore" restava ancorato al gruppo anche per chi si era separato.
    let effectiveKey;
    if(playerChatMode==='subgroup' && playerActiveSubgroupId){
      thread = 'subgroup:'+playerActiveSubgroupId;
      raw = await getPrivateLog(code, thread);
      filterVal = subgroupLocationFilter[playerActiveSubgroupId];
      if(filterVal===undefined) filterVal = null;
      effectiveKey = subgroupLocationKey((cachedSubgroups||[]).find(g=>g.id===playerActiveSubgroupId));
    } else if(playerChatMode==='private'){
      thread = session.username;
      raw = await getPrivateLog(code, thread);
      filterVal = privateLocationFilter;
      effectiveKey = memberLocationKey(me);
    } else {
      raw = scenePublicRawLog();
      filterVal = publicLocationFilter;
      effectiveKey = currentLocationKey();
    }
    // BUGFIX (segnalato da Rocco: "il tasto Sì andiamo... non sposta i giocatori"): esponiamo
    // qui il thread/log EFFETTIVAMENTE mostrati in questo momento (vedi playerActiveChatThread/
    // playerActiveChatLog in js/chat-log-engine.js) così attachLogModeration può ritrovare i
    // messaggi di Privata/Sottogruppo al momento del click sul voto di spostamento, invece di
    // cercarli sempre in cachedLog (solo Chat Generale) come succedeva prima.
    playerActiveChatThread = thread;
    playerActiveChatLog = raw;
    const filtered = filterByLocation(raw, filterVal, effectiveKey);
    const logLive = document.getElementById('log-live');
    if(logLive){
      const wasAtBottom = logLive.scrollHeight - logLive.scrollTop <= logLive.clientHeight + 40;
      logLive.innerHTML = logHTML(filtered, false);
      if(opts.forceScrollBottom || wasAtBottom) logLive.scrollTop = logLive.scrollHeight;
    }
    const barWrap = document.getElementById('chat-location-bar');
    if(barWrap){
      barWrap.innerHTML = `
        ${locationFilterSelectHTML('chat-location-select', raw, effectiveKey, filterVal)}
        <button class="btn ghost small" id="btn-export-chat" style="padding:2px 8px;">⬇️ Esporta</button>
      `;
      const sel = document.getElementById('chat-location-select');
      if(sel) sel.onchange = ()=>{
        const v = sel.value;
        if(playerChatMode==='subgroup' && playerActiveSubgroupId) subgroupLocationFilter[playerActiveSubgroupId] = v;
        else if(playerChatMode==='private') privateLocationFilter = v;
        else publicLocationFilter = v;
        renderChatArea(code, me, { forceScrollBottom:true });
      };
      const exportBtn = document.getElementById('btn-export-chat');
      if(exportBtn) exportBtn.onclick = ()=>{
        const label = sel ? sel.options[sel.selectedIndex].textContent.replace('📍 ','') : currentLocationLabel();
        exportVisibleLogAsText(filtered, label);
      };
    }
    if(playerChatMode==='private'){
      markPrivateThreadRead(code, session.username, raw);
      updateChatBadge('chatmode-private', false);
    } else if(playerChatMode==='subgroup' && playerActiveSubgroupId){
      markPrivateThreadRead(code, thread, raw);
      checkPlayerSubgroupsUnread();
    }
  }

  async function refreshPlayerLogDisplay(code, me){
    updateChatModeButtons();
    await renderChatArea(code, me, { forceScrollBottom:true });
  }

  // onlineSummary spostata in js/scene-encounters.js

  // Settore "effettivo" di un membro: se non si è mai separato dal gruppo (currentSectorId nullo)
  // segue semplicemente il Settore attuale della Scena; altrimenti resta dove si è spostato da solo
  // finché il Master non lo fa "Rientrare nel gruppo" o non sposta l'intero gruppo (che resetta tutti).
  // Luogo "effettivo" di un membro: se ha un Settore proprio (spostato singolarmente col pannello
  // "Posizione dei giocatori", ANCHE se quel Settore coincide per coincidenza con quello attuale
  // del gruppo) non eredita mai il Luogo di gruppo in automatico — altrimenti un giocatore mandato
  // deliberatamente "solo nel Settore, nessun Luogo" si ritroverebbe comunque nel Luogo che il
  // gruppo sta guardando in quel momento, cosa che il Master non ha scelto. Eredita il Luogo di
  // gruppo SOLO chi non è mai stato spostato singolarmente (nessun Settore proprio: sta seguendo
  // il gruppo in tutto e per tutto).
  // DIAGNOSI 28/08/2026: Chat Privata e Sottogruppi taggavano SEMPRE i messaggi con
  // currentLocationKey() (la posizione dell'INTERO gruppo sulla Scena), anche quando il
  // destinatario/i membri del sottogruppo si erano separati dal gruppo verso un altro Settore.
  // Risultato: due giocatori realmente nella stessa zona in un sottogruppo non venivano mai
  // "riconosciuti" come tali dal filtro "Storico per Settore", che restava ancorato alla
  // posizione del gruppo principale. Queste due funzioni calcolano la chiave usando invece la
  // posizione EFFETTIVA (memberEffectiveSectorId/LuogoId) di chi partecipa alla conversazione.
  // Per un Sottogruppo usiamo la posizione effettiva del primo membro come riferimento: un
  // Sottogruppo esiste per far parlare tra loro persone che si presume trovarsi nello stesso
  // posto, quindi non gestiamo il caso limite (raro, e comunque non peggiore di prima) di membri
  // finiti in Settori diversi tra loro.
  // Un Digimon del roster segnato "hiddenFromParty" resta visibile SOLO a Master e proprietario —
  // serve a coprire il tempo tra la creazione/evoluzione di un Digimon e il momento in cui il Master
  // vuole rivelarlo narrativamente al resto del gruppo (es. un Digitama che si schiude prima degli altri).
  // Cerca un Settore per id in TUTTE le Macroscene (non solo quella attiva), utile per mostrare
  // dove si trova un membro anche se il Master sta guardando una Macroscena diversa in quel momento.
  // Come sectorNameById/luogoNameById, ma restituisce anche la Macroscena a cui il Settore
  // appartiene — serve a "sceneHTML" per mostrare correttamente la scena di un giocatore separato
  // in una Macroscena diversa da quella attiva per il resto del gruppo (prima si cercava il Settore
  // SOLO dentro la Macroscena attiva, quindi un separato in un'altra Macroscena non vedeva nulla).
  // isDigimonHiddenFromViewer spostata in js/scene-encounters.js

  // ---------- LIVE PARTS (updated by polling, never touch forms) ----------
  // `tick` = numero del ciclo di polling (incrementa ogni 15s, vedi startPolling). Roster/Scena/
  // Log/Avvisi restano aggiornati OGNI ciclo perché sono ciò che rende il gioco "in tempo reale"
  // (posizioni, HP, chat). Digidex/Progressione/Sottogruppi cambiano raramente (il Master li
  // tocca ogni tanto, non ogni pochi secondi): rileggerli ogni 15s per OGNI client connesso era
  // pura banda sprecata sul Fast Origin Transfer di Vercel. Ora si aggiornano ogni 4 cicli (~1
  // minuto) — restano comunque "quasi in tempo reale" per dati che nella pratica non cambiano
  // a quella velocità. Il Combattimento fa eccezione: se è già attivo resta ad ogni ciclo (serve
  // reattività in scontro), altrimenti anche lui scende a 1 su 4.
  //
  // DIAGNOSI 28/08/2026: il Digidex (/api/dex) è però un caso a parte — non un semplice record,
  // ma l'INTERO elenco specie della campagna (~700 righe, oltre 1 MB di JSON). Rileggerlo ogni
  // "slowCycle" (~60s) per OGNI client con index.html aperto (Master + Giocatori) significava
  // ​~1 MB al minuto per client: con più persone connesse durante una sessione, bastavano poche
  // ore per generare diversi GB di traffico — probabilmente la causa principale, più dei bug già
  // risolti sopra, dei consumi eccessivi di egress Supabase e Fast Origin Transfer Vercel. Il
  // Digidex cambia solo quando qualcuno aggiunge/modifica una voce (azione già riflessa subito in
  // cachedDex lato client, vedi addDexEntry/updateDexEntry), quindi non serve rileggerlo spesso:
  // ora si aggiorna ogni 40 cicli (~10 minuti) invece che ogni 4 (~1 minuto), un taglio di banda
  // di circa 10 volte su questa singola voce.
  async function refreshLiveParts(tick){
    if(!session) return;
    const slowCycle = (typeof tick!=='number') || (tick % 4 === 0); // sempre true al primo giro
    const dexCycle = (typeof tick!=='number') || (tick % 40 === 0); // ~10 minuti (era ogni 60s)
    cachedRoster = (await getRoster(session.code)).map(normalizeMember);
    cachedScene = await getScene(session.code);
    cachedLog = await getLog(session.code);
    if(cachedLog.length){
      const myPublicName = session.role==='master' ? 'Master' : displayName(cachedMe || cachedRoster.find(m=>m.username===session.username) || {username:session.username});
      maybeNotifyNew('public', null, cachedLog[cachedLog.length-1], myPublicName);
    }
    if(dexCycle) cachedDex = await getDex(session.code);
    if(dexCycle) cachedNpcs = await getNpcs(session.code);
    // Vedi combatActionPending (definita presso saveCombat): non ri-fetchare/sovrascrivere il
    // combattimento mentre un salvataggio locale è in corso, altrimenti questo poll può clobberare
    // una mutazione non ancora confermata dal server con una copia ancora vecchia (bug "torna
    // indietro da solo").
    if(!combatActionPending && (slowCycle || (cachedCombat && cachedCombat.active))){
      const freshCombat = await getCombat(session.code);
      if(freshCombat && cachedCombat && typeof cachedCombat==='object'){
        // Muta l'oggetto esistente invece di sostituirlo: il Combat Manager del Master
        // tiene riferimenti a cachedCombat dentro le closure dei bottoni (+ Aggiungi, ecc.);
        // se qui lo rimpiazzassimo con un nuovo oggetto, quei bottoni scriverebbero
        // su una copia "orfana" e le modifiche andrebbero perse al salvataggio.
        Object.keys(cachedCombat).forEach(k=>{ delete cachedCombat[k]; });
        Object.assign(cachedCombat, freshCombat);
      } else {
        cachedCombat = freshCombat;
      }
    }
    // Passa turno automatico dopo 5 minuti (richiesta utente): solo per un PC (mai per un Nemico
    // creato dal Master) che ha esaurito ENTRAMBI i pool di Azioni -- vedi trySpendAction, che
    // timbra participant.actionsExhaustedAt nel momento in cui questo succede, e i vari punti che
    // lo azzerano quando l'Azione torna disponibile (bottoni +1 Azione/↺ 2+2, inizio di un nuovo
    // turno). Nessun cron lato server: il controllo gira qui, dentro il polling di ogni client,
    // ogni 15s. Per evitare che più client tentino l'avanzamento in contemporanea (nessun lock
    // reale lato server -- stesso compromesso già accettato altrove, vedi combatActionPending/nota
    // su /api/state in claude/split-status.md) il tentativo è limitato al client del Master e a
    // quello del giocatore di turno stesso: gli unici due punti di vista per cui ha senso che
    // scatti da solo, senza bisogno che sia il Master a intervenire manualmente.
    if(cachedCombat && cachedCombat.active && !combatActionPending){
      const curTurnP = currentTurnParticipant(cachedCombat);
      const iAmMaster = session.role==='master';
      const iAmTurnPlayer = !!(curTurnP && session.role==='player' && curTurnP.isPC && session.username===curTurnP.username);
      if(curTurnP && curTurnP.isPC && curTurnP.actionsExhaustedAt && (iAmMaster || iAmTurnPlayer)){
        const elapsedMs = Date.now() - new Date(curTurnP.actionsExhaustedAt).getTime();
        if(elapsedMs >= 5*60*1000){
          const stuckName = combatDisplayName(curTurnP, false);
          await pushCombatNarration(cachedCombat, { who:'Sistema', role:'gm', text: `⏱ Turno di ${stuckName} passato automaticamente: Azioni esaurite da oltre 5 minuti senza altre azioni.` });
          await advanceCombatTurn(session.code, (cachedRoster||[]).filter(m=>m.role==='player'));
        }
      }
    }
    if(slowCycle) cachedProgression = await getProgression(session.code);
    if(slowCycle){
      cachedGameClock = await getGameClock(session.code);
      refreshGameClockDisplay();
    }
    if(slowCycle){
      cachedSubgroups = await getSubgroups(session.code);
      if(session.role==='player') updateChatModeButtons(); // mostra/nasconde il bottone "👥 Gruppo" appena arrivano sottogruppi nuovi
    }

    // Musica da Combattimento: rilevata qui (non solo nel click di "Inizia Combattimento") perché
    // questa funzione gira per TUTTI i client via polling — così la musica parte anche sui browser
    // dei Giocatori e non solo su quello del Master che ha premuto il bottone. __combatMusicSynced
    // evita di far ripartire la traccia da capo ad ogni poll mentre il combattimento resta attivo.
    if(!!(cachedCombat && cachedCombat.active) !== __combatMusicSynced){
      __combatMusicSynced = !!(cachedCombat && cachedCombat.active);
      if(__combatMusicSynced) startCombatMusic(cachedScene); else stopCombatMusic();
    }

    const sceneLive = document.getElementById('scene-live');
    if(sceneLive){
      const sceneViewer = session.role==='player' ? (cachedRoster.find(m=>m.username===session.username) || cachedMe) : null;
      sceneLive.innerHTML = `<div class="muted mono" style="margin-bottom:8px;">${onlineSummary(cachedRoster)}</div>` + sceneHTML(cachedScene, sceneViewer);
      refreshSceneDaytimeBadge();
    }
    bindSceneAudio(cachedScene);
    if(missionsModalOpen) refreshMissionsModal();
    const sceneLuoghiLive = document.getElementById('scene-luoghi-live');
    if(sceneLuoghiLive){
      sceneLuoghiLive.innerHTML = sceneCurrentSectorLuoghiHTML();
      bindSceneCurrentSectorLuoghi(session.code);
    }
    const logLive = document.getElementById('log-live');
    if(logLive){
      if(session.role==='player'){
        await renderChatArea(session.code, cachedMe);
      } else if((Date.now() - lastLogTapAt) >= 2500){
        // Vedi lastLogTapAt più sotto nel file: stessa guardia anti-race anche qui, per il
        // Registro del Master (ricostruito direttamente, non passa da renderChatArea).
        const wasAtBottom = logLive.scrollHeight - logLive.scrollTop <= logLive.clientHeight + 40;
        logLive.innerHTML = logHTML(sceneLog(), session && session.role==='master');
        if(wasAtBottom) logLive.scrollTop = logLive.scrollHeight;
        refreshLocationSelectOptions(document.getElementById('master-chat-location-select'), scenePublicRawLog(), currentLocationKey(), publicLocationFilter);
      }
    }
    // Controlla in ogni ciclo di polling — indipendentemente da quale chat è aperta in questo
    // momento — se ci sono messaggi privati o di sottogruppo non letti altrove, per accendere
    // i pallini sui bottoni "Privata"/"Gruppo" anche mentre si sta guardando la Chat Generale.
    if(session.role==='player'){
      checkPlayerPrivateUnread();
      checkPlayerSubgroupsUnread();
    }
    if(session.role==='master' && masterChatMode==='private' && masterPrivateThread){
      const privLogLive = document.getElementById('private-log-live-master');
      if(privLogLive){
        const plog = await getPrivateLog(session.code, masterPrivateThread);
        cachedMasterPrivateLog = plog;
        const wasAtBottom = privLogLive.scrollHeight - privLogLive.scrollTop <= privLogLive.clientHeight + 40;
        // Vedi memberLocationKey: la chiave "attuale" per la Chat Privata è quella effettiva del
        // giocatore del thread, non quella del gruppo intero.
        const privKey = memberLocationKey(cachedRoster.find(m=>m.username===masterPrivateThread));
        privLogLive.innerHTML = logHTML(filterByLocation(plog, masterPrivateLocationFilter[masterPrivateThread], privKey), true);
        attachLogModeration(privLogLive, session.code, null, true, undefined, refreshLiveParts, onPrivateReply);
        if(wasAtBottom) privLogLive.scrollTop = privLogLive.scrollHeight;
        markPrivateThreadRead(session.code, masterPrivateThread, plog);
        refreshLocationSelectOptions(document.getElementById('private-location-select'), plog, privKey, masterPrivateLocationFilter[masterPrivateThread]);
      }
    }
    if(session.role==='master' && masterChatMode==='subgroup' && activeSubgroupId){
      const subLogLive = document.getElementById('subgroup-log-live');
      if(subLogLive){
        const plog = await getPrivateLog(session.code, 'subgroup:'+activeSubgroupId);
        cachedSubgroupLog = plog;
        const wasAtBottom = subLogLive.scrollHeight - subLogLive.scrollTop <= subLogLive.clientHeight + 40;
        // Vedi subgroupLocationKey: la chiave "attuale" per il Sottogruppo è quella effettiva dei
        // suoi membri, non quella del gruppo intero.
        const activeGroupForKey = (await getSubgroups(session.code)).find(g=>g.id===activeSubgroupId);
        const subKey = subgroupLocationKey(activeGroupForKey);
        subLogLive.innerHTML = logHTML(filterByLocation(plog, masterSubgroupLocationFilter[activeSubgroupId], subKey), true);
        attachLogModeration(subLogLive, session.code, null, false, ()=>'subgroup:'+activeSubgroupId, refreshLiveParts, onSubgroupReply);
        if(wasAtBottom) subLogLive.scrollTop = subLogLive.scrollHeight;
        refreshLocationSelectOptions(document.getElementById('subgroup-location-select'), plog, subKey, masterSubgroupLocationFilter[activeSubgroupId]);
      }
    }
    const rosterLive = document.getElementById('roster-live');
    if(rosterLive && session.role==='master' && openManageIdx===null){
      const players = cachedRoster.filter(m=>m.role==='player');
      rosterLive.innerHTML = players.length===0
        ? '<div class="muted">Nessun giocatore ha ancora effettuato l\'accesso a questa campagna.</div>'
        : players.map((p,i)=>rosterItemHTML(p,i)).join('');
      bindRosterSuggestButtons(players);
      bindRosterManageButtons(players);
      if(document.getElementById('mchat-unread-badge')) checkMasterPrivateUnread(session.code, players, maybeNotifyNew);
    }
    const dexLive = document.getElementById('dex-live');
    if(dexLive && dexEditOpenId===null){ dexLive.innerHTML = dexListHTML(cachedDex, session.role==='master'); if(session.role==='master') bindDexEditButtons(session.code); }
    const combatLive = document.getElementById('combat-live');
    const isMasterRole = session && session.role==='master';
    if(combatLive) combatLive.innerHTML = combatDisplayHTML(cachedCombat, isMasterRole);
    // Prima si legava solo per il Master: ora le frecce ◀/▶ compaiono anche al Giocatore nel
    // proprio turno (vedi zoneLineHTML/bindZoneLineArrows) — bindZoneLineArrows è comunque un
    // no-op sicuro quando non ci sono bottoni [data-zoneline-move] nel DOM.
    bindZoneLineArrows(session.code, (cachedRoster||[]).filter(m=>m.role==='player'));
    // BUGFIX: il pannello Gestione Combattimento del Master (#combat-mgr-card, con le righe
    // dettagliate per partecipante) non veniva MAI ridisegnato dal polling -- solo dopo un click
    // su un suo stesso bottone. cachedCombat/cachedRoster invece si aggiornano ogni ~15s come il
    // resto (vedi sopra): il risultato erano nomi (es. dopo un'Evoluzione fatta dal GIOCATORE dalla
    // propria Scheda), Ferite, Azioni ecc. rimasti "congelati" nel pannello del Master finché non
    // interagiva lui stesso con quella riga. Ridisegnato qui ad ogni poll, saltando il refresh SOLO
    // se il Master ha il focus su un campo di input/select/textarea dentro il pannello in questo
    // momento (es. sta digitando un importo Danno manuale) per non perdere quello che sta scrivendo.
    if(isMasterRole && cachedCombat && cachedCombat.active){
      const mgrCard = document.getElementById('combat-mgr-card');
      const activeEl = document.activeElement;
      const typingInMgr = !!(mgrCard && activeEl && mgrCard.contains(activeEl) && /^(INPUT|SELECT|TEXTAREA)$/.test(activeEl.tagName));
      // Vedi ensureCombatUiTapListener/lastCombatUiTapAt più sopra: evita di ricostruire la card
      // esattamente mentre il Master sta toccando un chip Attaccante/Bersaglio o un bottone Azione.
      const recentTapInMgr = (Date.now() - lastCombatUiTapAt) < 2500;
      if(mgrCard && !typingInMgr && !recentTapInMgr) renderCombatManager(session.code, (cachedRoster||[]).filter(m=>m.role==='player'));
    }
    const attacksCard = document.getElementById('attacks-card');
    if(attacksCard) attacksCard.style.display = (cachedCombat && cachedCombat.active) ? '' : 'none';
    if(session.role==='player'){
      cachedMe = cachedRoster.find(m=>m.username===session.username) || cachedMe;
      const attacksCardInner = document.getElementById('attacks-card-inner');
      // Vedi ensureCombatUiTapListener/lastCombatUiTapAt più sopra: stessa guardia anti-race del
      // pannello Master, qui per il pulsante Bersaglio/Attacco del Giocatore.
      const recentTapInAttacks = (Date.now() - lastCombatUiTapAt) < 2500;
      if(attacksCardInner && cachedMe && !recentTapInAttacks){
        // Bug mobile: il poll (ogni 15s) ricostruisce da zero l'HTML di questa card, quindi
        // sostituisce anche <select id="self-target-select"> con un elemento nuovo che riparte
        // dalla prima opzione. Se il giocatore aveva già scelto un bersaglio e il poll scattava
        // proprio in quella finestra, il tasto Attacca (che legge il valore dal DOM al momento del
        // click) finiva per colpire il bersaglio sbagliato. Qui salviamo la selezione prima di
        // ridisegnare e la ripristiniamo subito dopo, se quel bersaglio esiste ancora tra i
        // partecipanti.
        const prevTargetSel = document.getElementById('self-target-select');
        const prevTargetVal = prevTargetSel ? prevTargetSel.value : null;
        attacksCardInner.innerHTML = attacksCardHTML(cachedMe, cachedCombat, session.username);
        bindAttacksCard(session.code, cachedMe);
        if(prevTargetVal){
          const newTargetSel = document.getElementById('self-target-select');
          // self-target-select è ora un <input type="hidden">: basta verificare che il bersaglio
          // esista ancora tra gli item del dropdown custom.
          const matchItem = document.querySelector(`.target-dropdown-item[data-target-id="${CSS.escape(prevTargetVal)}"]`);
          if(newTargetSel && matchItem){
            newTargetSel.value = prevTargetVal;
            // Aggiorna anche la riga visibile nel toggle
            const ddToggle = document.getElementById('target-dropdown-toggle');
            if(ddToggle) ddToggle.innerHTML = matchItem.innerHTML + ' <span style="margin-left:auto;color:var(--text-mute);">▾</span>';
          }
        }
      }
    }
    const combatSelf = document.getElementById('combat-self-actions');
    if(combatSelf && session.role==='player'){
      // BUGFIX (segnalato dall'utente: "continua a esserci un refresh troppo rapido quando uno dei
      // giocatori sta selezionando qualcosa dai menu a tendina"): questo blocco veniva ridisegnato
      // SENZA ALCUNA guardia a ogni giro di polling (~15s) -- a differenza di #combat-mgr-card
      // (typingInMgr) e #attacks-card-inner (recentTapInAttacks), che sono protetti da tempo. Un
      // giocatore con uno dei <select> di questa card (Azione Digimon/Azione Tamer, es. mentre sta
      // scegliendo Reinforce) aperto o anche solo appena toccato si vedeva l'elenco resettato alla
      // prima opzione o il menu chiuso a metà scelta. Stessa doppia guardia già in uso altrove:
      // salta il ridisegno se il focus è su un INPUT/SELECT/TEXTAREA dentro questa card, o se c'è
      // stato un tap/tocco recente al suo interno (vedi ensureCombatUiTapListener, ora esteso anche
      // a #combat-self-actions).
      const activeElSelf = document.activeElement;
      const typingInSelf = !!(activeElSelf && combatSelf.contains(activeElSelf) && /^(INPUT|SELECT|TEXTAREA)$/.test(activeElSelf.tagName));
      const recentTapInSelf = (Date.now() - lastCombatUiTapAt) < 2500;
      if(!typingInSelf && !recentTapInSelf){
        combatSelf.innerHTML = combatSelfActionHTML(cachedCombat, session.username);
        bindCombatSelfActions(session.code, session.username);
      }
    }
    // ===== Mini-log nel tab Battle (mobile): mostra gli ultimi 4 messaggi della chat =====
    if(session.role==='player'){
      const miniLogEl = document.getElementById('combat-mini-log');
      const miniLogCard = document.getElementById('combat-mini-log-card');
      if(miniLogCard) miniLogCard.style.display = (cachedCombat && cachedCombat.active) ? '' : 'none';
      // BUGFIX: mostrava sempre cachedLog (Chat Generale), ma pushCombatNarration instrada la
      // narrazione di combattimento verso il Sottogruppo scelto dal Master quando combat.chatLock
      // è impostato su "sub:<id>" -- in quel caso il mini-log restava vuoto/con messaggi vecchi
      // nonostante il combattimento stesse effettivamente narrando altrove. Stessa fonte di
      // pushCombatNarration: Generale se nessun chatLock (o "general"), altrimenti il thread del
      // Sottogruppo bloccato -- letto solo se il giocatore ne fa parte (getPrivateLog risponde
      // comunque solo con ciò a cui il thread dà accesso, stesso canale già usato dalla sua Chat
      // "Gruppo" quando ci entra volontariamente).
      const miniLogLock = cachedCombat && cachedCombat.chatLock && cachedCombat.chatLock.location;
      let miniLogSource = cachedLog;
      if(miniLogLock && miniLogLock.startsWith('sub:')){
        try{ miniLogSource = await getPrivateLog(session.code, 'subgroup:'+miniLogLock.slice(4)); }catch(e){ miniLogSource = cachedLog; }
      }
      if(miniLogEl && miniLogSource && miniLogSource.length > 0){
        const last4 = miniLogSource.slice(-4);
        miniLogEl.innerHTML = typeof logHTML === 'function' ? logHTML(last4, false) : last4.map(e=>`<div style="padding:2px 0;font-size:12px;"><b style="color:var(--cyan);font-size:11px;">${escapeHTML(e.who||'')}</b> <span>${escapeHTML(e.text||'')}</span></div>`).join('');
        miniLogEl.scrollTop = miniLogEl.scrollHeight;
      }
      // ===== Banner "È il tuo turno, ora puoi parlare!" nel tab Battle =====
      const turnBannerEl = document.getElementById('combat-turn-chat-banner');
      if(turnBannerEl){
        const myTurnForBanner = isMyCombatTurn(cachedCombat, session.username);
        if(myTurnForBanner && cachedCombat && cachedCombat.active){
          const curP = currentTurnParticipant(cachedCombat);
          const curUser = curP && curP.username;
          if(curUser !== __lastTurnChatNotifiedUsername){
            __lastTurnChatNotifiedUsername = curUser;
            // Mostra il banner con animazione fresca (re-trigger rimuovendo e riaggungendo)
            turnBannerEl.innerHTML = '';
            turnBannerEl.offsetHeight; // force reflow
            turnBannerEl.innerHTML = '<div class="combat-turn-chat-banner">⚔️ È il tuo turno! Ora puoi scrivere in chat 💬</div>';
          }
          // Mantieni visibile finché è il turno
          if(!turnBannerEl.innerHTML) turnBannerEl.innerHTML = '<div class="combat-turn-chat-banner">⚔️ È il tuo turno! Ora puoi scrivere in chat 💬</div>';
        } else {
          turnBannerEl.innerHTML = '';
          // Reset: se il combattimento finisce o cambia turno, la prossima volta si rinotifica
          if(!cachedCombat || !cachedCombat.active) __lastTurnChatNotifiedUsername = null;
        }
      }
    }
    // Blocca la chat pubblica (non quella privata col Master) fuori dal proprio turno, se in combattimento.
    // Blocca inoltre, per TUTTI (indipendentemente dal turno), la chat scelta dal Master come
    // "chat di combattimento" (chatLock) finché il Master non conclude lo scontro.
    if(session.role==='player'){
      const myTurnNow = isMyCombatTurn(cachedCombat, session.username);
      const turnLockPublicChat = !!(cachedCombat && cachedCombat.active) && playerChatMode!=='private' && playerChatMode!=='subgroup' && !myTurnNow;
      const chatLocked = combatChatLockLocationMatches(playerChatMode, playerActiveSubgroupId, myTurnNow);
      // Serve solo per sapere se QUESTA è la chat scelta dal Master come "chat di combattimento",
      // a prescindere dal turno — usato per mostrare il messaggio "è il tuo turno" proprio lì, dove
      // prima compariva il lucchetto 🔒 (ora sbloccato per il turno di myTurnNow, vedi sopra).
      const isCombatLockChat = combatChatLockLocationMatches(playerChatMode, playerActiveSubgroupId, false);
      const lockPublicChat = turnLockPublicChat || chatLocked;
      ['action-text','btn-send-action','btn-correct','action-img-btn'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.disabled = lockPublicChat;
      });
      const actionHintEl = document.getElementById('action-hint');
      if(actionHintEl){
        actionHintEl.innerHTML = chatLocked
          ? '<span style="color:var(--danger);">🔒 Questa chat è bloccata: è in corso un combattimento. Puoi comunque scrivere in privato al Master.</span>'
          : (isCombatLockChat && myTurnNow)
            ? `<span style="color:var(--cyan);">⚔️ È il tuo turno, ${escapeHTML(displayNameFor(session.username))}! Ora puoi parlare e fare azioni.</span>`
            : turnLockPublicChat
              ? '<span style="color:var(--danger);">⛔ Sei in combattimento: la chat pubblica è bloccata fuori dal tuo turno. Puoi comunque scrivere in privato al Master.</span>'
              : ACTION_HINT_DEFAULT_TEXT;
      }
    }
    const privateLogLiveMaster = document.getElementById('private-log-live-master');
    if(privateLogLiveMaster && session.role==='master' && masterPrivateThread){
      const plog = await getPrivateLog(session.code, masterPrivateThread);
      cachedMasterPrivateLog = plog;
      const wasAtBottom = privateLogLiveMaster.scrollHeight - privateLogLiveMaster.scrollTop <= privateLogLiveMaster.clientHeight + 40;
      privateLogLiveMaster.innerHTML = logHTML(plog, true);
      attachLogModeration(privateLogLiveMaster, session.code, null, true, undefined, refreshLiveParts, onPrivateReply);
      if(wasAtBottom) privateLogLiveMaster.scrollTop = privateLogLiveMaster.scrollHeight;
    }
    const errBanner = document.getElementById('api-err-banner');
    if(errBanner) errBanner.outerHTML = lastApiError ? `<div id="api-err-banner" class="hud-frame" style="border-color:var(--danger);padding:8px 14px;margin-bottom:16px;color:var(--danger);font-size:12px;">⚠ ${escapeHTML(lastApiError)}</div>` : '<div id="api-err-banner"></div>';
  }

  function bindRosterSuggestButtons(players){
    players.forEach((p,i)=>{
      const btn = document.getElementById('btn-suggest-'+i);
      if(btn && !btn.dataset.bound){
        btn.dataset.bound = '1';
        btn.onclick = async ()=>{
          btn.disabled = true; btn.textContent = 'Generando...';
          const contesto = cachedLog.slice(-6).map(l=>`${l.who}: ${l.text}`).join('\n');
          const lines = await suggerisciBattute(p.digimon.name || 'Digimon', p.digimon.personality, contesto);
          if(!lines.length){
            // AI fallita: non mostrare niente
            btn.disabled = false; btn.textContent = 'Suggerisci Battuta';
            return;
          }
          rosterSuggestLines[p.username] = lines;
          const box = document.getElementById('suggest-box-'+i);
          if(box){
            // Selettore destinazione: Generale / Privata del giocatore / Sottogruppi attivi
            const subOpts = (cachedSubgroups||[]).map(g=>`<option value="subgroup:${escapeAttr(g.id)}">${escapeHTML(g.name)}</option>`).join('');
            const destSelect = `<select class="suggest-dest" id="suggest-dest-${i}" style="font-size:11px;margin-bottom:6px;width:100%;">
              <option value="general">📣 Chat Generale</option>
              <option value="private:${escapeAttr(p.username)}">✉️ Privata di ${escapeHTML(displayName(p))}</option>
              ${subOpts}
            </select>`;
            box.innerHTML = destSelect + lines.map(l=>`<div class="suggest-line" data-line="${escapeAttr(l)}">${escapeHTML(l)}</div>`).join('');
            box.style.display = 'block';
            bindSuggestLineClicks(box, p, i);
          }
          btn.disabled = false; btn.textContent = 'Suggerisci Battuta';
        };
      }
      const existingBox = document.getElementById('suggest-box-'+i);
      if(existingBox && (rosterSuggestLines[p.username]||[]).length){
        bindSuggestLineClicks(existingBox, p, i);
      }
    });
  }

  function bindSuggestLineClicks(box, p, idx){
    box.querySelectorAll('.suggest-line').forEach(el=>{
      el.onclick = async ()=>{
        const entry = { who: p.digimon.name || 'Digimon', role:'digimon', text: el.getAttribute('data-line'), meta: p.digimon.chatColor ? { color: p.digimon.chatColor, avatar: p.digimon.imageUrl } : null };
        const destSel = document.getElementById('suggest-dest-'+idx);
        const dest = destSel ? destSel.value : 'general';
        if(dest.startsWith('subgroup:')){
          const subId = dest.slice('subgroup:'.length);
          const group = (cachedSubgroups||[]).find(g=>g.id===subId) || null;
          entry.meta = { ...(entry.meta||{}), location: subgroupLocationKey(group) };
          await pushPrivateLog(session.code, 'subgroup:'+subId, entry);
        } else if(dest.startsWith('private:')){
          const username = dest.slice('private:'.length);
          const member = (cachedRoster||[]).find(m=>m.username===username);
          entry.meta = { ...(entry.meta||{}), location: memberLocationKey(member) };
          await pushPrivateLog(session.code, username, entry);
        } else {
          await pushLog(session.code, entry);
        }
        delete rosterSuggestLines[p.username];
        box.innerHTML = '';
        box.style.display = 'none';
        refreshLiveParts();
      };
    });
  }

      if(rollResult){
        if(rollResult.dice && resEl){
          resEl.innerHTML = `${diceRowHTML(rollResult.dice)}<span class="roll-total">${rollResult.resultLabel}</span>${rollResult.verdict?`<span class="roll-verdict ${rollResult.verdict.cls}">${rollResult.verdict.label}</span>`:''}`;
        } else if(resEl){
          resEl.innerHTML = '';
        }
        const rollMeta = rollResult.dice ? { dice: rollResult.dice } : {};
        if(pendingActionImageUrl) rollMeta.image = pendingActionImageUrl;
        if(pendingReplyTo) rollMeta.replyTo = pendingReplyTo;
        await pushLog(code, { who: displayName(me), role:'roll', text: rollResult.text, meta: Object.keys(rollMeta).length ? rollMeta : null });
      } else {
        const textMeta = {};
        if(pendingActionImageUrl) textMeta.image = pendingActionImageUrl;
        if(pendingReplyTo) textMeta.replyTo = pendingReplyTo;
        await pushLog(code, { who: displayName(me), role:'player', text: raw, meta: Object.keys(textMeta).length ? textMeta : null });
      }
      } // fine else genericDice
      advanceGameClock('general', 5); // +5min per messaggio generale
      ta.value='';
      pendingActionImageUrl = null;
      pendingReplyTo = null;
      renderReplyBanner('action-reply-preview', null);
      const actionPreview = document.getElementById('action-img-preview');
      if(actionPreview) actionPreview.innerHTML = '';
      refreshLiveParts();
    };
    bindAttacksCard(code, me);
    // BUGFIX (Rocco: "il tasto Sì andiamo... non sposta i giocatori"): 8° argomento `true` —
    // vedi usePlayerActiveChat in js/chat-log-engine.js. Senza, questo binding (fatto una sola
    // volta qui, mai rifatto quando il giocatore cambia chat) restava fisso su Generale/cachedLog
    // per sempre, e un voto/risposta dato da Privata o Sottogruppo non trovava mai il messaggio.
    attachLogModeration(document.getElementById('log-live'), code, me, undefined, undefined, refreshLiveParts, (entry)=>{
      pendingReplyTo = replySnippetFromEntry(entry);
      renderReplyBanner('action-reply-preview', pendingReplyTo, ()=>{ pendingReplyTo = null; renderReplyBanner('action-reply-preview', null); });
      const taReply = document.getElementById('action-text');
      if(taReply) taReply.focus();
    }, true);
    bindCombatSelfActions(code, session.username);
    // Frecce ◀/▶ della linea distanze (vedi zoneLineHTML): compaiono anche al Giocatore quando è
    // il suo turno — le leghiamo già al primo render, non solo al primo poll di refreshLiveParts.
    bindZoneLineArrows(code, (cachedRoster||[]).filter(m=>m.role==='player'));
    updateChatModeButtons();
    // Chat segmented control (mobile-friendly, works on desktop too)
    document.querySelectorAll('#player-chat-seg .chat-seg-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const mode = btn.dataset.chatmode;
        playerChatMode = mode;
        document.querySelectorAll('#player-chat-seg .chat-seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.chatmode===mode));
        const subWrap = document.getElementById('player-subgroup-select-wrap');
        if(subWrap) subWrap.style.display = mode==='subgroup' ? '' : 'none';
        // Cambiare chat mentre si sta rispondendo a un messaggio di un'altra chat non avrebbe
        // senso (il messaggio citato non esiste in quel thread): annulla la risposta in corso.
        pendingReplyTo = null;
        renderReplyBanner('action-reply-preview', null);
        await refreshPlayerLogDisplay(code, me);
      };
    });
    updateChatModeButtons();
    initMobileNav();

    startPolling();
  }

        // Più destinatari nello stesso payload, separati da virgola: ogni giocatore in lista

        const namesLabel = targetUsernames.map(u=>{ const p = players.find(x=>x.username===u); return p ? displayName(p) : u; }).join(', ');
        const payload = `${targetUsernames.join(',')}|${skillKey}|${tn||''}`;
        const entry = { who:'Master', role:'request', text: `Richiesta a ${namesLabel}: tira ${label}${tnPart}::REQ::${payload}` };
        if(sendGeneral) await pushLog(code, entry);
        if(sendPrivate){

          // invece che con quella effettiva del giocatore destinatario. Se il giocatore era stato
          // spostato singolarmente in un Settore diverso, il filtro "Settore attuale" della sua

          for(const u of targetUsernames){

          }

          const group = (cachedSubgroups||[]).find(g=>g.id===subgroupId) || null;

        if(!sendGeneral && !sendPrivate && !sendSubgroup){ if(statusEl) statusEl.textContent = 'Scegli almeno un canale (Generale, Privata e/o Sottogruppo).'; return; }
        if(sendSubgroup && !subgroupId){ if(statusEl) statusEl.textContent = 'Scegli un sottogruppo.'; return; }
        const targetMember = cachedRoster.find(m=>m.username===targetUsername);
        const targetLabel = targetMember ? displayName(targetMember) : targetUsername;
        // Il nome del Torment può in teoria contenere "|" (testo libero digitato dal giocatore
        // in js/tamer-card.js): il lato ricevente ricompone tutto ciò che segue il primo "|"
        // invece di limitarsi a payload.split('|')[1], quindi non serve escaparlo qui.
        const payload = `${targetUsername}|${tormentName}`;
        const entry = { who:'Master', role:'tormentrequest', text: `Richiesta a ${targetLabel}: tira il Torment Check "${tormentName}"::TORMENTREQ::${payload}` };

        if(statusEl) statusEl.textContent = '';

    }

    startPolling();
