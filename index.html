      const myGroups = getMySubgroups(session.code, session.username);
      const segSubBtn = document.getElementById('seg-subgroup-btn');
      if(segSubBtn) segSubBtn.style.display = myGroups.length>0 ? '' : 'none';
      const subWrap = document.getElementById('player-subgroup-select-wrap');
      if(subWrap) subWrap.style.display = playerChatMode==='subgroup' ? '' : 'none';
      ensurePlayerSubgroupPicker(session.code);
    }
  }

  // Crea/aggiorna il selettore "quale sottogruppo sto guardando" e mantiene playerActiveSubgroupId
  // valido. PRIMA questa logica girava una volta sola, dentro il bind iniziale di renderPlayer():
  // se in quel momento cachedSubgroups era ancora vuota (praticamente sempre, dato che si popola
  // solo al primo giro di polling DOPO il render), playerActiveSubgroupId restava null per
  // sempre. Risultato: aprendo "👥 Gruppo" con playerActiveSubgroupId null, renderChatArea non
  // trovava le condizioni per il ramo "sottogruppo" e mostrava per sbaglio la Chat Generale (da
  // qui "leggo solo gli stessi messaggi") — e siccome quel ramo non veniva mai eseguito, il
  // thread non veniva mai segnato come letto (da qui il pallino rosso che restava acceso anche
  // dopo aver aperto la chat). Ora questa funzione gira ad ogni updateChatModeButtons(), quindi
  // anche ad ogni ciclo di polling: appena i sottogruppi arrivano dal server, la selezione si
  // aggiusta da sola.
  function ensurePlayerSubgroupPicker(code){
    if(!session) return;
    const wrap = document.getElementById('player-subgroup-select-wrap');
    if(!wrap) return;
    const myGroups = getMySubgroups(code, session.username);
    // Se il gruppo attivo non esiste più (es. eliminato dal Master) o non è mai stato scelto,
    // ripiega sul primo disponibile.
    if(!playerActiveSubgroupId || !myGroups.some(g=>g.id===playerActiveSubgroupId)){
      playerActiveSubgroupId = myGroups.length>0 ? myGroups[0].id : null;
    }
    if(myGroups.length===0){
      wrap.innerHTML = '';
      return;
    }
    let subSel = document.getElementById('player-subgroup-select');
    if(!subSel){
      wrap.innerHTML = `<select id="player-subgroup-select" style="width:100%;font-size:12px;"></select>`;
      subSel = document.getElementById('player-subgroup-select');
    }
    subSel.innerHTML = myGroups.map(g=>`<option value="${escapeAttr(g.id)}" ${g.id===playerActiveSubgroupId?'selected':''}>${escapeHTML(g.name)}</option>`).join('');
    subSel.onchange = async ()=>{
      playerActiveSubgroupId = subSel.value;
      await refreshPlayerLogDisplay(code, cachedMe);
    };
  }

  // Disegna insieme il selettore "Storico per Settore" (con le opzioni ricavate dal thread
  // attualmente aperto) e il Registro sottostante, per QUALSIASI delle tre chat del giocatore
  // (Generale/Privata/Gruppo) — sono condivisi lo stesso #chat-location-bar e #log-live, cambia
  // solo quale log/filtro sta guardando in quel momento in base a playerChatMode.
  async function renderChatArea(code, me, opts){
    opts = opts || {};
    if(!session) return;
    let raw, filterVal, thread = null;
    // "Chiave attuale" da usare per il filtro/tag: per Privata/Sottogruppo NON è la posizione
    // del gruppo intero (currentLocationKey), ma quella effettiva di chi partecipa — altrimenti
    // il filtro "Storico per Settore" restava ancorato al gruppo anche per chi si era separato.
    let effectiveKey;
    if(playerChatMode==='subgroup' && playerActiveSubgroupId){
      thread = 'subgroup:'+playerActiveSubgroupId;
      raw = await getPrivateLog(code, thread);
      filterVal = subgroupLocationFilter[playerActiveSubgroupId];
      if(filterVal===undefined) filterVal = null;
      effectiveKey = subgroupLocationKey((cachedSubgroups||[]).find(g=>g.id===playerActiveSubgroupId));
    } else if(playerChatMode==='private'){
      thread = session.username;
      raw = await getPrivateLog(code, thread);
      filterVal = privateLocationFilter;
      effectiveKey = memberLocationKey(me);
    } else {
      raw = scenePublicRawLog();
      filterVal = publicLocationFilter;
      effectiveKey = currentLocationKey();
    }
    const filtered = filterByLocation(raw, filterVal, effectiveKey);
    const logLive = document.getElementById('log-live');
    if(logLive){
      const wasAtBottom = logLive.scrollHeight - logLive.scrollTop <= logLive.clientHeight + 40;
      logLive.innerHTML = logHTML(filtered, false);
      if(opts.forceScrollBottom || wasAtBottom) logLive.scrollTop = logLive.scrollHeight;
    }
    const barWrap = document.getElementById('chat-location-bar');
    if(barWrap){
      barWrap.innerHTML = `
        ${locationFilterSelectHTML('chat-location-select', raw, effectiveKey, filterVal)}
        <button class="btn ghost small" id="btn-export-chat" style="padding:2px 8px;">⬇️ Esporta</button>
      `;
      const sel = document.getElementById('chat-location-select');
      if(sel) sel.onchange = ()=>{
        const v = sel.value;
        if(playerChatMode==='subgroup' && playerActiveSubgroupId) subgroupLocationFilter[playerActiveSubgroupId] = v;
        else if(playerChatMode==='private') privateLocationFilter = v;
        else publicLocationFilter = v;
        renderChatArea(code, me, { forceScrollBottom:true });
      };
      const exportBtn = document.getElementById('btn-export-chat');
      if(exportBtn) exportBtn.onclick = ()=>{
        const label = sel ? sel.options[sel.selectedIndex].textContent.replace('📍 ','') : currentLocationLabel();
        exportVisibleLogAsText(filtered, label);
      };
    }
    if(playerChatMode==='private'){
      markPrivateThreadRead(code, session.username, raw);
      updateChatBadge('chatmode-private', false);
    } else if(playerChatMode==='subgroup' && playerActiveSubgroupId){
      markPrivateThreadRead(code, thread, raw);
      checkPlayerSubgroupsUnread();
    }
  }

  async function refreshPlayerLogDisplay(code, me){
    updateChatModeButtons();
    await renderChatArea(code, me, { forceScrollBottom:true });
  }

  function onlineSummary(members){
    // Disattivato insieme all'heartbeat (vedi startPolling): senza last_seen aggiornati
    // in tempo reale, questa riga mostrerebbe sempre "nessun altro online" anche a
    // campagna piena. Ritorna stringa vuota così il contenitore resta semplicemente vuoto.
    return '';
  }

  // Settore "effettivo" di un membro: se non si è mai separato dal gruppo (currentSectorId nullo)
  // segue semplicemente il Settore attuale della Scena; altrimenti resta dove si è spostato da solo
  // finché il Master non lo fa "Rientrare nel gruppo" o non sposta l'intero gruppo (che resetta tutti).
  function memberEffectiveSectorId(member){
    const override = member && member.tamer && member.tamer.currentSectorId;
    return override || (cachedScene && cachedScene.currentSectorId) || null;
  }
  // Luogo "effettivo" di un membro: se ha un Settore proprio (spostato singolarmente col pannello
  // "Posizione dei giocatori", ANCHE se quel Settore coincide per coincidenza con quello attuale
  // del gruppo) non eredita mai il Luogo di gruppo in automatico — altrimenti un giocatore mandato
  // deliberatamente "solo nel Settore, nessun Luogo" si ritroverebbe comunque nel Luogo che il
  // gruppo sta guardando in quel momento, cosa che il Master non ha scelto. Eredita il Luogo di
  // gruppo SOLO chi non è mai stato spostato singolarmente (nessun Settore proprio: sta seguendo
  // il gruppo in tutto e per tutto).
  function memberEffectiveLuogoId(member){
    const luogoOverride = member && member.tamer && member.tamer.currentLuogoId;
    if(luogoOverride) return luogoOverride;
    const sectorOverride = member && member.tamer && member.tamer.currentSectorId;
    if(sectorOverride) return null;
    return (cachedScene && cachedScene.currentLuogoId) || null;
  }
  // DIAGNOSI 28/08/2026: Chat Privata e Sottogruppi taggavano SEMPRE i messaggi con
  // currentLocationKey() (la posizione dell'INTERO gruppo sulla Scena), anche quando il
  // destinatario/i membri del sottogruppo si erano separati dal gruppo verso un altro Settore.
  // Risultato: due giocatori realmente nella stessa zona in un sottogruppo non venivano mai
  // "riconosciuti" come tali dal filtro "Storico per Settore", che restava ancorato alla
  // posizione del gruppo principale. Queste due funzioni calcolano la chiave usando invece la
  // posizione EFFETTIVA (memberEffectiveSectorId/LuogoId) di chi partecipa alla conversazione.
  function memberLocationKey(member){
    if(!cachedScene) return '_|_|_';
    const sectorId = memberEffectiveSectorId(member);
    // Il Settore effettivo di un membro separato può appartenere a una Macroscena DIVERSA da
    // quella che il gruppo sta guardando in quel momento (es. gruppo su "Yokohama" ma il membro,
    // spostato singolarmente, si trova in un Settore della Macroscena "???"). Cerchiamo quindi la
    // Macroscena che contiene DAVVERO quel Settore invece di assumere sempre quella corrente del
    // gruppo, altrimenti la chiave mischierebbe Macroscena sbagliata + Settore/Luogo giusti e il
    // riconoscimento "stessa zona" tra due membri separati nella stessa Macroscena continuerebbe
    // a fallire.
    const found = sectorId ? findSectorAnywhere(cachedScene, sectorId) : null;
    const macroId = found ? found.macro.id : (cachedScene.currentMacroSceneId || null);
    return `${macroId||'_'}|${sectorId||'_'}|${memberEffectiveLuogoId(member)||'_'}`;
  }
  // Per un Sottogruppo usiamo la posizione effettiva del primo membro come riferimento: un
  // Sottogruppo esiste per far parlare tra loro persone che si presume trovarsi nello stesso
  // posto, quindi non gestiamo il caso limite (raro, e comunque non peggiore di prima) di membri
  // finiti in Settori diversi tra loro.
  function subgroupLocationKey(group){
    const firstUsername = group && Array.isArray(group.members) && group.members[0];
    const member = firstUsername ? (cachedRoster||[]).find(m=>m.username===firstUsername) : null;
    return member ? memberLocationKey(member) : currentLocationKey();
  }
  // Un Digimon del roster segnato "hiddenFromParty" resta visibile SOLO a Master e proprietario —
  // serve a coprire il tempo tra la creazione/evoluzione di un Digimon e il momento in cui il Master
  // vuole rivelarlo narrativamente al resto del gruppo (es. un Digitama che si schiude prima degli altri).
  // Cerca un Settore per id in TUTTE le Macroscene (non solo quella attiva), utile per mostrare
  // dove si trova un membro anche se il Master sta guardando una Macroscena diversa in quel momento.
  function sectorNameById(sectorId){
    if(!sectorId) return null;
    for(const m of (cachedScene.macroScenes||[])){
      const s = (m.sectors||[]).find(x=>x.id===sectorId);
      if(s) return s.name;
    }
    return null;
  }
  function luogoNameById(sectorId, luogoId){
    if(!sectorId || !luogoId) return null;
    for(const m of (cachedScene.macroScenes||[])){
      const s = (m.sectors||[]).find(x=>x.id===sectorId);
      if(s){ const lg = (s.luoghi||[]).find(x=>x.id===luogoId); return lg ? lg.name : null; }
    }
    return null;
  }
  // Come sectorNameById/luogoNameById, ma restituisce anche la Macroscena a cui il Settore
  // appartiene — serve a "sceneHTML" per mostrare correttamente la scena di un giocatore separato
  // in una Macroscena diversa da quella attiva per il resto del gruppo (prima si cercava il Settore
  // SOLO dentro la Macroscena attiva, quindi un separato in un'altra Macroscena non vedeva nulla).
  function findSectorAnywhere(scene, sectorId){
    if(!sectorId) return null;
    for(const m of ((scene && scene.macroScenes) || [])){
      const s = (m.sectors||[]).find(x=>x.id===sectorId);
      if(s) return { sector: s, macro: m };
    }
    return null;
  }
  function isDigimonHiddenFromViewer(member){
    if(!member || !member.digimon || !member.digimon.hiddenFromParty) return false;
    if(session && session.role==='master') return false;
    if(session && member.username===session.username) return false;
    return true;
  }

  // ---------- LIVE PARTS (updated by polling, never touch forms) ----------
  // `tick` = numero del ciclo di polling (incrementa ogni 15s, vedi startPolling). Roster/Scena/
  // Log/Avvisi restano aggiornati OGNI ciclo perché sono ciò che rende il gioco "in tempo reale"
  // (posizioni, HP, chat). Digidex/Progressione/Sottogruppi cambiano raramente (il Master li
  // tocca ogni tanto, non ogni pochi secondi): rileggerli ogni 15s per OGNI client connesso era
  // pura banda sprecata sul Fast Origin Transfer di Vercel. Ora si aggiornano ogni 4 cicli (~1
  // minuto) — restano comunque "quasi in tempo reale" per dati che nella pratica non cambiano
  // a quella velocità. Il Combattimento fa eccezione: se è già attivo resta ad ogni ciclo (serve
  // reattività in scontro), altrimenti anche lui scende a 1 su 4.
  //
  // DIAGNOSI 28/08/2026: il Digidex (/api/dex) è però un caso a parte — non un semplice record,
  // ma l'INTERO elenco specie della campagna (~700 righe, oltre 1 MB di JSON). Rileggerlo ogni
  // "slowCycle" (~60s) per OGNI client con index.html aperto (Master + Giocatori) significava
  // ​~1 MB al minuto per client: con più persone connesse durante una sessione, bastavano poche
  // ore per generare diversi GB di traffico — probabilmente la causa principale, più dei bug già
  // risolti sopra, dei consumi eccessivi di egress Supabase e Fast Origin Transfer Vercel. Il
  // Digidex cambia solo quando qualcuno aggiunge/modifica una voce (azione già riflessa subito in
  // cachedDex lato client, vedi addDexEntry/updateDexEntry), quindi non serve rileggerlo spesso:
  // ora si aggiorna ogni 40 cicli (~10 minuti) invece che ogni 4 (~1 minuto), un taglio di banda
  // di circa 10 volte su questa singola voce.
  async function refreshLiveParts(tick){
    if(!session) return;
    const slowCycle = (typeof tick!=='number') || (tick % 4 === 0); // sempre true al primo giro
    const dexCycle = (typeof tick!=='number') || (tick % 40 === 0); // ~10 minuti (era ogni 60s)
    cachedRoster = (await getRoster(session.code)).map(normalizeMember);
    cachedScene = await getScene(session.code);
    cachedLog = await getLog(session.code);
    if(cachedLog.length){
      const myPublicName = session.role==='master' ? 'Master' : displayName(cachedMe || cachedRoster.find(m=>m.username===session.username) || {username:session.username});
      maybeNotifyNew('public', null, cachedLog[cachedLog.length-1], myPublicName);
    }
    if(dexCycle) cachedDex = await getDex(session.code);
    if(slowCycle || (cachedCombat && cachedCombat.active)){
      const freshCombat = await getCombat(session.code);
      if(freshCombat && cachedCombat && typeof cachedCombat==='object'){
        // Muta l'oggetto esistente invece di sostituirlo: il Combat Manager del Master
        // tiene riferimenti a cachedCombat dentro le closure dei bottoni (+ Aggiungi, ecc.);
        // se qui lo rimpiazzassimo con un nuovo oggetto, quei bottoni scriverebbero
        // su una copia "orfana" e le modifiche andrebbero perse al salvataggio.
        Object.keys(cachedCombat).forEach(k=>{ delete cachedCombat[k]; });
        Object.assign(cachedCombat, freshCombat);
      } else {
        cachedCombat = freshCombat;
      }
    }
    if(slowCycle) cachedProgression = await getProgression(session.code);
    if(slowCycle){
      cachedSubgroups = await getSubgroups(session.code);
      if(session.role==='player') updateChatModeButtons(); // mostra/nasconde il bottone "👥 Gruppo" appena arrivano sottogruppi nuovi
    }

    // Musica da Combattimento: rilevata qui (non solo nel click di "Inizia Combattimento") perché
    // questa funzione gira per TUTTI i client via polling — così la musica parte anche sui browser
    // dei Giocatori e non solo su quello del Master che ha premuto il bottone. __combatMusicSynced
    // evita di far ripartire la traccia da capo ad ogni poll mentre il combattimento resta attivo.
    if(!!(cachedCombat && cachedCombat.active) !== __combatMusicSynced){
      __combatMusicSynced = !!(cachedCombat && cachedCombat.active);
      if(__combatMusicSynced) startCombatMusic(cachedScene); else stopCombatMusic();
    }

    const sceneLive = document.getElementById('scene-live');
    if(sceneLive){
      const sceneViewer = session.role==='player' ? (cachedRoster.find(m=>m.username===session.username) || cachedMe) : null;
      sceneLive.innerHTML = `<div class="muted mono" style="margin-bottom:8px;">${onlineSummary(cachedRoster)}</div>` + sceneHTML(cachedScene, sceneViewer);
    }
    bindSceneAudio(cachedScene);
    if(missionsModalOpen) refreshMissionsModal();
    const sceneLuoghiLive = document.getElementById('scene-luoghi-live');
    if(sceneLuoghiLive){
      sceneLuoghiLive.innerHTML = sceneCurrentSectorLuoghiHTML();
      bindSceneCurrentSectorLuoghi(session.code);
    }
    const logLive = document.getElementById('log-live');
    if(logLive){
      if(session.role==='player'){
        await renderChatArea(session.code, cachedMe);
      } else {
        const wasAtBottom = logLive.scrollHeight - logLive.scrollTop <= logLive.clientHeight + 40;
        logLive.innerHTML = logHTML(sceneLog(), session && session.role==='master');
        if(wasAtBottom) logLive.scrollTop = logLive.scrollHeight;
        refreshLocationSelectOptions(document.getElementById('master-chat-location-select'), scenePublicRawLog(), currentLocationKey(), publicLocationFilter);
      }
    }
    // Controlla in ogni ciclo di polling — indipendentemente da quale chat è aperta in questo
    // momento — se ci sono messaggi privati o di sottogruppo non letti altrove, per accendere
    // i pallini sui bottoni "Privata"/"Gruppo" anche mentre si sta guardando la Chat Generale.
    if(session.role==='player'){
      checkPlayerPrivateUnread();
      checkPlayerSubgroupsUnread();
    }
    if(session.role==='master' && masterChatMode==='private' && masterPrivateThread){
      const privLogLive = document.getElementById('private-log-live-master');
      if(privLogLive){
        const plog = await getPrivateLog(session.code, masterPrivateThread);
        cachedMasterPrivateLog = plog;
        const wasAtBottom = privLogLive.scrollHeight - privLogLive.scrollTop <= privLogLive.clientHeight + 40;
        // Vedi memberLocationKey: la chiave "attuale" per la Chat Privata è quella effettiva del
        // giocatore del thread, non quella del gruppo intero.
        const privKey = memberLocationKey(cachedRoster.find(m=>m.username===masterPrivateThread));
        privLogLive.innerHTML = logHTML(filterByLocation(plog, masterPrivateLocationFilter[masterPrivateThread], privKey), true);
        attachLogModeration(privLogLive, session.code, null, true);
        if(wasAtBottom) privLogLive.scrollTop = privLogLive.scrollHeight;
        markPrivateThreadRead(session.code, masterPrivateThread, plog);
        refreshLocationSelectOptions(document.getElementById('private-location-select'), plog, privKey, masterPrivateLocationFilter[masterPrivateThread]);
      }
    }
    if(session.role==='master' && masterChatMode==='subgroup' && activeSubgroupId){
      const subLogLive = document.getElementById('subgroup-log-live');
      if(subLogLive){
        const plog = await getPrivateLog(session.code, 'subgroup:'+activeSubgroupId);
        cachedSubgroupLog = plog;
        const wasAtBottom = subLogLive.scrollHeight - subLogLive.scrollTop <= subLogLive.clientHeight + 40;
        // Vedi subgroupLocationKey: la chiave "attuale" per il Sottogruppo è quella effettiva dei
        // suoi membri, non quella del gruppo intero.
        const activeGroupForKey = (await getSubgroups(session.code)).find(g=>g.id===activeSubgroupId);
        const subKey = subgroupLocationKey(activeGroupForKey);
        subLogLive.innerHTML = logHTML(filterByLocation(plog, masterSubgroupLocationFilter[activeSubgroupId], subKey), true);
        attachLogModeration(subLogLive, session.code, null, false, ()=>'subgroup:'+activeSubgroupId);
        if(wasAtBottom) subLogLive.scrollTop = subLogLive.scrollHeight;
        refreshLocationSelectOptions(document.getElementById('subgroup-location-select'), plog, subKey, masterSubgroupLocationFilter[activeSubgroupId]);
      }
    }
    const rosterLive = document.getElementById('roster-live');
    if(rosterLive && session.role==='master' && openManageIdx===null){
      const players = cachedRoster.filter(m=>m.role==='player');
      rosterLive.innerHTML = players.length===0
        ? '<div class="muted">Nessun giocatore ha ancora effettuato l\'accesso a questa campagna.</div>'
        : players.map((p,i)=>rosterItemHTML(p,i)).join('');
      bindRosterSuggestButtons(players);
      bindRosterManageButtons(players);
      if(document.getElementById('mchat-unread-badge')) checkMasterPrivateUnread(session.code, players);
    }
    const dexLive = document.getElementById('dex-live');
    if(dexLive && dexEditOpenId===null){ dexLive.innerHTML = dexListHTML(cachedDex, session.role==='master'); if(session.role==='master') bindDexEditButtons(session.code); }
    const combatLive = document.getElementById('combat-live');
    const isMasterRole = session && session.role==='master';
    if(combatLive) combatLive.innerHTML = combatDisplayHTML(cachedCombat, isMasterRole);
    if(isMasterRole) bindZoneLineArrows(session.code, (cachedRoster||[]).filter(m=>m.role==='player'));
    const attacksCard = document.getElementById('attacks-card');
    if(attacksCard) attacksCard.style.display = (cachedCombat && cachedCombat.active) ? '' : 'none';
    if(session.role==='player'){
      cachedMe = cachedRoster.find(m=>m.username===session.username) || cachedMe;
      const attacksCardInner = document.getElementById('attacks-card-inner');
      if(attacksCardInner && cachedMe){
        attacksCardInner.innerHTML = attacksCardHTML(cachedMe, cachedCombat, session.username);
        bindAttacksCard(session.code, cachedMe);
      }
    }
    const combatSelf = document.getElementById('combat-self-actions');
    if(combatSelf && session.role==='player'){
      combatSelf.innerHTML = combatSelfActionHTML(cachedCombat, session.username);
      bindCombatSelfActions(session.code, session.username);
    }
    // Blocca la chat pubblica (non quella privata col Master) fuori dal proprio turno, se in combattimento.
    if(session.role==='player'){
      const myTurnNow = isMyCombatTurn(cachedCombat, session.username);
      const lockPublicChat = !!(cachedCombat && cachedCombat.active) && playerChatMode!=='private' && playerChatMode!=='subgroup' && !myTurnNow;
      ['action-text','btn-send-action','btn-correct','action-img-btn'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.disabled = lockPublicChat;
      });
      const actionHintEl = document.getElementById('action-hint');
      if(actionHintEl){
        actionHintEl.innerHTML = lockPublicChat
          ? '<span style="color:var(--danger);">⛔ Sei in combattimento: la chat pubblica è bloccata fuori dal tuo turno. Puoi comunque scrivere in privato al Master.</span>'
          : ACTION_HINT_DEFAULT_TEXT;
      }
    }
    const privateLogLiveMaster = document.getElementById('private-log-live-master');
    if(privateLogLiveMaster && session.role==='master' && masterPrivateThread){
      const plog = await getPrivateLog(session.code, masterPrivateThread);
      cachedMasterPrivateLog = plog;
      const wasAtBottom = privateLogLiveMaster.scrollHeight - privateLogLiveMaster.scrollTop <= privateLogLiveMaster.clientHeight + 40;
      privateLogLiveMaster.innerHTML = logHTML(plog, true);
      attachLogModeration(privateLogLiveMaster, session.code, null, true);
      if(wasAtBottom) privateLogLiveMaster.scrollTop = privateLogLiveMaster.scrollHeight;
    }
    const errBanner = document.getElementById('api-err-banner');
    if(errBanner) errBanner.outerHTML = lastApiError ? `<div id="api-err-banner" class="hud-frame" style="border-color:var(--danger);padding:8px 14px;margin-bottom:16px;color:var(--danger);font-size:12px;">⚠ ${escapeHTML(lastApiError)}</div>` : '<div id="api-err-banner"></div>';
  }

  function bindRosterSuggestButtons(players){
    players.forEach((p,i)=>{
      const btn = document.getElementById('btn-suggest-'+i);
      if(btn && !btn.dataset.bound){
        btn.dataset.bound = '1';
        btn.onclick = async ()=>{
          btn.disabled = true; btn.textContent = 'Generando...';
          const contesto = cachedLog.slice(-6).map(l=>`${l.who}: ${l.text}`).join('\n');
          const lines = await suggerisciBattute(p.digimon.name || 'Digimon', p.digimon.personality, contesto);
          rosterSuggestLines[p.username] = lines;
          const box = document.getElementById('suggest-box-'+i);
          if(box){
            box.innerHTML = lines.map(l=>`<div class="suggest-line" data-line="${escapeAttr(l)}">${escapeHTML(l)}</div>`).join('');
            box.style.display = 'block';
            bindSuggestLineClicks(box, p);
          }
          btn.disabled = false; btn.textContent = 'Suggerisci Battuta';
        };
      }
      const existingBox = document.getElementById('suggest-box-'+i);
      if(existingBox && (rosterSuggestLines[p.username]||[]).length){
        bindSuggestLineClicks(existingBox, p);
      }
    });
  }

  function bindSuggestLineClicks(box, p){
    box.querySelectorAll('.suggest-line').forEach(el=>{
      el.onclick = async ()=>{
        await pushLog(session.code, { who: p.digimon.name || 'Digimon', role:'digimon', text: el.getAttribute('data-line'), meta: p.digimon.chatColor ? { color: p.digimon.chatColor, avatar: p.digimon.imageUrl } : null });

  // ---------- bars ----------
  function barHTML(label, current, max, kind, onMinusId, onPlusId){
    const pct = max>0 ? Math.max(0, Math.min(100, (current/max)*100)) : 0;
    const low = pct <= 25;
    return `
      <div class="bar-row">
        <div class="bar-label"><span>${label}</span><span class="val">${current} / ${max}</span></div>
        <div class="bar-track"><div class="bar-fill ${low?'low':kind}" style="width:${pct}%;"></div></div>
        <div class="bar-controls">
          <button id="${onMinusId}">−</button>
          <button id="${onPlusId}">+</button>
        </div>
      </div>
    `;
  }

  // ---------- battery cells (visual redesign: segmented cells instead of a plain bar) ----------
  const BATTERY_ABSOLUTE_MAX = 6; // pari al cap a Stage Mega — le celle oltre il cap dello Stage attuale sono mostrate "bloccate"
  function batteryCellsHTML(current, max, mini){
    const m = Math.max(0, Number(max)||0);
    const c = Math.max(0, Number(current)||0);
    if(m<=0) return `<div class="muted" style="font-size:10px;">—</div>`;
    let cells = '';
    for(let i=0;i<BATTERY_ABSOLUTE_MAX;i++){
      if(i<m) cells += `<div class="batt-cell ${i<c?'filled':''}"></div>`;
      else cells += `<div class="batt-cell locked" title="Si sblocca a uno Stage superiore"></div>`;
    }
    return `<div class="batt-cells${mini?' mini':''}">${cells}</div>`;
  }

  function batteryBarHTML(label, current, max, onMinusId, onPlusId){
    return `
      <div class="bar-row">
        <div class="bar-label"><span>⚡ ${label}</span><span class="val">${current||0} / ${max}</span></div>
        ${batteryCellsHTML(current, max)}
        <div class="bar-controls">
          <button id="${onMinusId}">−</button>
          <button id="${onPlusId}">+</button>
        </div>
      </div>
    `;
  }

  // ---------- compact HP readout, used in Scene encounter cards and the Combat tracker ----------
  function miniHpBarHTML(current, max, temp, label){
    const maxN = Math.max(1, Number(max)||1);
    const curN = Math.max(0, Number(current)||0);
    const pct = Math.max(0, Math.min(100, (curN/maxN)*100));
    const ratio = curN/maxN;
    const cls = curN<=0 ? 'ko' : (ratio<=0.25 ? 'crit' : (ratio<=0.5 ? 'warn' : 'ok'));
    const tempN = Number(temp)||0;
    return `
      <div class="hp-mini">
        ${label?`<span class="hp-mini-label">${escapeHTML(label)}</span>`:''}
        <div class="hp-mini-track"><div class="hp-mini-fill ${cls}" style="width:${pct}%;"></div></div>
        <span class="hp-mini-val">${curN}/${maxN}${tempN>0?` <span style="color:var(--cyan);">+${tempN}🛡</span>`:''}</span>
      </div>
    `;
  }

  function portraitHTML(imageUrl, name, size){
    const cls = size==='sm' ? 'portrait-sm' : 'portrait';
    if(imageUrl){
      return `<img class="${cls}" src="${escapeAttr(imageUrl)}" onerror="this.style.visibility='hidden'" />`;
    }
    const initial = (name||'?').trim().charAt(0).toUpperCase() || '?';
    return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:${size==='sm'?'14px':'20px'};">${initial}</div>`;
  }

  // Come portraitHTML, ma per il ritratto del TAMER: applica il ritaglio/zoom sul volto
  // impostato in player.html (portraitPosX/Y/portraitZoom), invece di mostrare l'immagine
  // intera. Se il tamer non ha ancora impostato una posizione, i default (50/50/100) equivalgono
  // a un semplice centraggio, quindi è sicuro usarla anche su schede vecchie senza quei campi.
  // Mostra la MINIATURA del Tamer (t.imageThumbUrl, impostata in player.html) se presente;
  // altrimenti l'immagine principale a corpo intero, semplicemente centrata.
  function tamerAvatarHTML(t, name, size){
    const cls = size==='sm' ? 'portrait-sm' : 'portrait';
    const src = t && (t.imageThumbUrl || t.imageUrl);
    if(src){
      return `<span class="${cls}" style="display:inline-block;overflow:hidden;position:relative;padding:0;">`
        + `<img src="${escapeAttr(src)}" onerror="this.parentElement.style.visibility='hidden'" style="width:100%;height:100%;object-fit:cover;display:block;" />`
        + `</span>`;
    }
    return portraitHTML('', name, size);
  }

  // Finché il Master non approva la scheda (dopo la Creazione Guidata), mostriamo un Digitama
  // al posto dell'immagine — anche se il giocatore ha già impostato un'immagine.
  function digimonPortraitHTML(d, size){
    if(!d.approved){
      const cls = size==='sm' ? 'portrait-sm' : 'portrait';
      if(EGG_IMAGE_URL) return `<img class="${cls}" src="${escapeAttr(EGG_IMAGE_URL)}" />`;
      return `<div class="${cls}" style="display:flex;align-items:center;justify-content:center;font-size:${size==='sm'?'20px':'32px'};background:radial-gradient(circle at 35% 30%, #fff8e6, #f0d9a0 60%, #d9b976);border-radius:50%;">🥚</div>`;
    }
    return portraitHTML(bestDigimonImage(null, d.name, d.imageUrl), d.name, size);
  }

  function dexFilterBarHTML(entries){
    const allCats = new Set();
    (entries||[]).forEach(e=>(e.categories||[]).forEach(c=>allCats.add(c)));
    if(allCats.size===0) return '';
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
      ${Array.from(allCats).sort().map(c=>`
        <span class="tag" data-filter-cat="${escapeAttr(c)}" style="cursor:pointer;${dexActiveFilters.includes(c)?'background:rgba(53,232,201,0.15);border-color:var(--cyan);color:var(--cyan);':''}">${escapeHTML(c)}</span>
      `).join('')}
      ${dexActiveFilters.length>0 ? `<span class="tag" data-filter-cat="__clear__" style="cursor:pointer;color:var(--danger);border-color:var(--danger);">× azzera filtri</span>` : ''}
    </div>`;
  }

  function dexListHTML(entries, canEdit){
    dexCanEditGlobal = canEdit;
    if(!entries || entries.length===0) return '<div class="muted">Nessun Digimon ancora registrato nel Dex.</div>';
    const filterBar = dexFilterBarHTML(entries);
    const filtered = dexActiveFilters.length===0 ? entries : entries.filter(e=>(e.categories||[]).some(c=>dexActiveFilters.includes(c)));
    if(filtered.length===0) return filterBar + '<div class="muted">Nessun Digimon corrisponde ai filtri selezionati.</div>';
    return filterBar + filtered.slice().reverse().map(e=>{
      const bs = e.base_stats || {};
      const hasStats = bs.baseAccuracy || bs.baseDamage || bs.baseDodge || bs.baseArmor || bs.baseHealth;
      if(!canEdit && !e.discovered){
        return `
        <div class="roster-item" id="dex-item-${e.id}">
          <div style="display:flex;gap:10px;align-items:center;">
            <div class="portrait-sm" style="display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-family:'Share Tech Mono',monospace;">?</div>
            <div><span class="name" style="color:var(--text-mute);">???</span><div class="muted" style="font-size:10px;">Non ancora incontrato</div></div>
          </div>
        </div>`;
      }
      return `
      <div class="roster-item" id="dex-item-${e.id}">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          ${portraitHTML(e.image_url, e.name, 'sm')}
          <div style="flex:1;">
            <div class="flex-between">
              <div><span class="name">${escapeHTML(e.name)}</span><span class="tag" style="margin-left:6px;">${escapeHTML(e.stage)}</span>${canEdit ? `<span class="tag" style="margin-left:4px;color:${e.discovered?'var(--cyan)':'var(--text-mute)'};border-color:${e.discovered?'var(--cyan-dim)':'var(--line)'};">${e.discovered?'scoperto':'nascosto'}</span>` : ''}</div>
              ${canEdit ? `<button class="btn ghost small" data-dex-edit="${e.id}">Modifica</button>` : ''}
            </div>
            ${e.description ? `<div class="sub" style="margin-top:3px;">${escapeHTML(e.description)}</div>` : ''}
            ${hasStats ? `<div class="muted" style="margin-top:4px;font-size:10px;">ACC ${bs.baseAccuracy||0} · DMG ${bs.baseDamage||0} · DODGE ${bs.baseDodge||0} · ARM ${bs.baseArmor||0} · HP ${bs.baseHealth||0}</div>` : ''}
            ${e.categories && e.categories.length ? `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">${attributeBadgeHTML(splitCategoriesAttribute(e.categories).attribute)}${splitCategoriesAttribute(e.categories).family.map(c=>`<span class="tag" style="font-size:9px;">${escapeHTML(c)}</span>`).join('')}</div>` : ''}
            ${e.evolutions && e.evolutions.length ? evolutionsReadonlyHTML(e.evolutions) : ''}
            ${e.qualities && e.qualities.length ? `<div class="muted" style="margin-top:4px;">Qualities: ${computeDpSpent(e.qualities)}/${e.dp_total||0} DP (${e.qualities.length})</div>` : ''}
            ${e.added_by ? `<div class="muted" style="margin-top:2px;">aggiunto da ${escapeHTML(e.added_by)}</div>` : ''}
          </div>
        </div>
        <div id="dex-edit-form-${e.id}"></div>
      </div>
    `;
    }).join('');
  }

    let localQual = (entry.qualities || []).slice();
    el.innerHTML = `
      <div class="divider"></div>
      <div class="field"><label>Nome</label><input type="text" id="dex-e-name-${entry.id}" value="${escapeAttr(entry.name)}" /></div>

        <div class="field"><label>Armor</label><input type="number" id="dex-e-arm-${entry.id}" value="${bs.baseArmor||0}" min="0" /></div>
      </div>

        <input type="text" id="dex-e-evoimg-${entry.id}" placeholder="URL immagine (opz.)" style="flex:2;" />

      <div class="muted" style="margin:8px 0 4px;">Qualities</div>

    bindEvo();
    document.getElementById('dex-e-evoadd-'+entry.id).onclick = ()=>{
      const n = document.getElementById('dex-e-evoname-'+entry.id).value.trim();
      if(!n) return;
      localEvo.push({ name:n, imageUrl: document.getElementById('dex-e-evoimg-'+entry.id).value.trim() });
      document.getElementById('dex-e-evoname-'+entry.id).value='';
      document.getElementById('dex-e-evoimg-'+entry.id).value='';
      document.getElementById('dex-e-evolist-'+entry.id).innerHTML = evolutionsEditableHTML(localEvo);
      bindEvo();
    };
    const bindQual = ()=>{
      document.querySelectorAll(`#dex-e-quallist-${entry.id} [data-rmquality]`).forEach(btn=>{
        btn.onclick = ()=>{
          localQual.splice(Number(btn.getAttribute('data-rmquality')),1);

          bindQual();
        };
      });
    };

    document.getElementById('dex-e-qualadd-'+entry.id).onclick = ()=>{
      const name = document.getElementById('dex-e-qualname-'+entry.id).value.trim();
      if(!name) return;
      const cost = Number(document.getElementById('dex-e-qualcost-'+entry.id).value)||0;
      const category = document.getElementById('dex-e-qualcat-'+entry.id).value.trim();
      const description = document.getElementById('dex-e-qualdesc-'+entry.id).value.trim();
      localQual.push({ name, cost, category, description });
      document.getElementById('dex-e-qualname-'+entry.id).value='';
      document.getElementById('dex-e-qualcost-'+entry.id).value='1';
      document.getElementById('dex-e-qualcat-'+entry.id).value='';
      document.getElementById('dex-e-qualdesc-'+entry.id).value='';
      document.getElementById('dex-e-quallist-'+entry.id).innerHTML = qualitiesEditableHTML(localQual);
      bindQual();
    };
    document.getElementById('dex-e-cancel-'+entry.id).onclick = ()=>{ el.innerHTML=''; dexEditOpenId = null; };
    document.getElementById('dex-e-save-'+entry.id).onclick = async ()=>{
      const fields = {
        name: document.getElementById('dex-e-name-'+entry.id).value.trim(),
        stage: document.getElementById('dex-e-stage-'+entry.id).value,
        description: document.getElementById('dex-e-desc-'+entry.id).value.trim(),
        imageUrl: document.getElementById('dex-e-img-'+entry.id).value.trim(),
        categories: [document.getElementById('dex-e-attribute-'+entry.id).value, ...document.getElementById('dex-e-family-'+entry.id).value.split(',').map(s=>s.trim()).filter(Boolean)].filter(Boolean),
        baseStats: {
          baseAccuracy: Number(document.getElementById('dex-e-acc-'+entry.id).value)||0,
          baseDamage: Number(document.getElementById('dex-e-dmg-'+entry.id).value)||0,
          baseDodge: Number(document.getElementById('dex-e-dodge-'+entry.id).value)||0,
          baseArmor: Number(document.getElementById('dex-e-arm-'+entry.id).value)||0,
          baseHealth: Number(document.getElementById('dex-e-hp-'+entry.id).value)||0
        },
        evolutions: localEvo,
        qualities: localQual,
        dpTotal: Number(document.getElementById('dex-e-dptotal-'+entry.id).value)||0,
        discovered: document.getElementById('dex-e-discovered-'+entry.id).checked
      };
      const ok = await updateDexEntry(code, entry.id, fields);
      const st = document.getElementById('dex-e-status-'+entry.id);
      if(ok){
        Object.assign(entry, { name:fields.name, stage:fields.stage, description:fields.description, image_url:fields.imageUrl, base_stats:fields.baseStats, evolutions:fields.evolutions, categories:fields.categories, qualities:fields.qualities, dp_total:fields.dpTotal, discovered:fields.discovered });
        el.innerHTML='';
        dexEditOpenId = null;
        const dexLive = document.getElementById('dex-live');
        if(dexLive){ dexLive.innerHTML = dexListHTML(cachedDex, true); bindDexEditButtons(code); }
      } else {
        st.style.color='var(--danger)'; st.textContent = 'Errore: ' + (lastApiError||'');
      }
    };
  }

  function bindDexEditButtons(code){
    document.querySelectorAll('[data-dex-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute('data-dex-edit');
        const entry = cachedDex.find(e=>String(e.id)===String(id));
        if(entry){ dexEditOpenId = id; renderDexEditForm(code, entry); }
      };
    });
  }

  function bindDexForm(code, username){
    const btn = document.getElementById('btn-dex-add');
    if(!btn) return;

    const bindAddEvoRemove = ()=>{
      const listEl = document.getElementById('dex-add-evolist');
      if(!listEl) return;
      listEl.querySelectorAll('[data-rmevo]').forEach(b=>{
        b.onclick = ()=>{
          dexAddEvolutions.splice(Number(b.getAttribute('data-rmevo')),1);
          listEl.innerHTML = evolutionsEditableHTML(dexAddEvolutions);
          bindAddEvoRemove();
        };
      });
    };
    bindAddEvoRemove();
    const evoAddBtn = document.getElementById('btn-dex-evo-add');
    if(evoAddBtn){
      evoAddBtn.onclick = ()=>{
        const n = document.getElementById('dex-evo-name').value.trim();
        if(!n) return;
        dexAddEvolutions.push({ name:n, imageUrl: document.getElementById('dex-evo-img').value.trim() });
        document.getElementById('dex-evo-name').value='';
        document.getElementById('dex-evo-img').value='';
        document.getElementById('dex-add-evolist').innerHTML = evolutionsEditableHTML(dexAddEvolutions);
        bindAddEvoRemove();
      };
    }

    btn.onclick = async ()=>{
      const name = document.getElementById('dex-name').value.trim();
      const stage = document.getElementById('dex-stage').value;
      const description = document.getElementById('dex-desc').value.trim();
      const imageUrl = document.getElementById('dex-img').value.trim();
      const attributeSel = document.getElementById('dex-attribute');
      const attribute = attributeSel ? attributeSel.value : '';
      const familyInput = document.getElementById('dex-family');
      const family = familyInput ? familyInput.value.split(',').map(s=>s.trim()).filter(Boolean) : [];
      const categories = [attribute, ...family].filter(Boolean);
      const statusEl = document.getElementById('dex-status');
      if(!name){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Serve almeno un nome.'; return; }
      const baseStats = {
        baseAccuracy: Number((document.getElementById('dex-acc')||{}).value)||0,
        baseDamage: Number((document.getElementById('dex-dmg')||{}).value)||0,
        baseDodge: Number((document.getElementById('dex-dodge')||{}).value)||0,
        baseArmor: Number((document.getElementById('dex-arm')||{}).value)||0,
        baseHealth: Number((document.getElementById('dex-hp')||{}).value)||0
      };
      const discoveredCheckbox = document.getElementById('dex-discovered');
      const discovered = discoveredCheckbox ? discoveredCheckbox.checked : false;
      const d = await addDexEntry(code, { name, stage, description, imageUrl, addedBy: username, categories, baseStats, evolutions: dexAddEvolutions, discovered });
      if(d && d.entry){
        statusEl.style.color = 'var(--text-mute)';
        statusEl.textContent = 'Aggiunto al Dex.';
        document.getElementById('dex-name').value='';
        document.getElementById('dex-desc').value='';
        document.getElementById('dex-img').value='';
        if(attributeSel) attributeSel.value='';
        if(familyInput) familyInput.value='';
        ['dex-acc','dex-dmg','dex-dodge','dex-arm','dex-hp'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value='0'; });
        dexAddEvolutions = [];
        if(discoveredCheckbox) discoveredCheckbox.checked = false;
        const evoListEl = document.getElementById('dex-add-evolist');
        if(evoListEl){ evoListEl.innerHTML = evolutionsEditableHTML(dexAddEvolutions); bindAddEvoRemove(); }
        cachedDex.push(d.entry);
        const dexLive = document.getElementById('dex-live');
        if(dexLive){ dexLive.innerHTML = dexListHTML(cachedDex, true); bindDexEditButtons(code); }
      } else {
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = 'Errore: ' + (lastApiError || 'sconosciuto');
      }
    };
  }

  // ---------- PLAYER VIEW (shell built once, live parts patched by poll) ----------

    root.innerHTML = `

    document.getElementById('btn-send-action').onclick = async ()=>{

      const raw = ta.value.trim();
      if(!raw) return;
      if(playerChatMode==='subgroup' && playerActiveSubgroupId){
        const subMeta = {};
        if(pendingActionImageUrl) subMeta.image = pendingActionImageUrl;
        // Vedi subgroupLocationKey: tagga con la posizione effettiva del sottogruppo, non quella
        // del gruppo intero, altrimenti un sottogruppo separato non viene mai "riconosciuto".
        subMeta.location = subgroupLocationKey((cachedSubgroups||[]).find(g=>g.id===playerActiveSubgroupId));
        await pushPrivateLog(code, 'subgroup:'+playerActiveSubgroupId, { who: displayName(me), role:'player', text: raw, meta: subMeta });
        ta.value='';
        pendingActionImageUrl = null;
        const ap = document.getElementById('action-img-preview');
        if(ap) ap.innerHTML = '';
        await refreshPlayerLogDisplay(code, me);
        return;
      }
      if(playerChatMode==='private'){
        // Stesso trattamento dell'immagine allegata della chat pubblica qui sotto (pendingActionImageUrl
        // è condiviso tra le due modalità, dato che usano lo stesso widget #action-img-*): senza questo
        // l'immagine restava selezionata nel widget ma non veniva mai inviata in privato.
        const privTextMeta = {};
        if(pendingActionImageUrl) privTextMeta.image = pendingActionImageUrl;
        // Vedi memberLocationKey: tagga con la posizione effettiva del giocatore (se separato
        // dal gruppo), non quella del gruppo intero.
        privTextMeta.location = memberLocationKey(me);

        ta.value='';
        pendingActionImageUrl = null;

        await refreshPlayerLogDisplay(code, me);
        return;

      const rollResult = await tryParseRollShortcut(raw, me);
      const resEl = document.getElementById('action-roll-result');
      if(rollResult){
        if(rollResult.dice && resEl){
          resEl.innerHTML = `${diceRowHTML(rollResult.dice)}<span class="roll-total">${rollResult.resultLabel}</span>${rollResult.verdict?`<span class="roll-verdict ${rollResult.verdict.cls}">${rollResult.verdict.label}</span>`:''}`;
        } else if(resEl){
          resEl.innerHTML = '';
        }
        const rollMeta = rollResult.dice ? { dice: rollResult.dice } : {};
        if(pendingActionImageUrl) rollMeta.image = pendingActionImageUrl;
        await pushLog(code, { who: displayName(me), role:'roll', text: rollResult.text, meta: Object.keys(rollMeta).length ? rollMeta : null });
      } else {
        const textMeta = {};
        if(pendingActionImageUrl) textMeta.image = pendingActionImageUrl;
        await pushLog(code, { who: displayName(me), role:'player', text: raw, meta: Object.keys(textMeta).length ? textMeta : null });
      }
      ta.value='';
      pendingActionImageUrl = null;
      const actionPreview = document.getElementById('action-img-preview');
      if(actionPreview) actionPreview.innerHTML = '';
      refreshLiveParts();

  const ATTR_ABBR = { agility:'AGI', body:'BODY', charisma:'CAR', intelligence:'INT', willpower:'WILL' };
  let editingSkills = false;

  // Nel pannello Master ogni card di un giocatore ha un containerId tipo 'm-tamer-3', 'm-skills-3',
  // 'm-digimon-3', 'm-inventory-3' (stesso indice, prefisso diverso). Quando una card deve
  // aggiornarne un'altra "gemella" dello stesso giocatore (es. Skills che aggiorna anche Tamer),
  // serve derivare il containerId corretto — altrimenti si rischia di aggiornare il default
  // 'tamer-card' che nel pannello Master non esiste, e la chiamata non fa nulla silenziosamente.
  function siblingCardId(containerId, targetCard){
    if(containerId && containerId.indexOf('m-')===0){
      const idx = containerId.split('-').pop();
      return 'm-'+targetCard+'-'+idx;
    }
    return targetCard+'-card';
  }

  function renderSkillsCard(me, containerId){
    containerId = containerId || 'skills-card';
    const cardEl = document.getElementById(containerId);
    if(!cardEl) return;
    const t = me.tamer;
    if(!editingSkills){
      const gp = Number(t.unspentGrowthPoints||0);
      cardEl.innerHTML = `
        <div class="flex-between"><div class="section-title" style="margin:0;border:none;padding:0;">Skill</div>
        <button class="btn small" id="btn-edit-skills">Modifica</button></div>
        ${gp>0 ? `
          <div class="hud-frame" style="padding:8px;margin:10px 0;border-color:var(--cyan-dim);">
            <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Growth Points disponibili</span><span class="mono" style="color:var(--cyan);">${gp}</span></div>
            <div class="row">
              <select id="gp-skill-select" style="flex:2;">${SKILL_DEFS.map(d=>`<option value="${d.key}">${escapeHTML(d.label)}</option>`).join('')}</select>
              <button class="btn small" id="btn-gp-skill" style="flex:1;">+1 Skill (1 GP)</button>
            </div>
            ${gp>=3 ? `
            <div class="row" style="margin-top:6px;">
              <select id="gp-attr-select" style="flex:2;">
                <option value="agility">Agility</option><option value="body">Body</option><option value="charisma">Charisma</option><option value="intelligence">Intelligence</option><option value="willpower">Willpower</option>
              </select>
              <button class="btn small" id="btn-gp-attr" style="flex:1;">+1 Attributo (3 GP)</button>
            </div>` : ''}
            <div class="muted" id="gp-status" style="margin-top:4px;"></div>
          </div>
        ` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;">
          ${SKILL_DEFS.map(def=>`
            <div class="stat-box" style="text-align:left;padding:6px 8px;">
              <div class="l" style="margin-bottom:2px;">${escapeHTML(def.label)}</div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span class="v" style="font-size:15px;">${Number(t.skills[def.key])||0}</span>
                <span style="display:flex;align-items:center;gap:4px;">
                  <span class="muted" style="font-size:9px;">${def.attrs.map(a=>ATTR_ABBR[a]).join('/')}</span>
                  <button class="roll-btn" data-roll-skill="${def.key}" title="Tira ${escapeAttr(def.label)}">🎲</button>
                </span>
              </div>
            </div>
          `).join('')}
        </div>
        <div id="skill-roll-panel-${containerId}" style="margin-top:12px;"></div>
      `;
      document.getElementById('btn-edit-skills').onclick = ()=>{ editingSkills = true; renderSkillsCard(me, containerId); };
      const gpSkillBtn = document.getElementById('btn-gp-skill');
      if(gpSkillBtn){
        gpSkillBtn.onclick = async ()=>{
          const key = document.getElementById('gp-skill-select').value;
          const def = SKILL_DEFS.find(d=>d.key===key);
          const max = skillMax(t, def);
          const statusEl = document.getElementById('gp-status');
          if(Number(t.skills[key])||0 >= max){ statusEl.style.color='var(--danger)'; statusEl.textContent = `${def.label} è già al massimo consentito (${max}).`; return; }
          t.skills[key] = (Number(t.skills[key])||0) + 1;
          t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 1;
          await saveMember(session.code, me);
          renderSkillsCard(me, containerId);
        };
      }
      const gpAttrBtn = document.getElementById('btn-gp-attr');
      if(gpAttrBtn){
        gpAttrBtn.onclick = async ()=>{
          const attr = document.getElementById('gp-attr-select').value;
          const statusEl = document.getElementById('gp-status');
          const current = Number(t[attr])||0;
          const milestone = cachedProgression ? Number(cachedProgression.milestone||0) : 0;
          let cap = 5;
          if(milestone>=6) cap = 7; else if(milestone>=3) cap = 6;
          if(current >= cap){ statusEl.style.color='var(--danger)'; statusEl.textContent = `Tetto attuale per gli Attributi: ${cap} (Milestone ${milestone}).`; return; }
          t[attr] = current + 1;
          t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 3;
          await saveMember(session.code, me);
          renderSkillsCard(me, containerId);
          renderTamerCard(me, siblingCardId(containerId,'tamer'));
        };
      }
      cardEl.querySelectorAll('[data-roll-skill]').forEach(btn=>{
        btn.onclick = ()=>{ openSkillRollPanel(me, btn.getAttribute('data-roll-skill'), containerId); };
      });
    } else {
      cardEl.innerHTML = `
        <div class="section-title">Skill — Modifica</div>
        <div class="muted" style="margin-bottom:10px;">Una Skill non può superare il valore più alto tra i suoi Attributi collegati.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          ${SKILL_DEFS.map(def=>{
            const max = skillMax(t, def);
            return `
            <div class="field" style="margin-bottom:6px;">
              <label>${escapeHTML(def.label)} <span class="muted">(max ${max}, ${def.attrs.map(a=>ATTR_ABBR[a]).join('/')})</span></label>
              <input type="number" min="0" max="${max}" id="e-sk-${def.key}" value="${Number(t.skills[def.key])||0}" />
            </div>`;
          }).join('')}
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn ghost" id="btn-cancel-skills">Annulla</button>
          <button class="btn solid" id="btn-save-skills">Salva</button>
        </div>
        <div class="muted" id="save-status-skills" style="margin-top:6px;"></div>
      `;
      document.getElementById('btn-cancel-skills').onclick = ()=>{ editingSkills = false; renderSkillsCard(me, containerId); };
      document.getElementById('btn-save-skills').onclick = async ()=>{
        SKILL_DEFS.forEach(def=>{
          const el = document.getElementById('e-sk-'+def.key);
          if(!el) return;
          const max = skillMax(t, def);
          let val = Number(el.value)||0;
          if(val > max) val = max;
          if(val < 0) val = 0;
          me.tamer.skills[def.key] = val;
        });
        const newMaxWounds = 3+Number(me.tamer.skills.endurance||0);
        if(me.tamer.currentWounds > newMaxWounds) me.tamer.currentWounds = newMaxWounds;
        const ok = await saveMember(session.code, me);
        const st = document.getElementById('save-status-skills');
        st.style.color = ok ? 'var(--text-mute)' : 'var(--danger)';
        st.textContent = ok ? 'Salvato.' : ('Errore: '+(lastApiError||''));
        if(ok){ editingSkills = false; renderSkillsCard(me, containerId); renderTamerCard(me, siblingCardId(containerId,'tamer')); }
      };
    }
  }

    { attr:'manipulate', skill:true, threshold:5, name:'Fakeout', text:'Se il Tamer usa 2 Azioni per Dirigere il proprio Digimon migliorandone l\'Accuracy, e l\'Attacco con quel bonus manca, il bersaglio subisce -2 al Dodge invece di -1 da quell\'Attacco.' },
    { attr:'manipulate', skill:true, threshold:7, name:'Hacking Pride', text:'Special Order "YOU\'VE ALREADY LOST" (1 Azione, una volta a combattimento): un Direct negativo contro un nemico, penalità al prossimo Pool di Accuracy o Dodge a scelta del Tamer. Non si può usare Direct lo stesso turno.', order:'hackingPride', cost:1, once:'combat' },

    { attr:'perform', skill:true, threshold:3, name:'Endless Dream', text:'Senza tirare nulla, un\'esibizione del Tamer dà IP Temporanei agli alleati, pari ai propri punti in Performance sopra 2, da dividere come preferisce (non a se stesso). Max 2 IP Temporanei a testa. Una volta a Rest.' },
    { attr:'perform', skill:true, threshold:5, name:'Personal Cheerleader', text:'Un Digimon che beneficia del Direct del Tamer, tirando un Accuracy o Dodge Pool, può ritirare fino a 2 dadi (deve tenere il nuovo risultato).' },
    { attr:'perform', skill:true, threshold:7, name:'Distracting Gesture', text:'Special Order "HEY, OVER HERE" (Interrupt, una volta a combattimento): quando un nemico attacca un alleato, dimezza i dadi tirati dal nemico per l\'Attacco.', order:'distractingGesture', cost:0, once:'combat' },

    { attr:'persuasion', skill:true, threshold:3, name:'Charming Influence', text:'Se il Tamer supera un Check di Persuasion in Roleplay, può "usare il fascino": i PNG bersaglio diventano amichevoli per una durata in minuti pari ai propri punti in Persuasion. Una volta a Rest; un PNG può subirlo una sola volta tra un Rest e l\'altro.' },
    { attr:'persuasion', skill:true, threshold:5, name:'Be the Winners', text:'Con 1 Azione extra, il Tamer può dividere il bonus del Direct fra il proprio Digimon e un altro Digimon consenziente, senza penalità per Dirigere il Digimon altrui (il proprio Digimon deve sempre ricevere almeno +2).' },
    { attr:'persuasion', skill:true, threshold:7, name:'Next Order', text:'Special Order "WE CAN DO THIS, TOGETHER" (1 Azione, una volta a combattimento): concede i benefici di un Direct a 2 alleati consenzienti (proprio Digimon incluso), senza penalità per Digimon altrui.', order:'nextOrder', cost:1, once:'combat' },

    { attr:'decipherIntent', skill:true, threshold:3, name:'Cyber Sleuth', text:'Il giocatore può fare una domanda al GM su un\'azione immediatamente disponibile, e il GM deve rispondere se avrà esiti buoni, cattivi o entrambi. Usi pari ai punti in Decipher Intent sopra 2, recuperati a ogni Rest.' },
    { attr:'decipherIntent', skill:true, threshold:5, name:'Best Laid Plans', text:'Usando Hold Action per sommare Intelligence all\'Accuracy/Dodge del Digimon, +1 Successo al risultato finale. Un nemico che stava investigando/interrogando o mentendo apertamente è considerato Sorpreso se il Tamer entra in Combattimento contro di lui.' },
    { attr:'decipherIntent', skill:true, threshold:7, name:'Predictable', text:'Special Order "I ALREADY KNOW YOUR NEXT MOVE" (2 Azioni, una volta a combattimento): dichiara un Hold Action con Trigger su qualsiasi Azione (Intercede incluse) del nemico bersaglio.', order:'predictable', cost:2, once:'combat' },

    { attr:'survival', skill:true, threshold:3, name:'Glorious World', text:'Senza tirare nulla, il Tamer cucina un pasto che dà Wound Box Temporanee a chi lo mangia, pari ai propri punti in Survival sopra 2, fino al prossimo Rest. Un personaggio ne beneficia una sola volta tra un Rest e l\'altro.' },
    { attr:'survival', skill:true, threshold:5, name:'Trailblazer', text:'Il Tamer ha un innato senso dell\'orientamento: sa sempre dov\'è il nord e la strada esatta per tornare all\'ultimo insediamento civilizzato visitato.' },
    { attr:'survival', skill:true, threshold:7, name:'Survival Instinct', text:'Special Order "FLOW WITH IT" (Interrupt, una volta a combattimento): il Danno di un Attacco subito viene dimezzato dopo l\'Armor e nessun Danno Unalterable viene applicato.', order:'survivalInstinct', cost:0, once:'combat' },

    { attr:'knowledge', skill:true, threshold:3, name:'Academic Advice', text:'Aiutando in un Check di Teamwork, il Tamer può usare un Check di Knowledge al posto di quello richiesto. Su Successo, il bonus dato aumenta per ogni punto in Knowledge sopra 2.' },
    { attr:'knowledge', skill:true, threshold:5, name:'Living Encyclopedia', text:'Se un Check di Knowledge per ricordare informazioni avrebbe TN 15 o meno, il Tamer può Riuscire Criticamente in automatico. Una volta a Rest.' },
    { attr:'knowledge', skill:true, threshold:7, name:'Hacker\'s Memory', text:'Special Order "I KNOW ALL YOUR TRICKS" (2 Azioni, una volta a combattimento): contro un nemico già affrontato, +1 alla Potenza delle proprie Quality/Effetti basati su Stat Derivate contro di lui, oppure -1 a quelle del nemico.', order:'hackersMemory', cost:2, once:'combat' },

    { attr:'fortitude', skill:true, threshold:3, name:'Calming Influence', text:'Se un altro Tamer fallisce un Torment Check, questo Tamer può fargli ritirare il Check con un bonus pari ai propri punti in Fortitude. Se diventa un Successo, entrambi i Tamer guadagnano 1 IP. Una volta a Rest.' },
    { attr:'fortitude', skill:true, threshold:5, name:'Team Player', text:'Partecipando in Teamwork con alleati: se aiuta, l\'alleato può ritirare gli 1 del Check (tenendo il nuovo risultato); se è chi inizia il Check, può ignorare il Fallimento Critico di un alleato.' },
    { attr:'fortitude', skill:true, threshold:7, name:'Take the Lead', text:'Special Order "NOW FOCUS" (1 Azione, una volta a combattimento): +5 a un Check del proprio Digimon, anche dopo aver visto il risultato; usabile come Interrupt se il Check avviene fuori turno.', order:'takeTheLead', cost:1, once:'combat' },

    { attr:'bravery', skill:true, threshold:3, name:'Break the Chain', text:'Il Tamer ottiene un bonus ai Torment Check pari ai propri punti in Bravery. Se Calming Influence viene usato per ritirare un Torment Check con questo bonus, si prende il bonus più alto invece di sommarli.' },
    { attr:'bravery', skill:true, threshold:5, name:'With the Will', text:'Se il Tamer dovrebbe fare un Torment Check, il proprio Digimon può usare un\'Interrupt Action per trasformarlo in un Teamwork Check, tirando un Check di Bravery (usando DOS) per aiutare. Una volta a Rest.' },
    { attr:'bravery', skill:true, threshold:7, name:'Heroic Exemplar', text:'Special Order "SHOW THEM WHAT YOU\'RE MADE OF" (2 Azioni, una volta a combattimento): dopo un Attacco andato a segno, Digimon e tutti gli alleati ottengono [BASTION 1] (Durata 3).', order:'heroicExemplar', cost:2, once:'combat' },

    { attr:'awareness', skill:true, threshold:3, name:'Hyper Alert', text:'Senza tirare, il Tamer può usare un Check di Awareness al posto del Check normale per evitare pericoli a sorpresa. Il Digimon del Tamer ottiene un bonus all\'Iniziativa per ogni punto in Awareness sopra 2.' },
    { attr:'awareness', skill:true, threshold:5, name:'Danger Sense', text:'Quando il Digimon userebbe un\'Interrupt Action, il Tamer può spendere 1 Azione propria al posto del Digimon. Una volta a Rest.' },
    { attr:'awareness', skill:true, threshold:7, name:'Realization', text:'Special Order "I\'VE FIGURED IT OUT" (2 Azioni, una volta a combattimento): infligge [EXPLOIT 3] a un nemico, bypassando immunità da Overwrite o Resistance, fino a fine combattimento.', order:'realization', cost:2, once:'combat' }
  ];

  const SKILL_LABEL_BY_KEY = { evade:'EVADE', precision:'PREC', stealth:'STEALTH', athletics:'ATHL', endurance:'END', featsOfStrength:'FOS', manipulate:'MANIP', perform:'PERF', persuasion:'PERS', decipherIntent:'D.INTENT', survival:'SURV', knowledge:'KNOW', fortitude:'FORT', bravery:'BRAV', awareness:'AWARE' };
  function talentAbbr(t){ return t.skill ? (SKILL_LABEL_BY_KEY[t.attr] || t.attr) : ATTR_ABBR[t.attr]; }

  function computeUnlockedTalents(tamer){
    const cfg = campaignConfig();
    const stdIdx = { 3:0, 5:1, 6:2, 7:3 };
    return TALENT_DEFS.filter(t => {
      const idx = stdIdx[t.threshold];
      const effectiveThreshold = idx!==undefined ? cfg.thresholds[idx] : t.threshold;
      const value = t.skill ? Number((tamer.skills && tamer.skills[t.attr])||0) : Number(tamer[t.attr]||0);
      return value >= effectiveThreshold;
    });
  }

  const STAGE_CREATION = {
    Fresh:    { dp:2,  startStat:1 },
    Baby:     { dp:5,  startStat:1 },
    Rookie:   { dp:10, startStat:2 },
    Champion: { dp:20, startStat:3 },
    Ultimate: { dp:30, startStat:4 },
    Mega:     { dp:40, startStat:5 }
  };

  function renderTamerCard(me, containerId){
    containerId = containerId || 'tamer-card';
    const cardEl = document.getElementById(containerId);
    if(!cardEl) return;
    const t = me.tamer;
    const maxW = 3 + Number(t.skills.endurance||0);
    if(!editingTamer){
      cardEl.innerHTML = `
        <div class="flex-between"><div class="section-title" style="margin:0;border:none;padding:0;">Scheda Tamer</div>
        <span><a href="player.html" target="_blank" class="btn ghost small" style="margin-right:4px;text-decoration:none;">✏️ Scheda Completa</a><button class="btn small" id="btn-edit-tamer">Modifica</button>${containerId && containerId.indexOf('m-tamer-')===0 ? `<button class="btn ghost small" id="btn-reset-tamer" style="margin-left:4px;color:var(--danger);border-color:var(--danger);">🗑️ Azzera</button>` : ''}</span></div>
        <div class="sheet-head" style="margin-top:12px;">
          ${tamerAvatarHTML(t, displayName(me))}
          <div class="info"><div class="nm">${escapeHTML(displayName(me))}</div><div class="tg">AGI ${t.agility} · BODY ${t.body} · CAR ${t.charisma} · INT ${t.intelligence} · WILL ${t.willpower}</div></div>
          <div style="margin-left:auto;text-align:center;">
            ${t.digiviceImageUrl
              ? `<img src="${escapeAttr(t.digiviceImageUrl)}" onerror="this.style.visibility='hidden'" style="width:44px;height:44px;object-fit:contain;border:1px solid var(--cyan-dim);border-radius:var(--radius);background:var(--panel-2);padding:3px;" />`
              : `<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:var(--radius);color:var(--text-mute);font-size:18px;">📟</div>`}
            <div class="muted" style="font-size:9px;margin-top:2px;">Digivice</div>
          </div>
        </div>
        ${barHTML('Caselle Ferita', t.currentWounds, maxW, 'hp', 'tamer-w-minus', 'tamer-w-plus')}
        <div class="divider"></div>
        <div class="flex-between" style="margin-bottom:8px;">
          <span class="muted">Inspiration Points</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="mono" style="color:var(--cyan);font-size:16px;">${t.inspirationPoints||0}</span>
            <button class="btn ghost small" id="ip-minus">−</button>
            <button class="btn ghost small" id="ip-plus">+</button>
          </span>
        </div>
        ${Number(t.tormentPenalty||0)!==0 ? `<div class="muted" style="color:var(--danger);margin-bottom:8px;">Penalità Torment attiva: ${t.tormentPenalty} su Tiri/bonus finché non fai un Rest.</div>` : ''}
        <div class="divider"></div>
        <div class="muted" style="margin-bottom:6px;">Aspects — tratti di personalità che danno bonus o penalità ai Check, a scelta del giocatore</div>
        <div class="roster-item" style="padding:8px;margin-bottom:6px;">
          <div class="flex-between"><b>Major</b><span class="mono">${t.majorAspect.usesLeft||0} usi</span></div>
          <div class="muted" style="font-size:10px;margin-top:2px;">Un tratto prominente della personalità (es. "Track Star: atletico ma competitivo") — dà +4 a un Check pertinente, o -4 se ti giochi il lato negativo.</div>
          <div class="sub" style="margin:4px 0;">${escapeHTML(t.majorAspect.text)||'(non impostato — scrivilo in "Modifica")'}</div>
          ${(t.majorAspect.usesLeft||0)>0 ? `<button class="btn small" id="btn-aspect-major-use">Usa (+4 / −4)</button>` : ''}
        </div>
        <div class="roster-item" style="padding:8px;margin-bottom:6px;">
          <div class="flex-between"><b>Minor</b><span class="mono">${t.minorAspect.usesLeft||0} usi</span></div>
          <div class="muted" style="font-size:10px;margin-top:2px;">Un tratto più sottile, meno evidente del Major — dà +2 a un Check pertinente, o -2 se ti giochi il lato negativo.</div>
          <div class="sub" style="margin:4px 0;">${escapeHTML(t.minorAspect.text)||'(non impostato — scrivilo in "Modifica")'}</div>
          ${(t.minorAspect.usesLeft||0)>0 ? `<button class="btn small" id="btn-aspect-minor-use">Usa (+2 / −2)</button>` : ''}
        </div>
        <div class="divider"></div>
        <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Torments</span><button class="btn ghost small" id="btn-add-torment">+ Nuovo</button></div>
        <div id="torments-list">
          ${(t.torments||[]).length===0 ? '<div class="muted">Nessun Torment registrato.</div>' : t.torments.map((tor,ti)=>`
            <div class="roster-item" style="padding:8px;margin-bottom:6px;">
              <div class="flex-between"><b>${escapeHTML(tor.name)}</b><span class="mono">${tor.boxes}/10</span></div>
              <div class="flex-between" style="margin-top:6px;">
                ${tormentBoxesHTML(tor.boxes)}
                <span style="display:flex;gap:4px;">
                  <button class="btn ghost small" data-torment-minus="${ti}" style="padding:3px 9px;">−</button>
                  <button class="btn ghost small" data-torment-plus="${ti}" style="padding:3px 9px;">+</button>
                </span>
              </div>
              <div class="row" style="margin-top:6px;">
                <button class="btn ghost small" data-torment-remove="${ti}" style="flex:1;">Rimuovi</button>
                <button class="btn small" data-torment-check="${ti}" style="flex:1;" ${tor.usedThisRest?'disabled':''}>${tor.usedThisRest?'Già tentato (Rest)':'Torment Check'}</button>
              </div>
              <div class="muted" id="torment-result-${ti}" style="margin-top:4px;"></div>
            </div>
          `).join('')}
        </div>
        <div class="divider"></div>
        <div class="hud-frame" style="padding:10px;border-color:var(--cyan-dim);">
          <details ${computeUnlockedTalents(t).length>0?'open':''}>
            <summary class="mono" style="cursor:pointer;color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:0.05em;">⭐ Tamer Talents sbloccati — ${computeUnlockedTalents(t).length}</summary>
            <div style="margin-top:8px;">
              ${(()=>{ const unlocked = computeUnlockedTalents(t); return unlocked.length===0
                ? '<div class="muted">Nessun Talent ancora sbloccato (servono almeno 3 punti in un Attributo).</div>'
                : unlocked.map(tal=>`<div class="roster-item" style="padding:6px 8px;margin-bottom:4px;"><div class="flex-between"><b>${escapeHTML(tal.name)}</b><span class="tag">${talentAbbr(tal)} ${tal.threshold}+</span></div><div class="sub" style="margin-top:2px;">${escapeHTML(tal.text)}</div></div>`).join(''); })()}
            </div>
          </details>
        </div>
      `;
      document.getElementById('btn-edit-tamer').onclick = ()=>{ editingTamer = true; renderTamerCard(me, containerId); };
      const resetTamerBtn = document.getElementById('btn-reset-tamer');
      if(resetTamerBtn){
        resetTamerBtn.onclick = async ()=>{
          if(!window.confirm(`Azzerare la Scheda Tamer di ${displayName(me)}? Attributi, Skill, Torments, Aspetti e Inventario torneranno a zero e potrà rifare la Creazione Guidata. L'azione non è reversibile.`)) return;
          if(!window.confirm(`Sei sicuro? Questa è l'ultima conferma prima di azzerare definitivamente la Scheda Tamer di ${displayName(me)}.`)) return;
          me.tamer = defaultTamer();
          await saveMember(session.code, me);
          await pushLog(session.code, { who:'Master', role:'gm', text: `La Scheda Tamer di ${displayName(me)} è stata azzerata dal Master.` });
          renderTamerCard(me, containerId);
          refreshLiveParts();
        };
      }
      document.getElementById('tamer-w-minus').onclick = async ()=>{ me.tamer.currentWounds = Math.max(0, me.tamer.currentWounds-1); await saveMember(session.code, me); renderTamerCard(me, containerId); };
      document.getElementById('tamer-w-plus').onclick = async ()=>{ me.tamer.currentWounds = Math.min(maxW, me.tamer.currentWounds+1); await saveMember(session.code, me); renderTamerCard(me, containerId); };
      document.getElementById('ip-minus').onclick = async ()=>{ me.tamer.inspirationPoints = Math.max(0, (me.tamer.inspirationPoints||0)-1); await saveMember(session.code, me); renderTamerCard(me, containerId); };
      document.getElementById('ip-plus').onclick = async ()=>{ me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1; await saveMember(session.code, me); renderTamerCard(me, containerId); };
      const majorBtn = document.getElementById('btn-aspect-major-use');
      if(majorBtn) majorBtn.onclick = async ()=>{
        const asPenalty = window.confirm('OK = usa come bonus (+4, consuma 1 uso). Annulla = invoca la penalità (-4, ripristina l\'uso e guadagni 1 IP).');
        if(asPenalty){
          me.tamer.majorAspect.usesLeft = Math.max(0,(me.tamer.majorAspect.usesLeft||0)-1);
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Usa il Major Aspect "${me.tamer.majorAspect.text}" (+4 al prossimo Check).` });
        } else {
          me.tamer.majorAspect.usesLeft = 1;
          me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Invoca la penalità del Major Aspect "${me.tamer.majorAspect.text}" (-4), ripristina l'uso e guadagna 1 IP.` });
        }
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
        refreshLiveParts();
      };
      const minorBtn = document.getElementById('btn-aspect-minor-use');
      if(minorBtn) minorBtn.onclick = async ()=>{
        const asPenalty = window.confirm('OK = usa come bonus (+2, consuma 1 uso). Annulla = invoca la penalità (-2, ripristina entrambi gli usi).');
        if(asPenalty){
          me.tamer.minorAspect.usesLeft = Math.max(0,(me.tamer.minorAspect.usesLeft||0)-1);
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Usa il Minor Aspect "${me.tamer.minorAspect.text}" (+2 al prossimo Check).` });
        } else {
          me.tamer.minorAspect.usesLeft = 2;
          await pushLog(session.code, { who: displayName(me), role:'player', text: `Invoca la penalità del Minor Aspect "${me.tamer.minorAspect.text}" (-2), ripristina entrambi gli usi.` });
        }
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
        refreshLiveParts();
      };
      document.getElementById('btn-add-torment').onclick = async ()=>{
        const name = window.prompt('Nome del Torment:');
        if(!name) return;
        const boxesStr = window.prompt('Caselle segnate iniziali (0-10):', '4');
        const boxes = Math.max(0, Math.min(10, Number(boxesStr)||0));
        if(!me.tamer.torments) me.tamer.torments = [];
        me.tamer.torments.push({ name, boxes, usedThisRest:false });
        await saveMember(session.code, me);
        renderTamerCard(me, containerId);
      };
      cardEl.querySelectorAll('[data-torment-remove]').forEach(btn=>{
        btn.onclick = async ()=>{
          me.tamer.torments.splice(Number(btn.getAttribute('data-torment-remove')),1);
          await saveMember(session.code, me);
          renderTamerCard(me, containerId);
        };
      });
      cardEl.querySelectorAll('[data-torment-plus]').forEach(btn=>{
        btn.onclick = async ()=>{
          const tor = me.tamer.torments[Number(btn.getAttribute('data-torment-plus'))];
          tor.boxes = Math.min(10, (Number(tor.boxes)||0)+1);
          await saveMember(session.code, me);
          renderTamerCard(me, containerId);
        };
      });
      cardEl.querySelectorAll('[data-torment-minus]').forEach(btn=>{
        btn.onclick = async ()=>{
          const tor = me.tamer.torments[Number(btn.getAttribute('data-torment-minus'))];
          tor.boxes = Math.max(0, (Number(tor.boxes)||0)-1);
          await saveMember(session.code, me);
          renderTamerCard(me, containerId);
        };
      });
      cardEl.querySelectorAll('[data-torment-check]').forEach(btn=>{
        btn.onclick = async ()=>{
          const idx = Number(btn.getAttribute('data-torment-check'));
          const tor = me.tamer.torments[idx];
          if(!tor || tor.usedThisRest) return;
          const result = rollTormentCheck(tor.boxes);
          let outcomeText;
          if(result.outcome==='crit-success'){
            tor.boxes = Math.max(0, tor.boxes-1);
            me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
            tor.usedThisRest = true;
            outcomeText = 'Successo Critico! Cancella 1 Casella Torment e guadagna 1 IP.';
          } else if(result.outcome==='success'){
            me.tamer.inspirationPoints = (me.tamer.inspirationPoints||0)+1;
            tor.usedThisRest = true;
            outcomeText = 'Successo! Guadagna 1 IP.';
          } else if(result.outcome==='deep-crit-fail'){
            tor.boxes = Math.min(10, tor.boxes+1);
            me.tamer.tormentPenalty = -5;
            tor.usedThisRest = true;
            outcomeText = 'Fallimento Critico Profondo! +1 Casella Torment, penalità -5 fino al Rest.';
          } else if(result.outcome==='crit-fail'){
            me.tamer.tormentPenalty = -2;
            tor.usedThisRest = true;
            outcomeText = 'Fallimento Critico! Penalità -2 fino al Rest.';
          } else {
            outcomeText = 'Fallimento. Nessun effetto, si può ritentare più tardi.';
          }
          await saveMember(session.code, me);
          const resEl = document.getElementById('torment-result-'+idx);
          if(resEl) resEl.innerHTML = `${diceRowHTML(result.dice)} <b>${result.total}</b> vs TN ${result.tn} — ${outcomeText}`;
          await pushLog(session.code, { who: displayName(me), role:'roll', text: `Torment Check su "${tor.name}": 3d6[${result.dice.join(',')}]=${result.total} vs TN ${result.tn} → ${outcomeText}`, meta:{dice: result.dice} });
          if(tor.usedThisRest){ btn.disabled = true; btn.textContent = 'Già tentato (Rest)'; }
          refreshLiveParts();
        };
      });
    } else {
      cardEl.innerHTML = `
        <div class="section-title">Scheda Tamer — Modifica</div>
        <div class="field"><label>URL Immagine (opzionale)</label><input type="text" id="e-t-img" value="${escapeAttr(t.imageUrl)}" placeholder="https://..." /></div>
        <div class="field"><label>URL Immagine Digivice (opzionale)</label><input type="text" id="e-t-digivice-img" value="${escapeAttr(t.digiviceImageUrl)}" placeholder="https://..." /></div>
        <div class="grid-stats">
          ${statBox('AGI','e-t-agility',t.agility)}
          ${statBox('BODY','e-t-body',t.body)}
          ${statBox('CAR','e-t-charisma',t.charisma)}
          ${statBox('INT','e-t-intelligence',t.intelligence)}
          ${statBox('WILL','e-t-willpower',t.willpower)}
        </div>
        <div class="muted" style="margin-top:8px;">Endurance e le altre Skill si gestiscono nella card "Skill" qui sotto.</div>
        <div class="divider"></div>
