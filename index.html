  const EFFECT_QUALITY_MAP = {
    fear:'Basic Effect: Fear', slow:'Basic Effect: Slow', keen:'Basic Effect: Keen', swift:'Basic Effect: Swift',
    cleanse:'Basic Effect: Cleanse', root:'Basic Effect: Root', taunt:'Basic Effect: Taunt', push:'Basic Effect: Push', pull:'Basic Effect: Pull',
    lag:'Basic Effect: Lag', lead:'Basic Effect: Lead', tailwind:'Basic Effect: Tailwind', vague:'Basic Effect: Vague',
    confuse:'Advanced Effect: Confuse', distract:'Advanced Effect: Distract', dull:'Advanced Effect: Dull', frail:'Advanced Effect: Frail',
    sturdy:'Advanced Effect: Sturdy', sharpen:'Advanced Effect: Sharpen', nimble:'Advanced Effect: Nimble', exploit:'Advanced Effect: Exploit',
    burn:'Advanced Effect: Burn', poison:'Advanced Effect: Poison', shield:'Advanced Effect: Shield',
    heavy:'Advanced Effect: Heavy', freeze:'Advanced Effect: Freeze',
    fury:'Master Effect: Fury', pacify:'Master Effect: Pacify', debilitate:'Master Effect: Debilitate', bastion:'Master Effect: Bastion', daring:'Master Effect: Daring',
    paralyze:'Master Effect: Paralyze', rattled:'Master Effect: Rattled', shaken:'Master Effect: Shaken', weak:'Master Effect: Weak',
    strength:'Master Effect: Strength', vigil:'Master Effect: Vigil', vigor:'Master Effect: Vigor', steady:'Master Effect: Steady',
    regen:'Master Effect: Regen', ruin:'Master Effect: Ruin', doom:'Master Effect: Doom', blind:'Master Effect: Blind',
    dot:'Master Effect: Dot', stun:'Master Effect: Stun', immune:'Master Effect: Immune', deny:'Master Effect: Deny', haste:'Master Effect: Haste'
  };
  function hasAttributeAdvantage(atkAttr, defAttr){
    if(!atkAttr || !defAttr) return false;
    if(atkAttr==='Free' || defAttr==='Free' || atkAttr==='Variable' || defAttr==='Variable') return false;
    const table = { Vaccine:'Virus', Virus:'Data', Data:'Vaccine' };
    return table[atkAttr] === defAttr;
  }
  function getParticipantAttribute(p){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      return member ? (member.digimon.attribute||'Free') : 'Free';
    }
    return p.attribute || 'Free';
  }
  function hasEffectQuality(d, effectKey){
    const required = EFFECT_QUALITY_MAP[effectKey];
    if(!required) return true; // no known requirement (e.g. custom/unlisted effect) — allow
    return (d.qualities||[]).some(q=>q.name===required);
  }

  async function applyInstantEffect(code, target, key, potency){
    const def = EFFECT_DEFS.find(d=>d.key===key);
    if(!def || !def.instant) return null;
    if(def.instant==='pull'){
      const from = target.zone||'Medio';
      const steps = Math.max(1, potency);
      const zi = Math.max(0, zoneIndex(from)-steps);
      target.zone = ZONES[zi];
      return `${target.name} viene attirato da ${zoneLabel(from)} a ${zoneLabel(target.zone)}.`;
    }
    if(def.instant==='push'){
      const from = target.zone||'Medio';
      const steps = Math.max(1, potency);
      const zi = Math.min(ZONES.length-1, zoneIndex(from)+steps);
      target.zone = ZONES[zi];
      return `${target.name} viene respinto da ${zoneLabel(from)} a ${zoneLabel(target.zone)}.`;
    }
    if(def.instant==='cleanse'){
      let removedCount = 0;
      target.effects = (target.effects||[]).filter(e=>{
        const d = EFFECT_DEFS.find(x=>x.key===e.key);
        if(d && d.type==='negative' && removedCount<potency){ removedCount++; return false; }
        return true;
      });
      return `${target.name} viene purificato: rimossi ${removedCount} Effetti negativi.`;
    }
    if(def.instant==='shield'){
      if(target.isPC){
        const member = cachedRoster.find(m=>m.username===target.username);
        if(member){ member.digimon.tempWounds = Number(member.digimon.tempWounds||0)+potency; await saveMember(code, member); }
      } else {
        target.tempWounds = Number(target.tempWounds||0)+potency;
      }
      return `${target.name} guadagna ${potency} Caselle Ferita Temporanee.`;
    }
    return null;
  }

  function computeEffectModifiers(p){
    const mod = { accuracy:0, damage:0, dodge:0, armor:0 };
    let resistance = 0;
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member) resistance = computeQualityMechanics(member.digimon.qualities).resistance;
    }
    (p.effects||[]).forEach(e=>{
      const def = EFFECT_DEFS.find(d=>d.key===e.key);
      if(!def) return;
      let potency = Number(e.potency||1);
      if(def.type==='negative' && resistance>0) potency = Math.max(1, potency - resistance);
      Object.keys(def.mods||{}).forEach(stat=>{
        mod[stat] += def.mods[stat] * potency;
      });
    });
    return mod;
  }

  function effectTagsHTML(p){
    if(!p.effects || p.effects.length===0) return '';
    return p.effects.map(e=>{
      const def = EFFECT_DEFS.find(d=>d.key===e.key);
      const color = def&&def.type==='positive'?'var(--cyan)':'var(--danger)';
      const borderColor = def&&def.type==='positive'?'var(--cyan-dim)':'rgba(255,93,93,0.4)';
      return `<details style="display:inline-block;margin:2px 4px 2px 0;vertical-align:top;">
        <summary class="tag" style="cursor:pointer;color:${color};border-color:${borderColor};">${effectIcon(e.key)} ${def?def.label:e.key} ${e.potency}(${e.duration})</summary>
        <div class="muted" style="font-size:10px;margin-top:2px;max-width:200px;">${escapeHTML(effectExplanationText(def))}</div>
      </details>`;
    }).join('');
  }

  async function tickEffectsForParticipant(code, combat, p){
    if(!p.effects || p.effects.length===0) return [];
    const logs = [];
    let resistance = 0;
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member) resistance = computeQualityMechanics(member.digimon.qualities).resistance;
    }
    p.effects.forEach(e=>{
      const def = EFFECT_DEFS.find(d=>d.key===e.key);
      if(def && def.tick){
        const dmg = Math.max(1, Number(e.potency||1) - resistance);
        logs.push(`${p.name} subisce ${dmg} danno da ${def.label}${resistance>0?` (Resistance -${resistance})`:''}.`);
        applyDamageToParticipantSync(p, dmg);
      }
    });
    p.effects.forEach(e=>{ e.duration = Number(e.duration||1) - 1; });
    const expired = p.effects.filter(e=>e.duration<=0);
    expired.forEach(e=>{
      const def = EFFECT_DEFS.find(d=>d.key===e.key);
      logs.push(`${def?def.label:e.key} su ${p.name} è terminato.`);
    });
    p.effects = p.effects.filter(e=>e.duration>0);
    return logs;
  }

  function applyDamageToParticipantSync(p, amount){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member) member.digimon.currentWounds = Math.max(0, member.digimon.currentWounds - amount);
    } else {
      p.currentWounds = Math.max(0, (p.currentWounds||0) - amount);
    }
  }

  function getParticipantCombatStats(p){
    let base;
    let stanceMod = { accuracy:0, dodge:0, damage:0, armor:0 };
    let qMech = { certainStrike:0, weapon:0, ammoRank:0, combatMonster:0, monsterStrength:false };
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      base = member ? { accuracy: member.digimon.baseAccuracy, damage: member.digimon.baseDamage, dodge: member.digimon.baseDodge, armor: member.digimon.baseArmor } : { accuracy:0, damage:0, dodge:0, armor:0 };
      if(member){ stanceMod = stanceModifiers(member.digimon); qMech = computeQualityMechanics(member.digimon.qualities); }
    } else {
      base = { accuracy: p.accuracy||0, damage: p.damage||0, dodge: p.dodge||0, armor: p.armor||0 };
    }
    const mod = computeEffectModifiers(p);
    const nw = qMech.naturewalk || { accuracy:0, damage:0, dodge:0, armor:0 };
    const sc = qMech.supremeCode || 0;
    return {
      accuracy: Math.max(0, base.accuracy + mod.accuracy + stanceMod.accuracy + qMech.weapon + nw.accuracy + sc),
      damage: Math.max(0, base.damage + mod.damage + stanceMod.damage + qMech.weapon + nw.damage + sc),
      dodge: Math.max(0, base.dodge + mod.dodge + stanceMod.dodge + (qMech.instinctDodge||0) + nw.dodge + sc),
      armor: Math.max(0, base.armor + mod.armor + stanceMod.armor + (qMech.wardenArmor||0) + nw.armor + sc),
      certainStrike: qMech.certainStrike,
      combatMonsterRank: qMech.combatMonster,
      monsterStrength: qMech.monsterStrength,
      absoluteEvasion: qMech.absoluteEvasion||0
    };
  }

  function getParticipantResistance(p){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member) return computeQualityMechanics(member.digimon.qualities).resistance;
    }
    return 0;
  }

  function getParticipantSizeIndex(p){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member) return SIZES.indexOf(member.digimon.size) >=0 ? SIZES.indexOf(member.digimon.size) : 1;
    }
    return 1; // Medium default for enemies (Size not tracked for them)
  }

  // Regola 9.12a — Sconfitta: un Digimon portato a 0 Wound Box scende al suo Default Stage,
  // resta a 1 Wound Box, ed è "Sconfitto" (cosciente, ma di norma ignorato per il resto del
  // combattimento salvo scelga di rientrare a proprio rischio — nessuna Azione speciale è
  // definita da regolamento per questo caso, è a discrezione del Master).
  // Se il Digimon è già al proprio Default Stage (o sotto), il caso limite è il Digitama:
  // non è automatizzato da nessuna parte nell'app, va gestito a mano dal Master.
  async function applyDefeatIfNeeded(code, participant){
    if(participant.isPC){
      const member = cachedRoster.find(m=>m.username===participant.username);
      if(!member || member.digimon.defeated || member.digimon.currentWounds>0) return null;
      const curIdx = stageIndex(member.digimon.stage);
      const defIdx = stageIndex(member.digimon.defaultStage);
      member.digimon.defeated = true;
      if(curIdx>defIdx){
        applyStageChange(member.digimon, member.digimon.stage, member.digimon.defaultStage);
        member.digimon.currentWounds = 1;
        await saveMember(code, member);
        return { name: member.digimon.name||participant.name, digitama:false, toStage: member.digimon.defaultStage };
      } else {
        await saveMember(code, member);
        return { name: member.digimon.name||participant.name, digitama:true };
      }
    } else {
      if(participant.defeated || (participant.currentWounds||0)>0) return null;
      participant.defeated = true;
      return { name: participant.name, digitama:false, enemy:true };
    }
  }

  async function applyDamageToParticipant(code, combat, p, amount){
    if(p.isPC){
      const member = cachedRoster.find(m=>m.username===p.username);
      if(member){
        let remaining = amount;
        const shield = Number(member.digimon.tempWounds||0);
        if(shield>0 && remaining>0){
          const absorbed = Math.min(shield, remaining);
          member.digimon.tempWounds = shield - absorbed;
          remaining -= absorbed;
        }
        member.digimon.currentWounds = Math.max(0, member.digimon.currentWounds - remaining);
        const qMech = computeQualityMechanics(member.digimon.qualities);
        if(qMech.combatMonster>0 && amount>0){
          member.digimon.resolveCurrent = Math.min(Number(member.digimon.resolveMax||0), Number(member.digimon.resolveCurrent||0)+amount);
        }
        await saveMember(code, member);
      }
    } else {
      let remaining = amount;
      const shield = Number(p.tempWounds||0);
      if(shield>0 && remaining>0){
        const absorbed = Math.min(shield, remaining);
        p.tempWounds = shield - absorbed;
        remaining -= absorbed;
      }
      p.currentWounds = Math.max(0, (p.currentWounds||0) - remaining);
      await saveCombat(code, combat);
    }
  }

  // ---------- shared attack resolution (usato sia dal Combat Manager del Master sia dall'attacco in self-service del giocatore) ----------
  function validateAttackTargeting(attacker, target, atk){
    if(!attacker || !target || attacker.id===target.id){
      return { ok:false, error:'Scegli attaccante e bersaglio diversi.' };
    }
    const zDist = zoneDistance(attacker.zone||'Medio', target.zone||'Medio');
    if(atk && atk.shape==='Melee' && zDist>0){
      return { ok:false, error:`${atk.name} è [MELEE]: serve la stessa posizione di ${target.name} (ora: ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')}). Avvicinati prima di attaccare.` };
    }
    if(atk && atk.shape==='Range' && zDist > (atk.reach||1)){
      return { ok:false, error:`${atk.name} è [RANGE ${atk.reach||1}]: ${target.name} è troppo lontano (distanza ${zDist}, ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')}).` };
    }
    return { ok:true };
  }

  // Esegue i tiri Accuracy (attaccante) vs Dodge (bersaglio, automatico) e applica il danno se colpito.
  // Assume che validateAttackTargeting sia già stato chiamato con esito positivo.
  async function performAttackRoll(code, combat, attacker, target, atk){
    const aStats = getParticipantCombatStats(attacker);
    const tStats = getParticipantCombatStats(target);
    const zDist = zoneDistance(attacker.zone||'Medio', target.zone||'Medio');
    const zPenalty = zonePenalty(zDist);
    const effAccuracy = Math.max(0, aStats.accuracy + zPenalty);
    const overpowerUsed = !!attacker.overpowerActive;
    const accRoll = rollPool(effAccuracy, overpowerUsed);
    if(overpowerUsed) attacker.overpowerActive = false;
    if(aStats.certainStrike>0) accRoll.successes += aStats.certainStrike;
    let attrAdvNote = '';
    const attrRule = cachedProgression && cachedProgression.attributeAdvantage;
    if(attrRule && hasAttributeAdvantage(getParticipantAttribute(attacker), getParticipantAttribute(target))){
      if(attrRule==='minor'){
        const bonusDie = rollD6();
        accRoll.dice.push(bonusDie);
        if(bonusDie>=4) accRoll.successes += 1;
        attrAdvNote = ` [Attribute Advantage (Minor): +1d6(${bonusDie})]`;
      } else if(attrRule==='major'){
        accRoll.successes += 1;
        attrAdvNote = ' [Attribute Advantage (Major): +1 Successo automatico]';
      }
    }
    const dodgeRoll = rollPool(tStats.dodge);
    if(tStats.absoluteEvasion>0) dodgeRoll.successes += tStats.absoluteEvasion;
    const zoneNote = (zPenalty!==0 ? ` (${zPenalty} Accuracy per distanza: ${zoneLabel(attacker.zone||'Medio')}→${zoneLabel(target.zone||'Medio')})` : '') + (overpowerUsed ? ' [Overpower: 4 conta come Successo]' : '');
    const certainNote = (aStats.certainStrike>0 ? ` +${aStats.certainStrike} [CERTAIN]` : '') + attrAdvNote;
    const atkLabel = atk ? `${atk.name} ${attackTagsPlain(atk)}` : 'Attacco generico';
    let logText, dealt = 0;

    if(atk && atk.type==='Support'){
      const effDef = atk.effectKey ? EFFECT_DEFS.find(d=>d.key===atk.effectKey) : null;
      const isHelpful = effDef && effDef.type==='positive';
      const verb = isHelpful ? 'supporta' : 'colpisce';
      const resultTag = isHelpful ? 'RIUSCITO' : 'COLPITO';
      if(accRoll.successes <= dodgeRoll.successes){
        logText = `✨ ${attacker.name} usa ${atkLabel} su ${target.name}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${isHelpful?'NON RIUSCITO':'MANCATO'}, nessun Effetto applicato.`;
      } else if(atk.effectKey){
        const def = effDef;
        // Potenza 1 / Durata 3 di default (stessi valori dello strumento manuale "+Effetto" sulla riga
        // partecipante) — niente popup nativi del browser, che stonavano col resto dell'interfaccia.
        // Il Master può correggerli in un secondo momento rimuovendo e riapplicando l'Effetto a mano.
        const potency = 1;
        if(def && def.instant){
          const msg = await applyInstantEffect(code, target, atk.effectKey, potency);
          logText = `✨ ${attacker.name} usa ${atkLabel} su ${target.name}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${resultTag}! ${msg}`;
        } else {
          const duration = 3;
          if(!target.effects) target.effects = [];
          target.effects.push({ key: atk.effectKey, potency, duration });
          logText = `✨ ${attacker.name} usa ${atkLabel} su ${target.name}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → ${resultTag}! ${isHelpful?'Supporta':'Applica'} ${def?def.label:atk.effectKey} (Potenza ${potency}, Durata ${duration} — valori di default, correggibili a mano sulla riga di ${target.name}).`;
        }
      } else {
        logText = `✨ ${attacker.name} usa ${atkLabel} su ${target.name}: ${verb}, ma non ha un Effetto collegato da applicare.`;
      }
    } else {
      if(accRoll.successes <= dodgeRoll.successes){
        logText = `⚔ ${attacker.name} usa ${atkLabel} su ${target.name}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → MANCATO (schivato)`;
      } else {
        const excess = accRoll.successes - dodgeRoll.successes;
        let raw = excess + aStats.damage;
        let combatMonsterNote = '';
        if(attacker.isPC){
          const aMember = cachedRoster.find(m=>m.username===attacker.username);
          if(aMember && Number(aMember.digimon.resolveCurrent||0)>0 && computeQualityMechanics(aMember.digimon.qualities).combatMonster>0){
            const resolveSpent = Number(aMember.digimon.resolveCurrent||0);
            raw += resolveSpent;
            aMember.digimon.resolveCurrent = 0;
            await saveMember(code, aMember);
            combatMonsterNote = ` +${resolveSpent} Resolve (Combat Monster, azzerato)`;
          }
        }
        dealt = Math.max(0, raw - tStats.armor);
        await applyDamageToParticipant(code, combat, target, dealt);
        const w = getParticipantWounds(target);
        const defeatInfo = await applyDefeatIfNeeded(code, target);
        let defeatNote = '';
        if(defeatInfo){
          defeatNote = defeatInfo.digitama
            ? ` 🥚 ${defeatInfo.name} è Sconfitto ed è già al Default Stage minimo: da regolamento diventerebbe Digitama — gestiscilo a mano.`
            : ` 🏳️ ${defeatInfo.name} è Sconfitto! Retrocede a ${defeatInfo.toStage} con 1 Ferita.`;
        }
        logText = `⚔ ${attacker.name} usa ${atkLabel} su ${target.name}: Accuracy ${effAccuracy}d6${zoneNote}[${accRoll.dice.join(',')}]${certainNote}=${accRoll.successes} succ. vs Dodge ${tStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ. → COLPITO! (${excess}+DMG ${aStats.damage})${combatMonsterNote}-ARM ${tStats.armor} = ${dealt} danno → ${target.name} ${w.current}/${w.max} Ferite${defeatNote}`;
        return { logText, dealt, accRoll, dodgeRoll, atkLabel, defeatInfo };
      }
    }
    return { logText, dealt, accRoll, dodgeRoll, atkLabel, defeatInfo: null };
  }

  let masterPrivateThread = null;

  async function grantMilestoneRewards(code, milestoneNumber, reason){
    const players = cachedRoster.filter(m=>m.role==='player');
    for(const p of players){
      p.tamer.unspentGrowthPoints = Number(p.tamer.unspentGrowthPoints||0) + 3;
      p.tamer.inspirationPoints = Number(p.tamer.inspirationPoints||0) + 1;
      p.digimon.unspentBonusDP = Number(p.digimon.unspentBonusDP||0) + 3;
      // Traccia l'origine di ogni concessione (quale Milestone, quando, come) — prima si perdeva,
      // lasciando solo un numero grezzo senza modo di risalire al perché per il Master.
      p.digimon.bonusDpLog = Array.isArray(p.digimon.bonusDpLog) ? p.digimon.bonusDpLog : [];
      p.digimon.bonusDpLog.push({ amount: 3, milestone: milestoneNumber, date: new Date().toISOString(), reason: reason || 'Milestone' });
      await saveMember(code, p);
    }
  }

  async function renderNoticeManager(code, players){
    const cardEl = document.getElementById('notice-mgr-card');
    if(!cardEl) return;
    const notices = await getNotices(code);
    const active = notices.filter(n=>n.active);
    const closedAll = notices.filter(n=>!n.active);
    const closed = closedAll.slice(0, 5);

    function targetDescHTML(n){
      if(n.target_type==='all') return 'Tutti i giocatori';
      const list = Array.isArray(n.target_usernames) ? n.target_usernames : [];
      return (n.target_type==='single' ? 'Solo: ' : 'Alcuni: ') + (list.length ? list.map(displayNameFor).join(', ') : '—');
    }
    function confirmProgressHTML(n){
      const targetUsers = n.target_type==='all' ? players.map(p=>p.username) : (n.target_usernames||[]);
      const confirmed = Array.isArray(n.acked_by) ? n.acked_by : [];
      const pending = targetUsers.filter(u=>!confirmed.includes(u));
      return `
        <div class="muted" style="margin-top:6px;font-size:11px;">
          ✔ Confermato: ${confirmed.length ? confirmed.map(displayNameFor).join(', ') : '—'}<br/>
          ⏳ In attesa: ${pending.length ? pending.map(displayNameFor).join(', ') : 'nessuno'}
        </div>`;
    }

    cardEl.innerHTML = `
      <div class="section-title">📢 Gestione Avvisi</div>
      <div class="muted" style="margin-bottom:10px;">Un Avviso blocca l'interfaccia (con un popup che va confermato per proseguire) solo per i destinatari scelti — gli altri giocatori continuano a giocare normalmente.</div>
      <textarea id="notice-text" rows="3" placeholder="Testo dell'avviso..."></textarea>
      ${chatAttachHTML('notice')}
      <div class="field" style="margin-top:10px;"><label>Destinatari</label>
        <select id="notice-target-type">
          <option value="all">Tutti i giocatori</option>
          <option value="some">Solo alcuni</option>
          <option value="single">Un solo giocatore</option>
        </select>
      </div>
      <div id="notice-target-players" style="display:none;margin-bottom:10px;"></div>
      <button class="btn solid" id="btn-send-notice" style="width:100%;">Invia Avviso</button>
      <div class="muted" id="notice-status" style="margin-top:6px;"></div>
      <div class="divider"></div>
      <div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Avvisi attivi</div>
      ${active.length===0 ? '<div class="muted">Nessun avviso attivo.</div>' : active.map(n=>`
        <div class="roster-item" style="padding:8px;margin-bottom:6px;">
          <div class="flex-between"><b style="font-size:12px;">${targetDescHTML(n)}</b><button class="btn ghost small" data-notice-close="${n.id}">Chiudi</button></div>
          <div style="margin-top:4px;font-size:12px;white-space:pre-wrap;">${escapeHTML(n.text)}</div>
          ${confirmProgressHTML(n)}
        </div>
      `).join('')}
      ${closed.length ? `
      <div class="flex-between" style="margin:10px 0 6px;">
        <span class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;">Storico recente (chiusi)</span>
        <button class="btn ghost small" id="btn-clear-notice-history" style="color:var(--danger);border-color:rgba(255,93,93,0.4);font-size:10px;padding:3px 8px;">🗑 Cancella storico</button>
      </div>
      ${closed.map(n=>`<div class="flex-between muted" style="font-size:11px;margin-bottom:4px;gap:6px;"><span>• ${escapeHTML((n.text||'').slice(0,60))}${(n.text||'').length>60?'…':''} — ${targetDescHTML(n)}</span><button class="btn ghost small" data-notice-delete="${n.id}" style="padding:1px 6px;flex-shrink:0;" title="Cancella questo avviso dallo storico">✕</button></div>`).join('')}
      ` : ''}
    `;

    let pendingNoticeImageUrl = null;
    bindChatAttach('notice', code, 'avvisi', ()=>pendingNoticeImageUrl, (url)=>{ pendingNoticeImageUrl = url; });

    // "Un solo giocatore" ora usa veri <input type="radio"> (stesso `name`, quindi il browser
    // stesso garantisce che al massimo uno sia selezionato) invece di checkbox con un click
    // handler in JS che provava a de-selezionare gli altri manualmente: su touchscreen quel
    // pattern è fragile (un tap può non registrarsi come "click" in tempo, o due tap ravvicinati
    // possono lasciare più caselle spuntate), ed era la causa più probabile del bug per cui un
    // Avviso "a un solo giocatore" finiva selezionato per più persone di quelle volute. Con un
    // vero radio group la cosa è semplicemente impossibile, indipendentemente dal dispositivo.
    function noticeTargetPlayersHTML(mode){
      const inputType = mode==='single' ? 'radio' : 'checkbox';
      const nameAttr = mode==='single' ? ' name="notice-target-radio"' : '';
      return players.map(p=>`<label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;"><input type="${inputType}"${nameAttr} class="notice-target-player" value="${escapeAttr(p.username)}" /> ${escapeHTML(displayName(p))}</label>`).join('') || '<div class="muted">Nessun giocatore in roster.</div>';
    }

    const targetSel = document.getElementById('notice-target-type');
    targetSel.onchange = ()=>{
      const wrap = document.getElementById('notice-target-players');
      wrap.style.display = targetSel.value==='all' ? 'none' : 'block';
      if(targetSel.value!=='all') wrap.innerHTML = noticeTargetPlayersHTML(targetSel.value);
    };

    document.getElementById('btn-send-notice').onclick = async ()=>{
      const text = document.getElementById('notice-text').value.trim();
      const statusEl = document.getElementById('notice-status');
      if(!text){ statusEl.textContent = 'Scrivi un testo per l\'avviso.'; statusEl.style.color='var(--danger)'; return; }
      const targetType = targetSel.value;
      const targetUsernames = targetType==='all' ? [] : Array.from(cardEl.querySelectorAll('.notice-target-player:checked')).map(cb=>cb.value);
      if(targetType!=='all' && targetUsernames.length===0){ statusEl.textContent = 'Seleziona almeno un destinatario.'; statusEl.style.color='var(--danger)'; return; }
      if(targetType==='single' && targetUsernames.length>1){ statusEl.textContent = 'Per "Un solo giocatore" seleziona un solo nome.'; statusEl.style.color='var(--danger)'; return; }
      statusEl.style.color='var(--text-mute)'; statusEl.textContent = 'Invio...';
      const res = await createNotice(code, { text, imageUrl: pendingNoticeImageUrl, targetType, targetUsernames, createdBy: session.username });
      if(res && res.ok){
        statusEl.style.color='var(--cyan)'; statusEl.textContent = 'Avviso inviato.';
        pendingNoticeImageUrl = null;
        renderNoticeManager(code, players);
      } else {
        statusEl.style.color='var(--danger)'; statusEl.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
      }
    };

    cardEl.querySelectorAll('[data-notice-close]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!window.confirm('Chiudere questo avviso? Chi non ha ancora confermato non lo vedrà più.')) return;
        await closeNotice(code, btn.getAttribute('data-notice-close'));
        renderNoticeManager(code, players);
      };
    });
    cardEl.querySelectorAll('[data-notice-delete]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!window.confirm('Cancellare definitivamente questo avviso dallo storico? Non si può annullare.')) return;
        await deleteNotice(code, btn.getAttribute('data-notice-delete'));
        renderNoticeManager(code, players);
      };
    });
    const clearHistBtn = document.getElementById('btn-clear-notice-history');
    if(clearHistBtn){
      clearHistBtn.onclick = async ()=>{
        if(!window.confirm(`Cancellare tutto lo storico avvisi chiusi (${closedAll.length} voci)? Non si può annullare.`)) return;
        await Promise.all(closedAll.map(n=>deleteNotice(code, n.id)));
        renderNoticeManager(code, players);
      };
    }
  }

    const rowsHTML = log.length === 0
      ? '<div class="muted">Nessuna scansione registrata finora per questa campagna.</div>'
      : log.slice().reverse().map(l => {
          // Il bottone "Applica" resta nascosto SOLO se quel Tamer ha già un nome DIVERSO impostato
          // (per non rischiare di sovrascrivere una creazione in corso non collegata a questo scan).
          // Se il nome è lo stesso di questa riga (o manca del tutto), il bottone c'è sempre: la
          // Wizard/applyDexMatchIfNeeded riempiono solo i campi ancora vuoti/di default, senza
          // toccare quelli che il giocatore ha già personalizzato — quindi è sicuro anche per
          // "completare" una scheda a metà, non solo per crearne una da zero.
          const member = cachedRoster.find(m=>m.username===l.username);
          const currentName = member && member.digimon && member.digimon.name ? member.digimon.name.trim() : '';
          const sameName = currentName && currentName.toLowerCase() === (l.digimon_name||'').trim().toLowerCase();
          const blockedByDifferentSheet = currentName && !sameName;
          const btnLabel = currentName ? '🔧 Completa Scheda (riempie i vuoti)' : '📤 Applica alla Scheda';
          return `
          <div class="row" style="align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;">
            <div>
              <b>${escapeHTML(member ? displayName(member) : l.username)}</b> <span class="muted">— tentativo ${l.attempt_number}/2</span><br/>

  function privateReadKey(code, thread){ return `dvos_privread_${code}_${thread}`; }
  function markPrivateThreadRead(code, thread, log){
    if(!log || !log.length) return;
    try{ localStorage.setItem(privateReadKey(code, thread), String(log[log.length-1].id)); }catch(e){}
    delete masterPrivateUnread[thread];
  }
  function isPrivateThreadUnread(code, thread, log){
    if(!log || !log.length) return false;
    const last = log[log.length-1];
    let lastRead = null;
    try{ lastRead = localStorage.getItem(privateReadKey(code, thread)); }catch(e){}
    return String(last.id) !== String(lastRead);
  }
  // Controlla in background (durante il polling) se ci sono messaggi privati non letti in QUALSIASI
  // thread, non solo in quello aperto — serve per il pallino rosso sul bottone "Privata".
  async function checkMasterPrivateUnread(code, players){
    for(const p of players){
      const log = await getPrivateLog(code, p.username);
      const lastFromPlayer = log.length>0 && log[log.length-1].who !== 'Master';
      if(lastFromPlayer && isPrivateThreadUnread(code, p.username, log)) masterPrivateUnread[p.username] = true;
      else delete masterPrivateUnread[p.username];
      if(log.length) maybeNotifyNew('private', p.username, log[log.length-1], 'Master');
    }
    const badge = document.getElementById('mchat-unread-badge');
    const count = Object.keys(masterPrivateUnread).length;
    if(badge) badge.innerHTML = count>0 ? `<span style="background:var(--danger);color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;">${count}</span>` : '';
  }

    if(subSlot) subSlot.style.display = masterChatMode==='subgroup' ? '' : 'none';
    if(genBtn) genBtn.classList.toggle('active', masterChatMode==='general');
    if(privBtn) privBtn.classList.toggle('active', masterChatMode==='private');
    if(subBtn) subBtn.classList.toggle('active', masterChatMode==='subgroup');
  }
  function bindMasterChatMode(code, players){

    if(genBtn) genBtn.onclick = ()=>{ masterChatMode='general'; updateMasterChatModeUI(); };

    if(subBtn) subBtn.onclick = async ()=>{ masterChatMode='subgroup'; updateMasterChatModeUI(); await renderSubgroupChatMaster(code, players); };

      if(!window.confirm('Cancellare TUTTA la chat generale? Non si può annullare. Le chat private non vengono toccate.')) return;

      await clearLog(code);
      cachedLog = await getLog(code);

      if(logLive) logLive.innerHTML = logHTML(sceneLog(), true);
      clearBtn.disabled = false;
    };

      exportVisibleLogAsText(sceneLog(), label);
    };
    updateMasterChatModeUI();
    checkMasterPrivateUnread(code, players);
  }
  async function renderPrivateChatMaster(code, players){

      <div class="muted" style="font-size:10.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;">

          ${(cachedScene.encounters||[]).map((e,i)=>`<option value="encounter:${i}">${escapeHTML(encName(e))} (in scena)</option>`).join('')}
          ${cachedDex.map(e=>`<option value="dex:${escapeAttr(e.id)}">${escapeHTML(e.name)} (Digidex)</option>`).join('')}
          ${loadSavedNpcs(code).map(n=>`<option value="npc-saved:${escapeAttr(n.name)}">${escapeHTML(n.name)} (NPC)</option>`).join('')}

    if(masterChatMode==='private') markPrivateThreadRead(code, masterPrivateThread, log);

    document.getElementById('private-thread-select').onchange = (e)=>{
      masterPrivateThread = e.target.value;

    };

    bindMentionButton('private', code, 'private-text-master');
    // Correzione IT via AI: stessa funzione già usata in Chat Generale (Player) — mancava qui,

    const privLocSelect = document.getElementById('private-location-select');

    const privSpeakAsSel = document.getElementById('private-speak-as');
    const privEnemyFields = document.getElementById('private-enemy-fields');
    const privNpcFields = document.getElementById('private-npc-fields');
    const privColorInput = document.getElementById('private-speak-color');
    if(privSpeakAsSel){
      privSpeakAsSel.onchange = ()=>{
        privEnemyFields.style.display = privSpeakAsSel.value==='enemy' ? 'flex' : 'none';

        const mode = privSpeakAsSel.value;
        if(mode.startsWith('digimon:')){
          const username = mode.slice('digimon:'.length);
          const member = cachedRoster.find(m=>m.username===username);
          if(privColorInput) privColorInput.value = (member && member.digimon.chatColor) || '#c896ff';
        } else if(mode.startsWith('encounter:')){
          if(privColorInput) privColorInput.value = '#ff5d5d';
        } else if(mode.startsWith('dex:')){
          if(privColorInput) privColorInput.value = '#ff5d5d';
        } else if(mode==='enemy'){
          if(privColorInput) privColorInput.value = '#ff5d5d';
        } else if(mode==='npc'){
          if(privColorInput) privColorInput.value = '#ffd76a';
        } else if(mode.startsWith('npc-saved:')){
          const name = mode.slice('npc-saved:'.length);
          const saved = loadSavedNpcs(code).find(n=>n.name===name);
          if(privColorInput) privColorInput.value = (saved && saved.color) || '#ffd76a';

          if(privColorInput) privColorInput.value = '#ff8a3d';

      const text = ta.value.trim();
      if(!text || !masterPrivateThread) return;
      const mode = privSpeakAsSel ? privSpeakAsSel.value : 'master';
      let who = 'Master', role = 'gm', avatar = null, color = null;
      if(mode.startsWith('digimon:')){
        const username = mode.slice('digimon:'.length);
        const member = cachedRoster.find(m=>m.username===username);
        who = (member && member.digimon.name) ? member.digimon.name : username;
        role = 'digimon';
        avatar = member ? member.digimon.imageUrl : null;
        color = member ? member.digimon.chatColor : null;
      } else if(mode.startsWith('encounter:')){
        const idx = Number(mode.slice('encounter:'.length));
        const encObj = (cachedScene.encounters||[])[idx];
        who = encName(encObj) || 'Digimon';
        const dexMatch = cachedDex.find(e=>e.name.trim().toLowerCase()===who.trim().toLowerCase());
        role = 'enemy';
        avatar = (encObj && typeof encObj==='object' && encObj.image) ? encObj.image : (dexMatch ? dexMatch.image_url : null);
      } else if(mode.startsWith('dex:')){
        const dexId = mode.slice('dex:'.length);
        const dexEntry = cachedDex.find(e=>String(e.id)===dexId);
        who = dexEntry ? dexEntry.name : 'Digimon';
        role = 'enemy';
        avatar = dexEntry ? dexEntry.image_url : null;
      } else if(mode==='enemy'){
        who = document.getElementById('private-enemy-speak-name').value.trim() || 'Nemico';

        who = document.getElementById('private-npc-speak-name').value.trim() || 'NPC';
        role = 'npc';

      meta.location = memberLocationKey(cachedRoster.find(m=>m.username===masterPrivateThread));
      if(role==='npc') rememberNpc(code, { name: who, color: chosenColor, avatar });
      await pushPrivateLog(code, masterPrivateThread, { who, role, text, meta });
      ta.value='';
      pendingPrivateImageUrl = null;
      // renderPrivateChatMaster ricostruisce anche la select "Parla come" da loadSavedNpcs(code),
      // quindi un NPC nuovo qui compare già pronto per la prossima volta senza bisogno di un patch
      // manuale del DOM come nella chat generale (questa vista si ridisegna comunque per intero).
      renderPrivateChatMaster(code, players);

  // ===== fine Sottogruppi di Chat =====

  // Le zone sono un'unica linea condivisa con 5 posizioni (o——o——o——o——o): ogni pallino È una zona
  // per il regolamento — niente conversioni, Melee = stessa posizione, Reach 1/2 = distanza in pallini,
  // penalità -2/-4 dirette sulla distanza. Un "Muovi" sposta di 1 pallino = 1 zona.
  // "Medio" resta il centro esatto (indice 2 su 5), quindi i fallback "||'Medio'" restano validi.
  const ZONES = ['Molto Corto','Corto','Medio','Lungo','Molto Lungo'];
  function zoneIndex(z){ const i = ZONES.indexOf(z); return i<0?2:i; }
  function zoneDistance(a,b){ return Math.abs(zoneIndex(a)-zoneIndex(b)); }
  function zonePenalty(distance){ if(distance<=0) return 0; if(distance===1) return -2; return -4; }
  // Etichetta numerica per la UI ("Range 3") invece del nome assoluto ("Medio") — i nomi sono relativi
  // e da soli non dicono nulla; il numero di posizione è più chiaro e coerente con "distanza in zone".
  function zoneLabel(z){ return 'Range ' + (zoneIndex(z)+1); }
  // Muovi di un solo pallino lungo la linea, in riferimento a un altro partecipante.
  function zoneStepToward(fromZone, refZone){
    const fi = zoneIndex(fromZone), ri = zoneIndex(refZone);
    if(fi===ri) return null; // già alla stessa posizione, "avvicinati" non ha effetto
    return ZONES[fi + (ri>fi?1:-1)];
  }
  function zoneStepAway(fromZone, refZone){
    const fi = zoneIndex(fromZone), ri = zoneIndex(refZone);
    const dir = (ri>=fi) ? -1 : 1; // se pari, per default ci si allontana verso "Molto Corto"
    const ni = fi + dir;
    if(ni<0 || ni>ZONES.length-1) return null; // già al limite (non si può allontanare oltre)
    return ZONES[ni];
  }
  // Muovi di N pallini in una direzione fissa (usato dalle frecce sotto la linea) — clampato ai limiti.
  function zoneStepDirection(fromZone, dir){
    const fi = zoneIndex(fromZone);
    const ni = fi + (dir>0?1:-1);
    if(ni<0 || ni>ZONES.length-1) return null;
    return ZONES[ni];
  }

  // Le zone sono un unico asse condiviso (Corto-Medio-Lungo), non una distanza per ogni coppia:
  // avvicinarsi a uno può avvicinare o allontanare da tutti gli altri, a seconda di dove si trovano
  // sullo stesso asse. Segnala l'effetto collaterale su chiunque non sia il riferimento scelto.
  function zoneSideEffectsNote(participants, movingId, refId, beforeZone, afterZone){
    const notes = [];
    participants.forEach(o=>{
      if(o.id===movingId || o.id===refId) return;
      const before = zoneDistance(beforeZone, o.zone||'Medio');
      const after = zoneDistance(afterZone, o.zone||'Medio');
      if(after<before) notes.push(`si avvicina anche a ${o.name}`);
      else if(after>before) notes.push(`si allontana da ${o.name}`);
    });
    return notes.length ? ` — ${notes.join(', ')}` : '';
  }

                  return `<option value="${o.order}" ${blocked?'disabled':''}>${escapeHTML(o.name)} (${o.cost} Az.)${blocked?' — già usato':''}</option>`;
                }).join('')}</select>

            })()}

            </div>
          </div>
        `;}).join('')}

    const persistAndRefresh = async ()=>{
      await saveCombat(code, cachedCombat);
      renderCombatManager(code, players);
      const combatLive = document.getElementById('combat-live');
      if(combatLive) combatLive.innerHTML = combatDisplayHTML(cachedCombat, true);
      bindZoneLineArrows(code, players);
    };

    const startZoneAllyLiveSel = document.getElementById('combat-startzone-ally-live');
    if(startZoneAllyLiveSel){
      startZoneAllyLiveSel.onchange = async ()=>{
        combat.startZoneAlly = startZoneAllyLiveSel.value;
        await saveCombat(code, combat);
      };
    }
    const startZoneEnemyLiveSel = document.getElementById('combat-startzone-enemy-live');
    if(startZoneEnemyLiveSel){
      startZoneEnemyLiveSel.onchange = async ()=>{
        combat.startZoneEnemy = startZoneEnemyLiveSel.value;
        await saveCombat(code, combat);
      };
    }
    const jogressUnlockCb = document.getElementById('combat-jogress-unlock');
    if(jogressUnlockCb){
      jogressUnlockCb.onchange = async ()=>{
        combat.jogressUnlocked = jogressUnlockCb.checked;
        await persistAndRefresh();
      };
    }

    function populateAttackChoice(){
      const attackerId = document.getElementById('combat-attacker').value;
      const attacker = combat.participants.find(p=>p.id===attackerId);
      const sel = document.getElementById('combat-attack-choice');
      const btnWrap = document.getElementById('combat-attack-buttons');
      if(!sel) return;
      const atks = getParticipantAttacks(attacker);
      // combatSelectedAttackIndex è la fonte di verità persistente (sopravvive a qualunque re-render
      // del pannello); se non è più valida per l'attaccante corrente (indice fuori range), si azzera.
      if(combatSelectedAttackIndex!==null && (combatSelectedAttackIndex<0 || combatSelectedAttackIndex>=atks.length)){
        combatSelectedAttackIndex = null;
      }
      if(atks.length===0){
        sel.innerHTML = '<option value="">⚠️ Nessun Attacco — importa da Dex</option>';
        if(btnWrap) btnWrap.innerHTML = '<div class="muted" style="font-size:11px;grid-column:1/-1;">⚠️ Nessun Attacco — importa da Dex.</div>';
      } else {
        sel.innerHTML = '<option value="">— scegli un Attacco —</option>' + atks.map((a,i)=>`<option value="${i}" ${combatSelectedAttackIndex===i?'selected':''}>${a.signature?'⭐ ':''}${escapeHTML(a.name)} — ${a.shape}/${a.type}</option>`).join('');
        sel.value = combatSelectedAttackIndex===null ? '' : String(combatSelectedAttackIndex);
        if(btnWrap){
          const applyHighlight = ()=>{
            btnWrap.querySelectorAll('[data-atk-btn]').forEach(b=>{
              const i = Number(b.getAttribute('data-atk-btn'));
              const a = atks[i];
              const typeColor = a.type==='Support' ? 'var(--cyan)' : 'var(--danger)';
              const isSel = combatSelectedAttackIndex === i;
              b.style.border = `2px solid ${isSel?typeColor:'var(--line)'}`;
              b.style.background = isSel?'rgba(255,255,255,0.06)':'var(--panel-2)';
            });
          };
          btnWrap.innerHTML = atks.map((a,i)=>{
            const typeColor = a.type==='Support' ? 'var(--cyan)' : 'var(--danger)';
            return `<button type="button" data-atk-btn="${i}" style="text-align:left;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--panel-2);cursor:pointer;">
              <div style="font-size:12px;font-weight:bold;color:${typeColor};">${a.signature?'⭐ ':''}${escapeHTML(a.name)}</div>
              <div class="muted" style="font-size:9px;">${a.shape} · ${a.type}${a.areaAttack?' · Area':''}</div>
            </button>`;
          }).join('');
          applyHighlight();
          btnWrap.querySelectorAll('[data-atk-btn]').forEach(b=>{
            b.onclick = ()=>{
              // Scritto sia sulla variabile persistente (sopravvive a QUALSIASI re-render, es. aprire
              // i dettagli di un altro partecipante) sia sulla select nascosta, che resta la fonte
              // letta da "Risolvi Attacco". Prima la scelta viveva solo nella select e spariva al
              // primo re-render causato da un click qualsiasi altrove nel pannello.
              combatSelectedAttackIndex = Number(b.getAttribute('data-atk-btn'));
              sel.value = b.getAttribute('data-atk-btn');
              applyHighlight();
              updateAreaButtonVisibility();
            };
          });
        }
      }
      updateAreaButtonVisibility();
    }
    function updateAreaButtonVisibility(){
      const attackerId = document.getElementById('combat-attacker').value;
      const attacker = combat.participants.find(p=>p.id===attackerId);
      const sel = document.getElementById('combat-attack-choice');
      const areaBtn = document.getElementById('btn-combat-attack-area');
      if(!sel || !areaBtn) return;
      let atk = null;
      if(attacker && sel.value !== ''){
        atk = getParticipantAttacks(attacker)[Number(sel.value)];
      }
      areaBtn.style.display = (atk && atk.areaAttack) ? 'block' : 'none';
    }
    const attackerSel = document.getElementById('combat-attacker');
    const targetSel = document.getElementById('combat-target');
    const attackChoiceSel = document.getElementById('combat-attack-choice');
    if(attackerSel) attackerSel.onchange = ()=>{ populateAttackChoice(); renderClashActions(); };
    if(targetSel) targetSel.onchange = renderClashActions;
    if(attackChoiceSel) attackChoiceSel.onchange = updateAreaButtonVisibility;
    populateAttackChoice();

    function renderClashActions(){
      const panel = document.getElementById('combat-clash-actions');
      if(!panel) return;
      const aId = document.getElementById('combat-attacker').value;
      const bId = document.getElementById('combat-target').value;
      const a = combat.participants.find(p=>p.id===aId);
      const b = combat.participants.find(p=>p.id===bId);
      if(!a || !b || a.id===b.id || a.clashWith!==b.id || b.clashWith!==a.id){
        panel.innerHTML = '<div class="muted">Seleziona due partecipanti attualmente in Clash tra loro per vedere le Azioni disponibili.</div>';
        return;
      }
      const controller = a.clashController ? a : (b.clashController ? b : null);
      const opponent = controller ? (controller===a ? b : a) : null;
      if(!controller){ panel.innerHTML = '<div class="muted">Nessun Controller determinato — usa "Inizia/Contesa".</div>'; return; }
      let hasWrestlemania = false;
      if(controller.isPC){
        const cMember = cachedRoster.find(m=>m.username===controller.username);
        if(cMember) hasWrestlemania = computeQualityMechanics(cMember.digimon.qualities).wrestlemania;
      }
      panel.innerHTML = `
        <div class="muted" style="margin-bottom:4px;">Controller: <b style="color:var(--cyan);">${escapeHTML(controller.name)}</b> · Opponent: <b>${escapeHTML(opponent.name)}</b>${opponent.clashPinned?' <span class="tag" style="color:var(--danger);border-color:var(--danger);">PINNATO</span>':''}</div>
        <div class="row">
          <button class="btn small" id="btn-clash-attack" style="flex:1;">⚔ Attacco (Dodge ½)</button>
          <button class="btn small" id="btn-clash-pin" style="flex:1;" ${opponent.clashPinned?'disabled':''}>📌 Pin</button>
          <button class="btn small" id="btn-clash-throw" style="flex:1;">🤾 Lancia</button>
        </div>
        ${hasWrestlemania ? `<div class="row" style="margin-top:6px;"><button class="btn amber" id="btn-clash-finisher" style="flex:1;">🏆 Finisher (Wrestlemania)</button></div>` : ''}
        <div class="row" style="margin-top:6px;">
          <button class="btn ghost small" id="btn-clash-weak" style="flex:1;">🥊 Attacco Disperato</button>
          <button class="btn ghost small" id="btn-clash-comeback" style="flex:1;" ${opponent.clashPinned?'disabled':''}>💪 Comeback</button>
          <button class="btn ghost small" id="btn-clash-contestpin" style="flex:1;" ${!opponent.clashPinned?'disabled':''}>🔓 Contest Pin</button>
        </div>
        <div class="muted" id="clash-action-result" style="margin-top:6px;"></div>
      `;
      const resEl = ()=>document.getElementById('clash-action-result');

      const finisherBtn = document.getElementById('btn-clash-finisher');
      if(finisherBtn){
        finisherBtn.onclick = async ()=>{
          const cStats = getParticipantCombatStats(controller);
          const oStats = getParticipantCombatStats(opponent);
          const accRoll = rollPool(cStats.accuracy);
          const dodgeRoll = rollPool(Math.floor(oStats.dodge/2));
          let text, dealt=0;
          if(accRoll.successes<=dodgeRoll.successes){
            text = `🏆 Finisher di ${controller.name} su ${opponent.name}: MANCATO (${accRoll.successes} vs ${dodgeRoll.successes} succ.) — il Clash finisce comunque.`;
          } else {
            const excess = accRoll.successes-dodgeRoll.successes;
            dealt = Math.max(0, excess+cStats.damage-oStats.armor);
            const cMember = cachedRoster.find(m=>m.username===controller.username);
            const stageNum = cMember ? stageIndex(cMember.digimon.stage)+1 : 1;
            const tn = 10+stageNum;
            const finVal = Math.max(cStats.cpu, cStats.bit||0);
            const { dice, total } = rollSkillCheck(finVal, 0);
            const verdict = evaluateVsTN(total, tn, dice);
            let bonus = 0, bonusNote='';
            if(verdict && (verdict.cls==='success'||verdict.cls==='crit-success')){
              bonus = stageNum;
              if(verdict.cls==='crit-success'){
                const bestDerived = Math.max(cStats.bit||0, cStats.dos||0, cStats.ram||0, cStats.cpu||0);
                if(bestDerived>stageNum) bonus = bestDerived;
              }
              dealt += bonus;
              bonusNote = ` +${bonus} bonus Finisher (Check ${total} vs TN ${tn}, ${verdict.label})`;
            } else {
              bonusNote = ` nessun bonus (Check ${total} vs TN ${tn}, Fallito)`;
            }
            await applyDamageToParticipant(code, combat, opponent, dealt);
            const w = getParticipantWounds(opponent);
            text = `🏆 Finisher di ${controller.name} su ${opponent.name}: COLPITO! ${dealt} danno${bonusNote} → ${opponent.name} ${w.current}/${w.max} Ferite — il Clash finisce.`;
          }
          controller.clashWith=null; controller.clashController=false; controller.clashPinned=false; controller.clashComebackBonus=0;
          opponent.clashWith=null; opponent.clashController=false; opponent.clashPinned=false; opponent.clashComebackBonus=0;
          await pushLog(code, { who:'Master', role:'roll', text, meta:{dice:accRoll.dice.concat(dodgeRoll.dice)} });
          await persistAndRefresh();
        };
      }

      document.getElementById('btn-clash-attack').onclick = async ()=>{
        const cStats = getParticipantCombatStats(controller);
        const oStats = getParticipantCombatStats(opponent);
        const accRoll = rollPool(cStats.accuracy);
        const dodgeRoll = rollPool(Math.floor(oStats.dodge/2));
        let dealt=0, text;
        if(accRoll.successes<=dodgeRoll.successes){
          text = `⚔ ${controller.name} attacca ${opponent.name} nel Clash: Acc ${cStats.accuracy}d6[${accRoll.dice.join(',')}]=${accRoll.successes} vs Dodge½ ${Math.floor(oStats.dodge/2)}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} → MANCATO`;
        } else {
          const excess = accRoll.successes-dodgeRoll.successes;
          dealt = Math.max(0, excess+cStats.damage-oStats.armor);
          await applyDamageToParticipant(code, combat, opponent, dealt);
          const w = getParticipantWounds(opponent);
          text = `⚔ ${controller.name} attacca ${opponent.name} nel Clash: Acc ${cStats.accuracy}d6[${accRoll.dice.join(',')}]=${accRoll.successes} vs Dodge½ ${Math.floor(oStats.dodge/2)}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} → COLPITO! ${dealt} danno → ${opponent.name} ${w.current}/${w.max} Ferite`;
        }
        await pushLog(code, { who:'Master', role:'roll', text, meta:{dice:accRoll.dice.concat(dodgeRoll.dice)} });
        await persistAndRefresh();
        renderClashActions();
      };
      document.getElementById('btn-clash-pin').onclick = async ()=>{
        opponent.clashPinned = true;
        await pushLog(code, { who:'Master', role:'gm', text: `📌 ${controller.name} pinna ${opponent.name}: non può Fuggire o fare Comeback finché non riesce un Contest Pin.` });
        await persistAndRefresh();
        renderClashActions();
      };
      document.getElementById('btn-clash-throw').onclick = async ()=>{
        const cStats = getParticipantCombatStats(controller);
        const oStats = getParticipantCombatStats(opponent);
        const cSizeIdx = getParticipantSizeIndex(controller);
        const oSizeIdx = getParticipantSizeIndex(opponent);
        if((oSizeIdx - cSizeIdx) >= 2 && !cStats.monsterStrength){
          const resEl2 = document.getElementById('clash-action-result');
          if(resEl2) resEl2.innerHTML = `<div class="err">${opponent.name} è 2+ Size più grande di ${controller.name}: serve Monster Strength (o Titan Power) per Lanciarlo.</div>`;
          return;
        }
        const dealt = Math.max(0, cStats.damage - oStats.armor);
        await applyDamageToParticipant(code, combat, opponent, dealt);
        const zi = Math.min(ZONES.length-1, zoneIndex(opponent.zone||'Medio')+1);
        opponent.zone = ZONES[zi];
        controller.clashWith=null; controller.clashController=false; controller.clashPinned=false; controller.clashComebackBonus=0;
        opponent.clashWith=null; opponent.clashController=false; opponent.clashPinned=false; opponent.clashComebackBonus=0;
        const w = getParticipantWounds(opponent);
        await pushLog(code, { who:'Master', role:'gm', text: `🤾 ${controller.name} lancia ${opponent.name} (${dealt} danno, ora a ${opponent.zone}) — il Clash finisce.` });
        await persistAndRefresh();
      };
      document.getElementById('btn-clash-weak').onclick = async ()=>{
        const oStats = getParticipantCombatStats(opponent);
        const cStats = getParticipantCombatStats(controller);
        const accRoll = rollPool(oStats.accuracy);
        const dodgeRoll = rollPool(Math.floor(cStats.dodge/2));
        let dealt=0, text;
        if(accRoll.successes<=dodgeRoll.successes){
          text = `🥊 ${opponent.name} tenta un Attacco Disperato su ${controller.name}: MANCATO (${accRoll.successes} vs ${dodgeRoll.successes} succ.)`;
        } else {
          const excess = accRoll.successes-dodgeRoll.successes;
          const raw = Math.max(0, excess+oStats.damage-cStats.armor);
          dealt = Math.ceil(raw/2);
          await applyDamageToParticipant(code, combat, controller, dealt);
          const w = getParticipantWounds(controller);
          text = `🥊 ${opponent.name} tenta un Attacco Disperato su ${controller.name}: COLPITO! ${dealt} danno (dimezzato) → ${controller.name} ${w.current}/${w.max} Ferite`;
        }
        await pushLog(code, { who:'Master', role:'roll', text, meta:{dice:accRoll.dice.concat(dodgeRoll.dice)} });
        await persistAndRefresh();
        renderClashActions();
      };
      document.getElementById('btn-clash-comeback').onclick = async ()=>{
        opponent.clashComebackBonus = 3;
        await pushLog(code, { who:'Master', role:'gm', text: `💪 ${opponent.name} si prepara al Comeback: +3 alla prossima Contesa del Clash.` });
        await persistAndRefresh();
        renderClashActions();
      };

        const narrTimeout = new Promise(resolve=>setTimeout(()=>resolve(null), 6000));

        if(!atk || !atk.areaAttack){

          return;
        }
        const spend = trySpendAction(attacker, 'attack');
        if(!spend.ok){
          if(resEl) resEl.innerHTML = `<div class="err">${spend.msg}</div>`;

        }
        const zone = centerTarget.zone || 'Medio';
        const victims = combat.participants.filter(p=>p.id!==attacker.id && p.side!==attacker.side && (p.zone||'Medio')===zone);
        if(victims.length===0){
          if(resEl) resEl.innerHTML = `<div class="err">Nessun bersaglio avversario nella zona ${zone}.</div>`;
          return;
        }
        const aStats = getParticipantCombatStats(attacker);
        const effAccuracy = Math.max(0, aStats.accuracy);
        const accRoll = rollPool(effAccuracy);
        if(aStats.certainStrike>0) accRoll.successes += aStats.certainStrike;
        const lines = [`🌪 ${attacker.name} usa ${atk.name} ${attackTagsPlain(atk)} come Area Attack sulla zona ${zone} (Accuracy ${effAccuracy}d6[${accRoll.dice.join(',')}]=${accRoll.successes} succ.):`];
        let combatMonsterGain = 0;
        for(const v of victims){
          const vStats = getParticipantCombatStats(v);
          const dodgeRoll = rollPool(vStats.dodge);
          if(vStats.absoluteEvasion>0) dodgeRoll.successes += vStats.absoluteEvasion;
          if(accRoll.successes <= dodgeRoll.successes){
            lines.push(`— ${v.name}: MANCATO (Dodge ${vStats.dodge}d6[${dodgeRoll.dice.join(',')}]=${dodgeRoll.successes} succ.)`);
            continue;
          }
          const excess = accRoll.successes - dodgeRoll.successes;
          if(atk.type==='Support'){
            if(atk.effectKey){
              const def = EFFECT_DEFS.find(d=>d.key===atk.effectKey);
              const isPositive = def && def.type==='positive';
              const finalPotency = isPositive ? 0 : 1;
              if(def && def.instant){
                const msg = await applyInstantEffect(code, v, atk.effectKey, 1);
                lines.push(`— ${v.name}: COLPITO! ${msg}`);
              } else if(finalPotency>0){
                if(!v.effects) v.effects=[];
                v.effects.push({ key: atk.effectKey, potency:1, duration:1 });
                lines.push(`— ${v.name}: COLPITO! Applica ${def?def.label:atk.effectKey} (Potenza 1, Durata 1 — ridotto da Area).`);
              } else {
                lines.push(`— ${v.name}: COLPITO! Effetto positivo azzerato dalla penalità Area (nessun effetto).`);
              }

              lines.push(`— ${v.name}: COLPITO! (nessun Effetto collegato)`);
            }
          } else {
            const raw = excess + aStats.damage;
            const dealt = Math.max(0, Math.ceil((raw - vStats.armor)/2));
            await applyDamageToParticipant(code, combat, v, dealt);
            if(dealt>0) combatMonsterGain += dealt;
            const w = getParticipantWounds(v);

            lines.push(`— ${v.name}: COLPITO! ${dealt} danno (dimezzato da Area) → ${w.current}/${w.max} Ferite${vDefeatNote}`);
          }
        }
        if(attacker.isPC && atk.type!=='Support'){
          const aMember = cachedRoster.find(m=>m.username===attacker.username);
          if(aMember && Number(aMember.digimon.resolveCurrent||0)>0 && computeQualityMechanics(aMember.digimon.qualities).combatMonster>0){
            aMember.digimon.resolveCurrent = 0;
            await saveMember(code, aMember);

        if(resEl) resEl.innerHTML = '<div class="muted" style="font-size:11px;">Tiro in corso...</div>';
        const hitCount = victims.length - lines.filter(l=>l.includes('MANCATO')).length;
        const compactHTML = attackResultCompactHTML(
          `🌪 ${atk.name} come Area su ${zone}: ${hitCount}/${victims.length} colpiti.`,
          hitCount>0, combatMonsterGain,
          `${diceRowHTML(accRoll.dice)}<div class="muted" style="margin-top:4px;font-size:10.5px;">${lines.map(escapeHTML).join('<br>')}</div>`
        );
        await pushLog(code, { who:'Master', role:'roll', text: lines.join(' | '), meta:{ dice: accRoll.dice } });
        await persistAndRefresh();
        const resEl2 = document.getElementById('combat-attack-result');

      };

          return;
        }
        const aStats = getParticipantClashStats(a);

        const wasClashPair = a.clashWith===b.id && b.clashWith===a.id;
        const aPinned = wasClashPair && a.clashPinned && !a.clashController;
        const bPinned = wasClashPair && b.clashPinned && !b.clashController;
        let winner, loser, aRoll, bRoll, autoWin=false;
        if(aPinned || bPinned){
          winner = aPinned ? b : a; loser = aPinned ? a : b;
          autoWin = true;
        } else {
          const aBonus = (a.clashComebackBonus||0) + (aStats.clashBonus||0);
          const bBonus = (b.clashComebackBonus||0) + (bStats.clashBonus||0);
          aRoll = rollSkillCheck(aStats.cpu, aStats.ram); aRoll.total += aBonus;
          bRoll = rollSkillCheck(bStats.cpu, bStats.ram); bRoll.total += bBonus;
          if(aRoll.total > bRoll.total){ winner=a; loser=b; }
          else if(bRoll.total > aRoll.total){ winner=b; loser=a; }
          else if(aStats.cpu !== bStats.cpu){ winner = aStats.cpu>bStats.cpu ? a : b; loser = winner===a?b:a; }
          else { winner = a; loser = b; }
        }
        a.clashComebackBonus = 0; b.clashComebackBonus = 0;
        a.clashPinned = false; b.clashPinned = false;
