<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giocatore — Digivice OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pixel Digivolve';
    src: url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff2') format('woff2'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff') format('woff'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.ttf') format('truetype');
    font-display: swap;
  }
  .pixel-title{ font-family:'Pixel Digivolve','Share Tech Mono',monospace; letter-spacing:0.03em; }
  :root{
    --bg: #080b10; --panel: #0e141b; --panel-2: #121a22; --line: #1c2a30;
    --cyan: #35e8c9; --cyan-dim: #1f6e63; --amber: #ff8a3d; --text: #dcece8;
    --text-mute: #6d8385; --danger: #ff5d5d; --radius: 2px;
    font-family: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root-app{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing:0.04em;}
  .app{min-height:100vh;background:
      radial-gradient(circle at 15% 10%, rgba(53,232,201,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,138,61,0.05), transparent 45%),
      var(--bg); padding:20px;}
  .hud-frame{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); position:relative;}
  .hud-frame::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
  .hud-frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .brand-title{font-family:'Pixel Digivolve','Share Tech Mono',monospace;font-size:15px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.05em;}
  .brand-sub{font-size:11px;color:var(--text-mute);}
  .conn-ticker{font-size:11px;color:var(--text-mute);}
  .conn-ticker b{color:var(--cyan);}
  .btn{font-family:'Share Tech Mono',monospace;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px 14px;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:0.05em;border-radius:var(--radius);transition:.15s;}
  .btn:hover{background:rgba(53,232,201,0.1);border-color:var(--cyan);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.solid{background:var(--cyan);color:#04211c;border-color:var(--cyan);font-weight:700;}
  .btn.solid:hover{background:#4ffbe0;}
  .btn.ghost{border-color:var(--line);color:var(--text-mute);}
  .btn.small{padding:5px 10px;font-size:10px;text-decoration:none;display:inline-block;}
  input[type=text], input[type=number], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; font-family:'Manrope',sans-serif; font-size:13px; border-radius:var(--radius); width:100%;
  }
  textarea{resize:vertical;min-height:56px;font-family:'Manrope',sans-serif;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--cyan-dim);}
  label{font-size:10px;text-transform:uppercase;color:var(--text-mute);letter-spacing:0.06em;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;min-width:0;}
  .section-title{font-size:12px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.08em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .card{padding:18px;margin-bottom:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .grid-skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-box{text-align:center;padding:10px 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);}
  .stat-box .l{font-size:9px;color:var(--text-mute);text-transform:uppercase;margin-top:4px;}
  .stat-box input{text-align:center;padding:6px;margin-top:4px;}
  .skill-box{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .skill-box .l{font-size:10px;color:var(--text-mute);text-transform:uppercase;}
  .skill-box input{width:60px;text-align:center;}
  .portrait-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .portrait{width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan-dim);background:#05070a;}
  .portrait-placeholder{width:120px;height:120px;border-radius:50%;background:var(--panel-2);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--text-mute);}
  .list-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;}
  .list-item .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .list-item .name{font-weight:700;font-size:13px;}
  .list-item .sub{font-size:11px;color:var(--text-mute);margin-top:4px;}
  .add-row{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;}
  .muted{color:var(--text-mute);font-size:11px;}
  .err{color:var(--danger);font-size:11px;margin-top:6px;}
  .ok-msg{color:var(--cyan);font-size:11px;margin-top:6px;}
  .login-wrap{max-width:420px;margin:60px auto;padding:32px;}
  .login-wrap h1{font-family:'Pixel Digivolve','Share Tech Mono',monospace;color:var(--cyan);font-size:26px;letter-spacing:0.03em;text-align:center;text-shadow:0 0 16px rgba(53,232,201,0.5);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:24px;}
  .role-pick{display:flex;gap:10px;margin-bottom:16px;}
  .role-pick .btn{flex:1;}
  .role-pick .btn.active{background:rgba(53,232,201,0.12);border-color:var(--cyan);color:var(--cyan);}
  .save-bar{position:sticky;bottom:0;padding:14px 0;margin-top:6px;background:linear-gradient(to top, var(--bg) 60%, transparent);}
  @media (max-width: 700px){
    .grid-stats{grid-template-columns:repeat(3,1fr);}
    .app{padding:10px;}
    /* Schede pieghevoli: tocca il titolo per aprire/chiudere la scheda */
    .hud-frame.card > .section-title{cursor:pointer;user-select:none;}
    .hud-frame.card > .section-title .fold-icon{transition:transform .15s;display:inline-block;}
    .hud-frame.card.collapsed > .section-title .fold-icon{transform:rotate(-90deg);}
    .hud-frame.card.collapsed > *:not(.section-title){display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="scanline" style="position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);mix-blend-mode:overlay;"></div>
  <div id="root-app"></div>
</div>
<script>
(function(){
  const SESSION_KEY = 'digivice_session_v1';
  // Immagine dell'Uovo mostrata al posto del Digimon finché il Master non approva la scheda.
  // Rocco: sostituisci con l'URL della tua immagine (es. su Supabase Storage), altrimenti resta l'emoji di fallback.
  const EGG_IMAGE_URL = 'https://i.imgur.com/68Yh5vE.gif';
  let session = null;
  let cachedRoster = [];
  let lastApiError = null;
  let pollTimer = null;

  const root = document.getElementById('root-app');

  const SKILL_DEFS = [
    { key:'evade', label:'Evade' }, { key:'precision', label:'Precision' }, { key:'stealth', label:'Stealth' },
    { key:'athletics', label:'Athletics' }, { key:'endurance', label:'Endurance' }, { key:'featsOfStrength', label:'Feats of Strength' },
    { key:'manipulate', label:'Manipulate' }, { key:'perform', label:'Perform' }, { key:'persuasion', label:'Persuasion' },
    { key:'decipherIntent', label:'Decipher Intent' }, { key:'survival', label:'Survival' }, { key:'knowledge', label:'Knowledge' },
    { key:'fortitude', label:'Fortitude' }, { key:'bravery', label:'Bravery' }, { key:'awareness', label:'Awareness' }
  ];
  const STAT_DEFS = [
    { key:'agility', label:'Agility' }, { key:'body', label:'Body' }, { key:'charisma', label:'Charisma' },
    { key:'intelligence', label:'Intelligence' }, { key:'willpower', label:'Willpower' }
  ];

  function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHTML(s); }

  function defaultTamer(){
    const skills = {}; SKILL_DEFS.forEach(s=>skills[s.key]=0);
    return { agility:1, body:1, charisma:1, intelligence:1, willpower:1, imageUrl:'', currentWounds:null, inventory:[], skills,
      unspentGrowthPoints:0, inspirationPoints:0, tormentPenalty:0, torments:[],
      majorAspect:{text:'',usesLeft:1}, minorAspect:{text:'',usesLeft:2} };
  }
  function normalizeMember(m){
    m.tamer = Object.assign(defaultTamer(), m.tamer||{});
    m.tamer.skills = Object.assign((()=>{const s={};SKILL_DEFS.forEach(d=>s[d.key]=0);return s;})(), m.tamer.skills||{});
    if(!Array.isArray(m.tamer.inventory)) m.tamer.inventory = [];
    if(!Array.isArray(m.tamer.torments)) m.tamer.torments = [];
    if(!m.tamer.majorAspect) m.tamer.majorAspect = { text:'', usesLeft:1 };
    if(!m.tamer.minorAspect) m.tamer.minorAspect = { text:'', usesLeft:2 };
    return m;
  }

  // ---------- session ----------
  function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function loadSession(){ try{ const v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

  // ---------- api ----------
  async function apiGet(path){
    try{ const r = await fetch(path); const data = await r.json();
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function apiPost(path, body){
    try{ const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await r.json();
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function getRoster(code){ const d = await apiGet('/api/roster?code=' + encodeURIComponent(code)); return d ? (d.members||[]).map(normalizeMember) : []; }
  async function saveMember(code, member){ const d = await apiPost('/api/roster', { code, member }); return !!(d && d.ok); }
  async function uploadImage(code, dataUrl){ return apiPost('/api/upload', { code, dataUrl }); }

  // ---------- collapsible cards (mobile) ----------
  function enableCollapsibleCards(container){
    (container||document).querySelectorAll('.hud-frame.card').forEach(card=>{
      const title = card.querySelector(':scope > .section-title');
      if(!title || title.dataset.foldBound) return;
      title.dataset.foldBound = '1';
      if(!title.querySelector('.fold-icon')){
        const icon = document.createElement('span');
        icon.className = 'fold-icon';
        icon.textContent = '▾';
        title.appendChild(icon);
      }
      title.addEventListener('click', ()=>{
        if(window.innerWidth > 700) return;
        card.classList.toggle('collapsed');
      });
    });
  }

  // ---------- polling ----------
  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async ()=>{
      if(!session) return;
      cachedRoster = await getRoster(session.code);
      if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      render();
    }, 4000);
  }

  function render(){
    if(!session){ renderLogin(); return; }
    renderPage();
  }

  function topbar(){
    return `
    <div class="hud-frame topbar">
      <div>
        <div class="brand-title">👤 GIOCATORE</div>
        <div class="brand-sub">Digimon: Digital Adventures — Campagna ${escapeHTML(session.code)}</div>
      </div>
      <div class="conn-ticker mono">
        UTENTE <b>${escapeHTML(session.username)}</b> (${session.role==='master'?'Master':'Giocatore'})
        &nbsp;<a href="index.html" class="btn ghost small">← Tavolo</a>
        &nbsp;<a href="digimon.html" class="btn ghost small">👾 Digimon</a>
        &nbsp;<button class="btn ghost small" id="btn-logout">Esci</button>
      </div>
    </div>
    ${lastApiError ? `<div class="hud-frame" style="border-color:var(--danger);padding:8px 14px;margin-bottom:16px;color:var(--danger);font-size:12px;">⚠ ${escapeHTML(lastApiError)}</div>` : ''}`;
  }

  function renderLogin(){
    root.innerHTML = `
      <div class="login-wrap hud-frame">
        <h1>GIOCATORE // ACCESSO</h1>
        <div class="sub">Inserisci lo stesso codice campagna e nome utente usati nel Tavolo Testuale.</div>
        <div class="field"><label>Codice Campagna</label><input type="text" id="in-code" placeholder="es. FRONTIER01" /></div>
        <div class="field"><label>Nome Utente</label><input type="text" id="in-user" placeholder="il tuo nome al tavolo" /></div>
        <div class="field"><label>Ruolo</label>
          <div class="role-pick">
            <button class="btn active" id="role-player" data-role="player">Giocatore</button>
            <button class="btn" id="role-master" data-role="master">Master</button>
          </div>
        </div>
        <button class="btn solid" id="btn-enter" style="width:100%;padding:12px;">Entra</button>
        <div class="err" id="login-err"></div>
      </div>`;
    let role = 'player';
    document.getElementById('role-player').onclick = ()=>{ role='player'; document.getElementById('role-player').classList.add('active'); document.getElementById('role-master').classList.remove('active'); };
    document.getElementById('role-master').onclick = ()=>{ role='master'; document.getElementById('role-master').classList.add('active'); document.getElementById('role-player').classList.remove('active'); };
    document.getElementById('btn-enter').onclick = async ()=>{
      const code = document.getElementById('in-code').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      const username = document.getElementById('in-user').value.trim();
      const errEl = document.getElementById('login-err');
      if(!code || !username){ errEl.textContent = 'Inserisci codice campagna e nome utente.'; return; }
      // Salviamo subito uno stub del membro (come fa index.html al login) così il Master
      // vede il giocatore comparire ovunque anche prima che abbia creato un personaggio.
      const roster = await getRoster(code);
      const existing = roster.find(m=>m.username===username);
      const member = normalizeMember(existing || { username, role });
      member.role = role;
      await saveMember(code, member);
      session = { code, username, role };
      saveSession(session);
      cachedRoster = await getRoster(code);
      startPolling();
      render();
    };
  }

  function logout(){
    if(pollTimer) clearInterval(pollTimer);
    session = null; clearSession(); render();
  }

  function statBoxHTML(m, key, label, editable){
    const val = Number(m.tamer[key])||0;
    return editable
      ? `<div class="stat-box"><input type="number" min="0" max="10" id="p-stat-${key}" value="${val}" /><div class="l">${label}</div></div>`
      : `<div class="stat-box"><div class="v mono" style="font-size:20px;color:var(--cyan);">${val}</div><div class="l">${label}</div></div>`;
  }

  function skillBoxHTML(m, def, editable){
    const val = Number(m.tamer.skills[def.key])||0;
    return editable
      ? `<div class="skill-box"><span class="l">${def.label}</span><input type="number" min="0" max="10" id="p-skill-${def.key}" value="${val}" /></div>`
      : `<div class="skill-box"><span class="l">${def.label}</span><span class="mono" style="color:var(--cyan);">${val}</span></div>`;
  }

  function portraitBlockHTML(m, editable){
    return `
    <div class="portrait-wrap">
      ${m.tamer.imageUrl ? `<img class="portrait" src="${escapeAttr(m.tamer.imageUrl)}" />` : `<div class="portrait-placeholder">👤</div>`}
      <div style="flex:1;min-width:220px;">
        ${editable
          ? `<div class="field"><label>Nome Utente (login — non modificabile qui)</label><input type="text" value="${escapeAttr(m.username)}" disabled /></div>`
          : `<div class="pixel-title" style="font-size:22px;color:var(--cyan);text-shadow:0 0 10px rgba(53,232,201,0.4);">${escapeHTML(m.username)}</div>`}
        <div class="muted" style="margin-top:2px;">Tamer — Campagna ${escapeHTML(session.code)}</div>
        ${editable ? `
        <div class="field" style="margin-top:12px;">
          <label>URL Immagine Profilo</label>
          <input type="text" id="p-imageUrl" value="${escapeAttr(m.tamer.imageUrl||'')}" placeholder="https://..." />
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="file" accept="image/*" id="p-img-file" style="display:none;" />
          <button type="button" class="btn ghost small" id="p-img-btn">📎 Carica immagine</button>
          <span class="muted" id="p-img-status"></span>
        </div>` : ''}
      </div>
    </div>`;
  }

  function statoBlockHTML(m, editable){
    const t = m.tamer;
    if(!editable){
      return `
      <div class="hud-frame card">
        <div class="section-title"><span>Stato</span></div>
        <div class="grid-2">
          <div class="field"><label>Ferite Attuali</label><div class="mono">${t.currentWounds ?? '—'}</div></div>
          <div class="field"><label>Punti Crescita non spesi</label><div class="mono">${t.unspentGrowthPoints||0}</div></div>
          <div class="field"><label>Punti Ispirazione</label><div class="mono">${t.inspirationPoints||0}</div></div>
          <div class="field"><label>Penalità Torment</label><div class="mono">${t.tormentPenalty||0}</div></div>
        </div>
      </div>`;
    }
    return `
    <div class="hud-frame card">
      <div class="section-title"><span>Stato</span></div>
      <div class="grid-2">
        <div class="field"><label>Ferite Attuali</label><input type="number" id="p-currentWounds" value="${t.currentWounds ?? 0}" /></div>
        <div class="field"><label>Punti Crescita non spesi</label><input type="number" id="p-unspentGrowthPoints" value="${t.unspentGrowthPoints||0}" /></div>
        <div class="field"><label>Punti Ispirazione</label><input type="number" id="p-inspirationPoints" value="${t.inspirationPoints||0}" /></div>
        <div class="field"><label>Penalità Torment</label><input type="number" id="p-tormentPenalty" value="${t.tormentPenalty||0}" /></div>
      </div>
    </div>`;
  }

  function aspectsBlockHTML(m, editable){
    const t = m.tamer;
    if(!editable){
      return `
      <div class="hud-frame card">
        <div class="section-title"><span>Aspetti</span></div>
        <div class="field"><label>Major Aspect</label><div>${escapeHTML(t.majorAspect.text||'—')} <span class="muted">(${t.majorAspect.usesLeft||0} usi)</span></div></div>
        <div class="field"><label>Minor Aspect</label><div>${escapeHTML(t.minorAspect.text||'—')} <span class="muted">(${t.minorAspect.usesLeft||0} usi)</span></div></div>
      </div>`;
    }
    return `
    <div class="hud-frame card">
      <div class="section-title"><span>Aspetti</span></div>
      <div class="row">
        <div class="field"><label>Major Aspect</label><input type="text" id="p-majorText" value="${escapeAttr(t.majorAspect.text||'')}" placeholder="es. Track Star..." /></div>
        <div class="field" style="max-width:90px;"><label>Usi</label><input type="number" id="p-majorUses" value="${t.majorAspect.usesLeft||0}" /></div>
      </div>
      <div class="row">
        <div class="field"><label>Minor Aspect</label><input type="text" id="p-minorText" value="${escapeAttr(t.minorAspect.text||'')}" placeholder="es. Smarter Than They Act..." /></div>
        <div class="field" style="max-width:90px;"><label>Usi</label><input type="number" id="p-minorUses" value="${t.minorAspect.usesLeft||0}" /></div>
      </div>
    </div>`;
  }

  function inventoryBlockHTML(m, editable){
    const items = m.tamer.inventory || [];
    return `
    <div class="hud-frame card">
      <div class="section-title"><span>Inventario</span></div>
      ${items.length===0 ? '<div class="muted">Nessun oggetto.</div>' : items.map((it,i)=>`
        <div class="list-item">
          <div class="top-row">
            <span class="name">${escapeHTML(it.name)} <span class="muted">x${Number(it.qty)||1}</span></span>
            ${editable ? `<button class="btn ghost small" data-inv-remove="${i}">Rimuovi</button>` : ''}
          </div>
          ${it.desc ? `<div class="sub">${escapeHTML(it.desc)}</div>` : ''}
        </div>
      `).join('')}
      ${editable ? `
      <div class="add-row">
        <div class="row">
          <div class="field"><label>Oggetto</label><input type="text" id="p-inv-name" placeholder="es. Digivice" /></div>
          <div class="field" style="max-width:70px;"><label>Q.tà</label><input type="number" id="p-inv-qty" value="1" min="1" /></div>
        </div>
        <div class="field"><label>Descrizione (opz.)</label><input type="text" id="p-inv-desc" placeholder="cosa fa..." /></div>
        <button class="btn ghost small" id="p-inv-add" style="width:100%;">+ Aggiungi Oggetto</button>
      </div>` : ''}
    </div>`;
  }

  function tormentBoxesHTML(boxes){
    boxes = Math.max(0, Math.min(10, Number(boxes)||0));
    let out = '<span style="display:inline-flex;gap:2px;vertical-align:middle;">';
    for(let i=1;i<=10;i++){
      out += `<span style="width:12px;height:12px;border:1px solid var(--cyan-dim);${i<=boxes?'background:var(--cyan);':'background:transparent;'}display:inline-block;"></span>`;
    }
    out += '</span>';
    return out;
  }

  function tormentsBlockHTML(m, editable){
    const items = m.tamer.torments || [];
    return `
    <div class="hud-frame card">
      <div class="section-title"><span>Torments</span></div>
      ${items.length===0 ? '<div class="muted">Nessun Torment registrato.</div>' : items.map((tor,i)=>`
        <div class="list-item">
          <div class="top-row">
            <span class="name">${escapeHTML(tor.name)}</span>
            <span class="mono">${tor.boxes||0}/10</span>
          </div>
          <div class="top-row" style="margin-top:6px;">
            ${tormentBoxesHTML(tor.boxes)}
            ${editable ? `
            <span style="display:flex;gap:4px;">
              <button class="btn ghost small" data-tor-minus="${i}" style="padding:3px 9px;">−</button>
              <button class="btn ghost small" data-tor-plus="${i}" style="padding:3px 9px;">+</button>
            </span>` : ''}
          </div>
          ${editable ? `
          <div class="top-row" style="margin-top:6px;">
            <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" data-torment-rest="${i}" ${tor.usedThisRest?'checked':''} style="width:auto;" /> Già tentato (Rest)</label>
            <button class="btn ghost small" data-torment-remove="${i}">Rimuovi</button>
          </div>` : ''}
        </div>
      `).join('')}
      ${editable ? `
      <div class="add-row">
        <div class="row">
          <div class="field"><label>Nome Torment</label><input type="text" id="p-tor-name" placeholder="nome" /></div>
          <div class="field" style="max-width:90px;"><label>Caselle iniziali</label><input type="number" id="p-tor-boxes" value="4" min="0" max="10" /></div>
        </div>
        <button class="btn ghost small" id="p-tor-add" style="width:100%;">+ Aggiungi Torment</button>
      </div>` : ''}
    </div>`;
  }

  function renderPage(){
    const isMaster = session.role === 'master';
    let target = null;
    let selectorHTML = '';

    if(isMaster){
      const players = cachedRoster.filter(m=>m.role==='player');
      const selected = window.__playerSelected || (players[0] && players[0].username) || null;
      target = players.find(p=>p.username===selected) || players[0] || null;
      selectorHTML = `
      <div class="hud-frame card">
        <div class="section-title"><span>Seleziona Giocatore</span></div>
        <select id="p-select-player">
          ${players.length===0 ? '<option>— nessun giocatore —</option>' : players.map(p=>`<option value="${escapeAttr(p.username)}" ${target && target.username===p.username?'selected':''}>${escapeHTML(p.username)}</option>`).join('')}
        </select>
        <div class="muted" style="margin-top:8px;">Come Master puoi modificare direttamente la scheda selezionata.</div>
      </div>`;
    } else {
      target = cachedRoster.find(m=>m.username===session.username);
    }

    const editable = true;

    root.innerHTML = `
      <div style="max-width:760px;margin:0 auto;">
        ${topbar()}
        ${selectorHTML}
        ${!target ? `
        <div class="hud-frame card muted">
          ${isMaster ? 'Nessuna scheda trovata. Seleziona un giocatore.' : `
            <div style="margin-bottom:10px;">Non hai ancora una scheda. Puoi crearla subito con la Creazione Guidata.</div>
            <a href="index.html?openWizard=1" target="_blank" class="btn solid" style="text-decoration:none;display:inline-block;padding:10px 16px;">🧙 Apri Creazione Guidata</a>
          `}
        </div>` : `
        <div class="hud-frame card">
          ${portraitBlockHTML(target, editable)}
        </div>
        <div class="hud-frame card">
          <div class="section-title"><span>Punteggi Base</span></div>
          <div class="grid-stats">
            ${STAT_DEFS.map(d=>statBoxHTML(target, d.key, d.label, editable)).join('')}
          </div>
        </div>
        <div class="hud-frame card">
          <div class="section-title"><span>Skill</span></div>
          <div class="grid-skills">
            ${SKILL_DEFS.map(d=>skillBoxHTML(target, d, editable)).join('')}
          </div>
        </div>
        ${statoBlockHTML(target, editable)}
        ${aspectsBlockHTML(target, editable)}
        ${inventoryBlockHTML(target, editable)}
        ${tormentsBlockHTML(target, editable)}
        ${editable ? `
        <div class="save-bar">
          <button class="btn solid" id="p-save" style="width:100%;padding:12px;">💾 Salva Scheda</button>
          <div id="p-save-msg" style="margin-top:8px;"></div>
          ${isMaster ? `<button class="btn ghost" id="p-reset" style="width:100%;padding:10px;margin-top:8px;color:var(--danger);border-color:var(--danger);">🗑️ Azzera Scheda Tamer (permette una nuova Creazione Guidata)</button>` : ''}
        </div>` : ''}
        `}
      </div>`;

    document.getElementById('btn-logout').onclick = logout;

    if(isMaster){
      const sel = document.getElementById('p-select-player');
      if(sel) sel.onchange = ()=>{ window.__playerSelected = sel.value; renderPage(); };
    }

    if(target && editable){
      bindImageUpload(target);
      bindListEditors(target);
      document.getElementById('p-save').onclick = async ()=>{
        STAT_DEFS.forEach(d=>{
          const el = document.getElementById('p-stat-'+d.key);
          if(el) target.tamer[d.key] = Math.max(0, Number(el.value)||0);
        });
        SKILL_DEFS.forEach(d=>{
          const el = document.getElementById('p-skill-'+d.key);
          if(el) target.tamer.skills[d.key] = Math.max(0, Number(el.value)||0);
        });
        const imgEl = document.getElementById('p-imageUrl');
        if(imgEl) target.tamer.imageUrl = imgEl.value.trim();
        target.tamer.currentWounds = Math.max(0, Number(document.getElementById('p-currentWounds').value)||0);
        target.tamer.unspentGrowthPoints = Math.max(0, Number(document.getElementById('p-unspentGrowthPoints').value)||0);
        target.tamer.inspirationPoints = Math.max(0, Number(document.getElementById('p-inspirationPoints').value)||0);
        target.tamer.tormentPenalty = Number(document.getElementById('p-tormentPenalty').value)||0;
        target.tamer.majorAspect.text = document.getElementById('p-majorText').value.trim();
        target.tamer.majorAspect.usesLeft = Math.max(0, Number(document.getElementById('p-majorUses').value)||0);
        target.tamer.minorAspect.text = document.getElementById('p-minorText').value.trim();
        target.tamer.minorAspect.usesLeft = Math.max(0, Number(document.getElementById('p-minorUses').value)||0);

        const msgEl = document.getElementById('p-save-msg');
        msgEl.innerHTML = '<span class="muted">Salvataggio...</span>';
        const ok = await saveMember(session.code, target);
        msgEl.innerHTML = ok ? '<span class="ok-msg">✔ Salvato.</span>' : `<span class="err">⚠ ${escapeHTML(lastApiError||'errore sconosciuto')}</span>`;
        if(ok) cachedRoster = await getRoster(session.code);
      };
      const resetBtn = document.getElementById('p-reset');
      if(resetBtn){
        resetBtn.onclick = async ()=>{
          if(!window.confirm(`Azzerare la Scheda Tamer di ${target.username}? Attributi, Skill, Torments, Aspetti e Inventario torneranno a zero e potrà rifare la Creazione Guidata. L'azione non è reversibile.`)) return;
          if(!window.confirm(`Sei sicuro? Questa è l'ultima conferma prima di azzerare definitivamente la Scheda Tamer di ${target.username}.`)) return;
          target.tamer = defaultTamer();
          const ok = await saveMember(session.code, target);
          if(ok) cachedRoster = await getRoster(session.code);
          renderPage();
        };
      }
    }

    enableCollapsibleCards(root);
  }

  function bindListEditors(target){
    root.querySelectorAll('[data-inv-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.tamer.inventory.splice(Number(btn.getAttribute('data-inv-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    const invAdd = document.getElementById('p-inv-add');
    if(invAdd) invAdd.onclick = async ()=>{
      const name = document.getElementById('p-inv-name').value.trim();
      if(!name) return;
      const qty = Number(document.getElementById('p-inv-qty').value)||1;
      const desc = document.getElementById('p-inv-desc').value.trim();
      target.tamer.inventory.push({ name, qty, desc });
      await saveMember(session.code, target);
      renderPage();
    };
    root.querySelectorAll('[data-torment-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.tamer.torments.splice(Number(btn.getAttribute('data-torment-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-tor-plus]').forEach(btn=>{
      btn.onclick = async ()=>{
        const tor = target.tamer.torments[Number(btn.getAttribute('data-tor-plus'))];
        tor.boxes = Math.min(10, (Number(tor.boxes)||0)+1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-tor-minus]').forEach(btn=>{
      btn.onclick = async ()=>{
        const tor = target.tamer.torments[Number(btn.getAttribute('data-tor-minus'))];
        tor.boxes = Math.max(0, (Number(tor.boxes)||0)-1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-torment-rest]').forEach(chk=>{
      chk.onchange = async ()=>{
        target.tamer.torments[Number(chk.getAttribute('data-torment-rest'))].usedThisRest = chk.checked;
        await saveMember(session.code, target);
      };
    });
    const torAdd = document.getElementById('p-tor-add');
    if(torAdd) torAdd.onclick = async ()=>{
      const name = document.getElementById('p-tor-name').value.trim();
      if(!name) return;
      const boxes = Math.max(0, Math.min(10, Number(document.getElementById('p-tor-boxes').value)||0));
      target.tamer.torments.push({ name, boxes, usedThisRest:false });
      await saveMember(session.code, target);
      renderPage();
    };
  }

  function bindImageUpload(target){
    const fileInput = document.getElementById('p-img-file');
    const btn = document.getElementById('p-img-btn');
    const statusEl = document.getElementById('p-img-status');
    if(!fileInput || !btn) return;
    btn.onclick = ()=> fileInput.click();
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      statusEl.textContent = 'Caricamento...';
      btn.disabled = true;
      try{
        const dataUrl = await new Promise((resolve,reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await uploadImage(session.code, dataUrl);
        if(res && res.ok && res.url){
          const imgEl = document.getElementById('p-imageUrl');
          if(imgEl) imgEl.value = res.url;
          statusEl.textContent = '✔ Caricata — ricordati di salvare.';
        } else {
          statusEl.textContent = '⚠ Caricamento fallito: ' + (lastApiError||'errore sconosciuto');
        }
      }catch(e){
        statusEl.textContent = '⚠ Errore: ' + e.message;
      }
      btn.disabled = false;
      fileInput.value = '';
    };
  }

  // ---------- boot ----------
  const restored = loadSession();
  if(restored && restored.code && restored.username){ session = restored; }
  (async ()=>{
    if(session){ cachedRoster = await getRoster(session.code); startPolling(); }
    render();
  })();
})();
</script>
</body>
</html>
