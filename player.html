<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giocatore — Digivice OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pixel Digivolve';
    src: url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff2') format('woff2'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.woff') format('woff'),
         url('https://db.onlinewebfonts.com/t/e7a35327535403014c02a38c285b82cf.ttf') format('truetype');
    font-display: swap;
  }
  .pixel-title{ font-family:'Pixel Digivolve','Share Tech Mono',monospace; letter-spacing:0.03em; }
  :root{
    --bg: #080b10; --panel: #0e141b; --panel-2: #121a22; --line: #1c2a30;
    --cyan: #35e8c9; --cyan-dim: #1f6e63; --amber: #ff8a3d; --text: #dcece8;
    --text-mute: #6d8385; --danger: #ff5d5d; --radius: 2px;
    font-family: 'Manrope', sans-serif;
  }
  *{box-sizing:border-box;}
  body,#root-app{margin:0;padding:0;background:var(--bg);color:var(--text);}
  .mono{font-family:'Share Tech Mono', monospace; letter-spacing:0.04em;}
  .app{min-height:100vh;background:
      radial-gradient(circle at 15% 10%, rgba(53,232,201,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,138,61,0.05), transparent 45%),
      var(--bg); padding:20px;}
  .hud-frame{border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); position:relative;}
  .hud-frame::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);}
  .hud-frame::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .brand-title{font-family:'Pixel Digivolve','Share Tech Mono',monospace;font-size:15px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.05em;}
  .brand-sub{font-size:11px;color:var(--text-mute);}
  .conn-ticker{font-size:11px;color:var(--text-mute);}
  .conn-ticker b{color:var(--cyan);}
  .btn{font-family:'Share Tech Mono',monospace;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px 14px;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:0.05em;border-radius:var(--radius);transition:.15s;}
  .btn:hover{background:rgba(53,232,201,0.1);border-color:var(--cyan);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn.solid{background:var(--cyan);color:#04211c;border-color:var(--cyan);font-weight:700;}
  .btn.solid:hover{background:#4ffbe0;}
  .btn.ghost{border-color:var(--line);color:var(--text-mute);}
  .btn.small{padding:5px 10px;font-size:10px;text-decoration:none;display:inline-block;}
  input[type=text], input[type=number], textarea, select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; font-family:'Manrope',sans-serif; font-size:13px; border-radius:var(--radius); width:100%;
  }
  textarea{resize:vertical;min-height:56px;font-family:'Manrope',sans-serif;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--cyan-dim);}
  label{font-size:10px;text-transform:uppercase;color:var(--text-mute);letter-spacing:0.06em;display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;min-width:0;}
  .section-title{font-size:12px;text-transform:uppercase;color:var(--cyan);letter-spacing:0.08em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .card{padding:18px;margin-bottom:16px;}
  .grid-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .grid-skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-box{text-align:center;padding:10px 4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);}
  .stat-box .l{font-size:9px;color:var(--text-mute);text-transform:uppercase;margin-top:4px;}
  .stat-box input{text-align:center;padding:6px;margin-top:4px;}
  .skill-box{padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .skill-box .l{font-size:10px;color:var(--text-mute);text-transform:uppercase;}
  .skill-box input{width:60px;text-align:center;}
  .portrait-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .portrait{width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan-dim);background:#05070a;}
  .portrait-placeholder{width:120px;height:120px;border-radius:50%;background:var(--panel-2);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--text-mute);}
  .list-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;}
  .list-item .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .list-item .name{font-weight:700;font-size:13px;}
  .list-item .sub{font-size:11px;color:var(--text-mute);margin-top:4px;}
  .add-row{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;}
  .muted{color:var(--text-mute);font-size:11px;}
  .err{color:var(--danger);font-size:11px;margin-top:6px;}
  .ok-msg{color:var(--cyan);font-size:11px;margin-top:6px;}
  .login-wrap{max-width:420px;margin:60px auto;padding:32px;}
  .login-wrap h1{font-family:'Pixel Digivolve','Share Tech Mono',monospace;color:var(--cyan);font-size:26px;letter-spacing:0.03em;text-align:center;text-shadow:0 0 16px rgba(53,232,201,0.5);margin-bottom:4px;}
  .login-wrap .sub{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:24px;}
  .role-pick{display:flex;gap:10px;margin-bottom:16px;}
  .role-pick .btn{flex:1;}
  .role-pick .btn.active{background:rgba(53,232,201,0.12);border-color:var(--cyan);color:var(--cyan);}
  .save-bar{position:sticky;bottom:0;padding:14px 0;margin-top:6px;background:linear-gradient(to top, var(--bg) 60%, transparent);}
  @media (max-width: 700px){
    .grid-stats{grid-template-columns:repeat(3,1fr);}
    .app{padding:10px;}
    /* Schede pieghevoli: tocca il titolo per aprire/chiudere la scheda */
    .hud-frame.card > .section-title{cursor:pointer;user-select:none;}
    .hud-frame.card > .section-title .fold-icon{transition:transform .15s;display:inline-block;}
    .hud-frame.card.collapsed > .section-title .fold-icon{transform:rotate(-90deg);}
    .hud-frame.card.collapsed > *:not(.section-title){display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="scanline" style="position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);mix-blend-mode:overlay;"></div>
  <div id="root-app"></div>
</div>
<script>
(function(){
  const SESSION_KEY = 'digivice_session_v1';
  // Immagine dell'Uovo mostrata al posto del Digimon finché il Master non approva la scheda.
  // Rocco: sostituisci con l'URL della tua immagine (es. su Supabase Storage), altrimenti resta l'emoji di fallback.
  const EGG_IMAGE_URL = 'https://i.imgur.com/68Yh5vE.gif';
  let session = null;
  let cachedRoster = [];
  let lastApiError = null;
  let pollTimer = null;

  const root = document.getElementById('root-app');

  const SKILL_DEFS = [
    { key:'evade', label:'Evade', attrs:['agility','willpower'] },
    { key:'precision', label:'Precision', attrs:['agility','intelligence'] },
    { key:'stealth', label:'Stealth', attrs:['agility','body'] },
    { key:'athletics', label:'Athletics', attrs:['body','agility'] },
    { key:'endurance', label:'Endurance', attrs:['body','willpower'] },
    { key:'featsOfStrength', label:'Feats of Strength', attrs:['body','charisma'] },
    { key:'manipulate', label:'Manipulate', attrs:['charisma','body'] },
    { key:'perform', label:'Perform', attrs:['charisma','agility'] },
    { key:'persuasion', label:'Persuasion', attrs:['charisma','intelligence'] },
    { key:'decipherIntent', label:'Decipher Intent', attrs:['intelligence','charisma'] },
    { key:'survival', label:'Survival', attrs:['intelligence','willpower'] },
    { key:'knowledge', label:'Knowledge', attrs:['intelligence'] },
    { key:'fortitude', label:'Fortitude', attrs:['willpower','intelligence'] },
    { key:'bravery', label:'Bravery', attrs:['willpower','body'] },
    { key:'awareness', label:'Awareness', attrs:['willpower','agility'] }
  ];
  const STAT_DEFS = [
    { key:'agility', label:'Agility' }, { key:'body', label:'Body' }, { key:'charisma', label:'Charisma' },
    { key:'intelligence', label:'Intelligence' }, { key:'willpower', label:'Willpower' }
  ];
  const ATTR_ABBR = { agility:'AGI', body:'BODY', charisma:'CAR', intelligence:'INT', willpower:'WILL' };
  const CAMPAIGN_LEVELS = {
    Standard: { ap:10, sp:25, cap:5, thresholds:[3,5,6,7], tnShift:0, startTorment:8 },
    Classic:  { ap:5,  sp:20, cap:3, thresholds:[2,3,4,5], tnShift:-2, startTorment:5 },
    Extreme:  { ap:15, sp:30, cap:7, thresholds:[4,6,8,10], tnShift:2, startTorment:10 }
  };
  let cachedProgression = null;
  function campaignConfig(){
    const level = (cachedProgression && cachedProgression.campaignLevel) || 'Standard';
    return CAMPAIGN_LEVELS[level] || CAMPAIGN_LEVELS.Standard;
  }
  function skillMax(t, def){ return Math.max(...def.attrs.map(a=>Number(t[a])||0)); }
  // Legge il Digimon partner (stesso membro di roster — le due schede condividono lo stesso record,
  // vedi normalizeMember) per sommare eventuali bonus di Prodigious Skill / Mind Over Matter su
  // questa Skill: +3 ai Check, per regola Companion 3.02a (aggiornata dal Changelog 21/11/25).
  function prodigiousSkillBonus(m, def){
    const qualities = (m && m.digimon && Array.isArray(m.digimon.qualities)) ? m.digimon.qualities : [];
    let bonus = 0;
    qualities.forEach(q=>{
      if(!q) return;
      if(q.mechanic==='prodigiousSkill' && q.skillTarget===def.label) bonus += 3;
      if(q.mechanic==='mindOverMatter' && (q.skillTarget===def.label || q.skillTarget2===def.label)) bonus += 3;
    });
    return bonus;
  }

  // ---------- Tamer Talents (soglia 3/5 Iniziali, 6/7 Avanzati — su Attributo o Skill) ----------
  const TALENT_DEFS = [
    { attr:'agility', threshold:3, name:'Quick Step', text:'Quando prendi l\'Azione Reposition, guadagni +1 Successo al risultato finale.' },
    { attr:'agility', threshold:5, name:'Strike Fast', text:'Special Order "FULL SPEED AHEAD" (2 Azioni): il Digimon guadagna 1 Azione extra, da usare per Muovi o Movimento Difficile.' },
    { attr:'body', threshold:3, name:'Bulk Up', text:'Quando prendi l\'Azione Reinforce, guadagni +1 Successo al risultato finale.' },
    { attr:'body', threshold:5, name:'Energy Burst', text:'Special Order "DON\'T WORRY YOU\'LL HEAL" (1 Azione): il Digimon recupera 1 Casella Ferita (2 se ha Ferite Temporanee).' },
    { attr:'body', threshold:7, name:'Overpower', text:'Special Order "I\'M WITH YOU" (1 Azione, una volta a riposo): dopo un tiro Accuracy del Digimon, i 4 contano come Successi.' },
    { attr:'charisma', threshold:3, name:'Direct Team', text:'La penalità -2 per dirigere Digimon che non sono il tuo si riduce a -1.' },
    { attr:'charisma', threshold:5, name:'Swagger', text:'Special Order "HEY YOU" (1 Azione): applica [TAUNT] a un Nemico per 3 round.' },
    { attr:'charisma', threshold:6, name:'Peak Performance', text:'Special Order "I BELIEVE IN YOU" (2 Azioni, una volta a combattimento): un Digimon alleato guadagna [BASTION 2] fino al tuo prossimo turno.' },
    { attr:'charisma', threshold:7, name:'Revitalize', text:'Special Order "WAKE UP, DON\'T QUIT NOW" (2 Azioni, una volta a riposo): rianima un Digimon sconfitto.' },
    { attr:'intelligence', threshold:3, name:'Experienced', text:'Guadagni +1 Punto Skill extra da spendere (in creazione, può portare una Skill a 5 anche superando il limite di una sola Skill al massimo).' },
    { attr:'intelligence', threshold:5, name:'Calculated', text:'Special Order: puoi trasformare Bolster in +1 Successo invece di +2 dadi.' },
    { attr:'intelligence', threshold:6, name:'Signature Versatility', text:'Special Order "TIME FOR PLAN B" (Azione Libera, una volta a combattimento): il prossimo Attacco del Digimon conta come Signature Move.' },
    { attr:'intelligence', threshold:7, name:'Enemy Scan', text:'Special Order "I\'VE FOUND AN EXPLOIT" (2 Azioni, una volta a riposo): infliggi [DEBILITATE] a un Nemico con Potenza pari al suo Stage.' },
    { attr:'willpower', threshold:3, name:'Potential', text:'Guadagni 1 Punto Ispirazione Temporaneo all\'inizio di ogni sessione.' },
    { attr:'willpower', threshold:5, name:'Purify Partner', text:'Special Order "TOUGH IT OUT" (1 Azione): cura il Digimon da un Effetto Negativo, come [CLEANSE].' },
    { attr:'willpower', threshold:6, name:'Challenger', text:'Quando si tira l\'Iniziativa, il tuo Digimon guadagna Ferite Temporanee pari ai tuoi Successi Willpower + lo Stage più alto tra i nemici (max 5).' },
    { attr:'willpower', threshold:7, name:'Miracle', text:'Spendendo 7 IP puoi aggiungere/sottrarre Willpower+5 a un Check, Dodge o Accuracy Pool.' },

    { attr:'evade', skill:true, threshold:3, name:'Avoiding Consequences', text:'Un Fallimento Critico su Check/Torment Check diventa Fallimento normale se sommando i punti in Evade si raggiungerebbe quel risultato.' },
    { attr:'evade', skill:true, threshold:5, name:'Tuck and Roll', text:'Una Evade fallita in combattimento può diventare un Successo, una volta a Rest.' },
    { attr:'evade', skill:true, threshold:7, name:'Quickening', text:'Special Order "YOU\'RE ONE STEP BEHIND" (Interrupt, una volta a combattimento): il Digimon schiva automaticamente un Attacco in arrivo, senza tirare.' },

    { attr:'precision', skill:true, threshold:3, name:'Busy Hands', text:'Crea senza tiro un oggetto utile durante un Rest, che dà un bonus a una Skill scelta pari ai punti in Precision sopra 2 (un solo uso, un oggetto per Rest).' },
    { attr:'precision', skill:true, threshold:5, name:'Aim Assist', text:'Dirigendo il Digimon per migliorare l\'Accuracy con 2 Azioni (Highest Attribute), il bonus al Direct sale di +2.' },
    { attr:'precision', skill:true, threshold:7, name:'Auto Hit', text:'Special Order "PUT 100% INTO THIS" (2 Azioni, una volta a combattimento): un Attacco (non Signature Move) colpisce automaticamente con successi pari all\'SV dell\'attaccante.' },

    { attr:'stealth', skill:true, threshold:3, name:'Overlooked', text:'Si mimetizza senza tiro; in combattimento può muoversi/agire senza essere notato finché non colpisce un nemico. Individuabile con Awareness TN 9 + punti in Stealth.' },
    { attr:'stealth', skill:true, threshold:5, name:'Silent Movement', text:'Tamer e Digimon non fanno rumore né lasciano impronte camminando.' },
    { attr:'stealth', skill:true, threshold:7, name:'Vanish', text:'Special Order "NOW YOU SEE US" (1 Azione, una volta a combattimento): Tamer e Digimon spariscono dalla vista di un nemico scelto ([BLIND] fino al prossimo turno del Tamer).' },

    { attr:'athletics', skill:true, threshold:3, name:'Natural Explorer', text:'Usa Athletics o Agility (il più alto) per il Movement; ottiene Climb/Swim/Jump pari al Movement e ignora il Terreno Difficile.' },
    { attr:'athletics', skill:true, threshold:5, name:'Experienced Step', text:'Reposition da 2 Azioni: +1 Successo al risultato finale.' },
    { attr:'athletics', skill:true, threshold:7, name:'Bullrush', text:'Special Order "THIS TRAIN WON\'T STOP" (1 Azione, una volta a combattimento): il Digimon ottiene Difficult Move come Azione Gratuita, e fino a fine turno lo stesso Difficult Move costa 1 Azione in meno (min. 1).' },

    { attr:'endurance', skill:true, threshold:3, name:'No Pain, No Gain', text:'Un Check fallito (non Torment) può essere ritirato come Check di Endurance con l\'Attributo pertinente, un numero di volte pari ai punti in Endurance sopra 2 (si ricarica a ogni Rest).' },
    { attr:'endurance', skill:true, threshold:5, name:'Grit', text:'Può schivare gli attacchi con Endurance invece di Evade (subisce comunque min. 1 danno anche se supera il Check); se ridotto a 0 Wound Box resta a 1. Una volta a Rest.' },
    { attr:'endurance', skill:true, threshold:7, name:'Thick Skin', text:'Special Order "NO, YOU MOVE" (Interrupt, una volta a combattimento): il Digimon ignora uno spostamento forzato subito.' },

    { attr:'featsOfStrength', skill:true, threshold:3, name:'Heavy Force', text:'Usa Feats of Strength al posto di Precision per attaccare in combattimento. Una volta a Rest, può aggiungere ai Check di Body/Agility un bonus pari ai punti in Feats of Strength.' },
    { attr:'featsOfStrength', skill:true, threshold:5, name:'Joint Effort', text:'In un Check di squadra (Feats of Strength) col proprio Digimon, il Tamer aggiunge l\'SV del Digimon al tiro.' },
    { attr:'featsOfStrength', skill:true, threshold:7, name:'Adrenaline Hit', text:'Special Order "HAVE SOME OF THIS" (2 Azioni, una volta a combattimento): il Tamer lancia un oggetto infliggendo Danno Unalterable pari al proprio SV e [STUN].' },

    { attr:'manipulate', skill:true, threshold:3, name:'Planted Idea', text:'Se il Tamer supera un Check di Manipulate in Roleplay, può impiantare un\'idea minore e ragionevole in un PNG, per una durata in minuti pari ai propri punti in Manipulate. Una volta a Rest.' },
    { attr:'manipulate', skill:true, threshold:5, name:'Fakeout', text:'Se il Tamer usa 2 Azioni per Dirigere il proprio Digimon migliorandone l\'Accuracy, e l\'Attacco con quel bonus manca, il bersaglio subisce -2 al Dodge invece di -1.' },
    { attr:'manipulate', skill:true, threshold:7, name:'Hacking Pride', text:'Special Order "YOU\'VE ALREADY LOST" (1 Azione, una volta a combattimento): un Direct negativo contro un nemico, penalità al prossimo Pool di Accuracy o Dodge a scelta del Tamer.' },

    { attr:'perform', skill:true, threshold:3, name:'Endless Dream', text:'Senza tirare nulla, un\'esibizione del Tamer dà IP Temporanei agli alleati, pari ai propri punti in Performance sopra 2. Una volta a Rest.' },
    { attr:'perform', skill:true, threshold:5, name:'Personal Cheerleader', text:'Un Digimon che beneficia del Direct del Tamer, tirando un Accuracy o Dodge Pool, può ritirare fino a 2 dadi.' },
    { attr:'perform', skill:true, threshold:7, name:'Distracting Gesture', text:'Special Order "HEY, OVER HERE" (Interrupt, una volta a combattimento): quando un nemico attacca un alleato, dimezza i dadi tirati dal nemico per l\'Attacco.' },

    { attr:'persuasion', skill:true, threshold:3, name:'Charming Influence', text:'Se il Tamer supera un Check di Persuasion in Roleplay, può "usare il fascino": i PNG bersaglio diventano amichevoli per una durata in minuti pari ai propri punti in Persuasion. Una volta a Rest.' },
    { attr:'persuasion', skill:true, threshold:5, name:'Be the Winners', text:'Con 1 Azione extra, il Tamer può dividere il bonus del Direct fra il proprio Digimon e un altro Digimon consenziente (il proprio Digimon deve sempre ricevere almeno +2).' },
    { attr:'persuasion', skill:true, threshold:7, name:'Next Order', text:'Special Order "WE CAN DO THIS, TOGETHER" (1 Azione, una volta a combattimento): concede i benefici di un Direct a 2 alleati consenzienti (proprio Digimon incluso).' },

    { attr:'decipherIntent', skill:true, threshold:3, name:'Cyber Sleuth', text:'Il giocatore può fare una domanda al GM su un\'azione immediatamente disponibile, e il GM deve rispondere se avrà esiti buoni, cattivi o entrambi. Usi pari ai punti in Decipher Intent sopra 2, recuperati a ogni Rest.' },
    { attr:'decipherIntent', skill:true, threshold:5, name:'Best Laid Plans', text:'Usando Hold Action per sommare Intelligence all\'Accuracy/Dodge del Digimon, +1 Successo al risultato finale.' },
    { attr:'decipherIntent', skill:true, threshold:7, name:'Predictable', text:'Special Order "I ALREADY KNOW YOUR NEXT MOVE" (2 Azioni, una volta a combattimento): dichiara un Hold Action con Trigger su qualsiasi Azione del nemico bersaglio.' },

    { attr:'survival', skill:true, threshold:3, name:'Glorious World', text:'Senza tirare nulla, il Tamer cucina un pasto che dà Wound Box Temporanee a chi lo mangia, pari ai propri punti in Survival sopra 2, fino al prossimo Rest.' },
    { attr:'survival', skill:true, threshold:5, name:'Trailblazer', text:'Il Tamer ha un innato senso dell\'orientamento: sa sempre dov\'è il nord e la strada esatta per tornare all\'ultimo insediamento civilizzato visitato.' },
    { attr:'survival', skill:true, threshold:7, name:'Survival Instinct', text:'Special Order "FLOW WITH IT" (Interrupt, una volta a combattimento): il Danno di un Attacco subito viene dimezzato dopo l\'Armor e nessun Danno Unalterable viene applicato.' },

    { attr:'knowledge', skill:true, threshold:3, name:'Academic Advice', text:'Aiutando in un Check di Teamwork, il Tamer può usare un Check di Knowledge al posto di quello richiesto. Su Successo, il bonus dato aumenta per ogni punto in Knowledge sopra 2.' },
    { attr:'knowledge', skill:true, threshold:5, name:'Living Encyclopedia', text:'Se un Check di Knowledge per ricordare informazioni avrebbe TN 15 o meno, il Tamer può Riuscire Criticamente in automatico. Una volta a Rest.' },
    { attr:'knowledge', skill:true, threshold:7, name:'Hacker\'s Memory', text:'Special Order "I KNOW ALL YOUR TRICKS" (2 Azioni, una volta a combattimento): contro un nemico già affrontato, +1 alla Potenza delle proprie Quality/Effetti basati su Stat Derivate contro di lui.' },

    { attr:'fortitude', skill:true, threshold:3, name:'Calming Influence', text:'Se un altro Tamer fallisce un Torment Check, questo Tamer può fargli ritirare il Check con un bonus pari ai propri punti in Fortitude. Una volta a Rest.' },
    { attr:'fortitude', skill:true, threshold:5, name:'Team Player', text:'Partecipando in Teamwork con alleati: se aiuta, l\'alleato può ritirare gli 1 del Check; se è chi inizia il Check, può ignorare il Fallimento Critico di un alleato.' },
    { attr:'fortitude', skill:true, threshold:7, name:'Take the Lead', text:'Special Order "NOW FOCUS" (1 Azione, una volta a combattimento): +5 a un Check del proprio Digimon, anche dopo aver visto il risultato.' },

    { attr:'bravery', skill:true, threshold:3, name:'Break the Chain', text:'Il Tamer ottiene un bonus ai Torment Check pari ai propri punti in Bravery.' },

    { attr:'awareness', skill:true, threshold:5, name:'Danger Sense', text:'Quando il Digimon userebbe un\'Interrupt Action, il Tamer può spendere 1 Azione propria al posto del Digimon. Una volta a Rest.' },
    { attr:'awareness', skill:true, threshold:7, name:'Realization', text:'Special Order "I\'VE FIGURED IT OUT" (2 Azioni, una volta a combattimento): infligge [EXPLOIT 3] a un nemico, bypassando immunità da Overwrite o Resistance.' }
  ];
  const SKILL_LABEL_BY_KEY = { evade:'EVADE', precision:'PREC', stealth:'STEALTH', athletics:'ATHL', endurance:'END', featsOfStrength:'FOS', manipulate:'MANIP', perform:'PERF', persuasion:'PERS', decipherIntent:'D.INTENT', survival:'SURV', knowledge:'KNOW', fortitude:'FORT', bravery:'BRAV', awareness:'AWARE' };
  function talentAbbr(t){ return t.skill ? (SKILL_LABEL_BY_KEY[t.attr] || t.attr) : ATTR_ABBR[t.attr]; }
  function computeUnlockedTalents(tamer){
    const cfg = campaignConfig();
    const stdIdx = { 3:0, 5:1, 6:2, 7:3 };
    return TALENT_DEFS.filter(t => {
      const idx = stdIdx[t.threshold];
      const effectiveThreshold = idx!==undefined ? cfg.thresholds[idx] : t.threshold;
      const value = t.skill ? Number((tamer.skills && tamer.skills[t.attr])||0) : Number(tamer[t.attr]||0);
      return value >= effectiveThreshold;
    });
  }

  function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHTML(s); }

  function defaultTamer(){
    const skills = {}; SKILL_DEFS.forEach(s=>skills[s.key]=0);
    return { agility:1, body:1, charisma:1, intelligence:1, willpower:1, imageUrl:'', currentWounds:null, inventory:[], skills,
      unspentGrowthPoints:0, inspirationPoints:0, tormentPenalty:0, torments:[],
      majorAspect:{text:'',usesLeft:1}, minorAspect:{text:'',usesLeft:2}, built:false };
  }
  function normalizeMember(m){
    const hadPriorTamer = !!(m.tamer && typeof m.tamer.built === 'undefined' && Object.keys(m.tamer).length>0);
    m.tamer = Object.assign(defaultTamer(), m.tamer||{});
    if(hadPriorTamer) m.tamer.built = true;
    m.tamer.skills = Object.assign((()=>{const s={};SKILL_DEFS.forEach(d=>s[d.key]=0);return s;})(), m.tamer.skills||{});
    if(!Array.isArray(m.tamer.inventory)) m.tamer.inventory = [];
    if(!Array.isArray(m.tamer.torments)) m.tamer.torments = [];
    if(!m.tamer.majorAspect) m.tamer.majorAspect = { text:'', usesLeft:1 };
    if(!m.tamer.minorAspect) m.tamer.minorAspect = { text:'', usesLeft:2 };
    return m;
  }

  function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
  function loadSession(){ try{ const v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

  // ---------- api ----------
  async function apiGet(path, silent){
    try{ const r = await fetch(path); const data = await r.json();
      if(!r.ok){ if(!silent) lastApiError = data.error || ('Errore ' + r.status); return null; }
      if(!silent) lastApiError = null; return data;
    }catch(e){ if(!silent) lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function apiPost(path, body){
    try{ const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await r.json();
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function apiPut(path, body){
    try{ const r = await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await r.json();
      if(!r.ok){ lastApiError = data.error || ('Errore ' + r.status); return null; }
      lastApiError = null; return data;
    }catch(e){ lastApiError = 'Errore di rete: ' + e.message; return null; }
  }
  async function getRoster(code){ const d = await apiGet('/api/roster?code=' + encodeURIComponent(code)); return d ? (d.members||[]).map(normalizeMember) : []; }
  async function saveMember(code, member){ const d = await apiPost('/api/roster', { code, member }); return !!(d && d.ok); }
  async function uploadImage(code, dataUrl){ return apiPost('/api/upload', { code, dataUrl }); }
  async function getProgression(code){
    const d = await apiGet('/api/state?resource=progression&code=' + encodeURIComponent(code));
    const p = d ? d.progression : { milestone:0, xp:0, inspiration:0, campaign_level:'Standard' };
    return { milestone: p.milestone||0, xp: p.xp||0, inspiration: p.inspiration||0, campaignLevel: p.campaign_level || 'Standard' };
  }
  async function pushLog(code, entry){ return apiPost('/api/log', { code, ...entry }); }

  // ---------- Avvisi (notice) ----------
  async function getNotices(code){ const d = await apiGet('/api/notice?code=' + encodeURIComponent(code), true); return d ? (d.notices||[]) : []; }
  async function confirmNotice(code, id, username){ return apiPut('/api/notice', { code, id, ack: username }); }

  // ---------- Segnalazioni Bug ----------
  async function createBugReport(code, username, text){ return apiPost('/api/notice', { resource:'bugreport', code, username, text }); }

  // ---------- Coda Avvisi bloccanti (stessa logica di index.html) ----------
  let noticeQueue = [];
  let noticeModalOpen = false;
  function isNoticeForMe(n){
    if(!session) return false;
    if(n.target_type==='all') return true;
    const list = Array.isArray(n.target_usernames) ? n.target_usernames : [];
    return list.includes(session.username);
  }
  function isNoticeConfirmedByMe(n){
    const acked = Array.isArray(n.acked_by) ? n.acked_by : [];
    return acked.includes(session.username);
  }
  async function checkNoticesForMe(){
    if(!session) return;
    const all = await getNotices(session.code);
    const mine = all.filter(n=>n.active && isNoticeForMe(n) && !isNoticeConfirmedByMe(n));
    mine.sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
    noticeQueue = mine;
    if(!noticeModalOpen && noticeQueue.length>0) showNextNotice();
    if(noticeQueue.length===0 && noticeModalOpen){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
    }
  }
  function showNextNotice(){
    if(noticeQueue.length===0){
      noticeModalOpen = false;
      const old = document.getElementById('notice-modal');
      if(old) old.remove();
      return;
    }
    noticeModalOpen = true;
    const n = noticeQueue[0];
    const old = document.getElementById('notice-modal');
    if(old) old.remove();
    const modal = document.createElement('div');
    modal.id = 'notice-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    modal.innerHTML = `
      <div class="hud-frame" style="max-width:480px;width:100%;padding:22px;background:var(--panel);">
        <div class="section-title"><span>📢 Avviso dal Master${noticeQueue.length>1?` (${noticeQueue.length} in attesa)`:''}</span></div>
        ${n.image_url ? `<img src="${escapeAttr(n.image_url)}" style="max-width:100%;max-height:40vh;object-fit:contain;margin-bottom:14px;border:1px solid var(--line);display:block;" />` : ''}
        <div style="white-space:pre-wrap;margin-bottom:18px;line-height:1.5;">${escapeHTML(n.text)}</div>
        <button class="btn solid" id="notice-confirm-btn" style="width:100%;padding:12px;">Ho capito</button>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('notice-confirm-btn').onclick = async ()=>{
      await confirmNotice(session.code, n.id, session.username);
      noticeQueue.shift();
      showNextNotice();
    };
  }

  // ---------- collapsible cards (mobile) ----------
  function enableCollapsibleCards(container){
    (container||document).querySelectorAll('.hud-frame.card').forEach(card=>{
      const title = card.querySelector(':scope > .section-title');
      if(!title || title.dataset.foldBound) return;
      title.dataset.foldBound = '1';
      if(!title.querySelector('.fold-icon')){
        const icon = document.createElement('span');
        icon.className = 'fold-icon';
        icon.textContent = '▾';
        title.appendChild(icon);
      }
      title.addEventListener('click', ()=>{
        if(window.innerWidth > 700) return;
        card.classList.toggle('collapsed');
      });
    });
  }

  // ---------- polling ----------
  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    checkNoticesForMe();
    pollTimer = setInterval(async ()=>{
      if(!session) return;
      cachedRoster = await getRoster(session.code);
      checkNoticesForMe();
      if(isEditingFullForm) return;
      if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
      render();
    }, 4000);
  }

      // Salviamo subito uno stub del membro (come fa index.html al login) così il Master

      const roster = await getRoster(code);
      const existing = roster.find(m=>m.username===username);
      const member = normalizeMember(existing || { username, role });
      member.role = role;

      session = { code, username, role };
      saveSession(session);
      cachedRoster = await getRoster(code);
      cachedProgression = await getProgression(code);
      startPolling();
      render();
    };

      </div>` : ''}
    </div>`;
  }

  // ---------- Creazione Guidata: Tamer (incorporata direttamente in questa pagina) ----------
  let creationDraft = null;
  let justBuiltTamer = false;
  let isEditingFullForm = false;

  function startTamerWizard(existingTamer){
    creationDraft = {
      agility:1, body:1, charisma:1, intelligence:1, willpower:1,
      skills: (()=>{ const s={}; SKILL_DEFS.forEach(d=>s[d.key]=0); return s; })(),
      digiviceImageUrl: (existingTamer && existingTamer.digiviceImageUrl) || ''
    };
    renderPage();
  }

  function growthPointsBlockHTML(m){
    const t = m.tamer;
    const gp = Number(t.unspentGrowthPoints||0);
    if(gp<=0) return '';
    return `
    <div class="hud-frame card" style="border-color:var(--cyan);">
      <div class="section-title"><span>🎁 Growth Point disponibili: ${gp}</span></div>
      <div class="muted" style="margin-bottom:10px;">1 GP = +1 a una Skill (fino al max consentito dagli Attributi collegati). 3 GP insieme = +1 a un Attributo (rispettando il tetto per Milestone).</div>
      <div class="row">
        <select id="gp-skill-select" style="flex:2;">${SKILL_DEFS.map(d=>`<option value="${d.key}">${escapeHTML(d.label)}</option>`).join('')}</select>
        <button class="btn small" id="btn-gp-skill" style="flex:1;">+1 Skill (1 GP)</button>
      </div>
      ${gp>=3 ? `
      <div class="row" style="margin-top:6px;">
        <select id="gp-attr-select" style="flex:2;">
          <option value="agility">Agility</option><option value="body">Body</option><option value="charisma">Charisma</option><option value="intelligence">Intelligence</option><option value="willpower">Willpower</option>
        </select>
        <button class="btn small" id="btn-gp-attr" style="flex:1;">+1 Attributo (3 GP)</button>
      </div>` : ''}
      <div class="muted" id="gp-status" style="margin-top:6px;"></div>
    </div>`;
  }

  function bindGrowthPoints(target){
    const t = target.tamer;
    const gpSkillBtn = document.getElementById('btn-gp-skill');
    if(gpSkillBtn){
      gpSkillBtn.onclick = async ()=>{
        const key = document.getElementById('gp-skill-select').value;
        const def = SKILL_DEFS.find(d=>d.key===key);
        const max = skillMax(t, def);
        const statusEl = document.getElementById('gp-status');
        if((Number(t.skills[key])||0) >= max){ statusEl.style.color='var(--danger)'; statusEl.textContent = `${def.label} è già al massimo consentito (${max}).`; return; }
        t.skills[key] = (Number(t.skills[key])||0) + 1;
        t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 1;
        const ok = await saveMember(session.code, target);
        if(ok){ cachedRoster = await getRoster(session.code); renderPage(); }
        else { statusEl.style.color='var(--danger)'; statusEl.textContent = 'Errore: ' + (lastApiError||'sconosciuto'); }
      };
    }
    const gpAttrBtn = document.getElementById('btn-gp-attr');
    if(gpAttrBtn){
      gpAttrBtn.onclick = async ()=>{
        const attr = document.getElementById('gp-attr-select').value;
        const statusEl = document.getElementById('gp-status');
        const current = Number(t[attr])||0;
        const milestone = cachedProgression ? Number(cachedProgression.milestone||0) : 0;
        let cap = 5;
        if(milestone>=6) cap = 7; else if(milestone>=3) cap = 6;
        if(current >= cap){ statusEl.style.color='var(--danger)'; statusEl.textContent = `Tetto attuale per gli Attributi: ${cap} (Milestone ${milestone}).`; return; }
        t[attr] = current + 1;
        t.unspentGrowthPoints = Number(t.unspentGrowthPoints||0) - 3;
        const ok = await saveMember(session.code, target);
        if(ok){ cachedRoster = await getRoster(session.code); renderPage(); }
        else { statusEl.style.color='var(--danger)'; statusEl.textContent = 'Errore: ' + (lastApiError||'sconosciuto'); }
      };
    }
  }

  function tamerWizardHTML(){
    const draft = creationDraft;
    const cfg = campaignConfig();
    const cap = cfg.cap;
    const attrs = ['agility','body','charisma','intelligence','willpower'];
    const apSpent = attrs.reduce((s,a)=>s+(draft[a]-1),0);
    const apRemaining = cfg.ap - apSpent;
    // Talent "Experienced" (Intelligence 3+, o soglia equivalente per Campaign Level): +1 Punto Skill
    // extra in creazione, e permette a una seconda Skill di arrivare al tetto.
    const hasExperienced = Number(draft.intelligence||0) >= cfg.thresholds[0];
    const spBudget = cfg.sp + (hasExperienced ? 1 : 0);
    const spSpent = SKILL_DEFS.reduce((s,def)=>s+Number(draft.skills[def.key]||0),0);
    const spRemaining = spBudget - spSpent;
    const attrAtCap = attrs.filter(a=>draft[a]===cap).length;
    const skillsAtCap = SKILL_DEFS.filter(def=>Number(draft.skills[def.key]||0)===cap).length;
    const skillCapAllowance = hasExperienced ? 2 : 1;
    const errors = [];
    if(apRemaining!==0) errors.push(`Punti Attributo da spendere: ${apRemaining} (devono arrivare esattamente a 0)`);
    if(spRemaining!==0) errors.push(`Punti Skill da spendere: ${spRemaining} (devono arrivare esattamente a 0)`);
    if(attrAtCap>1) errors.push(`Solo un Attributo può arrivare al tetto di ${cap} in creazione.`);
    if(skillsAtCap>skillCapAllowance) errors.push(`Solo ${skillCapAllowance===2?'due Skill possono':'una Skill può'} arrivare al tetto di ${cap} in creazione${hasExperienced?' (Talent Experienced attivo: +1 Skill Point, una Skill extra può arrivare al tetto)':''}.`);

    return `
    <div class="hud-frame card">
      <div class="section-title"><span>🧙 Creazione Guidata — Tamer</span></div>
      <div class="muted" style="margin-bottom:8px;">Campaign Level: <b>${(cachedProgression&&cachedProgression.campaignLevel)||'Standard'}</b> — ${cfg.ap} Punti Attributo (partono da 1) · ${spBudget} Punti Skill${hasExperienced?` <span style="color:var(--cyan);">(${cfg.sp}+1 da Talent Experienced)</span>`:''} · solo un Attributo e ${skillCapAllowance===2?'fino a due Skill possono':'una Skill può'} arrivare al tetto di ${cap}.</div>
      <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Punti Attributo rimasti</span><span class="mono" style="color:${apRemaining===0?'var(--cyan)':'var(--amber)'};">${apRemaining}</span></div>
      <div class="grid-stats">
        ${attrs.map(a=>`
          <div class="stat-box">
            <div class="l">${ATTR_ABBR[a]} <span class="muted" style="font-size:9px;">(max ${cap})</span></div>
            <input type="number" data-wiz-attr="${a}" min="1" max="${cap}" value="${draft[a]}" />
          </div>
        `).join('')}
      </div>
      <div style="border-top:1px dashed var(--line);margin:12px 0;"></div>
      <div class="flex-between" style="margin-bottom:6px;"><span class="muted">Punti Skill rimasti</span><span class="mono" style="color:${spRemaining===0?'var(--cyan)':'var(--amber)'};">${spRemaining}</span></div>
      <div class="grid-skills">
        ${SKILL_DEFS.map(def=>{
          const max = Math.min(cap, skillMax(draft, def));
          return `<div class="skill-box" style="flex-direction:column;align-items:stretch;text-align:left;">
            <span class="l">${escapeHTML(def.label)} <span class="muted" style="font-size:9px;">(max ${max})</span></span>
            <input type="number" data-wiz-skill="${def.key}" min="0" max="${max}" value="${draft.skills[def.key]||0}" style="margin-top:4px;" />
          </div>`;
        }).join('')}
      </div>
      <div style="border-top:1px dashed var(--line);margin:12px 0;"></div>
      ${(()=>{ const unlocked = computeUnlockedTalents(draft); return `
      <div class="hud-frame" style="padding:10px;border-color:var(--cyan-dim);margin-bottom:12px;">
        <div class="mono" style="color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">⭐ Tamer Talents sbloccati — ${unlocked.length}</div>
        ${unlocked.length===0
          ? '<div class="muted">Nessun Talent ancora sbloccato (servono almeno 3 punti in un Attributo o una Skill).</div>'
          : unlocked.map(tal=>`<div class="list-item"><div class="top-row"><span class="name">${escapeHTML(tal.name)}</span><span class="muted mono">${talentAbbr(tal)} ${tal.threshold}+</span></div><div class="sub">${escapeHTML(tal.text)}</div></div>`).join('')}
      </div>`; })()}
      <div class="field"><label>URL Immagine Digivice (opzionale)</label><input type="text" id="wiz-t-digivice-img" value="${escapeAttr(draft.digiviceImageUrl)}" placeholder="https://..." /></div>
      ${errors.length ? `<div class="err">${errors.map(e=>escapeHTML(e)).join('<br/>')}</div>` : '<div class="ok-msg">Tutto valido, puoi salvare.</div>'}
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost" id="btn-wiz-cancel" style="flex:1;">Annulla</button>
        <button class="btn solid" id="btn-wiz-save" style="flex:1;" ${errors.length?'disabled':''}>✅ Salva Tamer</button>
      </div>
      <div class="muted" id="wiz-status" style="margin-top:6px;"></div>
    </div>`;
  }

  function bindTamerWizard(target){
    const draft = creationDraft;
    const cfg = campaignConfig();
    const cap = cfg.cap;
    root.querySelectorAll('[data-wiz-attr]').forEach(inp=>{
      inp.onchange = ()=>{ draft[inp.getAttribute('data-wiz-attr')] = Math.max(1, Math.min(cap, Number(inp.value)||1)); renderPage(); };
    });
    root.querySelectorAll('[data-wiz-skill]').forEach(inp=>{
      inp.onchange = ()=>{
        const key = inp.getAttribute('data-wiz-skill');
        const def = SKILL_DEFS.find(d=>d.key===key);
        const max = Math.min(cap, skillMax(draft, def));
        draft.skills[key] = Math.max(0, Math.min(max, Number(inp.value)||0));
        renderPage();
      };
    });
    const digiviceImgInp = document.getElementById('wiz-t-digivice-img');
    if(digiviceImgInp) digiviceImgInp.onchange = (e)=>{ draft.digiviceImageUrl = e.target.value; };
    document.getElementById('btn-wiz-cancel').onclick = ()=>{ creationDraft = null; renderPage(); };
    const saveBtn = document.getElementById('btn-wiz-save');
    if(saveBtn){
      saveBtn.onclick = async ()=>{
        ['agility','body','charisma','intelligence','willpower'].forEach(a=>{ target.tamer[a] = draft[a]; });
        target.tamer.skills = draft.skills;
        target.tamer.unspentGrowthPoints = 0;
        target.tamer.currentWounds = 3 + Number(draft.skills.endurance||0);
        target.tamer.digiviceImageUrl = draft.digiviceImageUrl || '';
        target.tamer.built = true;
        const st = document.getElementById('wiz-status');
        st.textContent = 'Salvataggio...';
        const ok = await saveMember(session.code, target);
        if(ok){
          await pushLog(session.code, { who: session.username, role:'player', text: `${target.username} ha completato la Creazione Guidata del Tamer.` });
          creationDraft = null;
          justBuiltTamer = true;
          cachedRoster = await getRoster(session.code);
          renderPage();
        } else {
          st.style.color = 'var(--danger)';
          st.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
        }
      };
    }
  }

  function renderPage(){
    const isMaster = session.role === 'master';
    let target = null;
    let selectorHTML = '';

    if(isMaster){
      const players = cachedRoster.filter(m=>m.role==='player');
      const selected = window.__playerSelected || (players[0] && players[0].username) || null;
      target = players.find(p=>p.username===selected) || players[0] || null;
      selectorHTML = `
      <div class="hud-frame card">
        <div class="section-title"><span>Seleziona Giocatore</span></div>
        <select id="p-select-player">
          ${players.length===0 ? '<option>— nessun giocatore —</option>' : players.map(p=>`<option value="${escapeAttr(p.username)}" ${target && target.username===p.username?'selected':''}>${escapeHTML(p.username)}</option>`).join('')}
        </select>
        <div class="muted" style="margin-top:8px;">Come Master puoi modificare direttamente la scheda selezionata.</div>
      </div>`;
    } else {
      target = cachedRoster.find(m=>m.username===session.username);
    }

    const editable = true;

    let bodyHTML;
    if(creationDraft && target){
      bodyHTML = tamerWizardHTML();
    } else if(!isMaster && justBuiltTamer && target && target.tamer.built){
      bodyHTML = `
      <div class="hud-frame card" style="border-color:var(--cyan);">
        <div class="section-title"><span>✅ Tamer creato</span></div>
        <div style="margin-bottom:10px;">Ora crea il tuo Digimon. Se non l'hai ancora fatto, parti dalla Bio-Resonance Scan.</div>
        <div class="row">
          <a href="digimon.html" target="_blank" class="btn solid" style="flex:1;text-decoration:none;text-align:center;padding:10px;">👾 Vai alla Scheda Digimon</a>
        </div>
      </div>`;
    } else if(!target || !target.tamer.built){
      bodyHTML = `
        <div class="hud-frame card muted">
          ${isMaster ? (target ? `
            <div style="margin-bottom:10px;">${escapeHTML(target.username)} non ha ancora completato la Creazione Guidata.</div>
            <button class="btn solid" id="btn-start-wizard" style="padding:10px 16px;">🧙 Apri Creazione Guidata</button>
          ` : 'Nessuna scheda trovata. Seleziona un giocatore.') : `
            <div style="margin-bottom:10px;">Non hai ancora una scheda. Puoi crearla subito con la Creazione Guidata.</div>
            <button class="btn solid" id="btn-start-wizard" style="padding:10px 16px;">🧙 Apri Creazione Guidata</button>
          `}
        </div>`;
    } else {
      bodyHTML = null; // usa il ramo completo sotto
    }
    // Il form completo (Punteggi/Skill/Inventario/ecc.) è quello con campi editabili non ancora
    // salvati — mentre è aperto, il polling non deve ridisegnare la pagina sopra le modifiche
    // in corso, altrimenti si perdono silenziosamente ad ogni refresh di 4s.
    isEditingFullForm = (bodyHTML === null) || !!creationDraft;

    root.innerHTML = `
      <div style="max-width:760px;margin:0 auto;">
        ${topbar()}
        ${selectorHTML}
        ${bodyHTML !== null ? bodyHTML : `
        <div class="hud-frame card">
          ${portraitBlockHTML(target, editable)}
        </div>
        <div class="hud-frame card">
          <div class="section-title"><span>Punteggi Base</span></div>
          <div class="grid-stats">
            ${STAT_DEFS.map(d=>statBoxHTML(target, d.key, d.label, editable)).join('')}
          </div>
        </div>
        <div class="hud-frame card">
          <div class="section-title"><span>Skill</span></div>
          <div class="grid-skills">
            ${SKILL_DEFS.map(d=>skillBoxHTML(target, d, editable)).join('')}
          </div>
        </div>
        ${growthPointsBlockHTML(target)}
        ${statoBlockHTML(target, editable)}
        ${aspectsBlockHTML(target, editable)}
        ${inventoryBlockHTML(target, editable)}
        ${tormentsBlockHTML(target, editable)}
        ${editable ? `
        <div class="save-bar">
          <button class="btn solid" id="p-save" style="width:100%;padding:12px;">💾 Salva Scheda</button>
          <div id="p-save-msg" style="margin-top:8px;"></div>
          ${isMaster ? `<button class="btn ghost" id="p-reset" style="width:100%;padding:10px;margin-top:8px;color:var(--danger);border-color:var(--danger);">🗑️ Azzera Scheda Tamer (permette una nuova Creazione Guidata)</button>` : ''}
        </div>` : ''}
        `}
        <div class="hud-frame card">
          <div class="section-title"><span>🐞 Segnala un Bug</span></div>
          <div class="muted" style="margin-bottom:10px;">Hai trovato qualcosa che non funziona come dovrebbe? Descrivilo qui — arriva direttamente al Master.</div>
          <textarea id="bug-text" rows="4" placeholder="Cosa è successo? Cosa ti aspettavi succedesse invece?"></textarea>
          <button class="btn solid" id="btn-send-bug" style="width:100%;margin-top:8px;">Invia Segnalazione</button>
          <div class="muted" id="bug-status" style="margin-top:6px;"></div>
        </div>
      </div>`;

    document.getElementById('btn-logout').onclick = logout;
    const bugBtn = document.getElementById('btn-send-bug');
    if(bugBtn) bugBtn.onclick = async ()=>{
      const text = document.getElementById('bug-text').value.trim();
      const statusEl = document.getElementById('bug-status');
      if(!text){ statusEl.style.color='var(--danger)'; statusEl.textContent = 'Scrivi qualcosa prima di inviare.'; return; }
      statusEl.style.color='var(--text-mute)'; statusEl.textContent = 'Invio...';
      const res = await createBugReport(session.code, session.username, text);
      if(res && res.ok){
        statusEl.style.color='var(--cyan)'; statusEl.textContent = 'Segnalazione inviata, grazie!';
        document.getElementById('bug-text').value = '';
      } else {
        statusEl.style.color='var(--danger)'; statusEl.textContent = 'Errore: ' + (lastApiError||'sconosciuto');
      }
    };

    if(isMaster){
      const sel = document.getElementById('p-select-player');
      if(sel) sel.onchange = ()=>{ window.__playerSelected = sel.value; justBuiltTamer=false; creationDraft=null; renderPage(); };
    }

    const startWizBtn = document.getElementById('btn-start-wizard');
    if(startWizBtn) startWizBtn.onclick = ()=>{ startTamerWizard(target && target.tamer); };
    if(creationDraft && target) bindTamerWizard(target);
    if(target && target.tamer.built && bodyHTML===null) bindGrowthPoints(target);

    if(target && editable && bodyHTML === null){
      bindImageUpload(target);
      bindListEditors(target);
      document.getElementById('p-save').onclick = async ()=>{
        STAT_DEFS.forEach(d=>{
          const el = document.getElementById('p-stat-'+d.key);
          if(el) target.tamer[d.key] = Math.max(0, Number(el.value)||0);
        });
        SKILL_DEFS.forEach(d=>{
          const el = document.getElementById('p-skill-'+d.key);
          if(el) target.tamer.skills[d.key] = Math.max(0, Number(el.value)||0);
        });
        const imgEl = document.getElementById('p-imageUrl');
        if(imgEl) target.tamer.imageUrl = imgEl.value.trim();
        const digiviceEl = document.getElementById('p-digiviceImageUrl');
        if(digiviceEl) target.tamer.digiviceImageUrl = digiviceEl.value.trim();
        target.tamer.currentWounds = Math.max(0, Number(document.getElementById('p-currentWounds').value)||0);
        target.tamer.unspentGrowthPoints = Math.max(0, Number(document.getElementById('p-unspentGrowthPoints').value)||0);
        target.tamer.inspirationPoints = Math.max(0, Number(document.getElementById('p-inspirationPoints').value)||0);
        target.tamer.tormentPenalty = Number(document.getElementById('p-tormentPenalty').value)||0;
        target.tamer.majorAspect.text = document.getElementById('p-majorText').value.trim();
        target.tamer.majorAspect.usesLeft = Math.max(0, Number(document.getElementById('p-majorUses').value)||0);
        target.tamer.minorAspect.text = document.getElementById('p-minorText').value.trim();
        target.tamer.minorAspect.usesLeft = Math.max(0, Number(document.getElementById('p-minorUses').value)||0);

        const msgEl = document.getElementById('p-save-msg');
        msgEl.innerHTML = '<span class="muted">Salvataggio...</span>';
        const ok = await saveMember(session.code, target);
        msgEl.innerHTML = ok ? '<span class="ok-msg">✔ Salvato.</span>' : `<span class="err">⚠ ${escapeHTML(lastApiError||'errore sconosciuto')}</span>`;
        if(ok) cachedRoster = await getRoster(session.code);
      };
      const resetBtn = document.getElementById('p-reset');
      if(resetBtn){
        resetBtn.onclick = async ()=>{
          if(!window.confirm(`Azzerare la Scheda Tamer di ${target.username}? Attributi, Skill, Torments, Aspetti e Inventario torneranno a zero e potrà rifare la Creazione Guidata. L'azione non è reversibile.`)) return;
          if(!window.confirm(`Sei sicuro? Questa è l'ultima conferma prima di azzerare definitivamente la Scheda Tamer di ${target.username}.`)) return;
          target.tamer = defaultTamer();
          const ok = await saveMember(session.code, target);
          if(ok) cachedRoster = await getRoster(session.code);
          renderPage();
        };
      }
    }

    enableCollapsibleCards(root);
  }

  function bindListEditors(target){
    root.querySelectorAll('[data-inv-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.tamer.inventory.splice(Number(btn.getAttribute('data-inv-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    const invAdd = document.getElementById('p-inv-add');
    if(invAdd) invAdd.onclick = async ()=>{
      const name = document.getElementById('p-inv-name').value.trim();
      if(!name) return;
      const qty = Number(document.getElementById('p-inv-qty').value)||1;
      const desc = document.getElementById('p-inv-desc').value.trim();
      target.tamer.inventory.push({ name, qty, desc });
      await saveMember(session.code, target);
      renderPage();
    };
    root.querySelectorAll('[data-torment-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        target.tamer.torments.splice(Number(btn.getAttribute('data-torment-remove')),1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-tor-plus]').forEach(btn=>{
      btn.onclick = async ()=>{
        const tor = target.tamer.torments[Number(btn.getAttribute('data-tor-plus'))];
        tor.boxes = Math.min(10, (Number(tor.boxes)||0)+1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-tor-minus]').forEach(btn=>{
      btn.onclick = async ()=>{
        const tor = target.tamer.torments[Number(btn.getAttribute('data-tor-minus'))];
        tor.boxes = Math.max(0, (Number(tor.boxes)||0)-1);
        await saveMember(session.code, target);
        renderPage();
      };
    });
    root.querySelectorAll('[data-torment-rest]').forEach(chk=>{
      chk.onchange = async ()=>{
        target.tamer.torments[Number(chk.getAttribute('data-torment-rest'))].usedThisRest = chk.checked;
        await saveMember(session.code, target);
      };
    });
    const torAdd = document.getElementById('p-tor-add');
    if(torAdd) torAdd.onclick = async ()=>{
      const name = document.getElementById('p-tor-name').value.trim();
      if(!name) return;
      const boxes = Math.max(0, Math.min(10, Number(document.getElementById('p-tor-boxes').value)||0));
      target.tamer.torments.push({ name, boxes, usedThisRest:false });
      await saveMember(session.code, target);
      renderPage();
    };
  }

  function bindImageUpload(target){
    const fileInput = document.getElementById('p-img-file');
    const btn = document.getElementById('p-img-btn');
    const statusEl = document.getElementById('p-img-status');
    if(!fileInput || !btn) return;
    btn.onclick = ()=> fileInput.click();
    fileInput.onchange = async ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      statusEl.textContent = 'Caricamento...';
      btn.disabled = true;
      try{
        const dataUrl = await new Promise((resolve,reject)=>{
          const reader = new FileReader();
          reader.onload = ()=> resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const res = await uploadImage(session.code, dataUrl);
        if(res && res.ok && res.url){
          const imgEl = document.getElementById('p-imageUrl');
          if(imgEl) imgEl.value = res.url;
          statusEl.textContent = '✔ Caricata — ricordati di salvare.';
        } else {
          statusEl.textContent = '⚠ Caricamento fallito: ' + (lastApiError||'errore sconosciuto');
        }
      }catch(e){
        statusEl.textContent = '⚠ Errore: ' + e.message;
      }
      btn.disabled = false;
      fileInput.value = '';
    };
  }

  // ---------- boot ----------
  const restored = loadSession();
  if(restored && restored.code && restored.username){ session = restored; }
  (async ()=>{
    if(session){ cachedRoster = await getRoster(session.code); cachedProgression = await getProgression(session.code); startPolling(); }
    render();
  })();
})();
</script>
</body>
</html>
